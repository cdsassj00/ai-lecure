<title>강의안 지식그래프</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#eef0f4; --panel:#f8f9fb; --line:#d3d9e2; --line2:#bcc6d3;
  --ink:#102139; --body:#3d4c60; --mut:#68758a;
  --navy:#101827; --coral:#b94a48; --coralbg:#f6e7e6;
  --green:#2e7d5b; --amber:#b87a1c; --blue:#3f63a0; --violet:#6a4f9c;
  --canvas:#f5f6f8; --edge:#b7c1ce;
  --t1:#2a78d6; --t2:#eb6834; --t3:#1baf7a; --t4:#eda100; --t5:#e87ba4; --t6:#008300; --t7:#4a3aa7; --t8:#e34948; --t0:#9aa3b0;
  --font:'IBM Plex Sans KR','Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e141d; --panel:#141c27; --line:#243041; --line2:#30405a;
    --ink:#e7ecf3; --body:#b9c4d3; --mut:#8594a8;
    --navy:#dfe6f0; --coral:#e07b73; --coralbg:#3a2224;
    --green:#5fb58c; --amber:#d9a449; --blue:#7c9ee0; --violet:#a28ad6;
    --canvas:#111823; --edge:#3a4a60;
      --t1:#3987e5; --t2:#d95926; --t3:#199e70; --t4:#c98500; --t5:#d55181; --t6:#008300; --t7:#9085e9; --t8:#e66767; --t0:#5d6a7c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e141d; --panel:#141c27; --line:#243041; --line2:#30405a;
  --ink:#e7ecf3; --body:#b9c4d3; --mut:#8594a8;
  --navy:#dfe6f0; --coral:#e07b73; --coralbg:#3a2224;
  --green:#5fb58c; --amber:#d9a449; --blue:#7c9ee0; --violet:#a28ad6;
  --canvas:#111823; --edge:#3a4a60;
  --t1:#3987e5; --t2:#d95926; --t3:#199e70; --t4:#c98500; --t5:#d55181; --t6:#008300; --t7:#9085e9; --t8:#e66767; --t0:#5d6a7c;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;margin:0;
  -webkit-font-smoothing:antialiased;word-break:keep-all}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;height:100%;min-height:0}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{padding:18px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.3px;text-wrap:balance}
.brand h1 b{color:var(--coral);font-weight:700}
.stats{font-family:var(--mono);font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
#q{width:100%;box-sizing:border-box;font:inherit;padding:9px 11px;border:1px solid var(--line2);border-radius:6px;
  background:var(--canvas);color:var(--ink)}
#q:focus-visible,button:focus-visible,.chip:focus-within{outline:2px solid var(--coral);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border:1px solid var(--line2);
  border-radius:14px;cursor:pointer;user-select:none;color:var(--body);background:transparent}
.chip input{margin:0;accent-color:var(--coral)}
.chip.on{background:var(--coralbg);color:var(--ink);border-color:var(--line2)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:5px 10px;border:0;background:transparent;color:var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--panel)}
.detail{overflow:auto;padding:16px 18px 24px;display:grid;gap:14px;align-content:start;min-height:0}
.kicker{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--coral)}
.detail h2{font-size:18px;line-height:1.35;margin:2px 0 0;text-wrap:balance}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;color:var(--body)}
.meta dt{color:var(--mut)} .meta dd{margin:0}
.mono{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.sum{font-size:13px;line-height:1.6;color:var(--body);margin:0}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:2px 8px;border-radius:12px;background:var(--coralbg);color:var(--coral);cursor:pointer;border:0;font-family:inherit}
.tag.k{background:transparent;border:1px solid var(--line2);color:var(--body)}
.sec h3{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.06em;margin:0 0 6px;text-transform:uppercase}
ol.outline{margin:0;padding-left:22px;font-size:13px;line-height:1.55;color:var(--body);display:grid;gap:2px}
ol.outline li::marker{color:var(--mut);font-family:var(--mono);font-size:11px}
ul.docs{list-style:none;margin:0;padding:0;display:grid;gap:2px}
ul.docs li button{all:unset;display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;box-sizing:border-box;
  padding:6px 8px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--ink)}
ul.docs li button:hover,ul.docs li button:focus-visible{background:var(--bg)}
ul.docs .d{font-family:var(--mono);font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
a.open{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--panel);background:var(--coral);
  padding:7px 12px;border-radius:6px;text-decoration:none;justify-self:start}
.hint{font-size:12.5px;color:var(--mut);line-height:1.6}
table.topics{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.topics td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.topics td.n{text-align:right;color:var(--mut);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
table.topics button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
table.topics button:hover span,table.topics button:focus-visible span{text-decoration:underline}
.sw{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.sw.neutral{border-radius:2px}
.bar{height:6px;border-radius:3px;background:var(--line)}
.bar i{display:block;height:100%;border-radius:3px;background:var(--mut)}
.hint b{color:var(--ink)}
main{position:relative;min-width:0;min-height:0;background:var(--canvas)}
#net{position:absolute;inset:0}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--body);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:calc(100% - 24px);box-sizing:border-box}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.sq{border-radius:2px}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;height:auto}
  aside{display:contents}
  .top{order:1;background:var(--panel);padding-inline:16px}
  main{order:2;height:60vh}
  .detail{order:3;background:var(--panel);padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function visNodes() {
  if (mode === 'topic') return topicNodes();
  const P = palette(), out = [];
  for (const n of G.nodes) {
    if (n.type === 'doctype' || n.type === 'topic') continue;
    if (n.type === 'document' && (mode !== 'all' || !docVisible(n))) continue;
    if (n.type === 'client' && mode !== 'all') continue;
    const base = {id: n.id, label: n.label, font: {color: P.ink, face: 'IBM Plex Sans KR, sans-serif'}};
    if (n.type === 'concept') Object.assign(base, {shape: 'dot', size: 6 + Math.sqrt(n.docs) * 2.1,
      color: {background: P.coral, border: P.coral, highlight: {background: P.coral, border: P.ink}},
      font: {...base.font, size: 12 + Math.min(n.docs, 120) / 20, strokeWidth: 3, strokeColor: P.canvas}});
    else if (n.type === 'category') Object.assign(base, {shape: 'box', margin: 7,
      color: {background: P.navy, border: P.navy}, font: {...base.font, color: P.panel, size: 14, bold: true}});
    else if (n.type === 'client') Object.assign(base, {shape: 'diamond', size: 9 + Math.sqrt(n.docs) * 2,
      color: {background: P.green, border: P.green}, font: {...base.font, size: 12}});
    else Object.assign(base, {shape: 'dot', size: n.has_content ? 5 + Math.sqrt(n.n || 1) : 4,
      color: {background: n.has_content ? P.blue : P.canvas, border: P.blue},
      font: {...base.font, size: 10, color: P.mut}, label: n.label.length > 26 ? n.label.slice(0, 25) + '…' : n.label});
    out.push(base);

}
// 개념끼리의 '함께 등장' 선은 개념마다 가장 강한 3개만 남긴다 (전부 그리면 털뭉치가 된다)
const keepCo = new Set();
{
  const best = new Map();
  G.edges.forEach((e, i) => {
    if (e.type !== '함께 등장') return;
    for (const k of [e.s, e.t]) (best.get(k) || best.set(k, []).get(k)).push([e.w, i]);

  for (const arr of best.values()) arr.sort((a, b) => b[0] - a[0]).slice(0, 3).forEach(([, i]) => keepCo.add(i));
}
function visEdges(ids) {
  const P = palette(), out = [];
  G.edges.forEach((e, i) => {
    if (!ids.has(e.s) || !ids.has(e.t)) return;
    if (e.type === '유형') return;
    if (mode === 'topic' && e.type !== '주제') return;
    if (mode !== 'topic' && e.type === '주제') return;
    if (e.type === '함께 등장' && (mode === 'all' || !keepCo.has(i))) return;
    if (e.type === '주제') { out.push({id: i, from: e.s, to: e.t, width: .5, color: {color: P.edge, opacity: .45}, smooth: false}); return; }
    const w = e.type === '함께 등장' ? Math.min(3, 0.6 + e.w / 25) : e.type === '유사' ? 1 : 0.6;
    out.push({id: i, from: e.s, to: e.t, width: w, color: {color: P.edge, opacity: e.type === '다룸' ? .35 : .6},

let net, dsN, dsE;
function render() {
  const nodes = visNodes();
  const ids = new Set(nodes.map(n => n.id));
  dsN = new vis.DataSet(nodes); dsE = new vis.DataSet(visEdges(ids));
  if (net) net.destroy();
  $('#loading').hidden = false;
  net = new vis.Network($('#net'), {nodes: dsN, edges: dsE}, {
    physics: {solver: 'forceAtlas2Based', forceAtlas2Based: mode === 'topic'
        ? {gravitationalConstant: -30, centralGravity: .01, springLength: 22, springConstant: .12, avoidOverlap: .1}
        : {gravitationalConstant: mode === 'all' ? -60 : -160, springLength: mode === 'all' ? 80 : 150, springConstant: .04, avoidOverlap: .8},
      stabilization: {iterations: mode === 'concept' ? 180 : 300, fit: true}},
    interaction: {hover: true, tooltipDelay: 150, hideEdgesOnDrag: true}, nodes: {borderWidth: 1.5, scaling: {label: {enabled: false, drawThreshold: 4}}}});
  const done = () => { net.setOptions({physics: false}); $('#loading').hidden = true; net.fit(); };
  net.once('stabilizationIterationsDone', done);

  net.on('click', p => { if (p.nodes.length) show(p.nodes[0]); });
}
function neighbors(id, kind) {
  return (adj.get(id) || []).map(e => ({e, o: byId.get(e.s === id ? e.t : e.s)})).filter(x => x.o && (!kind || x.o.type === kind));
}
function docList(items) {

    <span>${esc(x.o.label)}</span><span class="d">${esc(x.o.date || '')}</span></button></li>`).join('')}</ul>`;
}
function tagList(items, cls = '') {

}
function show(id) {
  const n = byId.get(id); if (!n) return;
  const D = $('#detail'); let h = '';
  if (n.type === 'document') {

    const sim = neighbors(id, 'document');
    const tp = byId.get('topic:' + n.topic);
    h += `<div><div class="kicker">${esc(n.doc_type)}</div><h2>${esc(d.page_title || n.label)}</h2></div>
      ${tp ? `<div class="tags"><button type="button" class="tag k" data-id="${esc(tp.id)}"><i class="sw" style="background:var(--t${tp.slot})"></i> ${esc(tp.label)}</button>${d.topic_alt ? `<span class="tag k">보조: ${esc(d.topic_alt)}</span>` : ''}</div>` : ''}
      <dl class="meta"><dt>파일</dt><dd>${esc(d.title || n.label)}</dd>
      <dt>날짜</dt><dd>${esc(n.date || '—')}</dd>
      <dt>고객사</dt><dd>${esc((d.clients || []).join(', ') || '—')}</dd>
      <dt>섹션</dt><dd>${n.has_content ? n.n + '개' : '본문 미색인 (로컬 빌드 시 채워짐)'}</dd>
      <dt>버전</dt><dd>${d.versions ? d.versions + '개 사본 묶음' : '단일본'}</dd>
      <dt>fileId</dt><dd class="mono">${esc(id.slice(4))}</dd></dl>`;
    if (n.url) h += `<a class="open" href="${esc(n.url)}" target="_blank" rel="noopener">Drive에서 원본 열기 ↗</a>`;
    if (d.summary) h += `<p class="sum">${esc(d.summary)}</p>`;
    if (cons.length) h += `<div class="sec"><h3>다루는 개념</h3>${tagList(cons)}</div>`;
    if (d.keywords?.length) h += `<div class="sec"><h3>키워드</h3><div class="tags">${d.keywords.map(k => `<span class="tag k">${esc(k)}</span>`).join('')}</div></div>`;
    if (d.outline?.length) h += `<div class="sec"><h3>목차 (${d.outline.length})</h3><ol class="outline">${d.outline.map(o => `<li>${esc(o)}</li>`).join('')}</ol></div>`;
    if (sim.length) h += `<div class="sec"><h3>비슷한 문서</h3>${docList(sim)}</div>`;
  } else if (n.type === 'topic') {
    const ds = neighbors(id, 'document');
    const con = new Map(), cl = new Map(), ty = new Map();
    for (const x of ds) {
      for (const e of adj.get(x.o.id) || []) {
        const o = byId.get(e.s === x.o.id ? e.t : e.s); if (!o) continue;
        if (o.type === 'concept') con.set(o.id, (con.get(o.id) || 0) + Math.log1p(e.w));
        if (o.type === 'client') cl.set(o.id, (cl.get(o.id) || 0) + 1);
      }
      ty.set(x.o.doc_type, (ty.get(x.o.doc_type) || 0) + 1);
    }
    const top = m => [...m.entries()].sort((a, b) => b[1] - a[1]);
    h += `<div><div class="kicker" style="color:var(--t${n.slot})">강의 주제</div><h2>${esc(n.label)}</h2></div>
      <p class="sum">${esc(n.desc)}</p>
      <dl class="meta"><dt>문서</dt><dd>${n.docs}개 (본문 색인 ${n.indexed}개)</dd>
      <dt>기간</dt><dd>${esc(n.from || '—')} ~ ${esc(n.to || '—')}</dd>
      <dt>유형</dt><dd>${top(ty).map(([k, v]) => esc(k) + ' ' + v).join(' · ')}</dd></dl>

    const cs = top(con).slice(0, 14).map(([k]) => ({o: byId.get(k)}));
    if (cs.length) h += `<div class="sec"><h3>자주 다룬 개념</h3>${tagList(cs)}</div>`;

  } else if (n.type === 'concept') {

    if (co.length) h += `<div class="sec"><h3>함께 다룬 개념</h3>${tagList(co.slice(0, 14))}</div>`;
    h += `<div class="sec"><h3>관련 문서 (가중치순)</h3>${docList(ds)}</div>`;
  } else {
    const ds = G.edges.filter(e => e.t === id || e.s === id).map(e => ({e, o: byId.get(e.s === id ? e.t : e.s)}));

    else h += `<div class="sec"><h3>문서 ${ds.length}개</h3>${docList(ds.filter(x => x.o?.type === 'document'))}</div>`;
  }
  D.innerHTML = h; D.scrollTop = 0;
  if (dsN?.get(id)) { net.selectNodes([id]); net.focus(id, {scale: Math.max(net.getScale(), .8), animation: {duration: 350}}); }
}
$('#detail').addEventListener('click', ev => {
  const b = ev.target.closest('[data-id]'); if (!b) return;
  const id = b.dataset.id;
  if (!dsN.get(id) && byId.get(id)?.type === 'document') { setMode('topic'); setTimeout(() => show(id), 60); }
  if (!dsN.get(id) && byId.get(id)?.type === 'concept') { setMode('concept'); setTimeout(() => show(id), 60); }

function setMode(m) {

$('#m-topic').onclick = () => { setMode('topic'); intro(); };
$('#m-concept').onclick = () => setMode('concept');
$('#m-all').onclick = () => setMode('all');
$('#only-content').addEventListener('change', e => { onlyContent = e.target.checked; $('#c-content').classList.toggle('on', onlyContent); render(); });

let qt;
$('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => search(e.target.value.trim()), 180); });
function search(q) {
  if (!q) { intro(); return; }
  const ql = q.toLowerCase(), hits = [];
  for (const n of G.nodes) {
    if (n.type === 'doctype' || n.type === 'category') continue;
    let s = 0;
    if (n.type === 'topic' && n.desc.toLowerCase().includes(ql)) s += 4;
    if (n.label.toLowerCase().includes(ql)) s += n.type === 'concept' ? 10 : 6;
    if (n.type === 'document') {
      const d = docs[n.id.slice(4)] || {};
      if ((d.page_title || '').toLowerCase().includes(ql)) s += 5;
      if ((d.keywords || []).some(k => k.toLowerCase().includes(ql))) s += 3;
      s += Math.min(4, (d.outline || []).filter(o => o.toLowerCase().includes(ql)).length);
      if ((d.summary || '').toLowerCase().includes(ql)) s += 1;
    }
    if (s) hits.push({o: n, e: {w: s}});
  }
  hits.sort((a, b) => b.e.w - a.e.w);
  const cons = hits.filter(h => h.o.type !== 'document');
  const ds = hits.filter(h => h.o.type === 'document');
  $('#detail').innerHTML = `<div><div class="kicker">검색</div><h2>“${esc(q)}” ${hits.length}건</h2></div>` +
    (cons.length ? `<div class="sec"><h3>개념·고객사</h3>${tagList(cons.slice(0, 20))}</div>` : '') +
    (ds.length ? `<div class="sec"><h3>문서</h3>${docList(ds)}</div>` : '<p class="hint">일치하는 문서가 없습니다. 다른 표기(영문/한글)로 찾아보세요.</p>');

  net.selectNodes(vis_.slice(0, 80));
}

    점선은 내용이 비슷한 문서끼리 이은 선입니다. 속이 빈 파란 점은 아직 제목만 색인된 문서입니다.</p>
