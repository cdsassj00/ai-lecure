<style>
/* VibeStack 디자인 톤 (애플 다크·라이트, iOS 블루, Pretendard) — 토큰 값은 vibestack/style.css 와 같게 둔다.
   대주제 색 --g1~--g7 은 3D 네트워크 노드 색이라 테마와 관계없이 그대로 쓴다. */
:root{
  color-scheme:dark;
  --bg:#000000; --panel:#1c1c1e; --panel2:#2c2c2e; --panel3:#3a3a3c; --line:#38383a; --line2:#48484a;
  --ink:#f5f5f7; --body:#d1d1d6; --mut:#98989d; --faint:#6e6e73;
  --accent:#0a84ff; --accent-hi:#409cff; --accent-bg:rgba(10,132,255,.16); --accent-line:rgba(10,132,255,.4); --on-accent:#ffffff;
  /* 대주제 7색 — iOS 시스템 컬러를 톤다운한 파스텔 (인디고·오렌지·그린·옐로·핑크·틸·퍼플). 선택 강조는 블루(--accent)로 따로 둔다 */
  --g1:#9f9cf5; --g2:#f4b871; --g3:#7fd59a; --g4:#efd57a; --g5:#f28ba3; --g6:#86cfe2; --g7:#c9a2f2;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"D2Coding","Pretendard Variable",Pretendard,monospace;
  --space:radial-gradient(1100px 760px at 58% 42%,#141416 0%,#050505 60%,#000000 100%);
  --glass:rgba(28,28,30,.72); --shadow:0 20px 60px rgba(0,0,0,.6); --backdrop:rgba(0,0,0,.72);
  /* 3D 네트워크 (스크립트가 읽는다) */
  --n-dim:#1c1c1e; --n-lect:#3a3a3c; --n-lect-hi:#64b5ff;
  --lb-halo:rgba(0,0,0,.85); --lb-ink:#f5f5f7; --lb-sub:#d1d1d6; --lb-dim:rgba(255,255,255,.2); --lb-hi-bg:#0a84ff; --lb-lect:#98989d;
  --l-gt:rgba(200,200,210,.42); --l-tt:rgba(200,200,210,.22); --l-tl:rgba(180,180,190,.12); --l-dim:rgba(120,120,130,.06);
  --l-hi:rgba(64,156,255,.95); --l-hi2:rgba(100,181,255,.7);
  --b-disc:#1c1c1e; --b-ink:#f5f5f7; --b-sel:#ffd60a; --b-shadow:rgba(0,0,0,.55);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f5f7; --panel:#ffffff; --panel2:#f2f2f7; --panel3:#e5e5ea; --line:#d2d2d7; --line2:#c7c7cc;
  --ink:#1d1d1f; --body:#424245; --mut:#6e6e73; --faint:#86868b;
  --accent:#0071e3; --accent-hi:#0066cc; --accent-bg:rgba(0,113,227,.1); --accent-line:rgba(0,113,227,.35);
  --g1:#6e6bd8; --g2:#d98a2b; --g3:#3fa863; --g4:#c9a227; --g5:#d9597a; --g6:#3a9fb8; --g7:#9a62d0;
  --space:radial-gradient(1200px 800px at 60% 40%,#ffffff 0%,#f5f5f7 60%,#ececf0 100%);
  --glass:rgba(255,255,255,.78); --shadow:0 20px 60px rgba(0,0,0,.16); --backdrop:rgba(0,0,0,.4);
  --n-dim:#ebebf0; --n-lect:#d1d1d6; --n-lect-hi:#0071e3;
  --lb-halo:rgba(245,245,247,.9); --lb-ink:#1d1d1f; --lb-sub:#424245; --lb-dim:rgba(0,0,0,.2); --lb-hi-bg:#0071e3; --lb-lect:#6e6e73;

  --l-hi:rgba(0,113,227,.9); --l-hi2:rgba(0,113,227,.55);
  --b-disc:#ffffff; --b-ink:#1d1d1f; --b-sel:#e0a800; --b-shadow:rgba(0,0,0,.18);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}

.app{display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);height:100%}

/* 서비스 선택 메뉴 — VibeStack 세 페이지와 같은 메뉴 (vibestack/style.css .site-switch) */
.site-switch{display:flex;margin:14px 20px 0;padding:3px;border-radius:999px;background:var(--panel2);gap:2px}
.site-switch a{flex:1;text-align:center;padding:5px 6px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.3;white-space:nowrap;color:var(--mut);text-decoration:none;letter-spacing:-.02em;transition:background-color .15s,color .15s}

.brand>div{flex:1;min-width:0}
.theme{flex:none;display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:999px;background:var(--panel2);color:var(--ink);cursor:pointer;transition:background-color .15s}
.theme:hover{background:var(--panel3)}
.theme svg{display:block}
[data-theme="light"] .theme .sun,:root:not([data-theme="light"]) .theme .moon{display:none}
.brand h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.brand p{margin:3px 0 0;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}

.searchbox{padding:4px 20px 14px;border-bottom:1px solid var(--line)}
.search{position:relative;display:block}

.search input:focus{border-color:var(--accent);outline:none}

.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px 6px}
.modes{display:flex;gap:4px;margin-bottom:9px;background:var(--panel2);border-radius:999px;padding:3px}
.modes button{flex:1;border:0;background:transparent;border-radius:999px;padding:6px 8px;font-size:12.5px;color:var(--mut);cursor:pointer;font-weight:600;transition:background-color .15s,color .15s}

.answer ul,.answer ol{margin:0 0 10px;padding-left:20px}
.answer li{margin:2px 0}

.cite{border:0;background:var(--accent-bg);color:var(--accent);font:600 11px var(--mono);border-radius:4px;padding:0 4px;margin:0 1px;cursor:pointer;vertical-align:1px}

.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

.pbody{overflow:auto;min-height:0;padding:14px 18px 18px}
.kicker{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--accent)}
.pbody h2{margin:3px 0 4px;font-size:20px;font-weight:650;line-height:1.3;letter-spacing:-.028em;text-wrap:balance}

.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip .c{font-family:var(--mono);font-size:10.5px;opacity:.75}

.tree{display:grid;gap:14px;margin-top:14px}
.tree .g{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;letter-spacing:0;color:var(--ink)}

.tree li button:hover,.tree li button:focus-visible{background:var(--panel2)}
.tree .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.tree .bar b{display:block;height:100%;border-radius:3px}
.tree .n{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:right;white-space:nowrap}

.lects{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.lects button{all:unset;display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;box-sizing:border-box;padding:7px 9px;border-radius:10px;cursor:pointer;font-size:13px}
.lects button:hover{background:var(--panel2)}
.lects .d{font-family:var(--mono);font-size:11px;color:var(--mut)}
.lects .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;padding:11px 8px;border-bottom:1px solid var(--line)}
.card:last-child{border-bottom:0}
.card input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.card h4{margin:0;font-size:14px;line-height:1.45;font-weight:600}
.card h4 button{all:unset;cursor:pointer}
.card h4 button:hover,.card h4 button:focus-visible{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.card .x{grid-column:2;margin:1px 0 0;font-size:12.8px;color:var(--body);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .x mark{background:var(--accent-bg);color:var(--accent);border-radius:2px;padding:0 1px}
.card .src{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--mut);margin-top:3px}
.card.picked{background:var(--accent-bg);border-radius:12px}
.badge{font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:0 7px}
.open{border:0;background:var(--panel2);border-radius:999px;padding:2px 9px;font-size:11px;cursor:pointer;color:var(--ink);transition:background-color .15s}

.pfoot{border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:8px;background:var(--panel2)}
.pfoot .count{font-size:12.5px;color:var(--body);margin-right:auto}
.pfoot .count b{font-family:var(--mono);color:var(--ink)}
.btn{border:1px solid transparent;background:var(--panel3);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-weight:500;color:var(--ink);white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s}
.btn:hover{background:var(--line2)}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--accent-hi)}

main{position:relative;min-width:0;min-height:0;background:var(--space)}
#graph{position:absolute;inset:0}
.overlay{position:absolute;left:18px;top:14px;right:18px;display:flex;gap:12px;align-items:flex-start;pointer-events:none}
.status{font-size:12.5px;color:var(--body);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:7px 12px;backdrop-filter:saturate(150%) blur(20px);-webkit-backdrop-filter:saturate(150%) blur(20px)}
.status b{color:var(--accent)}
.legend{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:flex-end;max-width:62%;font-size:11.5px;color:var(--body);

.legend span{display:inline-flex;align-items:center;gap:5px}

.help{position:absolute;left:18px;bottom:16px;font-size:11.5px;color:var(--mut)}
.scene-tip{background:var(--panel);border:1px solid var(--line2);color:var(--ink);font-size:12px;padding:7px 10px;border-radius:10px;max-width:280px;font-family:var(--sans)}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px;pointer-events:none}

dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

.pvwrap{display:grid;grid-template-rows:auto auto 1fr;height:100%}
.pvhead{display:flex;gap:16px;align-items:flex-start;padding:14px 18px 10px}
.pvhead h2{margin:2px 0 2px;font-size:17px;font-weight:650;line-height:1.35;letter-spacing:-.02em}

.pvhead a{font-size:12px;color:var(--ink);background:var(--panel2);border-radius:999px;padding:6px 12px;text-decoration:none;white-space:nowrap;transition:background-color .15s}
.pvhead a:hover{background:var(--panel3)}
.tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 12px;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.pvbody{min-height:0;position:relative;background:#fff;overflow:hidden}
.pvbody iframe{position:absolute;left:0;top:0;width:1600px;border:0;display:block;background:#fff;transform-origin:0 0}
.digest{display:grid;grid-template-columns:minmax(220px,300px) 1fr;height:100%;min-height:0;background:var(--panel)}
.digest ol{margin:0;padding:14px 14px 14px 36px;overflow:auto;border-right:1px solid var(--line);font-size:12.5px;display:grid;gap:3px;align-content:start}
.digest ol li{color:var(--mut);cursor:pointer;line-height:1.45}
.digest ol li.has{color:var(--body)}
.digest ol li.cur{color:var(--accent);font-weight:600}
.digest ol li:hover{text-decoration:underline}
.digest .txt{overflow:auto;padding:22px 28px;min-height:0}
.digest .txt h3{margin:0 0 10px;font-size:18px;line-height:1.4}
.digest .txt pre{white-space:pre-wrap;font:13.5px/1.8 var(--sans);color:var(--body);margin:0;max-width:72ch}
.note{font-size:12.5px;color:var(--mut)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:12.5px}
dialog.ctx{width:min(780px,calc(100vw - 28px))}
.ctxwrap{display:grid;grid-template-rows:auto 1fr auto;max-height:calc(100vh - 48px)}
.ctxwrap header{padding:18px 20px 10px}
.ctxwrap h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.02em}
.ctxwrap p{margin:4px 0 0;font-size:12.5px;color:var(--mut)}
.ctxwrap textarea{margin:0 20px;min-height:340px;resize:vertical;border:1px solid transparent;border-radius:12px;padding:12px;background:var(--panel2);font:12.5px/1.6 var(--mono);color:var(--body)}
.ctxwrap footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;align-items:center}
.ctxwrap .ok{margin-right:auto;font-size:12.5px;color:var(--mut)}

@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  main{height:62vh;order:-1}
  aside{border-right:0;border-top:1px solid var(--line)}
  .legend,.help{display:none}
  .pfoot{position:sticky;bottom:0}
  .digest{grid-template-columns:1fr;grid-template-rows:40% 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

        <input id="q" type="search" placeholder="검색어를 넣으면 네트워크에 표시됩니다" autocomplete="off" aria-label="슬라이드 내용 검색">

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three-spritetext@1.9.0/dist/three-spritetext.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// 대주제 색: 화면(HTML)은 CSS 변수를 그대로 쓰고, 3D 노드는 readColors()가 읽은 값을 쓴다
const GCOL = D.groups.map((g, i) => `var(--g${i + 1})`);
// 3D 네트워크 색은 테마 토큰에서 읽는다 (테마를 바꾸면 다시 읽고 그린다)
let C = {};
const badgeCache = new Map();
function readColors() {
  C = Object.fromEntries(['accent', 'n-dim', 'n-lect', 'n-lect-hi', 'lb-halo', 'lb-ink', 'lb-sub', 'lb-dim', 'lb-hi-bg', 'lb-lect',
    'l-gt', 'l-tt', 'l-tl', 'l-dim', 'l-hi', 'l-hi2', 'b-disc', 'b-ink', 'b-sel', 'b-shadow'].map(k => [k, css('--' + k)]));
  C.light = document.documentElement.getAttribute('data-theme') === 'light';
  badgeCache.clear();
  C.g = D.groups.map((g, i) => css('--g' + (i + 1)) || '#8e8e93');
}
readColors();
const subs = D.groups.flatMap((g, gi) => g.subs.map(s => ({...s, group: g.name, gi})));
const subById = new Map(subs.map(s => [s.id, s]));
const L = D.lectures;
const selected = new Set();
let current = null, currentLect = null, lectFilter = null, query = '';
const short = (t, k = 18) => t.length > k ? t.slice(0, k - 1) + '…' : t;

// 강의안 ↔ 소주제 슬라이드 수
const lectTopic = new Map(), byLecture = new Map();
for (const s of D.slides) for (const d of s.docs) {
  (byLecture.get(d) || byLecture.set(d, []).get(d)).push(s);
  const m = lectTopic.get(d) || lectTopic.set(d, new Map()).get(d);
  for (const t of s.t) m.set(t, (m.get(t) || 0) + 1);
}
const lectIds = [...lectTopic.keys()];
$('#stats').innerHTML = `강의안 <b>${lectIds.length}</b>개 · 슬라이드 <b>${D.slides.length.toLocaleString()}</b>장 · 소주제 <b>${subs.length}</b>개 · ${esc(D.built)}`;
$('#legend').innerHTML = D.groups.map((g, i) => `<span><i style="background:${GCOL[i]}"></i>${esc(g.name)}</span>`).join('') +
  `<span><i style="background:var(--n-lect)"></i>강의안</span>`;
const QUICK_SEARCH = ['MCP', '하네스', 'RAG', '프롬프트', '피벗', 'Apps Script', '할루시네이션', '배포'];
const QUICK_ASK = ['공무원에게 MCP를 처음 설명할 때 어떤 순서로 가르쳤나요?', '하네스를 비개발자에게 설명한 비유를 모아 주세요',
  '엑셀 업무자동화 실습 예제는 뭐가 있었나요?', 'AI 데이터분석 8시간 과정 목차를 기존 강의로 짜 주세요'];
let mode = 'search';
function renderQuick() {
  $('#quick').innerHTML = (mode === 'search' ? QUICK_SEARCH : QUICK_ASK)
    .map(k => `<button type="button" data-q="${esc(k)}">${esc(mode === 'search' ? k : short(k, 24))}</button>`).join('');
}
renderQuick();

// ───────── 3D 그래프 데이터: 대주제 → 소주제 → 강의안
function lectMainGroup(id) {
  let best = null, bn = -1;
  for (const [t, n] of lectTopic.get(id)) if (n > bn) { bn = n; best = t; }
  return subById.get(best)?.gi ?? 0;
}
const nodes = [], links = [];
D.groups.forEach((g, gi) => nodes.push({id: 'g' + gi, kind: 'group', name: g.name, gi, val: 60}));
for (const s of subs) {
  nodes.push({id: s.id, kind: 'topic', name: s.name, gi: s.gi, val: 5 + s.slides / 3, ref: s});
  links.push({source: 'g' + s.gi, target: s.id, kind: 'gt'});
}
for (const id of lectIds) {
  const m = lectTopic.get(id), total = [...m.values()].reduce((a, b) => a + b, 0);
  nodes.push({id: 'L:' + id, kind: 'lect', name: L[id]?.t || id, lid: id, gi: lectMainGroup(id), val: 1 + Math.min(total, 60) / 10});
  [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4).forEach(([t, n]) => links.push({source: t, target: 'L:' + id, kind: 'tl', n}));
}
for (const s of subs) for (const [t, n] of s.related.slice(0, 2)) if (s.id < t) links.push({source: s.id, target: t, kind: 'tt', n});
const nodeById = new Map(nodes.map(n => [n.id, n]));

// ───────── 강조 상태
let hiTopic = new Map(), hiLect = new Map(), focusMode = false, showLects = true, topicRank = new Map();
function rankTopics() { topicRank = new Map([...hiTopic.entries()].sort((a, b) => b[1] - a[1]).map(([t], i) => [t, i])); }
function isHi(n) {
  if (!focusMode) return true;
  if (n.kind === 'group') return [...hiTopic.keys()].some(t => subById.get(t)?.gi === n.gi);
  if (n.kind === 'topic') return hiTopic.has(n.id);
  return hiLect.has(n.lid);
}
function nodeColor(n) {
  if (!isHi(n)) return C['n-dim'];
  if (n.id === current || (n.lid && n.lid === currentLect)) return C.accent;
  if (n.kind === 'lect') return focusMode ? C['n-lect-hi'] : C['n-lect'];
  return C.g[n.gi];
}
// 라벨: 상자 없이 글자만 두고 배경색 테두리(halo)로 읽히게 한다. 강조된 주제만 블루 알약
function labelFor(n) {
  if (n.kind === 'group') return {text: n.name, h: 15, w: 700, color: isHi(n) ? C['lb-ink'] : C['lb-dim']};
  if (n.kind === 'topic') {
    if (focusMode && !isHi(n)) return null;
    const c = hiTopic.get(n.id);
    if (focusMode && topicRank.has(n.id) && topicRank.get(n.id) >= 10) return null;
    if (focusMode) return {text: n.name + (c ? `  ${c}` : ''), h: 7.5, w: 600, color: '#ffffff', pill: C['lb-hi-bg']};
    return {text: n.name, h: 7.5, w: 600, color: C['lb-sub']};
  }
  if (focusMode && hiLect.has(n.lid) && hiLect.get(n.lid).rank < 8)
    return {text: short(n.name, 22) + (hiLect.get(n.lid).n ? ` · ${hiLect.get(n.lid).n}` : ''), h: 5.2, w: 500, color: C['lb-lect']};
  return null;
}

// 노드 배지 — 어두운 원판 + 대주제 색 테두리 + 바깥 빛 번짐 + 첫 글자 (opencabinet 네트워크와 같은 모양)
// 캔버스 한 장에 원판(반지름 R)과 빛 번짐(2.2R)을 함께 그려 스프라이트로 붙인다
const BADGE = 256, BR = BADGE / 2 / 2.4;
function badgeTexture(color, letter, sel) {
  const key = [color, letter, sel, C.light].join('|');
  if (badgeCache.has(key)) return badgeCache.get(key);
  const cv = document.createElement('canvas'); cv.width = cv.height = BADGE;
  const x = cv.getContext('2d'), c = BADGE / 2, ring = sel ? C['b-sel'] : color;
  const gl = x.createRadialGradient(c, c, BR * .4, c, c, BR * 2.2);
  gl.addColorStop(0, ring + (C.light ? '26' : '4d')); gl.addColorStop(1, ring + '00');
  x.fillStyle = gl; x.beginPath(); x.arc(c, c, BR * 2.2, 0, Math.PI * 2); x.fill();
  x.save(); x.shadowColor = C['b-shadow']; x.shadowBlur = 14; x.shadowOffsetY = 4;
  x.fillStyle = C['b-disc']; x.beginPath(); x.arc(c, c, BR, 0, Math.PI * 2); x.fill(); x.restore();
  if (letter) {
    x.fillStyle = C['b-ink']; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `600 ${Math.round(BR * .92)}px "Pretendard Variable", Pretendard, sans-serif`;
    x.fillText(letter, c, c + BR * .05);
  }
  x.strokeStyle = ring; x.lineWidth = BR * (sel ? .16 : .11);
  x.beginPath(); x.arc(c, c, BR - x.lineWidth / 2, 0, Math.PI * 2); x.stroke();
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  badgeCache.set(key, tex);
  return tex;
}
function badge(n, r) {
  const sel = n.id === current || (n.lid && n.lid === currentLect);
  const lect = n.kind === 'lect';
  const color = lect ? (focusMode && isHi(n) ? C['n-lect-hi'] : C['n-lect']) : C.g[n.gi];
  const tex = badgeTexture(color, lect ? '' : n.name.trim().charAt(0), sel);
  const m = new THREE.SpriteMaterial({map: tex, transparent: true, depthWrite: false, opacity: isHi(n) ? 1 : .16});
  const sp = new THREE.Sprite(m); const size = r * 2 * 2.4 * (sel ? 1.12 : 1);
  sp.scale.set(size, size, 1);
  return sp;
}

const el = $('#graph');
const Graph = ForceGraph3D({controlType: 'orbit'})(el)
  .backgroundColor('rgba(0,0,0,0)')
  .showNavInfo(false)
  .nodeRelSize(3)
  .nodeVal(n => n.val)
  .nodeResolution(24)
  .nodeOpacity(1)
  .nodeVisibility(n => n.kind !== 'lect' || showLects || (focusMode && hiLect.has(n.lid)))
  .nodeColor(nodeColor)
  .nodeLabel(n => n.kind === 'lect' ? `<div class="scene-tip"><b>${esc(n.name)}</b><br>${esc(L[n.lid]?.date || '')} · 클릭하면 원본 보기</div>`
    : n.kind === 'topic' ? `<div class="scene-tip"><b>${esc(n.name)}</b><br>슬라이드 ${n.ref.slides}장 · 강의안 ${n.ref.lectures}개</div>` : '')
  .nodeThreeObjectExtend(false)
  .nodeThreeObject(n => {
    const g = new THREE.Group();
    const r = Math.cbrt(n.val) * 3 * (n.kind === 'lect' ? 1.2 : 1.45);  // 배지는 공보다 커 보여야 읽힌다
    g.add(badge(n, r));
    const lb = labelFor(n);
    if (lb) {
      const s = new SpriteText(lb.text);
      s.fontFace = '"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif';
      s.fontWeight = String(lb.w);
      s.fontSize = 160;  // 캔버스 해상도 — 높을수록 글자가 선명하다
      s.textHeight = lb.h; s.color = lb.color;
      if (lb.pill) { s.backgroundColor = lb.pill; s.padding = [lb.h * .55, lb.h * .22]; s.borderRadius = lb.h * .6; }
      else { s.backgroundColor = false; s.strokeWidth = 1.6; s.strokeColor = C['lb-halo']; }
      s.material.depthWrite = false; s.material.depthTest = false; s.renderOrder = 10;
      s.position.set(0, -(r * 1.15 + lb.h * .75), 0);  // 이름은 원 아래
      g.add(s);
    }
    return g;
  })
  .linkVisibility(l => l.kind !== 'tl' || showLects || focusMode)
  .linkColor(l => {
    const a = l.source, b = l.target;
    if (focusMode && a.id && isHi(a) && isHi(b)) return l.kind === 'tl' ? C['l-hi2'] : C['l-hi'];
    if (focusMode) return C['l-dim'];
    return l.kind === 'gt' ? C['l-gt'] : l.kind === 'tt' ? C['l-tt'] : C['l-tl'];
  })
  .linkWidth(l => { const a = l.source, b = l.target; return focusMode && a.id && isHi(a) && isHi(b) ? (l.kind === 'tl' ? .5 : 1.2) : l.kind === 'gt' ? .5 : 0; })
  .onNodeClick(n => { if (n.kind === 'topic') selectTopic(n.id, true); else if (n.kind === 'lect') openLecture(n.lid); else fly(n, 260); })
  .onNodeHover(n => { el.style.cursor = n ? 'pointer' : 'grab'; })
  .graphData({nodes, links});
Graph.d3Force('charge').strength(n => n.kind === 'group' ? -900 : n.kind === 'topic' ? -220 : -26);
Graph.d3Force('link').distance(l => l.kind === 'gt' ? 95 : l.kind === 'tt' ? 160 : 52).strength(l => l.kind === 'gt' ? .8 : l.kind === 'tl' ? .18 : .03);
Graph.cooldownTicks(180);
let fitted = false;
Graph.onEngineStop(() => { if (!fitted) { fitted = true; Graph.zoomToFit(900, 10, n => n.kind !== 'lect'); $('#loading').hidden = true; } });
setTimeout(() => { $('#loading').hidden = true; }, 6000);
function resize() { Graph.width(el.clientWidth).height(el.clientHeight); }
window.addEventListener('resize', resize); resize();

function refresh() {
  rankTopics();
  Graph.nodeColor(Graph.nodeColor()).nodeThreeObject(Graph.nodeThreeObject()).nodeVisibility(Graph.nodeVisibility())
    .linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth()).linkVisibility(Graph.linkVisibility());
}
function fly(n, dist) {
  const len = Math.hypot(n.x || 1, n.y || 1, n.z || 1), r = 1 + dist / len;
  Graph.cameraPosition({x: n.x * r, y: n.y * r, z: n.z * r}, {x: n.x, y: n.y, z: n.z}, 1000);
}
function fitHi() { setTimeout(() => Graph.zoomToFit(1000, 40, n => n.kind === 'topic' ? isHi(n) && (!topicRank.has(n.id) || topicRank.get(n.id) < 10) : n.kind === 'lect' && hiLect.has(n.lid) && hiLect.get(n.lid).rank < 8), 80); }
function setStatus(html) { $('#status').innerHTML = html; }

// ───────── 검색 → 네트워크 강조
function hits(q) {
  const ql = q.toLowerCase();
  return D.slides.filter(s => s.h.toLowerCase().includes(ql) || s.x.toLowerCase().includes(ql))
    .sort((a, b) => (b.h.toLowerCase().includes(ql)) - (a.h.toLowerCase().includes(ql)) || b.reuse - a.reuse);
}
function runSearch(q) {
  query = q; current = null; currentLect = null; lectFilter = null;
  $('#qx').hidden = !q;
  if (!q) { focusMode = false; hiTopic = new Map(); hiLect = new Map(); refresh(); renderIntro(); Graph.zoomToFit(900, 10, n => n.kind !== 'lect'); setStatus(defaultStatus()); return; }
  const hs = hits(q);
  hiTopic = new Map(); const lc = new Map();
  for (const s of hs) { for (const t of s.t) hiTopic.set(t, (hiTopic.get(t) || 0) + 1); for (const d of s.docs) lc.set(d, (lc.get(d) || 0) + 1); }
  hiLect = new Map([...lc.entries()].sort((a, b) => b[1] - a[1]).map(([d, n], i) => [d, {n, rank: i}]));
  focusMode = true; refresh(); if (hs.length) fitHi();
  setStatus(`“${esc(q)}” → 슬라이드 <b>${hs.length}</b>장 · 주제 <b>${hiTopic.size}</b>개 · 강의안 <b>${hiLect.size}</b>개`);
  renderSearch(hs);
}
function mark(t) {
  if (!query) return esc(t);
  const ql = query.toLowerCase(), i = t.toLowerCase().indexOf(ql);
  if (i < 0) return esc(t);
  const a = Math.max(0, i - 50), seg = (a ? '…' : '') + t.slice(a), j = seg.toLowerCase().indexOf(ql);
  return esc(seg.slice(0, j)) + '<mark>' + esc(seg.slice(j, j + query.length)) + '</mark>' + esc(seg.slice(j + query.length));
}
function card(s) {
  const l = L[s.d] || {};
  return `<div class="card${selected.has(s.n) ? ' picked' : ''}" data-n="${s.n}">
    <input type="checkbox" ${selected.has(s.n) ? 'checked' : ''} aria-label="이 슬라이드 선택">
    <h4><button type="button" data-pv="${s.n}" title="원본에서 이 슬라이드 보기">${esc(s.h)}</button></h4>
    <p class="x">${mark(s.x)}</p>
    <div class="src"><span>${esc([short(l.t || '', 26), l.date].filter(Boolean).join(' · '))}</span>
      <button class="open" type="button" data-pv="${s.n}">${l.p ? '원본 보기' : '핵심 내용'}</button>
      ${s.reuse > 1 ? `<span class="badge">${s.reuse}개 강의안에서 사용</span>` : ''}</div></div>`;
}
function lectList(entries) {
  return `<ul class="lects">${entries.map(([d, n]) => `<li><button type="button" data-lect="${esc(d)}" title="${esc(L[d]?.t || '')}">
    <span class="t">${esc(L[d]?.t || d)}</span><span class="d">${n}장 · ${esc(L[d]?.date || '')}</span></button></li>`).join('')}</ul>`;
}
function topicChip(t, n) {
  return `<button class="chip" type="button" data-topic="${t}"><i style="background:${GCOL[subById.get(t).gi]}"></i>${esc(subById.get(t).name)}${n != null ? `<span class="c">${n}</span>` : ''}</button>`;
}
function renderSearch(hs) {
  const tops = [...hiTopic.entries()].sort((a, b) => b[1] - a[1]);
  $('#pbody').innerHTML = `<div class="kicker">검색 결과</div><h2>“${esc(query)}”</h2>

// ───────── AI에게 질문: BM25로 근거 슬라이드 → LLM 답변
function toks(s) {
  const out = [];
  for (const m of s.toLowerCase().matchAll(/[a-z0-9][a-z0-9+#.\-]*|[가-힣]+/g)) {
    const w = m[0];
    if (/[가-힣]/.test(w)) { if (w.length === 1) continue; for (let i = 0; i < w.length - 1; i++) out.push(w.slice(i, i + 2)); }
    else if (w.length >= 2) out.push(w);
  }
  return out;
}
let IDX = null;
function buildIdx() {
  const tfs = [], lens = [], df = new Map();
  for (const s of D.slides) {
    const tf = new Map(); let len = 0;
    for (const t of toks(s.h + ' ' + s.h + ' ' + s.x)) { tf.set(t, (tf.get(t) || 0) + 1); len++; }
    tfs.push(tf); lens.push(len); for (const t of tf.keys()) df.set(t, (df.get(t) || 0) + 1);
  }
  IDX = {tfs, lens, df, N: D.slides.length, avg: lens.reduce((a, b) => a + b, 0) / D.slides.length};
}
// 질문 문장에 흔한 말(두 글자 조각)은 검색어에서 뺀다
const QSTOP = new Set(toks('처음 설명 어떤 어떻게 순서 가르쳤나요 가르친 했나요 있었나요 알려 주세요 모아 짜 줘 기존 강의 강의안 과정 대상 시간 내용 관련 무엇 뭐가 방법 정리 해주 대해 위한 에게 할때 때 좋을까'));
// 파일 경로·코드 조각처럼 생긴 슬라이드는 근거에서 뺀다
const isJunk = s => /^\.{0,2}\//.test(s.h) || /[A-Za-z0-9_-]{24,}/.test(s.h) || (!/[가-힣]{2}/.test(s.h) && /[\/\\]/.test(s.h)) || s.x.length < 60;
function retrieve(q, k = 14) {
  if (!IDX) buildIdx();
  const sc = new Float64Array(IDX.N);
  for (const t of new Set(toks(q))) {
    if (QSTOP.has(t)) continue;
    const n = IDX.df.get(t); if (!n || n > IDX.N * .35) continue;       // 너무 흔한 조각은 무시
    const w = /^[a-z0-9]/.test(t) ? 2.2 : 1;                              // MCP·RAG 같은 영문 용어는 더 크게
    const idf = Math.log(1 + (IDX.N - n + .5) / (n + .5)) * w;
    for (let i = 0; i < IDX.N; i++) { const f = IDX.tfs[i].get(t); if (f) sc[i] += idf * f * 2.4 / (f + 1.4 * (.3 + .7 * IDX.lens[i] / IDX.avg)); }
  }
  // 질문에 소주제 키워드가 나오면 그 주제에 배정된 슬라이드를 끌어올린다
  const ql = q.toLowerCase(), boost = new Set();
  for (const t of subs) if (t.keywords.some(kw => kw.length >= 2 && ql.includes(kw.toLowerCase()))) boost.add(t.id);
  if (boost.size) for (let i = 0; i < IDX.N; i++) if (sc[i] && D.slides[i].t.some(t => boost.has(t))) sc[i] *= 1.8;
  const order = [...sc.keys()].filter(i => sc[i] > 0).sort((a, b) => sc[b] - sc[a]);
  const per = new Map(), picks = [];
  for (const i of order) {
    const s = D.slides[i]; if ((per.get(s.d) || 0) >= 3 || isJunk(s)) continue;
    per.set(s.d, (per.get(s.d) || 0) + 1); picks.push(s); if (picks.length >= k) break;
  }
  return picks;
}

  for (const s of list) { for (const t of s.t) hiTopic.set(t, (hiTopic.get(t) || 0) + 1); for (const d of s.docs) lc.set(d, (lc.get(d) || 0) + 1); }
  hiLect = new Map([...lc.entries()].sort((a, b) => b[1] - a[1]).map(([d, n], i) => [d, {n, rank: i}]));
  focusMode = true; refresh(); if (list.length) fitHi();
  setStatus(labelFn());
}
function buildPrompt(q, picks) {
  const ctx = picks.map((s, i) => {
    const l = L[s.d] || {};
    return `[${i + 1}] ${s.h}\n출처: ${[l.t, l.date, (l.c || []).join(', ')].filter(Boolean).join(' · ')}\n${s.x.slice(0, 750)}`;
  }).join('\n\n');
  return `아래는 강사 신성진의 기존 강의안에서 검색한 슬라이드 ${picks.length}장입니다.\n` +
    `규칙: 이 자료만 근거로 한국어 합니다체로 답합니다. 근거 문장 끝에 [번호]를 붙입니다. 자료에 없으면 "기존 강의안에는 없습니다"라고 씁니다. ` +
    `새 강의 구성을 물으면 차시·목차 형태로 제안하고 각 항목에 재사용할 슬라이드 번호를 적습니다. 불릿과 짧은 소제목(### )을 써도 됩니다.\n\n` +
    `질문: ${q}\n\n자료:\n${ctx}`;
}
function mdLite(text) {
  const lines = esc(text).split('\n'); let html = '', list = null;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(\d{1,2})\]/g, (m, n) => `<button class="cite" type="button" data-cite="${n}">${n}</button>`);
  for (const raw of lines) {
    const l = raw.trim();
    const li = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (li) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (list) { html += '</ul>'; list = null; }
    if (!l) continue;
    const h = l.match(/^#{1,4}\s+(.*)$/);
    html += h ? `<h4>${inline(h[1])}</h4>` : `<p>${inline(l)}</p>`;
  }
  if (list) html += '</ul>';
  return html;
}
let askPicks = [], askCtl = null;
const samplePromise = (window.claude && window.claude.use) ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);
const getPass = () => { try { return localStorage.getItem('kg.passcode') || ''; } catch (e) { return ''; } };
const setPass = v => { try { localStorage.setItem('kg.passcode', v); } catch (e) {} };
async function viaServer(prompt, onText, signal) {
  const r = await fetch('api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({prompt, passcode: getPass()}), signal});
  if (!r.ok) {
    let m = `서버 응답 ${r.status}`, code = 'server';
    try { const j = await r.json(); m = j.message || m; if (j.error === 'passcode') code = 'passcode'; } catch (e) {}
    if (code === 'passcode') throw {code, message: m};
    if (r.status === 404) m = 'AI 서버 함수(/api/ask)가 없습니다. Vercel 배포본에서 여세요.';
    throw {code: 'server', message: m};
  }
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', text = '';
  for (;;) {
    const {value, done} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream: true});
    const parts = buf.split('\n'); buf = parts.pop();
    for (const line of parts) {
      if (!line.startsWith('data:')) continue;
      const d = line.slice(5).trim(); if (d === '[DONE]') continue;
      try { const j = JSON.parse(d); const dl = j.choices?.[0]?.delta?.content; if (dl) { text += dl; onText(text); } if (j.error) throw {code: 'server', message: j.error.message || 'OpenRouter 오류'}; }
      catch (e) { if (e.code) throw e; }
    }
  }
  if (!text) throw {code: 'server', message: '빈 답변이 왔습니다.'};
  return text;
}
async function ask(q) {
  if (!q) { $('#q').focus(); return; }
  askCtl?.abort(); askCtl = new AbortController(); const signal = askCtl.signal;
  askPicks = retrieve(q);
  highlightSlides(askPicks, () => `질문 근거: 슬라이드 <b>${askPicks.length}</b>장 · 주제 <b>${hiTopic.size}</b>개 · 강의안 <b>${hiLect.size}</b>개`);
  $('#pbody').innerHTML = `<div class="kicker">AI 답변</div><h2>${esc(q)}</h2>
    <div class="answer" id="ans"><span class="think">${askPicks.length ? '내 강의안 근거 ' + askPicks.length + '장을 읽고 답을 쓰는 중…' : '관련 슬라이드를 찾지 못했습니다.'}</span></div>
    <div class="ansbar" id="ansbar"></div>
    <div class="sec"><h3>근거 슬라이드 (BM25 상위 ${askPicks.length}장)</h3>${askPicks.map((s, i) => card(s).replace('<h4>', `<h4><span class="num">${i + 1}</span>`)).join('')}</div>`;
  $('#pbody').scrollTop = 0;
  if (!askPicks.length) return;
  $('#stopBtn').hidden = false; $('#askBtn').disabled = true;
  const out = $('#ans'), prompt = buildPrompt(q, askPicks);
  const show = t => { out.innerHTML = mdLite(t); };
  let via = '';
  try {
    const sample = await samplePromise;
    if (sample) {
      via = 'Claude (claude.ai)';
      await sample(prompt, {signal, cache: false, onText: ({text}) => show(text)});
    } else {
      via = 'OpenRouter (Vercel)';
      await viaServer(prompt, show, signal);
    }
    $('#ansbar').innerHTML = `<span>${esc(via)} · 근거 ${askPicks.length}장</span><button class="btn" type="button" data-askctx="1">근거 슬라이드로 컨텍스트 만들기</button>`;
  } catch (e) {
    if (e?.name === 'AbortError' || e?.code === 'cancelled') { $('#ansbar').textContent = '중지했습니다.'; }
    else {
      const msg = {not_granted: 'Claude 사용을 허용하지 않아 답할 수 없습니다.', rate_limited: '요청이 많습니다. 잠시 뒤 다시 질문하세요.',
        sampling_disabled: '이 계정에서는 Claude 호출을 쓸 수 없습니다.'}[e?.code] || e?.message || '답변 중 오류가 났습니다.';
      if (e?.code === 'passcode') {
        out.innerHTML = `<p class="note">이 사이트는 질문 비밀번호로 잠겨 있습니다. 한 번 입력하면 이 브라우저에 기억합니다.</p>
          <div class="askrow"><input id="passIn" type="password" autocomplete="current-password" aria-label="질문 비밀번호"
            style="flex:1;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel)">
          <button class="btn primary" type="button" id="passOk">확인 후 다시 질문</button></div>`;
        $('#ansbar').innerHTML = '';
        $('#passOk').onclick = () => { setPass($('#passIn').value.trim()); ask(q); };
        $('#passIn').addEventListener('keydown', ev => { if (ev.key === 'Enter') $('#passOk').click(); });
        $('#passIn').focus();
        return;
      }
      if (!out.textContent || out.querySelector('.think')) out.innerHTML = `<p class="note">${esc(msg)}</p>`;
      $('#ansbar').innerHTML = `<span>${esc(msg)}</span>`;
    }
  } finally { $('#stopBtn').hidden = true; $('#askBtn').disabled = false; }
}
