<!DOCTYPE html>
<html lang="ko">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<title>LLM 에이전트·하네스·클라우드·로컬 실행구조 — 4장 보고서</title>
<style>
  :root{
    --bg:#f5f6f8; --surf:#ffffff; --tint:#e5e9ef; --tint2:#d7dde6;
    --hair:#d7dee8; --hair2:#c3cedb;
    --ink:#102139; --body:#3d4c60; --mut:#68758a; --faint:#93a1b3;
    --blue:#b94a48; --cyan:#943539; --green:#2e7d5b; --amber:#c38424;
    --coral:#b94a48; --navy:#101827;
    --gG:#2e8a5c; --gB:#4266a3; --gK:#141b28;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#c8ccd3}
  body{font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif;
       color:var(--ink);-webkit-font-smoothing:antialiased}
  .deck{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 0}
  body.shot .deck{padding:0;gap:0}

  /* ---------- slide frame ---------- */
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;flex:none;
    background:
      radial-gradient(760px 380px at 88% -10%, rgba(185,74,72,.05), transparent 60%),
      var(--bg);
    display:grid;grid-template-rows:auto 1fr auto auto;row-gap:14px;
    padding:28px 48px 0}
  .slide::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;pointer-events:none;
    background:linear-gradient(90deg,var(--gG) 0 33.3%,var(--gB) 33.3% 66.6%,var(--gK) 66.6% 100%)}

  /* ---------- header ---------- */
  .head{display:grid;grid-template-columns:1fr auto;column-gap:24px;align-items:end;
    margin:-28px -48px 0;padding:24px 48px 14px;
    background:linear-gradient(180deg,#e5e9ef 0%,#eef1f5 100%);
    border-bottom:2px solid #bdc7d4}
  .slide{word-break:keep-all;overflow-wrap:break-word}
  .kick{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .kick .no{font-weight:900;font-size:12px;letter-spacing:.1em;color:#fff;
    background:var(--blue);padding:3px 9px;border-radius:3px}
  .kick .lb{font-weight:800;font-size:12.5px;letter-spacing:.2em;color:var(--blue);text-transform:uppercase}
  h1{font-size:32px;font-weight:900;letter-spacing:-1.2px;line-height:1.16;color:#102139}
  h1 em{font-style:normal;color:var(--blue)}
  h1 em.g{color:var(--green)} h1 em.a{color:var(--amber)} h1 em.c{color:var(--coral)} h1 em.f{color:var(--faint)}
  .headsub{margin-top:7px;font-size:15px;color:var(--body);font-weight:500}
  .headsub b{color:var(--ink);font-weight:800}
  .brand{text-align:right;padding-bottom:3px}
  .brand .t1{font-weight:900;font-size:13px;letter-spacing:.08em;color:var(--ink)}
  .brand .t1 span{color:var(--blue)}
  .brand .t2{font-size:11px;color:var(--mut);margin-top:3px;letter-spacing:.04em}

  /* ---------- open sections (no boxes) ---------- */
  .main{display:grid;row-gap:14px;min-height:0}
  .sec{display:grid;grid-template-rows:auto 1fr;min-height:0;row-gap:9px}
  .sl{display:flex;align-items:center;gap:10px}
  .sl .tx{flex:none;font-weight:900;font-size:13.5px;letter-spacing:.02em;color:var(--ink)}
  .sl .tx i{font-style:normal;color:var(--blue)}
  .sl .sx{flex:none;font-size:12px;color:var(--mut);font-weight:500}
  .sl .ln{flex:1;border-top:1px solid var(--hair2)}
  .sl .tag{flex:none;font-size:11px;font-weight:800;color:var(--coral);
    border:1px solid rgba(185,74,72,.42);border-radius:20px;padding:2.5px 11px;letter-spacing:.03em;background:#faeeed}

  /* open step (typography-led, no border) */
  .flow{display:grid;min-height:0}
  .step{display:flex;flex-direction:column;min-height:0;padding:4px 2px 0;position:relative}
  .step .cno{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--mut);margin-bottom:5px}
  .step .ct{font-weight:800;font-size:16.5px;letter-spacing:-.4px;line-height:1.28;color:var(--ink)}
  .step .cs{font-size:13px;color:var(--body);line-height:1.55;margin-top:7px}
  .step .cs b{color:var(--ink);font-weight:800}
  .step .cf{margin-top:auto;padding-top:9px;font-size:11.5px;color:var(--mut)}
  .step .cf b{color:var(--blue);font-weight:800}
  .stepno{position:absolute;top:0;right:6px;font-size:30px;font-weight:900;color:var(--hair2);line-height:1}
  .arrow{align-self:center;justify-self:center;color:var(--hair2);font-size:22px;font-weight:900}

  /* highlighted step = only these get a surface */
  .step.hot{background:linear-gradient(180deg,#f8ecea,#fbf4f3);border-radius:12px;
    padding:12px 14px 12px;border:1px solid #e5c8c5}
  .step.hot .cno{color:var(--blue)} .step.hot .stepno{color:#e8cfcc;top:8px;right:12px}
  .step.hotg{background:linear-gradient(180deg,#e8f0ea,#f4f8f5);border-radius:12px;
    padding:12px 14px 12px;border:1px solid #c8dcce}
  .step.hotg .cno{color:var(--green)} .step.hotg .stepno{color:#bfd8c8;top:8px;right:12px}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:12px;font-weight:700;color:var(--body);background:var(--tint);
    border:1px solid var(--hair);border-radius:20px;padding:4px 12px;white-space:nowrap}
  .chip.on{color:#fff;background:var(--blue);border-color:var(--blue);font-weight:800}

  /* ---------- anchor bar (single strong element) ---------- */
  .anchor{height:54px;border-radius:11px;display:flex;align-items:center;gap:14px;padding:0 20px;
    background:linear-gradient(92deg,var(--navy),#1d2940);color:#fff;
    box-shadow:0 8px 20px -10px rgba(16,28,51,.45)}
  .anchor .k{flex:none;font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--navy);
    background:#ffc9c5;border-radius:4px;padding:4px 10px}
  .anchor .t{font-size:16.5px;font-weight:800;letter-spacing:-.2px}
  .anchor .t b{color:#ffc9c5}
  .anchor .r{margin-left:auto;font-size:12px;color:#aab6ca;font-weight:600;text-align:right}
  .anchor.coral{background:linear-gradient(92deg,#B23A24,var(--coral))}
  .anchor.coral .k{background:#FFD9CF;color:#8F2D1B}
  .anchor.coral .t b{color:#FFE1B8}
  .anchor.coral .r{color:#FFD3C7}

  /* ---------- footer ---------- */
  .foot{height:34px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--hair);
    font-size:10.5px;color:var(--faint);letter-spacing:.04em}
  .foot .pg{margin-left:auto;font-weight:900;color:var(--mut);font-size:11.5px}
  .foot .pg b{color:var(--blue)}

  /* ============ KEYNOTE v2 (s1~s5) — 편집본 V3 디자인 시스템 ============ */
  .slide.key{display:flex;flex-direction:column;padding:0}
  body.present .slide.key.cur{display:flex}   /* 발표 모드의 display:grid 오버라이드 방지 */
  .slide.key::before{display:none}
  .key .ktop{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 46px;background:var(--navy)}
  .key .kt1{font-size:12.5px;font-weight:700;color:#f3ede2;letter-spacing:.2px}
  .key .kt1 small{font-size:10px;color:rgba(243,237,226,.42);font-weight:600;letter-spacing:1px;margin-left:7px}
  .key .kt2{font-size:10.5px;font-weight:600;letter-spacing:1.2px;color:rgba(243,237,226,.55)}
  .key .khdr{flex:none;background:var(--tint);padding:20px 50px 18px;border-bottom:1.5px solid var(--hair2)}
  .key .keyebrow{font-size:10.5px;font-weight:900;letter-spacing:1.7px;color:var(--cyan);
    margin-bottom:6px;text-transform:uppercase}
  .key .ktitle{font-size:30px;font-weight:900;color:#102139;letter-spacing:-1.15px;line-height:1.16}
  .key .kbody{flex:1;display:flex;align-items:center;padding:0 96px 30px 50px;min-height:0}
  .key .krow{display:grid;grid-template-columns:240px 1fr;align-items:start;width:100%}
  .key .knum{font-size:110px;font-weight:900;color:#d3dae4;line-height:.9;text-align:center;
    padding-top:6px;letter-spacing:-5px}
  .key .ktxt{display:flex;flex-direction:column;gap:18px;max-width:880px}
  .key .ktxt h2{font-size:33px;font-weight:900;color:#102139;line-height:1.38;letter-spacing:-1.2px}
  .key .ktxt h2 em{font-style:normal;color:var(--blue)}
  .key .ktxt h2 .h2tag{display:block;font-size:16px;font-weight:800;letter-spacing:-.3px;
    color:#2e7d5b;margin-top:12px}
  .key .ktxt h2 .h2tag i{font-style:normal;color:var(--mut);font-weight:600}
  .key .ktxt h2 em.g{color:#2e7d5b} .key .ktxt h2 em.a{color:var(--amber)} .key .ktxt h2 em.c{color:var(--cyan)}
  .key .ktxt p{font-size:15px;color:var(--body);line-height:1.8;font-weight:400}
  .key .ktxt p b{color:var(--cyan);font-weight:700}
  .key .kpg{position:absolute;right:30px;bottom:13px;font-size:13.5px;font-weight:700;color:var(--blue)}

  /* ============ SLIDE 06 · 전수 현황 ============ */
  .s6x-main{grid-template-rows:.66fr 1fr}
  .s6x-top{display:grid;grid-template-columns:.9fr 1.15fr .8fr 1.5fr 1.45fr;gap:12px}
  .stat6{background:var(--surf);border:1px solid var(--hair);border-radius:10px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;
    box-shadow:0 4px 12px -9px rgba(16,33,57,.16)}
  .stat6 .n{font-size:26px;font-weight:900;letter-spacing:-1px;color:#4266a3}
  .stat6.g .n{color:#2e8a5c}.stat6.a .n{color:#c38424}
  .stat6 .l{font-size:11.8px;color:var(--mut);font-weight:600;padding:0 8px}
  .role{background:var(--tint);border:1px solid var(--hair);border-radius:10px;padding:11px 15px;
    display:flex;flex-direction:column;gap:6px;justify-content:center}
  .role .rt{font-size:14px;font-weight:800;color:var(--ink)}
  .role .rt small{font-size:11px;color:var(--mut);font-weight:700;margin-left:6px}
  .role .ri{font-size:11.8px;line-height:1.62;color:var(--body)}
  .s6x-rows{display:grid;grid-template-rows:repeat(5,1fr);row-gap:8px;min-height:0}
  .agrow{display:grid;grid-template-columns:158px 132px 1.18fr 1.12fr;gap:14px;align-items:center;
    background:var(--surf);border:1px solid var(--hair);border-left:4px solid #4266a3;border-radius:8px;
    padding:4px 16px;min-height:0;box-shadow:0 3px 10px -8px rgba(16,33,57,.14)}
  .agrow .ag{font-size:15px;font-weight:900;letter-spacing:-.3px;color:var(--ink)}
  .agrow .sz{font-size:13px;font-weight:800}
  .agrow .cfg{font-size:12.4px;color:var(--body);line-height:1.4}
  .agrow .sch{font-size:11.8px;color:var(--mut);line-height:1.4}

  /* ============ SLIDE 06 · 사례 상세 ============ */
  .case6-main{grid-template-rows:1fr 1fr 1fr 46px;row-gap:10px}
  .csrow{display:grid;grid-template-columns:148px repeat(4,1fr) 1.06fr;min-height:0;
    background:var(--surf);border:1px solid var(--hair);border-radius:9px;overflow:hidden;
    box-shadow:0 3px 10px -8px rgba(16,33,57,.14)}
  .csrow .cshead{background:var(--tint);border-right:1px solid var(--hair);padding:10px 12px;
    display:flex;flex-direction:column;justify-content:center;gap:4px;border-left:4px solid #4266a3}
  .csrow .cshead small{font-size:9px;font-weight:800;color:var(--mut);letter-spacing:.04em;line-height:1.35}
  .csrow .cshead b{font-size:16.5px;font-weight:900;letter-spacing:-.4px;color:var(--ink)}
  .csrow .cscell{padding:9px 12px;border-right:1px solid var(--hair);display:flex;flex-direction:column;
    gap:4px;justify-content:center;min-width:0}
  .csrow .cscell:last-child{border-right:none;background:#f9f1e2}
  .csrow .cscell em{font-style:normal;font-size:9.5px;font-weight:900;letter-spacing:.08em;color:var(--mut)}
  .csrow .cscell:last-child em{color:#8f5f14}
  .csrow .cscell p{font-size:11.8px;line-height:1.5;color:var(--body)}
  .csrow .cscell.out p{font-weight:700;color:var(--ink)}
  .dflow{display:grid;grid-template-columns:1fr 22px 1fr 22px 1fr 22px 1fr 22px 1.02fr;align-items:stretch}
  .dflow .dstep{background:var(--tint);border:1px solid var(--hair2);border-radius:8px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;padding:4px 8px}
  .dflow .dstep b{font-size:11.8px;font-weight:800;color:var(--ink)}
  .dflow .dstep span{font-size:10px;color:var(--mut);font-weight:600}
  .dflow .darr{align-self:center;justify-self:center;color:var(--blue);font-weight:900;font-size:15px}
  .dflow .dstep.fin{background:#f8ecea;border-color:rgba(185,74,72,.45)}
  .dflow .dstep.fin b{color:#943539}

  /* ============ SLIDE 08 · 도구 오케스트레이션 맵 ============ */
  .s7x-main{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;
    column-gap:16px;row-gap:16px;position:relative;min-height:0}
  .s7x-main::before{content:'';position:absolute;inset:-6px;border-radius:10px;
    background-image:radial-gradient(#c3cddd 1.1px,transparent 1.1px);background-size:24px 24px;opacity:.55}
  .npanel{background:rgba(255,255,255,.92);border:1px solid var(--hair);border-radius:11px;padding:11px 14px;
    display:flex;flex-direction:column;gap:8px;min-height:0;z-index:2;
    box-shadow:0 4px 12px -9px rgba(16,33,57,.18)}
  .npanel .nh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;letter-spacing:-.2px;color:var(--ink)}
  .npanel .nh .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .npanel .nh small{margin-left:auto;font-size:9.5px;color:var(--mut);font-weight:700}
  .npanel .nchips{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-content:center;min-height:0}
  .npanel .chip{font-size:11.4px;font-weight:700;padding:3.5px 10px;border-radius:15px;
    background:var(--tint);border:1px solid var(--hair2);color:var(--body);white-space:nowrap}
  .nmidcol{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;justify-content:space-between;min-height:0;z-index:2}
  .nmidcol .npanel{flex:0 0 33.5%}
  .nhubwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4}
  .nethub{width:212px;height:212px;border-radius:50%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;gap:6px;padding:20px;
    background:radial-gradient(circle at 36% 28%,#22314f,#0d1626 72%);
    box-shadow:0 16px 36px -12px rgba(16,24,39,.6),0 0 0 9px rgba(16,24,39,.07),0 0 0 1px rgba(16,24,39,.3)}
  .nethub .k{font-size:9px;font-weight:900;letter-spacing:2.2px;color:#ffc9c5}
  .nethub .t{font-size:16.5px;font-weight:900;letter-spacing:-.5px;color:#fff;line-height:1.3}
  .nethub .s{font-size:10px;color:#b9c2d4;line-height:1.5}
  .nethub .s b{color:#e8b571;font-weight:800}

  /* ============ COVER ============ */
  .slide.cover{grid-template-rows:auto 1fr auto auto}
  .cover .head{margin:0;padding:0;background:none;border-bottom:none}
  .cover h1{font-size:70px;letter-spacing:-2.4px;line-height:1.12}
  .cv-mid{display:flex;flex-direction:column;justify-content:center;gap:20px}
  .cv-sub{font-size:19px;color:var(--body);font-weight:500;line-height:1.6;max-width:980px}
  .cv-sub b{color:var(--ink);font-weight:800}
  .cv-agenda{display:grid;grid-template-columns:1fr 1fr 1fr 1.12fr;gap:12px}
  .cv-item{background:var(--surf);border:1px solid var(--hair);border-radius:12px;
    padding:16px 18px;display:flex;flex-direction:column;gap:6px;
    box-shadow:0 6px 18px -12px rgba(16,28,51,.18)}
  .cv-item .k{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--blue)}
  .cv-item .t{font-size:17.5px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
  .cv-item .s{font-size:12px;color:var(--mut);line-height:1.45}
  .cv-item.ask{background:linear-gradient(160deg,#faeeed,#FFFFFF);border-color:rgba(185,74,72,.5)}
  .cv-item.ask .k{color:var(--coral)}
  .cv-stats{display:flex;gap:40px;padding-top:6px}
  .cv-stats .st{display:flex;flex-direction:column;gap:4px;padding-left:16px;border-left:2px solid var(--hair2)}
  .cv-stats .n{font-size:27px;font-weight:900;letter-spacing:-.5px;color:var(--blue)}
  .cv-stats .n i{font-style:normal;font-size:15px;color:var(--body);font-weight:800}
  .cv-stats .l{font-size:12px;color:var(--mut);font-weight:600}

  /* ============ SLIDE 1 ============ */
  .s1-main{grid-template-rows:1.04fr 1fr}
  .s1-models{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--hair);padding-bottom:2px}
  .s1-models .lb{font-weight:800;font-size:13.5px;flex:none;color:var(--ink)}
  .s1-models .lb i{font-style:normal;color:var(--blue)}
  .s1-models .note{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600;flex:none}
  .s1-steps{grid-template-columns:1fr 34px 1fr 34px 1.14fr;column-gap:0}
  .s1-steps .step:not(.hot):not(.hotg){border-top:2px solid var(--hair2);padding-top:10px}

  /* ============ SLIDE 2 ============ */
  .s2-main{grid-template-rows:1fr 1.02fr}
  .s2-eq{grid-template-columns:1fr 40px 1fr 40px 1.3fr 46px .74fr}
  .s2-eq .step:not(.hotg){border-top:2px solid var(--hair2);padding-top:10px}
  .op{align-self:center;justify-self:center;font-size:28px;font-weight:900;color:var(--hair2)}
  .s2-sum{background:linear-gradient(165deg,var(--green),#1f5c42);border-radius:12px;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;
    box-shadow:0 10px 22px -12px rgba(46,125,91,.45)}
  .s2-sum .b{font-size:20px;font-weight:900;letter-spacing:-.3px}
  .s2-sum .s{font-size:11.5px;color:#d5ead9;margin-top:6px;line-height:1.45;font-weight:600}
  .s2-low{grid-template-columns:1.18fr 1fr 1fr;column-gap:24px}

  /* ============ SLIDE 3 ============ */
  .s3-main{grid-template-rows:1.12fr 1fr}
  .s3-cycle{grid-template-columns:1fr 26px 1fr 26px 1fr 26px 1fr 26px 1.08fr}
  .s3-cycle .step:not(.hot){border-top:2px solid var(--hair2);padding-top:10px}
  .s3-cycle .step .ct{font-size:15px}
  .s3-cycle .step .cs{font-size:12.2px;margin-top:5px}
  .loopnote{grid-column:1 / -1;display:flex;align-items:center;gap:10px;font-size:12px;
    color:var(--mut);font-weight:600;padding-top:8px}
  .loopnote .ln{flex:1;border-top:1.5px dashed var(--hair2);position:relative}
  .loopnote .ln::before{content:'◀';position:absolute;left:-2px;top:-8px;color:var(--faint);font-size:10px}
  .s3-low{grid-template-columns:1fr 1fr;column-gap:24px}
  .s3-low .step:not(.hot){border-top:2px solid var(--hair2);padding-top:10px}

  /* ============ SLIDE 4 ============ */
  .s4-main{grid-template-rows:1fr 1.05fr}
  .s4-domains{grid-template-columns:1fr 1fr 1fr;column-gap:24px}
  .s4-domains .step:not(.hot){border-top:2px solid var(--hair2);padding-top:10px}
  .s4-verify{grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr}
  .s4-verify .step:not(.hot){border-top:2px solid var(--hair2);padding-top:10px}
  .s4-trend{display:flex;align-items:center;gap:11px;border-top:1px solid var(--hair);padding-top:10px}
  .s4-trend .lb{font-weight:800;font-size:13px;flex:none}
  .s4-trend .lb i{font-style:normal;color:var(--green)}

  /* ============ SLIDE 5 ============ */
  .s5-main{grid-template-rows:1.55fr .45fr}
  .s5-cases{grid-template-columns:1fr 1fr 1fr;column-gap:16px}
  .case{display:grid;grid-template-rows:auto 1fr 1.3fr auto;background:var(--surf);
    border:1px solid var(--hair);border-radius:14px;padding:14px 17px;gap:6px;min-height:0;
    box-shadow:0 6px 18px -12px rgba(16,28,51,.18)}
  .case .nm{display:flex;align-items:baseline;gap:9px;padding-bottom:8px;border-bottom:1px solid var(--hair)}

      <p>실제 일을 끝내려면 <b>툴 호출</b>이 필요합니다. 툴 호출은 “파일을 읽어라”, “Python을 실행하라”, “웹을 조사하라”, “DB에 질의하라” 같은 기능을 외부 도구에 시키는 것입니다. 이 도구들과 실행환경을 안전하게 묶는 전체 작업대가 <b>하네스(Harness)</b>입니다.</p>
    </div>
  </div></div>
  <span class="kpg">01</span>
</section>

      <div class="cc-env remote"><div class="top"><b>REMOTE / WEB</b><i>Anthropic VM</i></div><p>세션별 새 관리형 VM에서 저장소를 clone해 실행합니다. 앱이나 PC를 닫아도 백그라운드에서 계속할 수 있습니다.</p><span class="where">명령: 격리 VM · 파일: repo clone · 결과: branch/diff/PR</span></div>
      <div class="cc-env ssh"><div class="top"><b>SSH</b><i>내 서버</i></div><p>Desktop은 인터페이스이고 Claude Code는 내가 관리하는 서버·클라우드 VM·개발 컨테이너에서 실행됩니다.</p><span class="where">명령/파일: 원격 호스트 · 권한: 그 서버의 계정</span></div>
      <div class="cc-env wsl"><div class="top"><b>WSL 2</b><i>내 PC Linux</i></div><p>Windows 안의 WSL 배포판에서 Linux 도구체인과 경로를 사용합니다. 일반 Windows Local과는 별도 실행장입니다.</p><span class="where">명령: WSL · 파일: Linux/마운트 경로 · 도구: Linux</span></div>
    </div>

      <div><b>설정은 어디까지 따라가는가</b><p>개인 설정·skills는 <code>~/.claude/</code>. Remote/Web VM에는 자동 복제되지 않습니다. 공유하려면 <code>CLAUDE.md</code>와 <code>.claude/</code>를 repo에 커밋합니다.</p></div>
      <div><b>권한·샌드박스</b><p>기본 읽기 전용, 편집·Bash는 승인. 작업 폴더 경계와 선택적 <code>/sandbox</code>로 파일·네트워크를 제한합니다.</p></div>

<script>
// ---- per-slide shot mode: ?slide=N ----
(function(){
  const p = new URLSearchParams(location.search).get('slide');
  if(p){
    document.body.classList.add('shot');
    document.querySelectorAll('.slide').forEach((s,i)=>{ if(i+1!==+p) s.style.display='none'; });
    window.scrollTo(0,0);
  }
})();

// ---- presentation mode (P / ▶버튼 / 더블클릭 진입, Esc 종료) ----
(function(){
  if(document.body.classList.contains('shot')) return;
  const slides=[...document.querySelectorAll('.slide')];
  let cur=0, present=false;
  const SEL='.head .kick,.head h1,.head .headsub,.head .brand,.s1-models,.sl,.step,.arrow,.op,'+
            '.s2-sum,.s2-big,.case,.dm,.s4-trend,.loopnote,.colh,.cap,.trk,.grade,'+
            '.s7-score,.mtx>*,.relay,.anchor,.cover h1,.cv-sub,.cv-item,.cv-stats .st,.ktop,.keyebrow,.ktitle,.knum,.ktxt h2,.ktxt p,.stat6,.role,.agrow,.npanel,.nethub,.csrow,.dstep,.af-node,.factline,.loopbox,.exec-card,.triple-card,.install-strip>div,.looptag,.cc-env,.compare-strip>div';
  let editing=false;
  const bar=document.createElement('div');
  bar.className='ptools';
  bar.innerHTML='<span class="hintxt">P 발표 · ←→ 이동 · Esc 종료</span>'+
    '<button type="button" data-act="edit">✏ 편집</button>'+
    '<button type="button" data-act="save">💾 저장 HTML</button>'+
    '<button type="button" data-act="pdf">📄 PDF</button>'+
    '<button type="button" class="primary" data-act="play">▶ 발표</button>';
  document.body.appendChild(bar);
  const btnEdit=bar.querySelector('[data-act="edit"]');
  function setEdit(on){
    editing=on;
    document.body.classList.toggle('editing',on);
    document.querySelectorAll('.slide').forEach(s=>{
      if(on) s.setAttribute('contenteditable','true');
      else s.removeAttribute('contenteditable');
    });
    btnEdit.classList.toggle('on',on);
    btnEdit.textContent=on?'✔ 편집 완료':'✏ 편집';
    if(!on && typeof drawWires==='function') setTimeout(drawWires,60);
  }
  function saveHTML(){
    if(editing) setEdit(false);
    const clone=document.documentElement.cloneNode(true);
    clone.querySelectorAll('.ptools').forEach(e=>e.remove());
    clone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
    clone.querySelectorAll('.a-el').forEach(e=>{
      e.classList.remove('a-el'); e.style.removeProperty('--d');
      if(!e.getAttribute('style')) e.removeAttribute('style');
    });
    const b=clone.querySelector('body'); if(b) b.removeAttribute('class');
    clone.querySelectorAll('.slide').forEach(s=>{
      s.classList.remove('cur','reveal');
      s.style.removeProperty('--sc'); s.style.removeProperty('display');
      if(!s.getAttribute('style')) s.removeAttribute('style');
    });
    const svg=clone.querySelector('svg.wires');
    if(svg){svg.innerHTML='';svg.removeAttribute('viewBox');}
    const html='<!DOCTYPE html>\n'+clone.outerHTML;
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
    const d=new Date(), z=n=>String(n).padStart(2,'0');
    a.download='AI챔피언_키노트_수정_'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())+'.html';
    a.click(); URL.revokeObjectURL(a.href);
  }
  bar.addEventListener('click',e=>{
    const btn=e.target.closest('button'); if(!btn) return;
    const act=btn.dataset.act;
    if(act==='edit') setEdit(!editing);
    else if(act==='save') saveHTML();
    else if(act==='pdf'){ if(editing) setEdit(false); setTimeout(()=>window.print(),120); }
    else if(act==='play'){ if(editing) setEdit(false); enter(); }
  });
  function mark(slide){
    slide.querySelectorAll(SEL).forEach((e,i)=>{
      e.classList.add('a-el');
      e.style.setProperty('--d',Math.min(i*55,1500)+'ms');
    });
  }
  function fit(){
    const sc=Math.min(innerWidth/1280,innerHeight/720);
    slides.forEach(s=>s.style.setProperty('--sc',sc));
  }
  function animateWires(slide){
    const svg=slide.querySelector('svg.wires'); if(!svg) return;
    svg.querySelectorAll('path').forEach((p,i)=>{
      try{
        const L=p.getTotalLength(); if(!L) return;
        p.style.strokeDasharray=L; p.style.strokeDashoffset=L; p.style.transition='none';
        requestAnimationFrame(()=>{
          p.style.transition='stroke-dashoffset .9s ease '+(600+i*35)+'ms';
          p.style.strokeDashoffset='0';
        });
      }catch(err){}
    });
    svg.querySelectorAll('circle').forEach((c,i)=>{
      c.style.opacity='0'; c.style.transition='none';
      requestAnimationFrame(()=>{
        c.style.transition='opacity .4s ease '+(1000+i*35)+'ms';
        c.style.opacity='1';
      });
    });
  }
  function show(n){
    cur=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach((s,i)=>{s.classList.toggle('cur',i===cur);s.classList.remove('reveal');});
    const s=slides[cur];
    mark(s);
    if(typeof drawWires==='function') drawWires(); if(typeof drawNet==='function') drawNet();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      s.classList.add('reveal');
      animateWires(s);
    }));
  }
  function enter(){
    if(present) return;
    let idx=0;
    slides.forEach((s,i)=>{ if(s.getBoundingClientRect().top < innerHeight/2) idx=i; });
    present=true; document.body.classList.add('present'); fit();
    show(idx);
    if(document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen().catch(()=>{});
  }
  function exit(){
    if(!present) return;
    present=false; document.body.classList.remove('present');
    slides.forEach(s=>s.classList.remove('cur','reveal'));
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    if(typeof drawWires==='function') setTimeout(drawWires,60);
    slides[cur].scrollIntoView();
  }
  document.addEventListener('dblclick',()=>{ if(!present && !editing) enter(); });
  addEventListener('resize',()=>{ if(present) fit(); });
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) exit(); });
  document.addEventListener('keydown',e=>{
    if(editing){ if(e.key==='Escape') setEdit(false); return; }
    if(!present){
      if(e.key==='p'||e.key==='P'){ enter(); return; }
      if(e.key==='ArrowRight'||e.key==='PageDown'){ cur=Math.min(slides.length-1,cur+1); slides[cur].scrollIntoView({behavior:'smooth'}); }
      else if(e.key==='ArrowLeft'||e.key==='PageUp'){ cur=Math.max(0,cur-1); slides[cur].scrollIntoView({behavior:'smooth'}); }
      return;
    }
    if(e.key==='Escape'){ exit(); return; }
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){ e.preventDefault(); show(cur+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); show(cur-1); }
    else if(e.key==='Home'){ show(0); }
    else if(e.key==='End'){ show(slides.length-1); }
  });
  // ?present=1 로 열면 바로 발표 모드
  if(new URLSearchParams(location.search).get('present')) setTimeout(enter,120);
})();

// ---- slide 6 flowchart wires (measured coordinates) ----
function drawWires(){
  const map=document.getElementById('wiremap'); if(!map) return;
  const s6=document.getElementById('s6'); if(s6.style.display==='none') return;
  const svg=document.getElementById('wires6');
  const mr=map.getBoundingClientRect();
  svg.setAttribute('viewBox','0 0 '+mr.width+' '+mr.height);
  const R=id=>{const r=document.getElementById(id).getBoundingClientRect();
    return {l:r.left-mr.left, r:r.right-mr.left, t:r.top-mr.top, b:r.bottom-mr.top,
            cy:r.top-mr.top+r.height/2};};
  const caps=['cap1','cap2','cap3','cap4','cap5','cap6','cap7','cap8','cap9','cap10'].map(R);
  const trks=['trk1','trk2','trk3','trk4'].map(R);
  const busX=caps[0].r+15;
  const BUS='#c3cad6';
  let paths=[];
  caps.forEach(c=>paths.push(`<path d="M ${c.r} ${c.cy} H ${busX}" stroke="${BUS}" stroke-width="1.6" fill="none"/>`));
  paths.push(`<path d="M ${busX} ${caps[0].cy} V ${caps[9].cy}" stroke="${BUS}" stroke-width="1.6" fill="none"/>`);
  trks.forEach(t=>{
    paths.push(`<path d="M ${busX} ${t.cy} H ${t.l}" stroke="${BUS}" stroke-width="1.6" fill="none"/>`);
    paths.push(`<circle cx="${t.l}" cy="${t.cy}" r="2.8" fill="#a4aec0"/>`);
  });
  const g=R('grdG'), b=R('grdB'), k=R('grdK');
  const wire=(t,gr,col,w)=>{
    const x1=t.r, y1=t.cy, x2=gr.l, y2=gr.cy, mx=(x1+x2)/2;
    paths.push(`<path d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" stroke="${col}" stroke-width="${w}" fill="none" opacity="0.85"/>`);
    paths.push(`<circle cx="${x2}" cy="${y2}" r="3.2" fill="${col}"/>`);
  };
  wire(trks[0],g,'#ccd4e0',1.4); wire(trks[0],b,'#ccd4e0',1.4); wire(trks[0],k,'#ccd4e0',1.4);
  wire(trks[1],g,'#2e8a5c',2.8);
  wire(trks[2],b,'#4266a3',2.8);
  wire(trks[3],k,'#1c2331',2.8);
  svg.innerHTML=paths.join('');
}
function drawNet(){
  const map=document.getElementById('netmap'); if(!map) return;
  const sl=document.getElementById('s7x'); if(!sl||sl.style.display==='none') return;
  const svg=document.getElementById('wires8'); if(!svg) return;
  const mr=map.getBoundingClientRect(); if(mr.width<10) return;
  svg.setAttribute('viewBox','0 0 '+mr.width+' '+mr.height);
  const hb=document.getElementById('nethub').getBoundingClientRect();
  const hx=hb.left-mr.left+hb.width/2, hy=hb.top-mr.top+hb.height/2;
  const specs=[['np1','#b94a48'],['np2','#4266a3'],['np3','#2e8a5c'],['np4','#c38424'],['np5','#141b28'],['np6','#6f5aa8']];
  let p='';
  p+='<circle cx="'+hx+'" cy="'+hy+'" r="146" fill="none" stroke="#aab8cc" stroke-width="1" stroke-dasharray="3 7" opacity="0.65"/>';
  p+='<circle cx="'+hx+'" cy="'+hy+'" r="188" fill="none" stroke="#b8c4d6" stroke-width="1" stroke-dasharray="2 9" opacity="0.4"/>';
  specs.forEach(function(sp){
    const r=document.getElementById(sp[0]).getBoundingClientRect();
    const cx=r.left-mr.left+r.width/2, cy=r.top-mr.top+r.height/2;
    const mx=(hx+cx)/2;
    p+='<path d="M '+hx+' '+hy+' C '+mx+' '+hy+', '+mx+' '+cy+', '+cx+' '+cy+'" stroke="'+sp[1]+'" stroke-width="2.5" fill="none" opacity="0.85"/>';
    const dx=cx-hx, dy=cy-hy, L=Math.hypot(dx,dy)||1;
    p+='<circle cx="'+(hx+dx/L*118)+'" cy="'+(hy+dy/L*118)+'" r="3.6" fill="'+sp[1]+'"/>';
    p+='<circle cx="'+(hx+dx/L*146)+'" cy="'+(hy+dy/L*146)+'" r="2.2" fill="'+sp[1]+'" opacity="0.65"/>';
  });
  svg.innerHTML=p;
}
window.addEventListener('load',drawNet);
window.addEventListener('resize',drawNet);
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>{drawWires();drawNet();});}
window.addEventListener('load',drawWires);
window.addEventListener('resize',drawWires);
</script>
<script>/* kg-preview: #<heading> \uc704\uce58\ub85c \uc774\ub3d9 */

function go(){var h=decodeURIComponent(location.hash.slice(1));if(!h)return;var k=norm(h).slice(0,24);if(!k)return;
var best=null,bl=1e9,els=document.body.querySelectorAll('h1,h2,h3,h4,h5,p,div,span,li,td,text,tspan,section,article');
for(var i=0;i<els.length;i++){var e=els[i],t=norm(e.textContent);if(t.length<bl&&t.indexOf(k)>-1){best=e;bl=t.length}}
if(!best)return;var box=best.closest('section,[class*=slide],[class*=page],article')||best;
box.scrollIntoView({block:'start',inline:'nearest'});window.scrollTo(0,window.scrollY);box.style.outline='3px solid #c0504d';box.style.outlineOffset='4px';
