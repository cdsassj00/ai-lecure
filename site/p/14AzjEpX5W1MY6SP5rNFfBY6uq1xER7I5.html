<!DOCTYPE html>
<html lang="ko">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OY Quiz Verse — Isometric</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0b10; --panel: #151720; --ink: #e8e4db; --ink-dim: #8a8680;
  --gold: #d4a574; --olive: #7a9b5a; --terra: #d96a4a; --rose: #d88b9c;
  --sky: #6b9cc8; --red: #e25656; --green: #5fb85f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; overflow: hidden; user-select: none; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#game { width: 100%; height: 100%; }

.hud-top { position: fixed; top: 0; left: 0; right: 0; padding: 16px 24px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; pointer-events: none; }
.panel-box { background: rgba(10,11,16,0.82); backdrop-filter: blur(14px); border: 1px solid rgba(232,228,219,0.08); border-radius: 6px; pointer-events: auto; }
.brand { padding: 12px 20px; }
.brand-name { font-family: 'Fraunces', serif; font-size: 18px; font-style: italic; letter-spacing: -0.02em; }
.brand-name span { color: var(--gold); }
.brand-sub { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--ink-dim); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
.player-info { padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
#avatar-preview { width: 44px; height: 44px; background: rgba(232,228,219,0.05); border-radius: 4px; }
.player-meta { display: flex; flex-direction: column; }
.player-name { font-size: 13px; font-weight: 500; }
.player-score { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); }

.leaderboard { position: fixed; top: 92px; right: 24px; width: 230px; padding: 16px; z-index: 10; }
.lb-title { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; margin-bottom: 12px; display: flex; justify-content: space-between; }
.lb-title::after { content: 'LIVE'; color: var(--red); font-weight: 700; animation: pulse 1.5s infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.lb-list { display: flex; flex-direction: column; gap: 4px; }
.lb-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; font-size: 12px; transition: all 0.3s; }
.lb-row.me { background: rgba(212,165,116,0.15); border-left: 2px solid var(--gold); }
.lb-row.eliminated { opacity: 0.3; text-decoration: line-through; }
.lb-rank { font-family: 'Fraunces', serif; font-style: italic; color: var(--gold); min-width: 20px; font-weight: 500; }
.lb-name { flex: 1; }
.lb-score { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-dim); }

.room-info { position: fixed; bottom: 80px; left: 24px; padding: 14px 20px; font-size: 11px; color: var(--ink-dim); z-index: 10; max-width: 280px; }
.room-info .label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.room-info .title { font-family: 'Fraunces', serif; font-size: 18px; font-style: italic; color: var(--ink); margin-bottom: 4px; }

.controls { position: fixed; bottom: 20px; left: 24px; padding: 10px 18px; font-size: 10px; color: var(--ink-dim); z-index: 10; }
kbd { display: inline-block; background: var(--ink); color: var(--bg); padding: 2px 6px; border-radius: 2px; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; margin: 0 1px; }

.mode-badge { position: fixed; top: 92px; left: 24px; background: var(--bg); border: 1px solid var(--red); color: var(--red); padding: 8px 16px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; z-index: 10; display: none; }
.mode-badge.show { display: block; }

.announce { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--bg); border: 2px solid var(--gold); color: var(--ink); padding: 14px 32px; border-radius: 6px; font-size: 13px; z-index: 20; opacity: 0; transition: all 0.4s cubic-bezier(.2,.9,.3,1.2); box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; }
.announce.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.announce .host { font-family: 'Fraunces', serif; font-style: italic; color: var(--gold); font-size: 11px; display: block; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px; }

.quiz-overlay { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); width: min(720px, 90vw); background: rgba(10,11,16,0.92); backdrop-filter: blur(14px); border: 1px solid var(--gold); border-radius: 8px; padding: 20px 28px; z-index: 15; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.quiz-overlay.show { opacity: 1; }
.quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.quiz-type { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
.quiz-timer { font-family: 'Fraunces', serif; font-size: 28px; font-style: italic; font-weight: 500; color: var(--gold); line-height: 1; }
.quiz-timer.warn { color: var(--terra); }
.quiz-timer.danger { color: var(--red); animation: shake 0.3s infinite; }
@keyframes shake { 0%,100% { transform: translateX(0); } 50% { transform: translateX(2px); } }
.quiz-q { font-family: 'Fraunces', serif; font-size: 22px; line-height: 1.3; color: var(--ink); letter-spacing: -0.01em; }
.quiz-hint { margin-top: 10px; font-size: 11px; color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; }

.text-input-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(10,11,16,0.92); backdrop-filter: blur(14px); border: 1px solid var(--gold); border-radius: 100px; padding: 10px 14px 10px 20px; display: none; align-items: center; gap: 10px; z-index: 15; width: min(500px, 90vw); }
.text-input-wrap.show { display: flex; }
.text-input-wrap input { flex: 1; background: transparent; border: none; color: var(--ink); font-family: inherit; font-size: 14px; outline: none; }
.text-input-wrap input::placeholder { color: var(--ink-dim); }
.text-input-wrap button { background: var(--gold); color: var(--bg); border: none; padding: 8px 16px; border-radius: 100px; font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }

.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: var(--bg); border: 2px solid; padding: 24px 48px; border-radius: 8px; font-family: 'Fraunces', serif; font-size: 42px; font-style: italic; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(.2,.9,.3,1.4); z-index: 30; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.toast.correct { border-color: var(--green); color: var(--green); }
.toast.wrong { border-color: var(--red); color: var(--red); }
.toast.eliminated { border-color: var(--red); color: var(--red); font-size: 32px; }
.toast-sub { display: block; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-style: normal; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 8px; color: var(--ink-dim); }

.char-select { position: fixed; inset: 0; background: radial-gradient(ellipse at center, #1a1c26 0%, #0a0b10 70%); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; transition: opacity 0.6s; overflow-y: auto; }
.char-select.hide { opacity: 0; pointer-events: none; }
.cs-title { font-family: 'Fraunces', serif; font-size: clamp(36px, 6vw, 56px); font-weight: 400; letter-spacing: -0.03em; margin-bottom: 6px; text-align: center; }
.cs-title .italic { font-style: italic; color: var(--gold); }
.cs-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 40px; }
.cs-main { display: flex; gap: 60px; align-items: center; flex-wrap: wrap; justify-content: center; }
.cs-preview { width: 280px; height: 340px; background: linear-gradient(180deg, rgba(212,165,116,0.08), rgba(212,165,116,0.02)); border: 1px solid rgba(212,165,116,0.25); border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; }
.cs-preview::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 75%, rgba(212,165,116,0.15), transparent 60%); pointer-events: none; }
#preview-canvas { width: 240px; height: 300px; position: relative; z-index: 1; }
.cs-controls { display: flex; flex-direction: column; gap: 18px; min-width: 340px; }
.cs-row { display: flex; align-items: center; gap: 14px; }
.cs-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); min-width: 70px; }
.cs-swatches { display: flex; gap: 7px; flex: 1; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
.swatch:hover { transform: scale(1.1); }
.swatch.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(212,165,116,0.3); }
.swatch.text { width: auto; padding: 4px 10px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; color: var(--ink); background: rgba(232,228,219,0.08); height: 28px; }
.cs-name-input { background: transparent; border: none; border-bottom: 1px solid rgba(232,228,219,0.25); color: var(--ink); font-family: inherit; font-size: 16px; padding: 8px 4px; outline: none; flex: 1; transition: border-color 0.2s; }
.cs-name-input:focus { border-color: var(--gold); }
.cs-start { background: var(--gold); color: var(--bg); border: none; padding: 16px 48px; border-radius: 100px; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; margin-top: 32px; transition: all 0.3s; }
.cs-start:hover { background: var(--ink); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(212,165,116,0.3); }
.cs-random { background: transparent; color: var(--ink-dim); border: 1px solid rgba(232,228,219,0.2); padding: 8px 20px; border-radius: 100px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; margin-top: 12px; transition: all 0.2s; }
.cs-random:hover { color: var(--gold); border-color: var(--gold); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="char-select" id="char-select">
  <h1 class="cs-title">Create Your <span class="italic">Avatar</span></h1>
  <div class="cs-sub">OY Quiz Verse · Isometric Edition</div>
  <div class="cs-main">
    <div class="cs-preview">
      <canvas id="preview-canvas" width="240" height="300"></canvas>
    </div>
    <div class="cs-controls">
      <div class="cs-row"><div class="cs-label">Name</div><input type="text" class="cs-name-input" id="cs-name" placeholder="Your name..." maxlength="12"></div>
      <div class="cs-row"><div class="cs-label">Skin</div><div class="cs-swatches" id="sw-skin"></div></div>
      <div class="cs-row"><div class="cs-label">Hair</div><div class="cs-swatches" id="sw-hair"></div></div>
      <div class="cs-row"><div class="cs-label">Style</div><div class="cs-swatches" id="sw-hairstyle"></div></div>
      <div class="cs-row"><div class="cs-label">Shirt</div><div class="cs-swatches" id="sw-shirt"></div></div>
      <div class="cs-row"><div class="cs-label">Pants</div><div class="cs-swatches" id="sw-pants"></div></div>
      <button class="cs-random" id="cs-random">↻ Randomize</button>
    </div>
  </div>
  <button class="cs-start" id="cs-start">Enter Verse →</button>
</div>

<div class="hud-top">
  <div class="panel-box brand">
    <div class="brand-name">OY <span>Quiz</span> Verse</div>
    <div class="brand-sub">Isometric · v0.3</div>
  </div>
  <div class="panel-box player-info">
    <canvas id="avatar-preview" width="44" height="44"></canvas>
    <div class="player-meta">
      <div class="player-name" id="hud-name">You</div>
      <div class="player-score">SCORE <span id="my-score">0</span></div>
    </div>
  </div>
</div>

<div class="panel-box leaderboard">
  <div class="lb-title">Leaderboard</div>
  <div class="lb-list" id="lb-list"></div>
</div>

<div class="mode-badge" id="mode-badge">Survival Mode</div>

<div class="panel-box room-info" id="room-info">
  <div class="label">Now In</div>
  <div class="title" id="room-title">Lobby</div>
  <div id="room-desc">4개 방 중 하나에 입장해서 퀴즈를 풀어보세요</div>
</div>

<div class="panel-box controls">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · 답안 구역에 서면 선택 · <kbd>ESC</kbd> 로비
</div>

<div class="announce" id="announce">
  <span class="host">Host · 사회자</span>
  <span id="announce-text"></span>
</div>

<div class="quiz-overlay" id="quiz-overlay">
  <div class="quiz-header">
    <div class="quiz-type" id="quiz-type">MULTIPLE CHOICE</div>
    <div class="quiz-timer" id="quiz-timer">15</div>
  </div>
  <div class="quiz-q" id="quiz-q"></div>
  <div class="quiz-hint" id="quiz-hint">→ 답안 구역에 캐릭터를 이동시키면 선택됩니다</div>
</div>

<div class="text-input-wrap" id="text-input-wrap">
  <input type="text" id="text-input" placeholder="답을 입력하세요..." autocomplete="off">
  <button id="text-submit">제출</button>
</div>

<div class="toast" id="toast"></div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  W = canvas.width = window.innerWidth * dpr;
  H = canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

const SKIN_TONES = ['#f5d4b8','#e8bc94','#c89670','#a67248','#8b5a2b','#5c3a1e'];
const HAIR_COLORS = ['#1a1814','#3d2817','#6b4423','#a0522d','#d4a574','#8b7f9f','#c8485e'];
const HAIR_STYLES = ['short','long','ponytail','bob','curly','bald'];
const SHIRT_COLORS = ['#d96a4a','#6b9cc8','#7a9b5a','#d4a574','#d88b9c','#8b7f9f','#e8e4db','#2a2a2a'];
const PANTS_COLORS = ['#2a2018','#3d3545','#1a3a5a','#4a3a2a','#5a5a5a','#1a1814'];

let myAvatar = { skin: 0, hair: 0, hairstyle: 0, shirt: 0, pants: 0, name: 'You' };

const TILE_W = 64;
const TILE_H = 32;
const ELEV = 16;

function gridToScreen(gx, gy) {
  return { x: (gx - gy) * (TILE_W / 2), y: (gx + gy) * (TILE_H / 2) };
}

let scene = 'lobby';
let currentRoom = null;
let quizState = null;
let survivalMode = false;
let myScore = 0;
let eliminated = false;

const BOT_NAMES = ['Minji','Junho','Serin','Hyun','Yuna','Daehyun','Soomin'];
function randomAvatar() {
  return {
    skin: Math.floor(Math.random()*SKIN_TONES.length),
    hair: Math.floor(Math.random()*HAIR_COLORS.length),
    hairstyle: Math.floor(Math.random()*HAIR_STYLES.length),
    shirt: Math.floor(Math.random()*SHIRT_COLORS.length),
    pants: Math.floor(Math.random()*PANTS_COLORS.length),
  };
}

const LOBBY = { w: 24, h: 24, tiles: null };
function buildLobby() {
  const m = [];
  for (let y = 0; y < LOBBY.h; y++) {
    const row = [];
    for (let x = 0; x < LOBBY.w; x++) {
      if (x === 0 || x === LOBBY.w-1 || y === 0 || y === LOBBY.h-1) row.push(2);
      else row.push(1);
    }
    m.push(row);
  }
  for (let y = 9; y < 15; y++) for (let x = 9; x < 15; x++) m[y][x] = 3;
  for (let x = 3; x < 8; x++) m[5][x] = 2;
  for (let x = 16; x < 21; x++) m[5][x] = 2;
  for (let x = 3; x < 8; x++) m[18][x] = 2;
  for (let x = 16; x < 21; x++) m[18][x] = 2;
  m[5][5] = 4; m[5][18] = 5; m[18][5] = 6; m[18][18] = 7;
  LOBBY.tiles = m;
}
buildLobby();

const ROOMS = {
  mcq: { name: 'MCQ', nameKo: '객관식 방', desc: '답안 구역 1~4 위에 서세요', color: '#6b9cc8', type: 'mcq',
    w: 22, h: 16, spawn: { x: 11, y: 4 },
    zones: [ { x: 3, y: 9, w: 3, h: 3, answer: 0, label: '1' }, { x: 7, y: 9, w: 3, h: 3, answer: 1, label: '2' },
             { x: 12, y: 9, w: 3, h: 3, answer: 2, label: '3' }, { x: 16, y: 9, w: 3, h: 3, answer: 3, label: '4' } ] },
  ox: { name: 'OX', nameKo: 'OX 방', desc: 'O 또는 X 구역에 서세요', color: '#d88b9c', type: 'ox',
    w: 22, h: 16, spawn: { x: 11, y: 4 },
    zones: [ { x: 3, y: 8, w: 7, h: 5, answer: 0, label: 'O', big: true }, { x: 12, y: 8, w: 7, h: 5, answer: 1, label: 'X', big: true } ] },
  short: { name: 'SHORT', nameKo: '단답형 방', desc: '아래 입력창에 답을 적으세요', color: '#d4a574', type: 'short',
    w: 20, h: 14, spawn: { x: 10, y: 7 }, zones: [] },
  survival: { name: 'SURVIVAL', nameKo: '서바이벌 방', desc: '오답 즉시 탈락! 끝까지 살아남으세요', color: '#d96a4a', type: 'survival',
    w: 22, h: 16, spawn: { x: 11, y: 4 },
    zones: [ { x: 3, y: 9, w: 3, h: 3, answer: 0, label: '1' }, { x: 7, y: 9, w: 3, h: 3, answer: 1, label: '2' },
             { x: 12, y: 9, w: 3, h: 3, answer: 2, label: '3' }, { x: 16, y: 9, w: 3, h: 3, answer: 3, label: '4' } ] }
};

function buildRoomMap(room) {
  const w = room.w, h = room.h;
  const m = [];
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      if (x === 0 || x === w-1 || y === 0 || y === h-1) row.push(2);
      else row.push(1);
    }
    m.push(row);
  }
  for (let x = 2; x < w-2; x++) m[2][x] = 3;
  room.tileMap = m;
}

const QUESTIONS = {
  mcq: [
    { q: '히알루론산이 피부에서 하는 가장 핵심 기능은?', choices: ['각질 제거','수분 보유','자외선 차단','미백'], answer: 1 },
    { q: '스킨케어 루틴에서 가장 마지막에 바르는 제품은?', choices: ['토너','세럼','자외선차단제','에센스'], answer: 2 },
    { q: '레티놀 제품 사용 시 주의해야 할 점은?', choices: ['아침에만 사용','자외선 회피','냉장 보관','매일 2회 이상'], answer: 1 },
  ],
  ox: [
    { q: '쿠션 파운데이션 퍼프는 매일 세척하는 것이 위생적이다.', answer: 0 },
    { q: '비타민 C 세럼은 아침에 사용해도 효과가 없다.', answer: 1 },
    { q: '향수의 베이스 노트가 가장 오래 지속된다.', answer: 0 },
  ],
  short: [
    { q: '자외선 차단지수를 나타내는 영문 약자 3글자는?', answer: 'spf' },
    { q: '향수 농도가 가장 진한 타입의 영문 약자는?', answer: 'edp' },
  ],
  survival: [
    { q: '다음 중 지용성 비타민이 아닌 것은?', choices: ['비타민 A','비타민 C','비타민 D','비타민 E'], answer: 1 },
    { q: 'EWG 그린 등급이란?', choices: ['가격 할인','안전 등급','신상 표시','유기농 인증'], answer: 1 },
    { q: '나이아신아마이드의 주요 효능은?', choices: ['수분 공급','미백·피지조절','각질 제거','자외선 차단'], answer: 1 },
    { q: 'SPF 50의 자외선 차단율은 약 몇 %?', choices: ['50%','75%','98%','100%'], answer: 2 },
  ]
};

const player = { gx: 12, gy: 12, speed: 0.12, facing: 'south', moving: false, bob: 0 };
let bots = [];
function spawnBots(sx, sy) {
  bots = BOT_NAMES.map(name => ({
    gx: sx + (Math.random()-0.5)*4, gy: sy + (Math.random()-0.5)*3,
    tx: sx, ty: sy, speed: 0.04 + Math.random()*0.03,
    avatar: randomAvatar(), name, score: 0, alive: true,
    facing: 'south', bob: Math.random()*Math.PI*2, moving: false,
    thinkTimer: Math.random()*2000, answered: false, correct: false
  }));
}
spawnBots(12, 12);

const keys = {};
let typingMode = false;
window.addEventListener('keydown', e => {
  if (typingMode) return;
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Escape' && scene === 'room') exitRoom();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function getInput() {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) { dx -= 1; dy -= 1; }
  if (keys['s'] || keys['arrowdown']) { dx += 1; dy += 1; }
  if (keys['a'] || keys['arrowleft']) { dx -= 1; dy += 1; }
  if (keys['d'] || keys['arrowright']) { dx += 1; dy -= 1; }
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len > 0) { dx /= len; dy /= len; }
  return { dx, dy };
}

function currentMap() { return scene === 'lobby' ? LOBBY.tiles : currentRoom.tileMap; }
function currentMapSize() { return scene === 'lobby' ? { w: LOBBY.w, h: LOBBY.h } : { w: currentRoom.w, h: currentRoom.h }; }

function isWalkable(gx, gy) {
  const map = currentMap();
  const sz = currentMapSize();
  const cx = Math.floor(gx), cy = Math.floor(gy);
  if (cy < 0 || cy >= sz.h || cx < 0 || cx >= sz.w) return false;
  const t = map[cy][cx];
  return t !== 0 && t !== 2;
}

let camX = 0, camY = 0;
function updateCamera() {
  const p = gridToScreen(player.gx, player.gy);
  const tX = window.innerWidth/2 - p.x;
  const tY = window.innerHeight/2 - p.y - 30;
  camX += (tX - camX) * 0.12;
  camY += (tY - camY) * 0.12;
}

function enterRoom(key) {
  const room = ROOMS[key];
  buildRoomMap(room);
  currentRoom = room;
  scene = 'room';
  player.gx = room.spawn.x; player.gy = room.spawn.y;
  spawnBots(room.spawn.x, room.spawn.y);
  eliminated = false;
  survivalMode = room.type === 'survival';
  document.getElementById('mode-badge').classList.toggle('show', survivalMode);
  document.getElementById('room-title').textContent = room.nameKo;
  document.getElementById('room-desc').textContent = room.desc;
  announce(`${room.nameKo}에 입장했습니다. 곧 첫 문제가 시작됩니다.`);
  setTimeout(startQuestion, 2500);
}

function exitRoom() {
  scene = 'lobby'; currentRoom = null; quizState = null;
  survivalMode = false; eliminated = false;
  document.getElementById('mode-badge').classList.remove('show');
  document.getElementById('quiz-overlay').classList.remove('show');
  document.getElementById('text-input-wrap').classList.remove('show');
  player.gx = 12; player.gy = 12;
  spawnBots(12, 12);
  document.getElementById('room-title').textContent = 'Lobby';
  document.getElementById('room-desc').textContent = '4개 방 중 하나에 입장해서 퀴즈를 풀어보세요';
  announce('로비로 돌아왔습니다.');
}

function startQuestion() {
  if (!currentRoom) return;
  const pool = QUESTIONS[currentRoom.type];
  const q = pool[Math.floor(Math.random()*pool.length)];
  quizState = { q, answered: false, myChoice: null, startTime: Date.now() };
  bots.forEach(b => { b.answered = false; b.thinkTimer = 2000 + Math.random()*8000; });

  const typeMap = { mcq: 'MULTIPLE CHOICE', ox: 'TRUE OR FALSE', short: 'SHORT ANSWER', survival: 'SURVIVAL · MCQ' };
  document.getElementById('quiz-type').textContent = typeMap[currentRoom.type];
  const qEl = document.getElementById('quiz-q');
  const hintEl = document.getElementById('quiz-hint');

  if (currentRoom.type === 'short') {
    qEl.textContent = q.q;
    hintEl.textContent = '→ 아래 입력창에 답을 입력하고 엔터';
    document.getElementById('text-input-wrap').classList.add('show');
    document.getElementById('text-input').value = '';
    document.getElementById('text-input').focus();
    typingMode = true;
  } else if (currentRoom.type === 'ox') {
    qEl.textContent = q.q;
    hintEl.textContent = '→ O 또는 X 구역에 캐릭터를 올려놓으세요';
  } else {
    const ct = q.choices.map((c,i) => `<span style="color:var(--gold)">${i+1}.</span> ${c}`).join('   ');
    qEl.innerHTML = `${q.q}<div style="font-size:14px;color:var(--ink-dim);margin-top:10px;font-family:'Noto Sans KR';">${ct}</div>`;
    hintEl.textContent = '→ 1~4번 구역에 캐릭터를 올려놓으세요';
  }
  document.getElementById('quiz-overlay').classList.add('show');
}

function checkZoneAnswer() {
  if (!quizState || quizState.answered || !currentRoom) return;
  if (currentRoom.type === 'short') return;
  for (const z of currentRoom.zones) {
    if (player.gx >= z.x && player.gx < z.x + z.w && player.gy >= z.y && player.gy < z.y + z.h) {
      quizState.myChoice = z.answer;
      return;
    }
  }
  quizState.myChoice = null;
}

function submitTextAnswer() {
  if (!quizState || quizState.answered || currentRoom.type !== 'short') return;
  const val = document.getElementById('text-input').value.trim().toLowerCase();
  if (!val) return;
  quizState.myChoice = val;
  resolveQuestion();
}
document.getElementById('text-submit').onclick = submitTextAnswer;
document.getElementById('text-input').addEventListener('keydown', e => { if (e.key === 'Enter') submitTextAnswer(); });
document.getElementById('text-input').addEventListener('focus', () => typingMode = true);
document.getElementById('text-input').addEventListener('blur', () => typingMode = false);

function resolveQuestion() {
  if (!quizState || quizState.answered) return;
  quizState.answered = true;
  const q = quizState.q;
  let myCorrect = false;
  if (currentRoom.type === 'short') {
    myCorrect = (quizState.myChoice || '').toString().toLowerCase().trim() === q.answer.toString().toLowerCase();
  } else {
    myCorrect = quizState.myChoice === q.answer;
  }
  bots.forEach(b => {
    if (!b.alive) return;
    if (!b.answered) b.correct = Math.random() < 0.55;
    if (b.correct) {
      const speed = Math.max(0, 15 - (Date.now() - quizState.startTime)/1000);
      b.score += Math.floor(800 + speed*20 + Math.random()*100);
    } else if (survivalMode) b.alive = false;
  });
  if (!eliminated) {
    if (myCorrect) {
      const speed = Math.max(0, 15 - (Date.now() - quizState.startTime)/1000);
      const gained = Math.floor(1000 + speed*30);
      myScore += gained;
      showToast('CORRECT!', `+${gained} points`, 'correct');
    } else {
      if (survivalMode) { eliminated = true; showToast('ELIMINATED', '서바이벌에서 탈락', 'eliminated'); }
      else showToast('WRONG', q.choices ? `정답: ${q.choices[q.answer]}` : `정답: ${q.answer}`, 'wrong');
    }
  }
  document.getElementById('my-score').textContent = myScore;
  updateLeaderboard();
  typingMode = false;
  document.getElementById('text-input-wrap').classList.remove('show');
  setTimeout(() => {
    document.getElementById('quiz-overlay').classList.remove('show');
    if (survivalMode && (eliminated || bots.filter(b => b.alive).length === 0)) {
      setTimeout(() => { announce('서바이벌 종료! 로비로 돌아갑니다.'); setTimeout(exitRoom, 2500); }, 1500);
    } else setTimeout(startQuestion, 2500);
  }, 2500);
}

function updateLeaderboard() {
  const all = [
    { name: myAvatar.name || 'You', score: myScore, me: true, alive: !eliminated },
    ...bots.map(b => ({ name: b.name, score: b.score, me: false, alive: b.alive }))
  ];
  all.sort((a,b) => b.score - a.score);
  const list = document.getElementById('lb-list');
  list.innerHTML = '';
  all.slice(0,8).forEach((p,i) => {
    const row = document.createElement('div');
    row.className = 'lb-row' + (p.me ? ' me' : '') + (!p.alive ? ' eliminated' : '');
    row.innerHTML = `<span class="lb-rank">${i+1}</span><span class="lb-name">${p.name}</span><span class="lb-score">${p.score}</span>`;
    list.appendChild(row);
  });
}
updateLeaderboard();

function announce(text) {
  const el = document.getElementById('announce');
  document.getElementById('announce-text').textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}
function showToast(text, sub, kind) {
  const el = document.getElementById('toast');
  el.className = 'toast ' + kind;
  el.innerHTML = `${text}<span class="toast-sub">${sub}</span>`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function updatePlayer() {
  if (typingMode) { player.moving = false; return; }
  const { dx, dy } = getInput();
  const nx = player.gx + dx * player.speed;
  const ny = player.gy + dy * player.speed;
  if (isWalkable(nx, player.gy)) player.gx = nx;
  if (isWalkable(player.gx, ny)) player.gy = ny;
  player.moving = dx !== 0 || dy !== 0;
  if (player.moving) {
    player.bob += 0.3;
    const sdx = dx - dy, sdy = dx + dy;
    if (Math.abs(sdx) > Math.abs(sdy)) player.facing = sdx > 0 ? 'east' : 'west';
    else player.facing = sdy > 0 ? 'south' : 'north';
  }
  if (scene === 'lobby') {
    const cx = Math.floor(player.gx), cy = Math.floor(player.gy);
    if (cy >= 0 && cy < LOBBY.h && cx >= 0 && cx < LOBBY.w) {
      const t = LOBBY.tiles[cy][cx];
      if (t === 4) enterRoom('mcq');
      else if (t === 5) enterRoom('ox');
      else if (t === 6) enterRoom('short');
      else if (t === 7) enterRoom('survival');
    }
  }
  if (scene === 'room' && quizState && !quizState.answered && !eliminated) checkZoneAnswer();
}

function updateBots(dt) {
  bots.forEach(b => {
    if (!b.alive) { b.moving = false; return; }
    if (scene === 'room' && quizState && !quizState.answered && currentRoom.type !== 'short') {
      b.thinkTimer -= dt;
      if (b.thinkTimer <= 0 && !b.answered) {
        b.answered = true;
        b.correct = Math.random() < 0.65;
        const correct = currentRoom.zones.find(z => z.answer === quizState.q.answer);
        let target;
        if (b.correct) target = correct;
        else {
          const wrongs = currentRoom.zones.filter(z => z.answer !== quizState.q.answer);
          target = wrongs[Math.floor(Math.random()*wrongs.length)];
        }
        if (target) { b.tx = target.x + target.w/2 + (Math.random()-0.5); b.ty = target.y + target.h/2 + (Math.random()-0.5); }
      }
    } else if (scene === 'lobby') {
      b.thinkTimer -= dt;
      if (b.thinkTimer <= 0) {
        b.thinkTimer = 2000 + Math.random()*3000;
        b.tx = 4 + Math.random()*16; b.ty = 4 + Math.random()*16;
      }
    }
    const dx = b.tx - b.gx, dy = b.ty - b.gy;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > 0.1) {
      const vx = (dx/d)*b.speed, vy = (dy/d)*b.speed;
      if (isWalkable(b.gx + vx, b.gy)) b.gx += vx;
      if (isWalkable(b.gx, b.gy + vy)) b.gy += vy;
      b.moving = true;
      b.bob += 0.25;
      const sdx = vx - vy, sdy = vx + vy;
      if (Math.abs(sdx) > Math.abs(sdy)) b.facing = sdx > 0 ? 'east' : 'west';
      else b.facing = sdy > 0 ? 'south' : 'north';
    } else b.moving = false;
  });
}

// ============ ISOMETRIC DRAWING ============
function drawDiamond(cx, cy, w, h, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - h/2);
  ctx.lineTo(cx + w/2, cy);
  ctx.lineTo(cx, cy + h/2);
  ctx.lineTo(cx - w/2, cy);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

function drawTile(gx, gy, type) {
  const s = gridToScreen(gx, gy);
  const cx = s.x, cy = s.y + TILE_H/2;
  if (type === 1) {
    drawDiamond(cx, cy, TILE_W, TILE_H, '#4a3a2a');
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, cy - TILE_H/2);
    ctx.lineTo(cx + TILE_W/2, cy);
    ctx.lineTo(cx, cy + TILE_H/2);
    ctx.lineTo(cx - TILE_W/2, cy);
    ctx.closePath();
    ctx.clip();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(cx - TILE_W/2 + i*12, cy - TILE_H/2);
      ctx.lineTo(cx + TILE_W/2 + i*12, cy + TILE_H/2);
      ctx.stroke();
    }
    ctx.restore();
    drawDiamond(cx, cy, TILE_W, TILE_H, null, 'rgba(255,240,210,0.04)');
  } else if (type === 3) {
    drawDiamond(cx, cy, TILE_W, TILE_H, '#8b4a28');
    drawDiamond(cx, cy, TILE_W*0.75, TILE_H*0.75, '#a85a34');
    drawDiamond(cx, cy, TILE_W*0.5, TILE_H*0.5, null, 'rgba(212,165,116,0.4)');
  } else if (type >= 4 && type <= 7) {
    drawDiamond(cx, cy, TILE_W, TILE_H, '#4a3a2a');
    const colors = { 4:'#6b9cc8', 5:'#d88b9c', 6:'#d4a574', 7:'#d96a4a' };
    const labels = { 4:'MCQ', 5:'OX', 6:'SHORT', 7:'SURVIVAL' };
    const c = colors[type];
    const pulse = Math.sin(Date.now()/350)*0.15 + 0.85;
    ctx.save();
    ctx.globalAlpha = pulse * 0.5;
    drawDiamond(cx, cy, TILE_W*0.85, TILE_H*0.85, c);
    ctx.restore();
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.globalAlpha = (0.4 - i*0.1)*pulse;
      drawDiamond(cx, cy - 18 - i*10, TILE_W*(0.7 - i*0.15), TILE_H*(0.7 - i*0.15), c);
      ctx.restore();
    }
    ctx.fillStyle = 'white';
    ctx.font = 'bold 9px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(labels[type], cx, cy - 46);
  }
}

function drawWall(gx, gy) {
  const s = gridToScreen(gx, gy);
  const cx = s.x, cy = s.y + TILE_H/2;
  const h = ELEV * 2.5;

  ctx.fillStyle = '#2a1f16';
  ctx.beginPath();
  ctx.moveTo(cx, cy + TILE_H/2);
  ctx.lineTo(cx + TILE_W/2, cy);
  ctx.lineTo(cx + TILE_W/2, cy - h);
  ctx.lineTo(cx, cy + TILE_H/2 - h);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#3a2e1e';
  ctx.beginPath();
  ctx.moveTo(cx, cy + TILE_H/2);
  ctx.lineTo(cx - TILE_W/2, cy);
  ctx.lineTo(cx - TILE_W/2, cy - h);
  ctx.lineTo(cx, cy + TILE_H/2 - h);
  ctx.closePath();
  ctx.fill();

  drawDiamond(cx, cy - h, TILE_W, TILE_H, '#5a4530', 'rgba(0,0,0,0.3)');

  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    const y = cy + TILE_H/2 - (h/3)*i;
    ctx.beginPath();
    ctx.moveTo(cx, y);
    ctx.lineTo(cx + TILE_W/2, y - TILE_H/2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, y);
    ctx.lineTo(cx - TILE_W/2, y - TILE_H/2);
    ctx.stroke();
  }
}

function drawZone(zone, room) {
  for (let y = zone.y; y < zone.y + zone.h; y++) {
    for (let x = zone.x; x < zone.x + zone.w; x++) {
      const s = gridToScreen(x, y);
      const cx = s.x, cy = s.y + TILE_H/2;
      const standing = player.gx >= zone.x && player.gx < zone.x + zone.w && player.gy >= zone.y && player.gy < zone.y + zone.h;
      ctx.save();
      ctx.globalAlpha = standing ? 0.55 : 0.25;
      drawDiamond(cx, cy, TILE_W, TILE_H, room.color);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = standing ? 1 : 0.5;
      drawDiamond(cx, cy, TILE_W, TILE_H, null, room.color);
      ctx.restore();
    }
  }
  const centerGx = zone.x + zone.w/2 - 0.5;
  const centerGy = zone.y + zone.h/2 - 0.5;
  const s = gridToScreen(centerGx, centerGy);
  const cx = s.x, cy = s.y + TILE_H/2;
  const bob = Math.sin(Date.now()/500 + zone.x)*2;
  ctx.save();
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 4, 28, 8, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'white';
  ctx.font = `italic bold ${zone.big ? 72 : 48}px Fraunces, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = room.color;
  ctx.shadowBlur = 20;
  ctx.fillText(zone.label, cx, cy - 20 + bob);
  ctx.shadowBlur = 0;
}

// ============ CHARACTER DRAWING ============
function shade(hex, amt) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgb(${Math.max(0,Math.min(255,r+amt))},${Math.max(0,Math.min(255,g+amt))},${Math.max(0,Math.min(255,b+amt))})`;
}

function drawCharOn(context, ox, oy, avatar, bobVal, facing, moving, scale = 1) {
  const skinCol = SKIN_TONES[avatar.skin];
  const hairCol = HAIR_COLORS[avatar.hair];
  const shirtCol = SHIRT_COLORS[avatar.shirt];
  const pantsCol = PANTS_COLORS[avatar.pants];
  const hairstyle = HAIR_STYLES[avatar.hairstyle];

  const b = moving ? Math.sin(bobVal)*1.5 : 0;
  const legBob = moving ? Math.sin(bobVal*2)*1.5 : 0;
  const armBob = moving ? Math.sin(bobVal*2 + Math.PI)*1 : 0;

  context.save();
  context.translate(ox, oy);
  context.scale(scale, scale);

  // Shadow
  context.fillStyle = 'rgba(0,0,0,0.5)';
  context.beginPath();
  context.ellipse(0, 2, 12, 4, 0, 0, Math.PI*2);
  context.fill();

  const baseY = b;

  // Legs
  context.fillStyle = pantsCol;
  context.fillRect(-5, baseY - 12 + legBob, 4, 10);
  context.fillRect(1, baseY - 12 - legBob, 4, 10);
  context.fillStyle = shade(pantsCol, -20);
  context.fillRect(-6, baseY - 3 + legBob, 5, 3);
  context.fillRect(1, baseY - 3 - legBob, 5, 3);

  // Torso
  context.fillStyle = shirtCol;
  context.fillRect(-7, baseY - 22, 14, 12);
  context.fillStyle = shade(shirtCol, -25);
  context.fillRect(2, baseY - 22, 5, 12);
  context.fillStyle = shade(shirtCol, 20);
  context.fillRect(-7, baseY - 22, 2, 12);
  context.fillStyle = 'rgba(0,0,0,0.3)';
  context.fillRect(-7, baseY - 12, 14, 2);

  // Arms
  context.fillStyle = shirtCol;
  context.fillRect(-9, baseY - 22 + armBob, 3, 8);
  context.fillStyle = skinCol;
  context.fillRect(-9, baseY - 14 + armBob, 3, 3);
  context.fillStyle = shade(shirtCol, -25);
  context.fillRect(6, baseY - 22 - armBob, 3, 8);
  context.fillStyle = shade(skinCol, -15);
  context.fillRect(6, baseY - 14 - armBob, 3, 3);

  // Neck
  context.fillStyle = shade(skinCol, -25);
  context.fillRect(-2, baseY - 24, 4, 2);

  // Head
  context.fillStyle = skinCol;
  context.fillRect(-6, baseY - 34, 12, 11);
  context.fillStyle = shade(skinCol, -15);
  context.fillRect(3, baseY - 34, 3, 11);
  context.fillStyle = shade(skinCol, -25);
  context.fillRect(-5, baseY - 24, 10, 1);

  // Hair
  if (hairstyle !== 'bald') {
    context.fillStyle = hairCol;
    context.fillRect(-6, baseY - 34, 12, 3);
    context.fillRect(-7, baseY - 33, 1, 2);
    context.fillRect(6, baseY - 33, 1, 2);
    if (hairstyle === 'long') {
      context.fillRect(-7, baseY - 32, 1, 8);
      context.fillRect(6, baseY - 32, 1, 8);
      context.fillRect(-6, baseY - 31, 1, 4);
      context.fillRect(5, baseY - 31, 1, 4);
    } else if (hairstyle === 'ponytail') {
      context.fillRect(6, baseY - 31, 2, 6);
      context.fillRect(7, baseY - 29, 1, 3);
    } else if (hairstyle === 'bob') {
      context.fillRect(-7, baseY - 32, 1, 5);
      context.fillRect(6, baseY - 32, 1, 5);
    } else if (hairstyle === 'curly') {
      context.fillRect(-7, baseY - 35, 14, 2);
      context.fillRect(-8, baseY - 34, 1, 3);
      context.fillRect(7, baseY - 34, 1, 3);
      context.fillRect(-6, baseY - 36, 12, 1);
    } else if (hairstyle === 'short') {
      context.fillRect(-6, baseY - 31, 2, 1);
      context.fillRect(4, baseY - 31, 2, 1);
    }
  }

  // Eyes
  context.fillStyle = '#1a1814';
  if (facing === 'south') {
    context.fillRect(-3, baseY - 29, 1.5, 2);
    context.fillRect(1.5, baseY - 29, 1.5, 2);
    context.fillStyle = shade(skinCol, -30);
    context.fillRect(-1, baseY - 26, 2, 1);
  } else if (facing === 'east') {
    context.fillRect(2, baseY - 29, 1.5, 2);
  } else if (facing === 'west') {
    context.fillRect(-3.5, baseY - 29, 1.5, 2);
  }

  context.restore();
}

function drawCharacter(gx, gy, avatar, bobVal, facing, moving, alive = true, name = '') {
  const s = gridToScreen(gx, gy);
  const cx = s.x, cy = s.y + TILE_H/2;
  ctx.globalAlpha = alive ? 1 : 0.3;
  drawCharOn(ctx, cx, cy, avatar, bobVal, facing, moving, 1);
  ctx.globalAlpha = 1;
  if (name) {
    ctx.font = 'bold 10px Noto Sans KR';
    ctx.textAlign = 'center';
    const nameW = ctx.measureText(name).width + 10;
    ctx.fillStyle = 'rgba(10,11,16,0.85)';
    ctx.fillRect(cx - nameW/2, cy - 48, nameW, 13);
    ctx.fillStyle = alive ? 'white' : '#888';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, cx, cy - 41);
  }
}

function draw() {
  ctx.fillStyle = '#0a0b10';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  const grad = ctx.createRadialGradient(window.innerWidth/2, window.innerHeight/2, 100, window.innerWidth/2, window.innerHeight/2, Math.max(window.innerWidth, window.innerHeight)/1.1);
  grad.addColorStop(0, 'rgba(40,35,55,0.3)');
  grad.addColorStop(1, 'rgba(10,11,16,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  ctx.save();
  ctx.translate(camX, camY);

  const map = currentMap();
  const sz = currentMapSize();

  for (let gy = 0; gy < sz.h; gy++) {
    for (let gx = 0; gx < sz.w; gx++) {
      const t = map[gy][gx];
      if (t >= 1 && t <= 7) drawTile(gx, gy, t);
    }
  }

  if (scene === 'room' && currentRoom.zones.length > 0) {
    currentRoom.zones.forEach(z => drawZone(z, currentRoom));
  }

  const drawList = [];
  for (let gy = 0; gy < sz.h; gy++) {
    for (let gx = 0; gx < sz.w; gx++) {
      if (map[gy][gx] === 2) {
        drawList.push({ depth: gx + gy, draw: () => drawWall(gx, gy) });
      }
    }
  }
  drawList.push({
    depth: player.gx + player.gy + 0.5,
    draw: () => drawCharacter(player.gx, player.gy, myAvatar, player.bob, player.facing, player.moving, !eliminated, myAvatar.name || 'You')
  });
  bots.forEach(b => {
    drawList.push({
      depth: b.gx + b.gy + 0.5,
      draw: () => drawCharacter(b.gx, b.gy, b.avatar, b.bob, b.facing, b.moving, b.alive, b.name)
    });
  });
  drawList.sort((a,b) => a.depth - b.depth);
  drawList.forEach(d => d.draw());

  ctx.restore();
}

// ============ PREVIEW CANVAS ============
const pc = document.getElementById('preview-canvas');
const pctx = pc.getContext('2d');
pctx.imageSmoothingEnabled = false;
function drawPreview() {
  pctx.clearRect(0, 0, pc.width, pc.height);
  const pulse = Math.sin(Date.now()/800)*5;
  pctx.save();
  pctx.fillStyle = 'rgba(212,165,116,0.08)';
  pctx.beginPath();
  pctx.ellipse(pc.width/2, pc.height/2 + 100 + pulse*0.2, 60, 15, 0, 0, Math.PI*2);
  pctx.fill();
  pctx.restore();
  drawCharOn(pctx, pc.width/2, pc.height/2 + 80 + pulse*0.3, myAvatar, Date.now()/400, 'south', true, 5);
}

const ac = document.getElementById('avatar-preview');
const actx = ac.getContext('2d');
actx.imageSmoothingEnabled = false;
function drawHudAvatar() {
  actx.clearRect(0, 0, ac.width, ac.height);
  drawCharOn(actx, ac.width/2, ac.height/2 + 18, myAvatar, 0, 'south', false, 1.2);
}

// ============ LOOP ============
let lastTime = performance.now();
function loop(now) {
  const dt = now - lastTime;
  lastTime = now;
  updatePlayer();
  updateBots(dt);
  updateCamera();
  if (quizState && !quizState.answered) {
    const elapsed = (Date.now() - quizState.startTime)/1000;
    const timeLeft = Math.max(0, (currentRoom.type === 'short' ? 20 : 15) - elapsed);
    const timerEl = document.getElementById('quiz-timer');
    timerEl.textContent = Math.ceil(timeLeft);
    timerEl.className = 'quiz-timer' + (timeLeft < 5 ? ' danger' : timeLeft < 10 ? ' warn' : '');
    if (timeLeft <= 0) resolveQuestion();
  }
  draw();
  requestAnimationFrame(loop);
}

// ============ CHAR SELECT UI ============
function buildSwatches() {
  const build = (id, colors, onClick, initial) => {
    const host = document.getElementById(id);
    host.innerHTML = '';
    colors.forEach((c, i) => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (i === initial ? ' active' : '');
      sw.style.background = c;
      sw.onclick = () => {
        host.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
        onClick(i);
      };
      host.appendChild(sw);
    });
  };
  build('sw-skin', SKIN_TONES, i => myAvatar.skin = i, myAvatar.skin);
  build('sw-hair', HAIR_COLORS, i => myAvatar.hair = i, myAvatar.hair);
  build('sw-shirt', SHIRT_COLORS, i => myAvatar.shirt = i, myAvatar.shirt);
  build('sw-pants', PANTS_COLORS, i => myAvatar.pants = i, myAvatar.pants);

  const hsHost = document.getElementById('sw-hairstyle');
  hsHost.innerHTML = '';
  HAIR_STYLES.forEach((style, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch text' + (i === myAvatar.hairstyle ? ' active' : '');
    sw.textContent = style;
    sw.onclick = () => {
      hsHost.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      myAvatar.hairstyle = i;
    };
    hsHost.appendChild(sw);
  });
}
buildSwatches();

document.getElementById('cs-random').onclick = () => {
  myAvatar = { ...randomAvatar(), name: myAvatar.name };
  buildSwatches();
};
document.getElementById('cs-name').addEventListener('input', e => { myAvatar.name = e.target.value || 'You'; });
document.getElementById('cs-start').onclick = () => {
  const name = document.getElementById('cs-name').value.trim();
  myAvatar.name = name || 'You';
  document.getElementById('hud-name').textContent = myAvatar.name;
  document.getElementById('char-select').classList.add('hide');
  setTimeout(() => announce('환영합니다. 4개의 방 중 입장할 곳을 선택하세요.'), 800);
  requestAnimationFrame(loop);
};

setInterval(() => {
  if (!document.getElementById('char-select').classList.contains('hide')) drawPreview();
  drawHudAvatar();
}, 50);
drawPreview();
drawHudAvatar();
draw();
</script>
