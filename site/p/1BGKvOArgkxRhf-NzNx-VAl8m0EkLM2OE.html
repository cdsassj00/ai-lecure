{type:'cards',sec:'01 · 프롬프트',title:'프롬프트는 업무지시서입니다',sub:'역할·맥락·조건·출력·검증을 갖춘 지시가 품질을 결정합니다',cols:4,cards:[{n:'R',t:'역할',d:'AI에게 업무 관점을 지정합니다. 전산 담당자, 개인정보 점검자, 데이터 분석 보조자처럼 답변 기준을 먼저 고정합니다.',use:'회의록 정리는 행정업무 보조자',check:'답변 관점과 책임 범위가 드러나는가',col:P[0],tc:TC[0]},{n:'C',t:'맥락',d:'기관, 업무 목적, 대상자, 보유 자료, 제한 조건을 알려줍니다. 맥락이 없으면 AI가 임의의 업무 상황을 가정합니다.',use:'교육청 내부회의·부서장 보고용',check:'기관·목적·대상·자료가 명시됐는가',col:P[1],tc:TC[1]},{n:'C',t:'조건',d:'개인정보 제외, 외부 자료 금지, 표준 서식 사용, 근거 없는 추측 금지처럼 반드시 지킬 선을 적습니다.',use:'개인정보 마스킹·추측은 확인 필요',check:'금지사항과 예외 처리가 구체적인가',col:P[2],tc:TC[2]},{n:'F',t:'출력',d:'표, 체크리스트, 보고서 초안, 코드, 명령어처럼 결과 형식을 지정합니다. 출력 형식이 명확하면 바로 업무에 쓰기 쉽습니다.',use:'담당부서·기한·근거를 표로 출력',check:'결과 칸과 분량을 바로 검수할 수 있는가',col:P[3],tc:TC[3]}],anchor:'프롬프트 작성은 문장 꾸미기가 아니라, 업무 목적과 검증 기준을 AI가 이해할 수 있게 구조화하는 일입니다.'},
{type:'two',sec:'01 · 프롬프트 실습',title:'행정업무 프롬프트 3종',sub:'요약·분류·초안 작성에 바로 쓰는 기본 실습',leftTitle:'입력 전 점검',leftH:112,left:[{t:'1. 민감정보 제거',d:'주민번호, 연락처, 학생·교직원 정보, 민원 원문은 입력 전에 마스킹합니다.',col:P[5],tc:TC[5]},{t:'2. 근거 자료 지정',d:'공문, 지침, 회의록, FAQ 중 어떤 자료를 근거로 삼을지 명확히 적습니다.',col:P[0],tc:TC[0]},{t:'3. 출력 형식 고정',d:'표, 3줄 요약, 담당부서, 기한, 후속 조치처럼 결과 칸을 지정합니다.',col:P[2],tc:TC[2]}],rightTitle:'실습 프롬프트',code:['너는 교육청 전산 담당자의 업무 보조자입니다.','다음 회의록을 근거로 업무 후속조치를 정리하세요.','','조건:','- 개인정보는 포함하지 않습니다.','- 담당부서, 처리기한, 확인사항을 표로 작성합니다.','- 근거가 불확실한 내용은 확인 필요로 표시합니다.','','출력:','1. 3줄 요약','2. 후속 조치 표','3. 누락 가능성이 있는 항목'],anchor:'좋은 프롬프트는 답변을 잘 받는 기술이 아니라, 업무 누락과 보안 사고를 줄이는 기본 절차입니다.'},
{type:'table',sec:'01 · 챗봇에서 하네스까지',title:'챗봇·에이전트·하네스의 차이',sub:'답변 도구와 업무 수행 구조를 구분합니다',widths:[170,500,498],rows:[['구분','무엇을 하는가','전산직 확인점'],['챗봇','질문에 답하고 문서를 요약합니다. 사용자가 다음 행동을 직접 합니다.','근거 표시, 개인정보 입력, 답변 품질, 사용 범위'],['에이전트','검색, 파일 읽기, 코드 실행, 표 작성처럼 여러 도구를 순서대로 사용합니다.','도구 권한, 승인 단계, 실패 시 중단, 로그'],['하네스','에이전트가 지켜야 할 지침, 도구, 파일, 검증 절차, 실행 환경을 묶은 작업 틀입니다.','표준 절차, 재사용성, 운영 통제, 담당자 인수인계'],['업무 서비스','사용자가 반복해서 안전하게 쓸 수 있도록 화면, 권한, 로그, 오류 처리를 갖춘 프로그램입니다.','입력 검증, 예외 처리, 사용자 지원, 운영 매뉴얼']],anchor:'프롬프트가 한 번의 지시라면, 하네스는 반복 가능한 업무 흐름입니다.'},
{type:'cards',sec:'02 · LLM 원리',title:'언어모델은 다음 토큰을 예측합니다',sub:'토큰·가중치·확률을 알면 모델의 한계를 이해할 수 있습니다',cols:3,cards:[{n:'01',t:'토큰',d:'모델이 읽고 쓰는 작은 글자 조각입니다. 문장 길이, 비용, 기억 가능한 범위는 토큰 수로 계산합니다.',use:'공문 입력·출력 길이 계산',check:'문서 전체가 범위 안에 드는가',col:P[0],tc:TC[0]},{n:'02',t:'가중치',d:'학습으로 만들어진 거대한 숫자 묶음입니다. 모델 파일의 대부분은 이 가중치이며 답변 패턴을 결정합니다.',use:'모델 파일 크기 비교',check:'장비·속도와 함께 판단했는가',col:P[1],tc:TC[1]},{n:'03',t:'확률',d:'모델은 정답표를 꺼내는 것이 아니라 다음에 올 가능성이 높은 토큰을 고릅니다. 그래서 검증이 필요합니다.',use:'같은 질문을 반복 실행',check:'결과 차이와 오류를 기록했는가',col:P[2],tc:TC[2]},{n:'04',t:'컨텍스트',d:'한 번에 읽을 수 있는 범위입니다. 긴 회의록과 매뉴얼 분석에서는 컨텍스트 길이가 중요합니다.',use:'관련 문단만 검색해 입력',check:'불필요한 대화가 누적되지 않는가',col:P[3],tc:TC[3]},{n:'05',t:'추론',d:'답변을 생성하는 실행 단계입니다. 같은 모델도 설정값과 입력 구조에 따라 결과가 달라집니다.',use:'설정값별 결과 비교',check:'업무별 기준값을 고정했는가',col:P[4],tc:TC[4]},{n:'06',t:'검증',d:'확률 기반 생성 결과는 틀릴 수 있습니다. 출처 확인, 반대 질문, 샘플 테스트를 함께 써야 합니다.',use:'근거·반례·샘플 확인',check:'사람의 최종 검토가 남아 있는가',col:P[5],tc:TC[5]}],anchor:'LLM을 이해한다는 것은 모든 수식을 외우는 것이 아니라, 모델이 왜 틀릴 수 있는지 아는 것입니다.'},
{type:'table',sec:'02 · 모델 스펙 읽기',title:'모델 카드에서 봐야 할 항목',sub:'크기·문맥·압축·라이선스를 업무 조건과 함께 봅니다',widths:[200,452,516],rows:[['항목','뜻','실무 판단'],['Parameters','모델 가중치 규모입니다. 7B, 13B, 70B처럼 표시됩니다.','클수록 항상 좋은 것은 아니며 장비와 비용이 함께 늘어납니다.'],['Context length','한 번에 읽을 수 있는 토큰 범위입니다.','긴 공문 묶음, 회의록, 매뉴얼 분석에는 큰 컨텍스트가 유리합니다.'],['Quantization','가중치를 압축해 로컬 장비에서 돌리기 쉽게 만든 형식입니다.','속도와 메모리는 좋아지지만 품질은 일부 낮아질 수 있습니다.'],['License','상업·기관 사용 가능 여부와 재배포 조건입니다.','기관 서비스에 넣기 전 반드시 확인해야 합니다.'],['Korean quality','한국어 지시 이해, 공문체, 표 생성, 긴 문서 요약 능력입니다.','벤치마크보다 실제 기관 문서 샘플로 테스트해야 합니다.']],anchor:'모델 스펙은 성능 순위표가 아니라 업무 목적, 장비, 보안, 비용, 라이선스를 함께 읽는 판단표입니다.'},
{type:'cards',sec:'02 · LLM과 SLM',title:'큰 모델과 작은 모델의 역할',sub:'모든 업무에 대형 모델이 필요한 것은 아닙니다',cols:3,cards:[{n:'LLM',t:'복잡한 이해와 작성',d:'정책 해석, 긴 문서 요약, 보고서 초안, 복잡한 질의응답처럼 문맥과 추론이 필요한 업무에 적합합니다.',use:'규정 비교·보고서 초안',check:'복잡도가 대형 모델을 요구하는가',col:P[0],tc:TC[0]},{n:'SLM',t:'반복·로컬·저비용',d:'분류, 키워드 추출, 짧은 요약, 내부 도구 호출처럼 작고 빠른 업무에 적합합니다.',use:'민원 분류·필드 추출',check:'작은 모델로 품질이 충분한가',col:P[3],tc:TC[3]},{n:'MIX',t:'혼합 운영',d:'대형 모델과 작은 모델을 업무 난이도에 따라 섞어 쓰면 비용과 속도를 조정할 수 있습니다.',use:'분류는 SLM·작성은 LLM',check:'업무 분기 조건이 명확한가',col:P[2],tc:TC[2]},{n:'GPU',t:'장비 조건',d:'로컬 실행은 GPU와 메모리에 좌우됩니다. 모델 크기와 양자화 수준을 장비에 맞춰야 합니다.',use:'VRAM별 모델 후보 시험',check:'동시 사용자 부하를 측정했는가',col:P[4],tc:TC[4]},{n:'COST',t:'비용 조건',d:'외부 API는 호출량, 입력 길이, 출력 길이에 따라 비용이 변합니다. 사용량 제한과 캐시가 필요합니다.',use:'월 호출량·토큰비용 산정',check:'상한·캐시·경고 기준이 있는가',col:P[5],tc:TC[5]},{n:'DATA',t:'데이터 조건',d:'외부 API로 보내도 되는 데이터인지, 로컬 실행이 필요한 데이터인지 업무 등급을 나눠야 합니다.',use:'공개·내부·민감 자료 분류',check:'등급별 전송 기준이 정해졌는가',col:P[6],tc:TC[6]}],anchor:'좋은 모델 하나를 고르는 것보다, 업무 난이도와 보안 조건에 맞게 모델을 나누는 설계가 중요합니다.'},
{type:'cards',sec:'02 · 내부 용어',title:'파라미터·KV 캐시·MoE·임베딩',sub:'전산 담당자가 알아야 할 최소 개념',cols:4,cards:[{n:'P',t:'파라미터',d:'모델이 학습한 숫자 규모입니다. 7B는 약 70억 개의 숫자를 뜻합니다. 크기는 품질·속도·메모리와 연결됩니다.',use:'7B·14B·70B별 장비와 응답속도 비교',check:'업무 품질과 VRAM 요구량을 함께 봤는가',col:P[0],tc:TC[0]},{n:'KV',t:'KV 캐시',d:'이전 토큰 계산 결과를 저장해 다음 토큰 생성을 빠르게 하는 메모리입니다. 긴 대화와 동시 사용자 수에 영향을 줍니다.',use:'긴 회의록 질의와 동시 사용자 부하 점검',check:'문맥 길이별 메모리 증가를 측정했는가',col:P[1],tc:TC[1]},{n:'M',t:'MoE',d:'여러 전문가 모델 중 일부만 골라 계산하는 구조입니다. 큰 모델처럼 보이지만 매번 전체가 계산되지는 않습니다.',use:'총 파라미터와 활성 파라미터를 구분',check:'모델 크기만으로 실행비용을 판단하지 않았는가',col:P[2],tc:TC[2]},{n:'E',t:'임베딩',d:'문장과 문서를 숫자 벡터로 바꾸는 방식입니다. RAG에서 비슷한 문서를 찾는 핵심 재료입니다.',use:'지침·FAQ 문단을 벡터화해 유사문서 검색',check:'한국어 문서 샘플의 검색 적합성을 시험했는가',col:P[3],tc:TC[3]}],anchor:'이 네 가지 용어만 알아도 모델 스펙, 로컬 실행, RAG 구조를 훨씬 현실적으로 읽을 수 있습니다.'},
{type:'two',sec:'03 · 오케스트레이션',title:'문제는 모델이 아니라 흐름입니다',sub:'하네스와 프로그램 구조가 실무 변화를 만듭니다',leftTitle:'단순 모델 호출',leftH:112,left:[{t:'1. 질문을 보냄',d:'사용자가 채팅창에 질문하고 모델이 답변합니다. 업무 시스템과는 분리되어 있습니다.',col:P[0],tc:TC[0]},{t:'2. 사람이 복사해 처리',d:'답변을 보고 사람이 파일을 만들고 시스템에 입력합니다. 자동화 효과가 제한됩니다.',col:P[2],tc:TC[2]},{t:'3. 검증이 개인 역량에 의존',d:'누가 어떤 기준으로 확인하는지 남지 않으면 반복 업무로 확장하기 어렵습니다.',col:P[5],tc:TC[5]}],rightTitle:'하네스 기반 업무흐름',rightH:112,right:[{t:'1. 도구와 데이터 연결',d:'파일 읽기, DB 조회, 검색, 코드 실행, 표 생성 같은 도구를 연결합니다.',col:P[3],tc:TC[3]},{t:'2. 승인과 중단 기준',d:'개인정보 조회, 외부 발송, 원본 수정은 사람 승인 후 진행하게 만듭니다.',col:P[1],tc:TC[1]},{t:'3. 로그와 재사용',d:'실행 절차와 결과를 남겨 같은 업무를 반복 수행하고 인수인계할 수 있게 합니다.',col:P[6],tc:TC[6]}],anchor:'AI 도입은 모델 선택 문제가 아니라 입력·도구·권한·검증·로그를 묶는 프로그램 구조 문제입니다.'},
{type:'cards',sec:'04 · AI 도입 지점',title:'기존 레거시 전체를 AI로 바꾸지 않습니다',sub:'검색·추출·분석·초안 작성 병목에 AI를 넣습니다',cols:4,cards:[{n:'01',t:'자료검색 병목',d:'담당자가 지침, 공문, 매뉴얼을 찾느라 시간을 쓰는 구간은 RAG 지식검색이 적합합니다.',use:'현행 지침·FAQ·매뉴얼 통합 검색',check:'출처 문서와 시행일이 답변에 표시되는가',col:P[0],tc:TC[0]},{n:'02',t:'텍스트 추출 병목',d:'PDF, HWPX, 스캔 문서, 엑셀 파일에서 필요한 항목을 뽑는 반복 업무는 AI와 파서가 함께 필요합니다.',use:'공문에서 기관·기한·예산 항목 추출',check:'표·스캔·깨진 파일의 실패 목록이 남는가',col:P[1],tc:TC[1]},{n:'03',t:'데이터분석 병목',d:'집계, 이상값 확인, 시각화, 보고서 초안은 Python과 LLM을 연결하면 효과가 큽니다.',use:'학교별 현황 집계·누락값·이상값 점검',check:'원본 행 수와 집계 결과를 대조했는가',col:P[2],tc:TC[2]},{n:'04',t:'초안 작성 병목',d:'보고서, 안내문, 회의록, 민원 답변 초안은 AI가 빠르게 만들고 담당자가 검토하는 방식이 적합합니다.',use:'회의 후속조치표와 안내문 초안 생성',check:'근거·담당자·기한을 사람이 확인했는가',col:P[3],tc:TC[3]}],anchor:'AI는 모든 시스템을 대체하는 도구가 아니라, 기존 업무 중 시간이 새는 지점을 좁게 개선하는 도구입니다.'},
{type:'table',sec:'04 · 기존 시스템 연결',title:'AI 서비스 연결 방식',sub:'DB·문서·파일·API를 안전하게 연결하는 기준',widths:[180,500,488],rows:[['연결 대상','적합한 방식','주의점'],['기존 DB','읽기 전용 API, 조회 전용 계정, 제한된 SQL, 결과 요약','원본 DB 직접 연결보다 중계 계층을 두는 편이 안전합니다.'],['공문·매뉴얼','텍스트 추출, 메타데이터, 임베딩, RAG 검색','폐지 문서와 최신 문서 구분이 중요합니다.'],['엑셀·CSV','Python 데이터프레임, 집계, 이상값 확인, 차트 생성','서식이 깨진 파일은 전처리 규칙이 필요합니다.'],['업무 파일','파일 업로드, 파서, 요약, 분류, 초안 작성','개인정보와 대외비를 입력 전에 차단해야 합니다.'],['외부 서비스','승인된 API, 인증키 관리, 호출량 제한, 응답 로그','기관 정책과 계약 조건을 먼저 확인해야 합니다.']],anchor:'AI가 직접 모든 시스템을 만지는 구조보다, 기존 프로그램이 안전하게 데이터를 꺼내고 AI가 필요한 부분만 처리하는 구조가 실무에 맞습니다.'},

{type:'cards',sec:'05 · 바이브코딩',title:'자연어로 프로그램을 만드는 방식',sub:'PowerShell·Python·Node.js·Rust의 역할을 구분합니다',cols:4,cards:[{n:'PS',t:'PowerShell',d:'파일 목록 정리, 폴더 생성, 로그 확인, 압축, 일괄 변환처럼 윈도우 반복 작업에 바로 씁니다.',use:'폴더별 파일명·수정일·크기를 CSV로 수집',check:'원본 변경 없이 결과 로그를 남기는가',col:P[0],tc:TC[0]},{n:'PY',t:'Python',d:'엑셀 병합, CSV 집계, PDF 텍스트 추출, 차트 생성, 간단한 AI 파이프라인에 적합합니다.',use:'월별 XLSX 병합 후 누락값과 합계 검증',check:'입력 행 수와 출력 행 수가 일치하는가',col:P[1],tc:TC[1]},{n:'JS',t:'Node.js',d:'간단한 웹 화면, 챗봇 UI, API 서버, 배포 가능한 내부 도구를 만들 때 유용합니다.',use:'브라우저 입력화면과 내부 API 중계 구현',check:'입력 검증·오류 메시지·접근권한이 있는가',col:P[2],tc:TC[2]},{n:'RS',t:'Rust',d:'빠른 실행, 단일 실행파일, 안정성이 필요한 도구에 적합합니다. 깊은 문법보다 쓰임새를 먼저 이해합니다.',use:'대량 파일 검사기를 단일 exe로 배포',check:'격리 환경에서 성능과 실패 처리를 시험했는가',col:P[3],tc:TC[3]}],anchor:'전산직의 바이브코딩은 앱을 멋지게 만드는 일이 아니라, 반복 업무를 명령과 코드로 짧게 만드는 실무 기술입니다.'},
{type:'code',sec:'05 · 코딩에이전트',title:'코딩에이전트에게 일을 맡기는 방법',sub:'목표·파일·제약·실행·검증을 한 번에 지시합니다',codeTitle:'좋은 지시 예시',code:['이 폴더의 xlsx 파일을 모두 읽어 하나의 CSV로 합쳐줘.','','조건:','- 파일명에서 학교명을 추출해 school 컬럼에 넣어줘.','- 개인정보로 보이는 컬럼은 결과에서 제외해줘.','- 결과 파일은 output/merged.csv 로 저장해줘.','- 실행 후 행 수와 누락값 개수를 알려줘.','','검증:','- 샘플 파일 3개로 먼저 테스트해줘.','- 오류가 나면 원인과 수정 내용을 요약해줘.'],sideTitle:'지시 구성 3요소',side:[{t:'1. 목표와 입력',d:'무엇을 만들지, 입력 파일은 어디 있는지, 결과 파일명은 무엇인지 명확히 말합니다.',col:P[0],tc:TC[0]},{t:'2. 제약과 보안',d:'사내망, 개인정보 제외, 설치 가능 패키지, 실행 환경을 알려줍니다.',col:P[2],tc:TC[2]},{t:'3. 실행과 검증',d:'만든 코드가 실제로 실행되는지 확인하고 결과 행 수, 오류, 누락값을 보고하게 합니다.',col:P[3],tc:TC[3]}],anchor:'코딩에이전트는 대신 타이핑하는 도구가 아니라, 실행하고 고치고 검증하는 작업 파트너처럼 사용해야 합니다.'},
{type:'code',sec:'06 · Ollama 로컬 AI',title:'Ollama를 이용한 로컬 AI 서비스',sub:'설치·모델·API·화면의 기본 구조',codeTitle:'로컬 실행 흐름',code:['# 1. Ollama 설치 후 버전 확인','ollama --version','','# 2. 모델 다운로드','ollama pull llama3.1','ollama pull qwen2.5','','# 3. 로컬 채팅 실행','ollama run llama3.1','','# 4. 로컬 API 호출','http://localhost:11434/api/chat','','# 5. 간단한 HTML 화면 또는 내부 도구와 연결'],sideTitle:'로컬 AI의 장점과 한계',side:[{t:'1. 외부 전송 없는 실습',d:'로컬 장비에서 모델을 실행하면 외부 API 없이 챗봇 구조를 이해할 수 있습니다.',col:P[3],tc:TC[3]},{t:'2. 장비 의존성',d:'GPU, 메모리, 모델 크기, 양자화 형식에 따라 속도와 품질이 크게 달라집니다.',col:P[5],tc:TC[5]},{t:'3. 서비스 구성 필요',d:'모델만 실행하면 서비스가 아닙니다. 화면, 파일 처리, 로그, 오류 처리가 함께 필요합니다.',col:P[0],tc:TC[0]}],anchor:'로컬 AI 실습의 목표는 거대한 서비스를 완성하는 것이 아니라, 모델이 프로그램과 연결되는 방식을 이해하는 것입니다.'},
{type:'steps',sec:'06 · 로컬 AI 서비스',title:'로컬 챗봇에서 내부 서비스까지',sub:'모델 실행만으로는 서비스가 되지 않습니다',steps:[{n:'01',k:'MODEL',t:'모델 실행',d:['Ollama가 로컬 모델을 실행','API 엔드포인트 제공','모델 크기와 속도 확인'],out:'점검 : 응답속도와 메모리',col:P[0],tc:TC[0]},{n:'02',k:'UI',t:'웹 화면',d:['질문 입력과 답변 표시','파일 업로드와 오류 안내','사용자 접근 방식 결정'],out:'점검 : 사용성과 접근권한',col:P[1],tc:TC[1]},{n:'03',k:'FILE',t:'파일·문서 연결',d:['문서 텍스트 추출','질문과 함께 모델에 전달','자료 범위와 보안 등급 관리'],out:'점검 : 입력 통제',col:P[2],tc:TC[2]},{n:'04',k:'LOG',t:'로그·설정',d:['질문·응답·오류 기록','모델과 프롬프트 설정','운영 담당자 확인'],out:'점검 : 유지보수 가능성',col:P[3],tc:TC[3]}],anchor:'로컬 챗봇도 업무 도구가 되려면 입력, 권한, 파일 처리, 로그, 오류 처리가 함께 설계되어야 합니다.'},
{type:'two',sec:'07 · RAG',title:'RAG는 검색 후 답변하는 구조입니다',sub:'임베딩·벡터DB·출처 표시가 핵심입니다',leftTitle:'RAG 기본 흐름',code:['문서 수집','  ↓','텍스트 추출','  ↓','작은 조각으로 분할','  ↓','임베딩 생성','  ↓','벡터DB 저장','  ↓','질문과 관련 문서 검색','  ↓','LLM이 근거 기반 답변 생성'],rightTitle:'품질을 좌우하는 요소',rightH:112,right:[{t:'1. 문서 조각 크기',d:'너무 작으면 맥락이 끊기고, 너무 크면 관련 없는 내용이 함께 들어갑니다.',col:P[0],tc:TC[0]},{t:'2. 메타데이터',d:'문서명, 시행일, 부서, 보안등급, 폐지 여부가 검색 품질을 좌우합니다.',col:P[2],tc:TC[2]},{t:'3. 출처 표시',d:'답변 아래에 사용한 문서명과 문단을 표시해야 업무 검토가 가능합니다.',col:P[3],tc:TC[3]}],anchor:'RAG는 문서를 넣으면 알아서 답하는 기능이 아니라, 문서를 검색 가능한 지식 구조로 바꾸는 절차입니다.'},
{type:'steps',sec:'07 · RAG 구현',title:'코딩에이전트로 RAG 챗봇 만들기',sub:'에이전트에게 맡길 수 있는 작업 단위로 쪼갭니다',steps:[{n:'01',k:'DOCS',t:'문서 폴더 준비',d:['테스트용 지침·FAQ·매뉴얼 수집','파일명과 문서 유형 정리','개인정보 없는 샘플 사용'],out:'입력 : docs 폴더',col:P[0],tc:TC[0]},{n:'02',k:'PARSE',t:'추출 코드 작성',d:['PDF·HWPX·TXT 텍스트 추출','표와 본문 분리','오류 파일 목록 저장'],out:'출력 : extracted.json',col:P[1],tc:TC[1]},{n:'03',k:'INDEX',t:'검색 저장소 구축',d:['문서 분할','임베딩 생성','로컬 벡터 저장소 구성'],out:'출력 : vector index',col:P[2],tc:TC[2]},{n:'04',k:'CHAT',t:'챗봇 연결',d:['질문 입력 화면','검색 결과와 모델 답변 연결','출처 표시와 샘플 질문 검증'],out:'출력 : RAG 챗봇',col:P[3],tc:TC[3]}],anchor:'RAG 챗봇 구현은 코딩 실력보다 문서 준비, 검색 기준, 출처 표시, 검증 질문을 잘 나누는 능력이 중요합니다.'},

{type:'table',sec:'02 · 생성 설정값',title:'Temperature·Top-p·Max tokens 읽는 법',sub:'모델 답변의 안정성과 다양성을 조정하는 기본값',widths:[190,420,558],rows:[['설정값','뜻','실무 적용'],['Temperature','다음 토큰 선택의 무작위성을 조정합니다. 낮을수록 보수적이고 높을수록 다양합니다.','공문 요약·규정 질의는 낮게, 아이디어 발산과 문안 후보 생성은 조금 높게 둡니다.'],['Top-p','확률이 높은 후보 토큰 묶음 안에서 선택하게 하는 설정입니다.','Temperature와 함께 답변의 다양성을 조절하지만, 둘을 동시에 크게 올리면 결과가 흔들립니다.'],['Max tokens','모델이 생성할 수 있는 출력 길이 제한입니다.','긴 보고서 초안이나 표 생성에는 충분한 길이를 주고, 요약 업무에는 짧게 제한합니다.'],['System prompt','모델의 역할과 금지사항을 가장 앞에서 고정하는 지침입니다.','기관 업무에서는 개인정보, 출처, 추측 금지, 말투, 출력 형식을 고정하는 데 사용합니다.'],['Stop sequence','특정 문자열이 나오면 생성을 멈추게 하는 조건입니다.','템플릿 출력이나 자동 처리에서 불필요한 뒷문장을 줄일 때 사용할 수 있습니다.']],anchor:'모델 품질은 모델 이름만이 아니라 입력 구조와 생성 설정값에 따라 크게 달라집니다.'},

{type:'cards',sec:'07 · RAG 세부 설계',title:'RAG 품질을 망치는 6가지 원인',sub:'모델보다 문서 처리와 검색 설계가 먼저입니다',cols:3,cards:[{n:'01',t:'오래된 문서',d:'폐지된 지침과 최신 지침이 함께 색인되면 답변 근거가 흔들립니다. 시행일과 폐지 여부가 필요합니다.',use:'현행·폐지 상태 필터',check:'최신 문서가 우선 검색되는가',col:P[5],tc:TC[5]},{n:'02',t:'문서 조각 오류',d:'문단이 너무 작으면 맥락이 끊기고 너무 크면 관련 없는 내용이 섞입니다.',use:'400·800·1200자 비교',check:'질문별 검색 적중률을 봤는가',col:P[0],tc:TC[0]},{n:'03',t:'표 추출 실패',d:'표 안의 조건, 금액, 기한이 빠지면 행정문서 답변 품질이 크게 낮아집니다.',use:'표 셀을 행 단위로 보존',check:'금액·기한·예외가 검색되는가',col:P[2],tc:TC[2]},{n:'04',t:'메타데이터 없음',d:'부서, 문서유형, 보안등급, 적용대상, 시행일이 없으면 검색 결과를 통제하기 어렵습니다.',use:'부서·시행일·등급 저장',check:'조건 검색과 정렬이 가능한가',col:P[3],tc:TC[3]},{n:'05',t:'권한 필터 누락',d:'사용자가 볼 수 없는 문서가 검색 결과에 들어오면 보안 사고가 됩니다.',use:'사용자 역할별 검색 필터',check:'검색 전에 권한이 적용되는가',col:P[4],tc:TC[4]},{n:'06',t:'출처 표시 부실',d:'문서명만 있고 문단 근거가 없으면 담당자가 답변을 검토하기 어렵습니다.',use:'문서명·쪽·문단 링크',check:'답변에서 원문을 바로 여는가',col:P[1],tc:TC[1]}],anchor:'RAG는 모델 기능이 아니라 문서 관리, 검색 설계, 권한 통제, 출처 표시가 결합된 업무 시스템입니다.'},
