<!DOCTYPE html>
<html lang="ko">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인삼·약초 병해충 진단 가이드</title>
<style>
  :root {
    --green-50:#EAF3DE; --green-100:#C0DD97; --green-200:#97C459;
    --green-600:#3B6D11; --green-800:#27500A;
    --amber-50:#FAEEDA; --amber-100:#FAC775; --amber-600:#854F0B; --amber-800:#633806;
    --red-50:#FCEBEB; --red-100:#F7C1C1; --red-600:#A32D2D; --red-800:#791F1F;
    --coral-50:#FAECE7; --coral-600:#993C1D; --coral-800:#712B13;
    --blue-50:#E6F1FB; --blue-100:#B5D4F4; --blue-600:#185FA5; --blue-800:#0C447C;
    --gray-50:#F1EFE8; --gray-100:#D3D1C7; --gray-600:#5F5E5A; --gray-800:#444441;
    --text-p: #1a1a18; --text-s: #5f5e5a; --text-t: #88878080;
    --bg-p: #ffffff; --bg-s: #f7f6f2; --bg-t: #f1efe8;
    --border-t: rgba(0,0,0,0.12); --border-s: rgba(0,0,0,0.22);
    --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --green-50:#1a2e0e; --green-100:#2a4a18; --green-200:#3b6811;
      --green-600:#7ab84a; --green-800:#a5d474;
      --amber-50:#2a1e08; --amber-100:#3d2d0d; --amber-600:#d4a030; --amber-800:#f0c060;
      --red-50:#2a0f0f; --red-100:#3d1a1a; --red-600:#d96060; --red-800:#f09090;
      --coral-50:#2a1208; --coral-600:#e07050; --coral-800:#f0a080;
      --blue-50:#0a1e30; --blue-100:#102d45; --blue-600:#5fa8e0; --blue-800:#90c8f5;
      --gray-50:#1e1e1c; --gray-100:#2c2c29; --gray-600:#a0a09a; --gray-800:#c8c8c0;
      --text-p: #e8e6de; --text-s: #a8a69e; --text-t: #686660;
      --bg-p: #1a1a18; --bg-s: #222220; --bg-t: #2a2a28;
      --border-t: rgba(255,255,255,0.1); --border-s: rgba(255,255,255,0.18);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif;
    background: var(--bg-s);
    color: var(--text-p);
    min-height: 100vh;
    padding: 0 0 3rem;
  }
  .header {
    background: var(--bg-p);
    border-bottom: 0.5px solid var(--border-t);
    padding: 1rem 1.25rem 0.875rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0.75rem;
  }
  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green-200);
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 15px; font-weight: 500; color: var(--text-p);
  }
  .header p {
    font-size: 12px; color: var(--text-s); line-height: 1.5;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 0.625rem;
  }
  .progress-bar-wrap {
    flex: 1; height: 4px; background: var(--bg-t); border-radius: 2px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: var(--green-200); border-radius: 2px;
    transition: width 0.35s ease;
  }
  .progress-label { font-size: 11px; color: var(--text-t); min-width: 40px; text-align: right; }
  .crumb-row {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 0.75rem 1.25rem 0;
    min-height: 36px;
  }
  .crumb {
    font-size: 11px; color: var(--text-t);
    background: var(--bg-t);
    border: 0.5px solid var(--border-t);
    border-radius: 99px;
    padding: 3px 10px;
    display: flex; align-items: center; gap: 4px;
  }
  .crumb-arrow { color: var(--text-t); font-size: 10px; }
  .main { padding: 1rem 1.25rem 0; }
  .question-card {
    background: var(--bg-p);
    border: 0.5px solid var(--border-t);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .q-step {
    font-size: 11px; font-weight: 500; color: var(--green-600);
    background: var(--green-50);
    border-radius: 99px;
    padding: 2px 10px;
    display: inline-block;
    margin-bottom: 0.75rem;
  }
  .q-text {
    font-size: 15px; font-weight: 500; color: var(--text-p);
    line-height: 1.55;
    margin-bottom: 0.375rem;
  }
  .q-hint {
    font-size: 12px; color: var(--text-s); line-height: 1.5;
    margin-bottom: 1rem;
  }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice-btn {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-s);
    border: 0.5px solid var(--border-t);
    border-radius: var(--radius-md);
    padding: 0.75rem 1rem;
    cursor: pointer;
    text-align: left;
    font-size: 14px; color: var(--text-p);
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
  }
  .choice-btn:hover { border-color: var(--border-s); background: var(--bg-p); }
  .choice-btn:active { transform: scale(0.99); }
  .choice-icon {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500;
    flex-shrink: 0;
  }
  .choice-icon.yes { background: var(--green-50); color: var(--green-800); }
  .choice-icon.no  { background: var(--red-50);   color: var(--red-800); }
  .choice-icon.opt { background: var(--blue-50);  color: var(--blue-800); }
  .choice-label { flex: 1; }
  .choice-sub { font-size: 11px; color: var(--text-s); margin-top: 2px; }
  .result-card {
    background: var(--bg-p);
    border: 1.5px solid var(--green-600);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 1rem;
  }
  .result-header {
    background: var(--green-50);
    padding: 1rem 1.25rem 0.875rem;
    border-bottom: 0.5px solid var(--border-t);
  }
  .result-badge {
    font-size: 11px; font-weight: 500;
    padding: 2px 10px; border-radius: 99px;
    display: inline-block; margin-bottom: 0.5rem;
  }
  .result-badge.danger { background: var(--red-100); color: var(--red-800); }
  .result-badge.warning { background: var(--amber-100); color: var(--amber-800); }
  .result-badge.notice { background: var(--blue-100); color: var(--blue-800); }
  .result-name {
    font-size: 18px; font-weight: 500; color: var(--green-800);
    margin-bottom: 0.25rem;
  }
  .result-name-ko { font-size: 13px; color: var(--green-600); margin-bottom: 0; }
  .result-body { padding: 1rem 1.25rem; }
  .section-label {
    font-size: 11px; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-t);
    margin-bottom: 0.5rem; margin-top: 1rem;
  }
  .section-label:first-child { margin-top: 0; }
  .symptom-list { list-style: none; padding: 0; }
  .symptom-list li {
    font-size: 13px; color: var(--text-s); line-height: 1.6;
    padding: 4px 0 4px 14px; position: relative;
  }
  .symptom-list li::before {
    content: '·'; position: absolute; left: 2px; color: var(--text-t);
  }
  .control-row {
    background: var(--amber-50);
    border: 0.5px solid var(--amber-100);
    border-radius: var(--radius-md);
    padding: 0.875rem 1rem;
    margin-bottom: 0.75rem;
  }
  .control-title {
    font-size: 13px; font-weight: 500; color: var(--amber-800);
    margin-bottom: 0.375rem;
  }
  .control-body { font-size: 13px; color: var(--amber-600); line-height: 1.65; }
  .chemical-row {
    background: var(--red-50);
    border: 0.5px solid var(--red-100);
    border-radius: var(--radius-md);
    padding: 0.875rem 1rem;
    margin-bottom: 0.75rem;
  }
  .chemical-title { font-size: 13px; font-weight: 500; color: var(--red-800); margin-bottom: 0.375rem; }
  .chemical-body { font-size: 13px; color: var(--red-600); line-height: 1.65; }
  .timing-row {
    background: var(--blue-50);
    border: 0.5px solid var(--blue-100);
    border-radius: var(--radius-md);
    padding: 0.875rem 1rem;
    margin-bottom: 0.75rem;
  }
  .timing-title { font-size: 13px; font-weight: 500; color: var(--blue-800); margin-bottom: 0.375rem; }
  .timing-body { font-size: 13px; color: var(--blue-600); line-height: 1.65; }
  .caution-box {
    background: var(--coral-50);
    border-left: 3px solid var(--coral-600);
    border-radius: 0;
    padding: 0.75rem 1rem;
    font-size: 12px; color: var(--coral-800); line-height: 1.6;
    margin-bottom: 0;
    border-radius: var(--radius-md);
  }
  .btn-row { display: flex; gap: 8px; margin-top: 1rem; }
  .btn-restart {
    flex: 1;
    background: var(--bg-p);
    border: 0.5px solid var(--border-s);
    border-radius: var(--radius-md);
    padding: 0.75rem;
    font-size: 14px; color: var(--text-p);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-restart:hover { background: var(--bg-s); }
  .btn-back {
    background: var(--bg-p);
    border: 0.5px solid var(--border-s);
    border-radius: var(--radius-md);
    padding: 0.75rem 1rem;
    font-size: 14px; color: var(--text-s);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-back:hover { background: var(--bg-s); }
  .tip-card {
    background: var(--gray-50);
    border: 0.5px solid var(--border-t);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .tip-label { font-size: 11px; font-weight: 500; color: var(--gray-600); margin-bottom: 0.5rem; }
  .tip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tip-item {
    font-size: 12px; color: var(--text-s); line-height: 1.5;
    padding: 6px 8px;
    background: var(--bg-p);
    border: 0.5px solid var(--border-t);
    border-radius: var(--radius-md);
  }
  .tip-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle;
  }
  .version-tag {
    font-size: 11px; color: var(--text-t);
    text-align: center;
    padding: 0.5rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo-dot"></div>
    <h1>인삼·약초 병해충 진단 가이드</h1>
  </div>
  <p>증상에 따라 단계별로 선택하면 병해충명과 방제 방법을 안내합니다</p>
  <div class="progress-row">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <span class="progress-label" id="progress-label">시작 전</span>
  </div>
</div>

<div class="crumb-row" id="crumb-row"></div>
<div class="main" id="main"></div>

<script>
const tree = {
  id: "start",
  q: "어느 부위에 증상이 나타납니까?",
  hint: "가장 눈에 띄는 증상 부위를 선택하세요",
  choices: [
    { label: "잎·줄기 (지상부)", sub: "잎 변색, 반점, 시들음, 줄기 썩음", icon:"opt", next: "leaf" },
    { label: "뿌리·지제부 (지하부)", sub: "뿌리 썩음, 표면 이상, 생육 불량", icon:"opt", next: "root" },
    { label: "포장 전체 (피해 범위 넓음)", sub: "여러 포기가 동시에 피해", icon:"opt", next: "field" }
  ]
};

const nodes = {
  start: tree,

  leaf: {
    id:"leaf", q:"잎에 어떤 색깔의 반점·병반이 있습니까?",
    hint: "잎을 뒤집어 뒷면도 확인하세요",
    crumb: "잎·줄기",
    choices: [
      { label: "갈색~암갈색 반점", sub: "물에 젖은 듯한 테두리 있음", icon:"opt", next: "leaf_brown" },
      { label: "흰색~회색 가루 또는 반점", sub: "잎 표면에 밀가루 같은 것이 묻은 듯", icon:"opt", next: "leaf_white" },
      { label: "황색·노란색으로 변색", sub: "잎 전체 또는 잎맥 사이 황변", icon:"opt", next: "leaf_yellow" },
      { label: "검은 반점·그을음 같은 것", sub: "잎 뒷면 또는 표면에 검은 부분", icon:"opt", next: "leaf_black" }
    ]
  },

  leaf_brown: {
    id:"leaf_brown", q:"반점 테두리가 뚜렷한 황색 테두리(halo)가 있습니까?",
    hint: "밝은 빛에 잎을 비춰 테두리 색을 확인하세요",
    crumb: "갈색 반점",
    choices: [
      { label: "예 — 황색 테두리가 뚜렷하다", icon:"yes", next: "r_alternaria" },
      { label: "아니요 — 테두리 없이 번지는 느낌", icon:"no", next: "leaf_brown2" }
    ]
  },

  leaf_brown2: {
    id:"leaf_brown2", q:"줄기 또는 잎자루도 함께 갈변·위축되었습니까?",
    hint: "잎자루 기부(잎이 붙는 부분)를 손으로 눌러 보세요",
    crumb: "테두리 없음",
    choices: [
      { label: "예 — 줄기까지 갈변·물러짐", icon:"yes", next: "r_phytophthora_leaf" },
      { label: "아니요 — 잎에만 국한된 병반", icon:"no", next: "r_cercospora" }
    ]
  },

  leaf_white: {
    id:"leaf_white", q:"흰 가루가 잎 표면에 분포합니까, 아니면 흰 털 같은 곰팡이(균총)입니까?",
    hint: "손가락으로 살짝 문질러보면 분말인지 확인 가능합니다",
    crumb: "흰색·회색",
    choices: [
      { label: "가루 같고 문지르면 묻어남 (흰가루병 의심)", icon:"opt", next: "r_powdery" },
      { label: "솜털 같은 회색 균총, 습한 환경", icon:"opt", next: "r_botrytis" },
      { label: "잎 뒷면에 흰 가루·흰 반점", icon:"opt", next: "r_downy" }
    ]
  },

  leaf_yellow: {
    id:"leaf_yellow", q:"황변이 아래 잎부터 위로 진행됩니까, 아니면 새 잎부터 나타납니까?",
    hint: "황변이 시작된 위치를 확인하세요",
    crumb: "황색 변색",
    choices: [
      { label: "아래 오래된 잎부터 황변 진행", icon:"opt", next: "leaf_yellow_old" },
      { label: "새 잎(상부)부터 황변·왜소화", icon:"opt", next: "r_virus" }
    ]
  },

  leaf_yellow_old: {
    id:"leaf_yellow_old", q:"뿌리를 당겼을 때 쉽게 뽑히거나 뿌리 표면에 이상이 있습니까?",
    hint: "포기를 살짝 당겨 뿌리 상태를 확인하세요",
    crumb: "아래잎 황변",
    choices: [
      { label: "예 — 뿌리가 쉽게 뽑히고 썩은 냄새", icon:"yes", next: "r_cylindrocarpon" },
      { label: "아니요 — 뿌리는 정상, 잎만 황변", icon:"no", next: "r_nutrient" }
    ]
  },

  leaf_black: {
    id:"leaf_black", q:"잎 뒷면에 진딧물·응애류 등 소형 해충이 보입니까?",
    hint: "루페(확대경)로 잎 뒷면을 확인하면 좋습니다",
    crumb: "검은 반점",
    choices: [
      { label: "예 — 작은 벌레·진딧물 확인됨", icon:"yes", next: "r_aphid" },
      { label: "아니요 — 해충 없음, 검은 반점·그을음만", icon:"no", next: "r_sooty" }
    ]
  },

  root: {
    id:"root", q:"뿌리의 어느 부위에 주로 이상이 있습니까?",
    hint: "뿌리 전체를 흙에서 꺼내 관찰하세요",
    crumb: "뿌리·지제부",
    choices: [
      { label: "뿌리 전체가 갈변·부패", sub: "악취, 물러짐", icon:"opt", next: "root_rot" },
      { label: "뿌리 표면에 혹·혹 같은 돌기", sub: "혹의 크기와 위치가 다양", icon:"opt", next: "root_gall" },
      { label: "지제부(뿌리 목 부분)만 썩음", sub: "지표면 경계 부근 갈변", icon:"opt", next: "r_stem_rot" },
      { label: "뿌리 안쪽이 텅 빔·공동 형성", sub: "겉은 멀쩡하나 속이 비어 있음", icon:"opt", next: "r_inner_rot" }
    ]
  },

  root_rot: {
    id:"root_rot", q:"뿌리 부패가 뿌리 끝부터 시작되었습니까, 아니면 전체가 동시에 물러졌습니까?",
    hint: "부패 진행 방향을 관찰하세요",
    crumb: "뿌리 부패",
    choices: [
      { label: "뿌리 끝(세근)부터 갈변 진행", icon:"opt", next: "r_fusarium" },
      { label: "뿌리 전체가 동시에 물러지고 악취", icon:"opt", next: "r_pythium" },
      { label: "부패부에 하얀 균사가 실처럼 보임", icon:"opt", next: "r_white_rot" }
    ]
  },

  root_gall: {
    id:"root_gall", q:"혹이 뿌리 전체에 고르게 분포합니까, 아니면 뿌리 주변 토양에 작은 알 같은 것(선충 알)이 보입니까?",
    hint: "돋보기로 혹 표면과 토양을 관찰하세요",
    crumb: "뿌리 혹",
    choices: [
      { label: "예 — 혹이 많고 크기 다양, 선충 의심", icon:"yes", next: "r_nematode" },
      { label: "아니요 — 혹 하나가 크게 형성됨", icon:"no", next: "r_gall_bacteria" }
    ]
  },

  field: {
    id:"field", q:"피해 포기가 어떤 패턴으로 분포합니까?",
    hint: "포장 전체를 둘러보며 피해 분포를 파악하세요",
    crumb: "포장 전체",
    choices: [

let history = [];
let currentId = "start";

function getProgress() {
  const maxDepth = 5;
  return Math.min(Math.round((history.length / maxDepth) * 100), 95);
}

function buildCrumbs() {
  const row = document.getElementById('crumb-row');
  row.innerHTML = '';
  if (history.length === 0) return;
  history.forEach((id, i) => {
    const node = nodes[id];
    if (!node || !node.crumb) return;
    const span = document.createElement('span');
    span.className = 'crumb';
    if (i > 0) {
      const arrow = document.createElement('span');
      arrow.className = 'crumb-arrow';
      arrow.textContent = '›';
      row.appendChild(arrow);
    }
    span.textContent = node.crumb;
    row.appendChild(span);
  });
}

function setProgress(pct, label) {
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = label;
}

function render(id) {
  currentId = id;
  const node = nodes[id];
  const main = document.getElementById('main');
  main.innerHTML = '';
  buildCrumbs();

  if (!node) { main.innerHTML = '<p style="color:var(--text-s);font-size:14px;padding:1rem">노드를 찾을 수 없습니다.</p>'; return; }

  if (node.type === 'result') {
    setProgress(100, '진단 완료');
    renderResult(node, main);
    return;
  }

  const pct = getProgress();
  setProgress(pct, `${history.length}단계`);

  const card = document.createElement('div');
  card.className = 'question-card';

  const stepEl = document.createElement('div');
  stepEl.className = 'q-step';
  stepEl.textContent = `질문 ${history.length + 1}`;
  card.appendChild(stepEl);

  const qEl = document.createElement('p');
  qEl.className = 'q-text';
  qEl.textContent = node.q;
  card.appendChild(qEl);

  if (node.hint) {
    const hEl = document.createElement('p');
    hEl.className = 'q-hint';
    hEl.textContent = '확인 방법: ' + node.hint;
    card.appendChild(hEl);
  }

  const choices = document.createElement('div');
  choices.className = 'choices';

  node.choices.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';

    const iconEl = document.createElement('div');
    iconEl.className = 'choice-icon ' + ch.icon;
    iconEl.textContent = ch.icon === 'yes' ? '예' : ch.icon === 'no' ? '아니요' : '•';
    btn.appendChild(iconEl);

    const lblWrap = document.createElement('div');
    lblWrap.className = 'choice-label';
    const lblEl = document.createElement('div');
    lblEl.textContent = ch.label;
    lblWrap.appendChild(lblEl);
    if (ch.sub) {
      const subEl = document.createElement('div');
      subEl.className = 'choice-sub';
      subEl.textContent = ch.sub;
      lblWrap.appendChild(subEl);
    }
    btn.appendChild(lblWrap);

    const arrow = document.createElement('span');
    arrow.style.cssText = 'font-size:16px;color:var(--text-t)';
    arrow.textContent = '›';
    btn.appendChild(arrow);

    btn.addEventListener('click', () => {
      history.push(id);
      render(ch.next);
    });
    choices.appendChild(btn);
  });

  card.appendChild(choices);
  main.appendChild(card);

  if (history.length > 0) {
    const backRow = document.createElement('div');
    backRow.className = 'btn-row';
    const backBtn = document.createElement('button');
    backBtn.className = 'btn-back';
    backBtn.innerHTML = '‹ 이전 질문으로';
    backBtn.addEventListener('click', () => {
      currentId = history.pop();
      render(currentId);
    });
    backRow.appendChild(backBtn);
    main.appendChild(backRow);
  }

  renderTips(main);
}

function renderResult(node, main) {
  const card = document.createElement('div');
  card.className = 'result-card';

  const header = document.createElement('div');
  header.className = 'result-header';

  const badge = document.createElement('div');
  badge.className = 'result-badge ' + node.level;
  badge.textContent = node.level === 'danger' ? '즉각 방제 필요' : node.level === 'warning' ? '주의 관찰 필요' : '생리 장해 의심';
  header.appendChild(badge);

  const nameEl = document.createElement('p');
  nameEl.className = 'result-name';
  nameEl.textContent = node.name;
  header.appendChild(nameEl);

  const nameEnEl = document.createElement('p');
  nameEnEl.className = 'result-name-ko';
  nameEnEl.textContent = node.nameEn;
  header.appendChild(nameEnEl);

  card.appendChild(header);

  const body = document.createElement('div');
  body.className = 'result-body';

  const syLabel = document.createElement('div');
  syLabel.className = 'section-label';
  syLabel.textContent = '주요 증상';
  body.appendChild(syLabel);

  const syList = document.createElement('ul');
  syList.className = 'symptom-list';
  node.symptoms.forEach(s => {
    const li = document.createElement('li');
    li.textContent = s;
    syList.appendChild(li);
  });
  body.appendChild(syList);

  const makeRow = (cls, titleTxt, bodyTxt) => {
    const row = document.createElement('div');
    row.className = cls;
    const t = document.createElement('div');
    t.className = cls.split('-')[0] + '-title';
    t.textContent = titleTxt;
    row.appendChild(t);
    const b = document.createElement('div');
    b.className = cls.split('-')[0] + '-body';
    b.textContent = bodyTxt;
    row.appendChild(b);
    return row;
  };

  body.appendChild(makeRow('control-row', '물리적·경종적 방제', node.control_phys));
  body.appendChild(makeRow('chemical-row', '약제 방제', node.control_chem));
  body.appendChild(makeRow('timing-row', '발생 시기 및 특성', node.timing));

  const caution = document.createElement('div');
  caution.className = 'caution-box';
  caution.textContent = '주의사항: ' + node.caution;
  body.appendChild(caution);

  card.appendChild(body);
  main.appendChild(card);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  const restartBtn = document.createElement('button');
  restartBtn.className = 'btn-restart';
  restartBtn.textContent = '처음부터 다시 진단하기';
  restartBtn.addEventListener('click', () => {
    history = [];
    render('start');
  });
  btnRow.appendChild(restartBtn);

  const backBtn = document.createElement('button');
  backBtn.className = 'btn-back';
  backBtn.textContent = '‹ 뒤로';
  backBtn.addEventListener('click', () => {
    currentId = history.pop();
    render(currentId);
  });
  btnRow.appendChild(backBtn);

  main.appendChild(btnRow);

  const ver = document.createElement('div');
  ver.className = 'version-tag';
  ver.textContent = '충남농업기술원 인삼약초연구소 · 병해충 진단 가이드 v1.0';
  main.appendChild(ver);
}

function renderTips(main) {
  const tips = [
    { dot:'#3B6D11', text:'이슬 맺힌 이른 아침 증상 가장 잘 보임' },
    { dot:'#185FA5', text:'잎 뒷면·뿌리 기부 반드시 확인' },
    { dot:'#854F0B', text:'인근 포기도 함께 관찰 (전파 여부)' },
    { dot:'#A32D2D', text:'진단 결과는 방제 참고용 — 심할 경우 연구소 문의' }
  ];
  const card = document.createElement('div');
  card.className = 'tip-card';
  const lbl = document.createElement('div');
  lbl.className = 'tip-label';
  lbl.textContent = '현장 진단 팁';
  card.appendChild(lbl);
  const grid = document.createElement('div');
  grid.className = 'tip-grid';
  tips.forEach(t => {
    const item = document.createElement('div');
    item.className = 'tip-item';
    item.innerHTML = `<span class="tip-dot" style="background:${t.dot}"></span>${t.text}`;
    grid.appendChild(item);
  });
  card.appendChild(grid);
  main.appendChild(card);
}

render('start');
</script>
