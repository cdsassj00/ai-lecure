.tools .primary{background:var(--blue)}

body.present{overflow:hidden;background:#070c13}
.present .deck{padding:0;gap:0}
.present .slide{display:none}
.present .slide.current{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));box-shadow:0 30px 100px rgba(0,0,0,.65)}
body.editing .svg-slide text{cursor:text}
body.editing .svg-slide text:hover{paint-order:stroke;stroke:#93c5fd;stroke-width:4px;stroke-linejoin:round}
@page{size:1280px 720px;margin:0}

<script>
(()=>{
'use strict';

const C = {
  paper: '#f5f3ed',
  white: '#ffffff',
  ink: '#101927',
  body: '#2d3748',
  muted: '#5a6675',
  line: '#cbd3dc',
  navy: '#101927',
  navyLight: '#1c2d48',
  blue: '#2563eb',
  blueSoft: '#e8f0fe',
  blueDark: '#1d4ed8',
  sky: '#dce8ff',
  gold: '#c38424',
  goldSoft: '#fef4e2',
  green: '#227154',
  greenSoft: '#e6f4ea',
  red: '#b54843',
  redSoft: '#fdeeed',
  wine: '#8e5262',
  wineSoft: '#faeef1',
  grayBg: '#eef1f4'
};

const NS = 'http://www.w3.org/2000/svg';
function el(n,a={}){const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a)){if(v!==undefined&&v!==null)e.setAttribute(k,v)}return e}
function R(s,x,y,w,h,f=C.white,st='none',r=0,sw=1){const p={x,y,width:w,height:h,fill:f,stroke:st};if(r)p.rx=r;if(st!=='none')p['stroke-width']=sw;const e=el('rect',p);s.appendChild(e);return e}
function T(s,x,y,txt,cls='',sz=null,extra={}){const p={x,y,class:cls,...extra};if(sz)p['font-size']=sz;const e=el('text',p);e.textContent=txt;s.appendChild(e);return e}
function M(s,x,y,lines,cls='',lh=26,extra={}){
  const t=el('text',{x,y,class:cls,...extra});
  lines.forEach((l,i)=>{
    const sp=el('tspan',{x,dy:i===0?0:lh});
    sp.textContent=l;
    t.appendChild(sp);
  });
  s.appendChild(t);
  return t;
}
function L(s,x1,y1,x2,y2,st=C.line,w=1,da=''){const p={x1,y1,x2,y2,stroke:st,'stroke-width':w};if(da)p['stroke-dasharray']=da;const e=el('line',p);s.appendChild(e);return e}
function CIRC(s,cx,cy,r,f=C.blue,st='none',sw=1){const p={cx,cy,r,fill:f,stroke:st};if(st!=='none')p['stroke-width']=sw;const e=el('circle',p);s.appendChild(e);return e}

function base(s, section, title, sub, page, totalPage=60){
  R(s,0,0,1280,720,C.paper);
  R(s,0,0,1280,44,C.navy);
  T(s,56,27,'SAMSUNG ELECTRONICS · GENERATIVE AI DATA ANALYSIS & VIBE CODING','top');
  T(s,1224,27,'SAMSUNG DS / DX','top',null,{'text-anchor':'end'});
  
  T(s,56,76,section,'eyebrow');
  T(s,56,108,title,'title fit-title');
  if(sub) T(s,56,134,sub,'subtitle');
  
  L(s,56,680,1224,680,C.line,1);
  T(s,56,700,'삼성전자 [AI+] 칼퇴러의 AI 데이터 분석 실무 · 신성진 대표','foot');
  T(s,1224,700,String(page).padStart(2,'0') + ' / ' + String(totalPage).padStart(2,'0'),'foot',null,{'text-anchor':'end'});
}

function anchor(s, msg){
  R(s,56,624,1168,42,C.navy,'none',8);
  T(s,640,650,msg,'',14.5,{fill:'#fff','font-weight':850,'text-anchor':'middle'});
}

function wrapText(text, maxW, sz=14){
  if(!text) return [];
  const words = text.split(' ');
  const lines = [];
  let curLine = '';
  let curW = 0;
  
  const charW = (c) => {
    const code = c.charCodeAt(0);
    if((code >= 0xac00 && code <= 0xd7a3) || (code >= 0x1100 && code <= 0x11ff) || (code >= 0x3130 && code <= 0x318f)) return sz * 1.05;
    if(c === ' ') return sz * 0.35;
    if(/[A-Z]/.test(c)) return sz * 0.65;
    if(/[0-9]/.test(c)) return sz * 0.58;
    return sz * 0.52;
  };
  
  const getStrW = (str) => {
    let w = 0;
    for(let i=0; i<str.length; i++) w += charW(str[i]);
    return w;
  };
  
  for(const word of words){
    const wordW = getStrW(word);
    const spaceW = curLine ? charW(' ') : 0;
    if(curW + spaceW + wordW <= maxW){
      curLine = curLine ? curLine + ' ' + word : word;
      curW += spaceW + wordW;
    } else {
      if(curLine) lines.push(curLine);
      if(wordW > maxW){
        let chunk = '', chunkW = 0;
        for(let i=0; i<word.length; i++){
          const cw = charW(word[i]);
          if(chunkW + cw > maxW){
            lines.push(chunk);
            chunk = word[i];
            chunkW = cw;
          } else {
            chunk += word[i];
            chunkW += cw;
          }
        }
        curLine = chunk;
        curW = chunkW;
      } else {
        curLine = word;
        curW = wordW;
      }
    }
  }
  if(curLine) lines.push(curLine);
  return lines;
}

function W(s, x, y, text, maxW, cls='', sz=14, lh=24, extra={}){
  let lines = [];
  if(Array.isArray(text)){
    text.forEach(t => {
      const wrapped = wrapText(t, maxW, sz);
      lines.push(...wrapped);
    });
  } else {
    lines = wrapText(text, maxW, sz);
  }
  return M(s, x, y, lines, cls, lh, {...extra, 'font-size': sz});
}

  R(s,56,540,1168,76,C.navyLight,'rgba(255,255,255,0.12)',8);
  R(s,76,558,90,38,C.blue,'none',6);
  T(s,121,582,'강사 소개','',13,{fill:'#fff','font-weight':850,'text-anchor':'middle'});
  T(s,182,574,'신성진 대표','',15.5,{fill:'#ffffff','font-weight':900});
  T(s,182,596,'한국데이터사이언티스트협회 대표이사 · 경영지도사 · 前 유한건강생활 경영지원실장','',12.5,{fill:'#94a3b8','font-weight':600});
  
  T(s,1200,582,'SAMSUNG DS / DX 인재개발원','',13,{fill:'#38bdf8','font-weight':800,'text-anchor':'end'});
}

// Presentation & Tooling System
let curSlide = 0;
const slides = () => Array.from(document.querySelectorAll('.slide'));

function enterPresent(idx=0){
  document.body.classList.add('present');
  curSlide = idx;
  showSlide(curSlide);
  resizePresent();
}
function exitPresent(){
  document.body.classList.remove('present');
  slides().forEach(s=>s.classList.remove('current'));
}
function showSlide(idx){
  const sls = slides();
  if (idx < 0) idx = 0;
  if (idx >= sls.length) idx = sls.length - 1;
  curSlide = idx;
  sls.forEach((s,i)=>s.classList.toggle('current', i === curSlide));
}
function resizePresent(){
  if (!document.body.classList.contains('present')) return;
  const sx = window.innerWidth / 1280;
  const sy = window.innerHeight / 720;
  document.documentElement.style.setProperty('--scale', Math.min(sx, sy) * 0.95);
}

window.addEventListener('resize', resizePresent);
window.addEventListener('keydown', (e)=>{
  if (e.key === 'p' || e.key === 'P'){
    if (document.body.classList.contains('present')) exitPresent();
    else enterPresent(0);
  } else if (e.key === 'Escape'){
    exitPresent();
  } else if (document.body.classList.contains('present')){
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') showSlide(curSlide + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') showSlide(curSlide - 1);
    else if (e.key === 'Home') showSlide(0);
    else if (e.key === 'End') showSlide(slides().length - 1);
  }
});
