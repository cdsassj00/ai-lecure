<!doctype html>
<html lang="ko">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사업자등록신청서 입력 양식</title>
<style>
  @page {
    size: A4 portrait;
    margin: 0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #e9e9e9;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    background: #222;
    color: #fff;
    font-size: 13px;
  }
  .toolbar button {
    border: 1px solid #777;
    border-radius: 6px;
    background: #fff;
    color: #111;
    padding: 7px 12px;
    cursor: pointer;
    font-weight: 700;
  }
  .toolbar .hint {
    opacity: .9;
    margin-left: 8px;
  }
  .sheet-wrap {
    width: fit-content;
    margin: 18px auto;
    padding: 10px;
    background: #fff;
    box-shadow: 0 8px 30px rgba(0,0,0,.22);
  }
  .sheet {
    position: relative;
    width: 210mm;
    height: 297mm;
    overflow: hidden;
    background: #fff;
  }
  .template {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .field {
    position: absolute;
    z-index: 2;
    padding: 0.4mm 0.7mm;
    line-height: 1.25;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-all;
    background: rgba(255,255,255,0);
    color: #000;
    outline: none;
    border: 0;
    font-weight: 500;
  }
  .field:hover {
    outline: 1px dashed rgba(0, 91, 255, .45);
    background: rgba(230, 242, 255, .22);
  }
  .field:focus {
    outline: 1.5px solid rgba(0, 91, 255, .85);
    background: rgba(255, 255, 210, .35);
  }
  .vertical {
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
  .chk {
    position: absolute;
    z-index: 3;
    margin: 0;
    padding: 0;
    accent-color: #111;
    opacity: .95;
    transform: scale(.75);
    transform-origin: left top;
  }
  @media print {
    body { background: #fff; }
    .toolbar { display: none !important; }
    .sheet-wrap {
      margin: 0;
      padding: 0;
      box-shadow: none;
    }
    .sheet {
      width: 210mm;
      height: 297mm;
    }
    .field, .field:hover, .field:focus {
      outline: none !important;
      background: transparent !important;
    }
    .chk {
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">인쇄 / PDF 저장</button>
    <button onclick="clearForm()">입력값 지우기</button>

<script>
(function() {
  const KEY = "business_registration_form_editable_v1";
  const fields = Array.from(document.querySelectorAll("[data-id]"));

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
      fields.forEach(el => {
        const id = el.dataset.id;
        if (!(id in saved)) return;
        if (el.type === "checkbox") el.checked = !!saved[id];
        else el.textContent = saved[id];
      });
    } catch(e) {}
  }

  function save() {
    const data = {};
    fields.forEach(el => {
      const id = el.dataset.id;
      data[id] = el.type === "checkbox" ? el.checked : el.textContent;
    });
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  fields.forEach(el => {
    el.addEventListener("input", save);
    el.addEventListener("change", save);
    el.addEventListener("paste", function(e) {
      if (el.type === "checkbox") return;
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, text);
    });
  });

  window.clearForm = function() {
    if (!confirm("현재 입력값을 모두 지울까요?")) return;
    fields.forEach(el => {
      if (el.type === "checkbox") el.checked = false;
      else el.textContent = "";
    });
    localStorage.removeItem(KEY);
  };

  load();
})();
</script>
