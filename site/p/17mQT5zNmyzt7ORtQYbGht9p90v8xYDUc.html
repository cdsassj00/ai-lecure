.slide{width:1280px;height:720px;flex:none;background:var(--paper);box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:4px;overflow:hidden;position:relative}

.svg-slide .mono{font-family:'D2Coding',Consolas,monospace}
.tools{position:fixed;right:20px;bottom:18px;z-index:999;display:flex;gap:8px;background:rgba(16,25,39,0.85);backdrop-filter:blur(8px);padding:8px 12px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.tools button{border:0;border-radius:20px;padding:8px 16px;background:rgba(255,255,255,0.12);color:#fff;font:800 12.5px inherit;cursor:pointer;transition:all .15s}
.tools button:hover{background:rgba(255,255,255,0.25);transform:translateY(-1px)}
.tools .primary{background:var(--blue)}
.tools .primary:hover{background:#1d4ed8}
body.present{overflow:hidden;background:#070c13}
.present .deck{padding:0;gap:0}
.present .slide{display:none}
.present .slide.current{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));box-shadow:0 30px 100px rgba(0,0,0,.65)}
body.editing .svg-slide text{cursor:text}
body.editing .svg-slide text:hover{paint-order:stroke;stroke:#93c5fd;stroke-width:4px;stroke-linejoin:round}
@page{size:1280px 720px;margin:0}
@media print{
  html,body{background:#fff}
  .deck{padding:0;gap:0}
  .slide{box-shadow:none;break-after:page;page-break-after:always;border-radius:0}
  .tools{display:none!important}
}

const NS = 'http://www.w3.org/2000/svg';
function el(n,a={}){const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a)){if(v!==undefined&&v!==null)e.setAttribute(k,v)}return e}
function R(s,x,y,w,h,f=C.white,st='none',r=0,sw=1){const p={x,y,width:w,height:h,fill:f,stroke:st};if(r)p.rx=r;if(st!=='none')p['stroke-width']=sw;const e=el('rect',p);s.appendChild(e);return e}

function M(s,x,y,lines,cls='',lh=20,extra={}){
  const t=el('text',{x,y,class:cls,...extra});
  lines.forEach((l,i)=>{
    const sp=el('tspan',{x,dy:i===0?0:lh});
    sp.textContent=l;
    t.appendChild(sp);
  });

function L(s,x1,y1,x2,y2,st=C.line,w=1,da=''){const p={x1,y1,x2,y2,stroke:st,'stroke-width':w};if(da)p['stroke-dasharray']=da;const e=el('line',p);s.appendChild(e);return e}

    while(t.getComputedTextLength()>1160&&size>19){
      size-=0.5;
      t.setAttribute('font-size',size);
    }
  });
}

renderDeck();

const slides=[...document.querySelectorAll('.slide')];
let editing=false, present=false, current=0;

const bar=document.createElement('div');
bar.className='tools';
bar.innerHTML='<button data-a="edit">✏ SVG 편집</button><button data-a="save">↓ HTML 저장</button><button data-a="pdf">📄 PDF</button><button class="primary" data-a="play">▶ 발표</button>';
document.body.appendChild(bar);

document.addEventListener('dblclick',e=>{
  if(!editing||!e.target.closest('svg')||!['text','tspan'].includes(e.target.tagName.toLowerCase()))return;
  const old=e.target.textContent;
  const n=prompt('SVG 텍스트 수정',old);
  if(n!==null){
    e.target.textContent=n;
    fitTitles();
  }
});

function setEdit(v){
  editing=v;
  document.body.classList.toggle('editing',v);
  bar.querySelector('[data-a=edit]').style.background=v?C.green:'';
}

function save(){
  setEdit(false);
  const clone=document.documentElement.cloneNode(true);
  clone.querySelectorAll('.tools').forEach(e=>e.remove());
  clone.querySelector('body').removeAttribute('class');
  clone.querySelectorAll('.slide').forEach(s=>{
    s.classList.remove('current');
    s.style.removeProperty('--scale');
    s.style.removeProperty('display');
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}));
  a.download='삼성전자_AI데이터분석_실무_강의안_35장_SVG.html';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function fit(){
  const sc=Math.min(innerWidth/1280,innerHeight/720);
  slides.forEach(s=>s.style.setProperty('--scale',sc));
}

function show(n){
  current=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('current',i===current));
}

function enter(){
  setEdit(false);
  present=true;
  document.body.classList.add('present');
  fit();
  show(current);
}

function exit(){
  present=false;
  document.body.classList.remove('present');
  slides.forEach(s=>s.classList.remove('current'));
}

bar.addEventListener('click',e=>{
  const a=e.target.closest('button')?.dataset.a;
  if(a==='edit')setEdit(!editing);
  if(a==='save')save();
  if(a==='pdf'){setEdit(false);print();}
  if(a==='play')enter();
});

addEventListener('resize',()=>{
  fitTitles();
  if(present)fit();
});

addEventListener('keydown',e=>{
  if((e.key==='p'||e.key==='P')&&!editing){
    present?exit():enter();
    return;
  }
  if(!present)return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){
    e.preventDefault();
    show(current+1);
  }
  if(['ArrowLeft','PageUp'].includes(e.key)){
    e.preventDefault();
    show(current-1);
  }
  if(e.key==='Home')show(0);
  if(e.key==='End')show(slides.length-1);
  if(e.key==='Escape')exit();
});

const shot=Number(new URLSearchParams(location.search).get('slide'));
if(shot){
  slides.forEach((s,i)=>{if(i!==shot-1)s.style.display='none'});
  document.querySelector('.deck').style.padding='0';
  bar.style.display='none';
}
})();
</script>
