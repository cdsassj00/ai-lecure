<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0a0a0a;
    --card-bg: #ffffff;
    --text: #111;
    --muted: #888;
    --border: #2a2a2a;
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: #e5e5e5;
    font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, sans-serif;
    min-height: 100vh;
  }
  body {
    padding: 40px 20px 80px;
  }

  /* TOP BAR */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 48px;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
    font-size: 13px;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar-title {
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
  }
  .topbar-sub {
    color: var(--muted);
    letter-spacing: 1px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar button {
    background: transparent;
    border: 1px solid #333;
    color: #ccc;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .topbar button:hover {
    background: #222;
    color: #fff;
    border-color: #555;
  }
  .topbar .counter {
    color: #aaa;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }

  /* STAGE */
  .stage {
    max-width: 1600px;
    margin: 60px auto 0;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  /* SLIDE CARD */
  .slide {
    background: var(--card-bg);
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    position: relative;
  }
  .slide svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .slide::after {
    content: attr(data-index) " / 19";
    position: absolute;
    top: 12px;
    right: 16px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 4px 10px;
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 700;
    border-radius: 2px;
    z-index: 10;
    pointer-events: none;
    opacity: 0.4;
    transition: opacity 0.15s;
  }
  .slide:hover::after {
    opacity: 1;
  }

  /* PER-SLIDE DOWNLOAD BUTTON (injected by JS) */
  .slide-dl {
    position: absolute;
    top: 12px;
    left: 16px;
    z-index: 11;
    background: rgba(0,0,0,0.82);
    color: #fff;
    border: none;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 2px;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s;
  }
  .slide:hover .slide-dl { opacity: 1; }
  .slide-dl:hover { background: #fff; color: #111; }
  .slide-dl.done { background: #f0e6cc; color: #111; }

  /* Make sure slide is position:relative so absolute children anchor correctly */
  /* (already has position via ::after, but set explicitly for JS-injected child) */

  /* PRESENTATION MODE (single slide view) */
  body.mode-single .stage {
    display: block;
    margin-top: 60px;
  }
  body.mode-single .slide {
    display: none;
    margin: 0 auto;
  }
  body.mode-single .slide.active {
    display: block;
  }

  /* HELP */
  .help {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: #555;
    font-size: 11px;
    letter-spacing: 1px;
    line-height: 1.6;
    background: rgba(20,20,20,0.6);
    padding: 10px 14px;
    border-radius: 3px;
    border: 1px solid #222;
    max-width: 280px;
  }
  .help strong { color: #999; }

  /* PRINT */
  @media print {
    body { background: #fff; padding: 0; }
    .topbar, .help { display: none !important; }
    .stage { margin: 0; gap: 0; max-width: none; }
    .slide {
      box-shadow: none;
      border-radius: 0;
      page-break-after: always;
      break-after: page;
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
    }
    .slide::after { display: none; }
  }

  /* MOBILE — keep readable */
  @media (max-width: 1000px) {
    body { padding: 30px 10px 60px; }
    .stage { gap: 20px; margin-top: 55px; }
    .help { display: none; }
  }
</style>

<script>
  const body = document.body;
  const slides = Array.from(document.querySelectorAll('.slide'));
  const total = slides.length;
  const counter = document.getElementById('counter');
  const modeBtn = document.getElementById('mode-toggle');
  const printBtn = document.getElementById('print-btn');

  let currentIndex = 0;
  let mode = 'scroll'; // 'scroll' | 'single'

  function updateCounter() {
    if (mode === 'single') {
      counter.textContent = String(currentIndex + 1).padStart(3, '0') + ' / ' + String(total).padStart(3, '0');
    } else {
      counter.textContent = total + ' 슬라이드';
    }
  }

  function setMode(newMode) {
    mode = newMode;
    if (mode === 'single') {
      body.classList.add('mode-single');
      body.classList.remove('mode-scroll');
      modeBtn.textContent = 'SCROLL MODE';
      showSlide(currentIndex);
    } else {
      body.classList.remove('mode-single');
      body.classList.add('mode-scroll');
      modeBtn.textContent = 'PRESENT MODE';
      slides.forEach(s => s.classList.remove('active'));
    }
    updateCounter();
  }

  function showSlide(i) {
    currentIndex = Math.max(0, Math.min(total - 1, i));
    slides.forEach((s, idx) => {
      s.classList.toggle('active', idx === currentIndex);
    });
    updateCounter();
  }

  modeBtn.addEventListener('click', () => {
    setMode(mode === 'scroll' ? 'single' : 'scroll');
  });

  printBtn.addEventListener('click', () => {
    window.print();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P') {
      setMode(mode === 'scroll' ? 'single' : 'scroll');
      e.preventDefault();
      return;
    }
    if (e.key === 'Escape') {
      if (mode === 'single') setMode('scroll');
      return;
    }
    if (mode !== 'single') return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      showSlide(currentIndex + 1);
      e.preventDefault();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      showSlide(currentIndex - 1);
      e.preventDefault();
    } else if (e.key === 'Home') {
      showSlide(0);
    } else if (e.key === 'End') {
      showSlide(total - 1);
    }
  });

  // Click on slide in single mode advances
  slides.forEach((s, idx) => {
    s.addEventListener('click', (e) => {
      if (mode === 'single') {
        const rect = s.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x > rect.width / 2) showSlide(currentIndex + 1);
        else showSlide(currentIndex - 1);
      }
    });
  });

  updateCounter();

  /* ==========================================================
   * SVG DOWNLOAD FUNCTIONALITY
   * ========================================================== */

  // 각 슬라이드 번호 → 파트/섹션 이름 (파일명용)
  const SLIDE_NAMES = {
    1:  'cover',
    2:  'course_map',
    3:  'why_ai_now',
    4:  'ai_evolution_4_stages',
    5:  'ml_vs_dl',
    6:  'llm_principles',
    7:  'llm_trends_12',
    8:  'llm_services_compared',
    9:  'prompting_24_principles',
    10: 'thinking_frameworks',
    11: 'llm_work_map',
    12: 'document_14_tips',
    13: 'deep_research_compared',
    14: 'market_sizing_tam_sam_som',
    15: 'data_analysis_20_tips',
    16: 'image_video_15_tips',
    17: 'excel_automation_20_tips',
    18: 'core_competencies_4',
    19: 'wrap_up'
  };

  // 단일 슬라이드에서 SVG 문자열을 추출하고 DOCTYPE 헤더 추가
  function extractSvgString(slideEl) {
    const svg = slideEl.querySelector('svg');
    if (!svg) return null;

    // 클론해서 원본은 건드리지 않음
    const clone = svg.cloneNode(true);

    // xmlns 보장 (브라우저에 따라 outerHTML에서 누락될 수 있음)
    if (!clone.getAttribute('xmlns')) {
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    }
    if (!clone.getAttribute('xmlns:xlink')) {
      clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    }

    // XMLSerializer로 안전하게 직렬화
    const serializer = new XMLSerializer();
    const svgStr = serializer.serializeToString(clone);

    return '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n' + svgStr;
  }

  // 개별 슬라이드를 파일로 저장
  function downloadSlide(slideEl) {
    const idx = parseInt(slideEl.getAttribute('data-index'), 10);
    const svgStr = extractSvgString(slideEl);
    if (!svgStr) return;

    const name = SLIDE_NAMES[idx] || ('slide_' + String(idx).padStart(3, '0'));
    const filename = 'Module01_' + String(idx).padStart(2, '0') + '_' + name + '.svg';

    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 100);
  }

  // 각 슬라이드에 DOWNLOAD 버튼 주입
  slides.forEach((slideEl, idx) => {
    const btn = document.createElement('button');
    btn.className = 'slide-dl';
    btn.type = 'button';
    btn.textContent = '↓ SVG 저장';
    btn.title = '이 슬라이드를 SVG로 저장';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();            // single 모드에서 슬라이드 클릭 네비 방지
      e.preventDefault();
      downloadSlide(slideEl);
      btn.textContent = '✓ 저장됨';
      btn.classList.add('done');
      setTimeout(() => {
        btn.textContent = '↓ SVG 저장';
        btn.classList.remove('done');
      }, 1500);
    });
    slideEl.appendChild(btn);
  });

  // 툴바 버튼: 현재 슬라이드 / 전체 ZIP
  const dlOneBtn = document.getElementById('download-one');
  const dlAllBtn = document.getElementById('download-all');

  dlOneBtn.addEventListener('click', () => {
    // single 모드에서는 현재 슬라이드, scroll 모드에서는 첫 번째 슬라이드
    const target = mode === 'single' ? slides[currentIndex] : slides[0];
    downloadSlide(target);
    flashBtn(dlOneBtn, 'SAVED ✓');
  });

  dlAllBtn.addEventListener('click', async () => {
    if (typeof JSZip === 'undefined') {
      alert('ZIP 라이브러리가 로드되지 않았음. 네트워크 상태를 확인해 주시기 바람.');
      return;
    }
    dlAllBtn.disabled = true;
    const originalText = dlAllBtn.textContent;
    dlAllBtn.textContent = 'ZIPPING...';

    try {
      const zip = new JSZip();
      const folder = zip.folder('Module01_AI리터러시와업무활용_SVG');

      slides.forEach((slideEl, idx) => {
        const i = idx + 1;
        const svgStr = extractSvgString(slideEl);
        if (!svgStr) return;
        const name = SLIDE_NAMES[i] || ('slide_' + String(i).padStart(3, '0'));
        const filename = String(i).padStart(2, '0') + '_' + name + '.svg';
        folder.file(filename, svgStr);
      });

      // README 포함
      const readme = [
        'Module 01 · AI 리터러시와 업무활용 — 강의안 슬라이드 SVG 모음',
        '',
        '파일: 19개 SVG (01_cover.svg ~ 19_wrap_up.svg)',
        '비율: 16:9 (viewBox 0 0 1600 900)',
        '폰트: Pretendard / Noto Sans KR (로컬 설치 또는 웹폰트 필요)',
        '',
        'PowerPoint, Keynote, Figma, Illustrator 등에 개별 삽입 또는 일괄 가져오기 가능함.',
        '생성일: ' + new Date().toISOString().split('T')[0]
      ].join('\n');
      folder.file('README.txt', readme);

      const content = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Module01_AI리터러시와업무활용_SVG.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 100);

      dlAllBtn.textContent = 'SAVED ✓';
      setTimeout(() => {
        dlAllBtn.textContent = originalText;
        dlAllBtn.disabled = false;
      }, 1500);
    } catch (err) {
      console.error(err);
      alert('ZIP 생성 중 오류가 발생함: ' + err.message);
      dlAllBtn.textContent = originalText;
      dlAllBtn.disabled = false;
    }
  });

  function flashBtn(btn, msg) {
    const original = btn.textContent;
    btn.textContent = msg;
    setTimeout(() => { btn.textContent = original; }, 1500);
  }

  // 키보드 단축키 확장: D = 현재 SVG 다운로드
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'd' || e.key === 'D') {
      const target = mode === 'single' ? slides[currentIndex] : slides[0];
      downloadSlide(target);
      e.preventDefault();
    }
  });
</script>
