<script>
const docs=[{"id": 0, "file": "260520_중앙재난안전대책본부첫가동.md", "title": "올여름 호우에 따른 중앙재난안전대책본부 첫 가동", "dept": "자연재난대응과", "date": "2026.05.20", "raw": "<!-- 부서: 자연재난대응과 | 코드: 260520 | 원본PDF: 260520 (즉시) 올여름 호우에 따른 중앙재난안전대책본부 첫 가동(자연재난대응과).pdf -->\n\n보도자료\n\n보도시점 (인터넷, 지면) 2026. 5. 20.(수) 즉시보도\n\n올여름  호우에  따른\n중앙재난안전대책본부  첫  가동\n\n  행정안전부(장관  윤호중)는  인천·경기(17시  예정),  전남(15시50분),  경남\n\n(14시20분)에  호우주의보가  발표됨에  따라  선제적  대응을  위해  5월  20일\n\n(수)  16시30분  부로  중앙재난안전대책본부  1단계를  가동했다고  밝혔다.\n\n  윤호중  중앙재난안전대책본부장은  중대본  가동에  따라  다음  사항을  지시\n\n했다.\n\n<  중앙재난안전대책본부장  지시사항  >\n\n▷ 지역별 비상대응체계를 철저히 구축하고 상황 관리에 빈틈이 없도록 할 것\n\n▷  지방정부·경찰·소방  등  관계기관  간  위험  정보를  실시간으로  공유하고,\n\n위험 우려 시에는 공동으로 대응하는 등 협조 체계를 공고히 할 것\n\n▷ 산사태 우려지역, 하천변, 반지하주택·지하차도 등 취약지역에 대한 예찰과\n\n사전통제를 강화하고, 필요시 주민대피를 선제적으로 실시할 것\n\n▷ 거동이 불편한 어르신 등 안전취약계층에 대한 보호·대피체계를 점검하고,\n\n필요시 주민대피지원단과 협력하여 신속한 대피를 지원할 것\n\n▷ 재난문자·마을방송 등 가용한 모든 매체를 활용하여 기상정보·통제 상황을\n\n안내하고 외출 자제, 취약지역 접근 금지 등 국민행동요령을 적극 홍보할 것\n\n▷ 위급 상황 시에는 인명구조를 최우선으로 하고, 현장 대응 인력의 안전관리에도\n\n만전을 기할 것\n\n  아울러,  국민께서도  기상정보와  재난문자  등  당국의  안내를  수시로  확인하\n\n고,  하천변·지하차도  등  위험지역  접근을  자제하는  등  안전에  각별히  유의\n\n해  주실  것을  당부했다.\n\n-  1  -\n\n\f담당 부서\n\n자연재난실\n자연재난대응과\n\n책임자\n\n담당자\n\n담당자\n\n과  장\n\n신일철 (044-205-5230)\n\n서기관\n\n사무관\n\n현종일 (044-205-5234)\n\n전혜숙 (044-205-5231)\n\n-  2  -\n\n\f참  고   국민행동요령\n\n-  3  -\n\n\f-  4  -\n\n\f-  5  -\n\n\f-  6  -\n\n\f-  7  -\n\n"}, {"id": 1, "file": "260522a_폭염취약계층지원점검.md", "title": "폭염 취약계층 보호를 위한 정부 지원대책 점검", "dept": "기후재난관리과", "date": "2026.05.22", "raw": "<!-- 부서: 기후재난관리과 | 코드: 260522a | 원본PDF: 260522 (16시) 폭염 취약계층 지원대책 점검회의 개최(기후재난관리과).pdf -->\n\n보도자료\n|     |     |     |       |     |       |     | 보도시점 |     | (온라인, 지면) 2026. 5. 22.(금) 16:00 |     |     |     |     |     |\n| --- | --- | --- | ----- | --- | ----- | --- | ---- | --- | ------------------------------- | --- | --- | --- | --- | --- |\n|     | 폭염  |     | 취약계층  |     |       |     | 보호를  |     |                                 | 위한  | 정부  |     |     |     |\n|     |     |     |       |     | 지원대책  |     |      | 점검  |                                 |     |     |     |     |     |\n- 폭염 취약계층 안전관리 강화를 위한 관계기관 점검회의 개최(5.22.)\n- 쪽방촌 주민, 독거노인, 옥외노동자 등 폭염 취약계층 현장점검 및 지원대책 논의\n|   행정안전부(장관  |     |     | 윤호중)는  |     |     | 올여름  | 폭염  |     | 취약계층  |     | 안전관리를  |     | 강화하기  |     |\n| ----------- | --- | --- | ------ | --- | --- | ---- | --- | --- | ----- | --- | ------ | --- | ----- | --- |\n위해 5월 22일(금) 관계기관 점검회의*를 개최했다.\n  * 참석기관: 중앙부처(행정안전부·보건복지부·기후에너지환경부·고용노동부·기상청), 17개 시도\n 최근 때이른 폭염으로 온열질환 사망자가 발생(5.16.)함에 따라, 지난 20\n| 일(수)  | 국무회의에서  |     |     | 대통령은  |     | 폭염  | 취약계층에  |     |     | 대한  | 현장점검과  |     | 지원  | 대   |\n| ----- | ------- | --- | --- | ----- | --- | --- | ------ | --- | --- | --- | ------ | --- | --- | --- |\n책 추진을 강조했다.\n|  이에  | 따라,    | 이날  | 회의에서는  |     |     | 폭염  | 피해   | 예방을    |     | 위해  | 기관별로  |      | 추진하고  |     |\n| ---- | ------ | --- | ------ | --- | --- | --- | ---- | ------ | --- | --- | ----- | ---- | ----- | --- |\n| 있는   | 현장점검과  |     | 취약계층   |     |     | 지원  | 대책을  | 점검하고,  |     | 추진  | 중인    | 대책을  |       | 더욱  |\n강화하는 방안을 집중 논의했다.\n|  행정안전부는  |         |     | 기관  | 간     | 소통    | 체계를     | 긴밀히  |        | 유지하며,  |        | 무더위쉼터와   |     |        | 폭염  |\n| -------- | ------- | --- | --- | ----- | ----- | ------- | ---- | ------ | ------ | ------ | -------- | --- | ------ | --- |\n| 취약       | 분야      | 대책  | 추진  | 상황을   |       | 주기적으로   |      | 점검한다.  |        | 특히,    | 쪽방주민·독거노 |     |        |     |\n| 인  등     | 보호를     | 위해  |     | 노후    | 냉방기기  |         | 점검과  |        | 건강관리   |        | 지원       | 등을  | 강화하고,  |     |\n| 소규모      | 취약사업장을  |     |     | 중심으로  |       | 이동식에어컨  |      |        | 등      | 재정지원과  |          | 함께  | 현장에    |     |\n서 폭염 안전수칙*이 준수되고 있는지 여부를 집중 점검할 예정이다.\n  * 충분한 물과 휴식, 보냉장구 제공, 폭염 시 작업 중지 등\n|  김용균  | 자연재난실장은  |     |     |     | “정부가  |     | 얼마나  | 정성과  |     | 노력을  | 기울이느냐에  |     |     | 따   |\n| ----- | -------- | --- | --- | --- | ----- | --- | ---- | ---- | --- | ---- | ------- | --- | --- | --- |\n라 폭염으로 인한 인명 피해를 막을 수 있는 만큼, 쪽방주민, 독거노인, 옥\n| 외  노동자  |     | 등  취약계층  |     |     | 보호  | 대책이  | 현장에서  |     |     | 철저히  | 이행되도록  |     | 행정력 |     |\n| ------- | --- | -------- | --- | --- | --- | ---- | ----- | --- | --- | ---- | ------ | --- | --- | --- |\n을 집중하겠다”라고 밝혔다.\n- 1 -\n\n| 담당 부서 | 행정안전부   | 책임자 | 과  장 | 김진희 | (044-205-6360) |\n| ----- | ------- | --- | ---- | --- | -------------- |\n|       | 기후재난관리과 | 담당자 | 사무관  | 조호명 | (044-205-6364) |\n- 2 -"}, {"id": 2, "file": "260522b_캠핑화재안전.md", "title": "즐거운 캠핑, 화재 안전에 유의하세요!", "dept": "예방안전제도과", "date": "2026.05.22", "raw": "<!-- 부서: 예방안전제도과 | 코드: 260522b | 원본PDF: 260522 (조간) 즐거운 캠핑 화재 안전에 유의하세요!(예방안전제도과).pdf -->\n\n보도자료\n(온라인) 2026. 5. 21.(목) 12:00\n보도시점\n(지  면) 2026. 5. 22.(금) 조 간\n|     | 즐거운  |     | 캠핑,  |     |     | 화재  |     | 안전에  |     | 유의하세요! |     |     |     |     |\n| --- | ---- | --- | ---- | --- | --- | --- | --- | ---- | --- | ------ | --- | --- | --- | --- |\n- 텐트 안 화기 사용 자제 및 바비큐・모닥불 후 잔불 정리 철저\n- 취침 시에는 침낭이나 보온물주머니 등을 활용하여 체온 유지\n|     | 연중  | 5월은   | 여름  | 휴가철을  |      |     | 제외하고  |     | 캠핑객이    | 가장   | 많은   | 시기로,  |       | 화재  |\n| --- | --- | ----- | --- | ----- | ---- | --- | ----- | --- | ------- | ---- | ---- | ----- | ----- | --- |\n| 등   | 각종  | 안전사고  |     | 발생    | 위험이  |     | 크다.   |     | 최근  강원  | 양양의  | 캠핑장  |       | 텐트에서  |     |\n불이 나 연기를 마시고 병원치료를 받는 사고(’26.5.9.)도 있었다.\n|  이에, 행정안전부(장관 윤호중)는  |     |     |     |     |     |     |     | 캠핑 시 발생하기 쉬운 화재 등  |     |     |     |     |     | 안전사 |\n| -------------------- | --- | --- | --- | --- | --- | --- | --- | ------------------ | --- | --- | --- | --- | --- | --- |\n고 예방에 각별한 주의를 당부했다.\n<2020~2024년 월별 야영(캠핑) 이용 현황 >\n                                                           (단위: 천박)\n[출처: 2024 숙박시설유형별 이용총량, 문화체육관광부]\n|  캠핑장에서의  |             |     | 주요  | 활동을        |     | 살펴보면  |       |     | 바비큐(38.0%),  |      | 요리(19.8%),  |     |     | 모닥  |\n| -------- | ----------- | --- | --- | ---------- | --- | ----- | ----- | --- | ------------ | ---- | ----------- | --- | --- | --- |\n| 불        | 놀이(17.6%),  |     |     | 휴식(15.6%)  |     |       | 등으로,  |     | 캠핑장          | 활동의  | 대부분이        |     | 불을  | 이용  |\n하는 만큼 화재 안전에 주의가 필요하다.\n기 타\n|     |     |     |     |     |     |     | 모닥불 |     |     |     | 걷 기 |     |     |     |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n|     | 구 분 |     | 바비큐 |     | 요 리 |     |     |     | 휴 식 | 수 영 |     |     |     |     |\n(등산,낚시\n|     |     |     |     |     |     |     | 놀 이 |     |     |     | 하이킹 |     |     |     |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n등)\n캠핑장에서 많이\n|     |     |     | 38.0 |     | 19.8 |     | 17.6 |     | 15.6 | 2.6 | 2.4 |     |     | 4.0 |\n| --- | --- | --- | ---- | --- | ---- | --- | ---- | --- | ---- | --- | --- | --- | --- | --- |\n하는 활동(%)\n[출처: 2024 기준 캠핑이용자 실태조사, 한국관광공사]\n- 1 -\n\n|  최근  | 5년간(2021~2025년)  |     |     |     | 봄철에  | 발생한  | 캠핑장  | 화재는  |     | 80건으로  | 화기  |\n| ---- | ---------------- | --- | --- | --- | ---- | ---- | ---- | ---- | --- | ------ | --- |\n사용이 많은 겨울철(82건)과 비슷한 수준이다. 원인별로는 불씨 방치나 조\n| 리  중  | 부주의가  |     | 58%(46건)로  |     |     | 가장  많았고,  | 접촉불량  |     |     | 등  전기적  | 요인  |\n| ----- | ----- | --- | ---------- | --- | --- | --------- | ----- | --- | --- | ------- | --- |\n16%(13건), 과열 등으로 인한 기계적 요인(5%, 4건)이 뒤를 이었다.\n                    <2021~2025년 캠핑장 화재 현황)>\n             (단위:건)\n|     |     | <화재 건수> |     |     |     |     |     | <원인별> |     |     |     |\n| --- | --- | ------- | --- | --- | --- | --- | --- | ----- | --- | --- | --- |\n                                                                                [제공, 소방청]\n 캠핑장 화재를 예방하기 위해서는 다음 수칙을 잘 지킨다.\n|  캠핑장에서는  |     |     | 대피소  | 등   | 주변  | 시설  배치,  | 소화  | 기구  | 위치,  | 이용자  | 안전  |\n| -------- | --- | --- | ---- | --- | --- | -------- | --- | --- | ---- | ---- | --- |\n수칙을 미리 확인한다.\n|  전기  | 연장선을  |     | 사용할  | 때는    | 선을  | 끝까지    | 풀어서  | 사용한다.  |      | 전선이  | 감겨  |\n| ---- | ----- | --- | ---- | ----- | --- | ------ | ---- | ------ | ---- | ---- | --- |\n| 있는   | 상태로   | 오랜  | 시간   | 사용하면  |     | 과열되거나  | 전선의  |        | 피복이  | 손상돼  | 화재  |\n위험이 크다.\n 하나의 콘센트에 여러 전기 제품을 연결해 사용하지 않도록 주의하고, 특\n히 전원 플러그와 콘센트가 물기에 노출되지 않도록 주의한다.\n|  모닥불을  |     | 피울  | 땐  화로를  |     | 사용하고,  | 주변  | 바닥에  | 물을  |     | 뿌려  화재를  | 예방  |\n| ------ | --- | --- | ------- | --- | ------ | --- | ---- | --- | --- | -------- | --- |\n한다. 모닥불을 피운 후에는 잔불이 남지 않도록 확실히 정리한다.\n|  밀폐된  | 텐트  | 안에서  |     | 숯이나  | 난로를 사용하는  |     | 것은  | 화재뿐만 아니라  |     |     | 질식  |\n| ----- | --- | ---- | --- | ---- | --------- | --- | --- | --------- | --- | --- | --- |\n등 사고 위험이 크다. 잠을 잘 때는 침낭 등 보온용품을 활용해 체온을 유\n지한다.\n- 2 -\n\n|  하종목  | 예방정책국장은  |     | “안전하고  |     | 즐거운  | 캠핑을  | 위해,  캠핑장에서  |     | 바비  |\n| ----- | -------- | --- | ------ | --- | ---- | ---- | ----------- | --- | --- |\n큐나 모닥물 놀이를 할 경우에는 주변 소화기 위치를 꼭 확인하고, 자리를\n| 정리할  | 때는  마지막  | 불씨까지  |     | 철저히  | 확인하는  |     | 등  안전수칙을  | 잘   | 지켜서  |\n| ---- | -------- | ----- | --- | ---- | ----- | --- | --------- | --- | ---- |\n안전하고 즐거운 캠핑 되시길 바란다”라고 말했다.\n| 총 괄 |     | 행정안전부 |     |     | 책임자 | 과  장 | 이치선(044-205-4510) |     |     |\n| --- | --- | ----- | --- | --- | --- | ---- | ----------------- | --- | --- |\n예방안전제도과\n|      |     |     |     |     | 담당자 | 사무관  | 송정호(044-205-4505) |     |     |\n| ---- | --- | --- | --- | --- | --- | ---- | ----------------- | --- | --- |\n|      |     |     |     |     | 책임자 | 과  장 | 이중기(044-205-7470) |     |     |\n| 화재통계 |     | 소방청 |     |     |     |      |                   |     |     |\n화재대응조사과\n|     |     |     |     |     | 담당자 | 주무관 | 임영채(044-205-7476) |     |     |\n| --- | --- | --- | --- | --- | --- | --- | ----------------- | --- | --- |\n\n- 3 -\n\n붙 임 캠핑장 안전요령\n- 4 -"}, {"id": 3, "file": "260523a_방재의날.md", "title": "제33회 방재의 날, 국민과 함께 생명과 안전이 우선인 사회 만든다", "dept": "재난관리정책과", "date": "2026.05.23", "raw": "<!-- 부서: 재난관리정책과 | 코드: 260523a | 원본PDF: 260523 (17시) 제33회 방재의 날 국민과 함께 생명과 안전이 우선인 사회 만든다(재난관리정책과).pdf -->\n\n보도자료\n(온라인) 2026. 5. 22.(금) 17:00\n보도시점\n(지  면) 2026. 5. 23.(토) 조간\n|     | 제33회  |     | 방재의  |     |     |      | 날,  | 국민과  |     | 함께   |     |     |\n| --- | ----- | --- | ---- | --- | --- | ---- | --- | ---- | --- | ---- | --- | --- |\n|     | 생명과   |     | 안전이  |     |     | 우선인  |     | 사회   |     | 만든다  |     |     |\n- 제33회 방재의 날 기념식 개최(5.22.), 국가재난관리 유공자 포상 수여\n- ‘방재주간(5.11.~22.)’ 운영을 통해 전국적인 재난 예방 활동 전개\n|  행정안전부(장관  |     |     | 윤호중)는  |     | 5월  | 22일(금)  |     | 정부서울청사  |     | 국제회의실에서  |     |     |\n| ---------- | --- | --- | ------ | --- | --- | ------- | --- | ------- | --- | -------- | --- | --- |\n제33회 방재의 날 기념식을 개최했다.\n|  정부는  | 1994년부터  |     | 매년  | 5월  | 25일을  |     | 방재의  | 날로  | 지정하고,  |     | 재난  | 예방에  |\n| ----- | -------- | --- | --- | --- | ----- | --- | ---- | --- | ------ | --- | --- | ---- |\n관한 국민 의식을 높이기 위한 교육과 홍보를 집중적으로 실시하고 있다.\n|  이번  | 기념식에는    |     | 재난       | 분야  | 공무원,  |     | 민간인  | 등       | 150여  | 명이   | 참석한  | 가운     |\n| ---- | -------- | --- | -------- | --- | ----- | --- | ---- | ------- | ----- | ---- | ---- | ------ |\n| 데,   | 재난  예방과  |     | 피해  극복에  |     | 공로가   |     | 큰    | 국가재난관리  |       | 유공자  |      | 12명에게  |\n포상을 수여*했다.\n * 훈장2, 포장2, 대통령표창3, 국무총리표창3, 행정안전부장관표창2\n 박찬성 국립과학수사연구원 연구관은 국내 최초로 가상 모형(디지털트윈)\n| 기법을   | 적용해  | 오송  | 지하차도  |     | 참사  |        | 당시의  | 침수    | 과정을  | 재현했다.  |     | 또한,  |\n| ----- | ---- | --- | ----- | --- | --- | ------ | ---- | ----- | ---- | ------ | --- | ---- |\n| CCTV  | 영상을  | 통해  | 실시간   |     | 인파  | 군집밀도를  |      | 산출하는  |      | 프로그램을  |     | 개발하  |\n는 등 과학적인 사고원인 분석에 기여한 공로로 녹조 근정훈장을 받았다.\n|  김도헌  | 국립공원공단  |     | 경영기획이사는  |     |     |        | 국립공원공단  |       |     | 내  현장  | 재난  | 대응을   |\n| ----- | ------- | --- | -------- | --- | --- | ------ | ------- | ----- | --- | ------ | --- | ----- |\n| 위한    | 재난안전과   |     | 사무소를     | 전국  |     | 17개소로  |         | 늘리고,  | 항공  | 전력     | 및   | 감시체계  |\n강화 등 산불 대응 핵심사업 확대에 기여한 공로로 대통령 표창을 받았다.\n|  행사장  | 내에는  | 재난  | 및   | 안전관리  |     | 분야  | 신기술로  |     | 인증된  | 제품  | 홍보,  | 재난  |\n| ----- | ---- | --- | --- | ----- | --- | --- | ----- | --- | ---- | --- | ---- | --- |\n예방 사진·영상 공모전 당선작 전시 등 다양한 부대행사도 함께 마련했다.\n- 1 -\n\n|  아울러,  | 행정안전부는  |     | 지역사회가  |     | 참여하는  |     | 재난  | 예방  | 활동의  |     | 중요성을  |\n| ------ | ------- | --- | ------ | --- | ----- | --- | --- | --- | ---- | --- | ----- |\n널리 알리기 위해 지난 5월 11일(월)부터 22일(금)까지 ‘방재주간’을 운영했다.\n|  방재주간      | 동안  | 지역사회의      |     | 재난  | 예방을  | 위해  | 지방정부,    |     | 지역자율방재단,  |     |     |\n| ---------- | --- | ---------- | --- | --- | ---- | --- | -------- | --- | --------- | --- | --- |\n| 새마을운동중앙회,  |     | 한국지방재정공제회  |     |     |      | 등   | 여러  기관이  |     | 동참했다.     |     | 참여자 |\n들은 빗물받이 청소, 하천·계곡 불법시설 신고, 취약지역 순찰 및 위험요소\n점검 등 다양한 재난 예방 활동에 적극 나섰다.\n|  윤호중    | 장관은 “방재의 날을 맞아 대한민국의 안전을 위해 헌신해  |      |      |      |     |          |     |       |     |     | 온 모  |\n| ------- | -------------------------------- | ---- | ---- | ---- | --- | -------- | --- | ----- | --- | --- | ---- |\n| 든  분들께  | 깊은                               | 존경과  | 감사의  | 인사를  |     | 드린다”라며,  |     | “재난을  |     | 막는  | 최후의  |\n보루는 일상생활 속 안전 실천에 있음을 다시 한번 되새기며, 더욱 안전한\n| 대한민국을  | 만드는  | 길에  | 국민  | 모두가  |     | 힘을  | 모아주시길  |     | 바란다”라고  |     | 강조  |\n| ------ | ---- | --- | --- | ---- | --- | --- | ------ | --- | ------- | --- | --- |\n했다.\n|     |     | 자연재난실   |     |     | 책임자 |     | 과  장  |     | 송상훈(044-205-5110) |     |     |\n| --- | --- | ------- | --- | --- | --- | --- | ----- | --- | ----------------- | --- | --- |\n|     |     | 재난관리정책과 |     |     | 담당자 |     | 사무관   |     | 장현준(044-205-5118) |     |     |\n담당 부서\n|     |     |     |     |     | 책임자 |     | 과  장  |     | 조수창(044-205-5210) |     |     |\n| --- | 민·관  | 협업을  |     | 바탕으로  |         | 안전체험교육 |       |     |\n을 전국으로 확대 운영한다.\n * 한국교육시설안전원, 대한산업보건협회, 한국남부발전, 한국화재보험협회\n|  ‘찾아가는   |          | 안전체험교실’은  |     |        |     | 안전체험시설이  |     | 부족한            |     | 곳을  |     | 직접  | 찾아가   | 지    |\n| -------- | -------- | --------- | --- | ------ | --- | -------- | --- | -------------- | --- | --- | --- | --- | ----- | ---- |\n| 역  주민에게  |          | 체험형       |     | 안전교육을  |     | 제공하는     |     | 프로그램이다.        |     |     | 이를  |     | 통해    | 2012 |\n| 년부터      | 지난해까지 총  |           |     | 249개   |     | 지역에서     |     | 73만여 명이 현장 체험  |     |     |     |     | 중심의 안 |      |\n전교육을 받았다.\n|  이번  | 협약으로  |     | 행정안전부와  |     |     | 각   | 기관은  | ‘찾아가는  |     | 안전체험교실’을  |     |     |     | 공동  |\n| ---- | ----- | --- | ------- | --- | --- | --- | ---- | ------ | --- | --------- | --- | --- | --- | --- |\n주최하고, 안전교육 활동 지원과 홍보 등을 위해 힘을 모으기로 했다.\n 올해 ‘찾아가는 안전체험교실’은 사전 수요조사를 통해 선정한 21개 지역\n을 대상으로 3월부터 11월까지 운영한다. 특히, 대상별 맞춤형 프로그램을\n| 구성해  | 교육  | 효과를    |     | 높였다.  |      | 어린이는  |     | 보행·물놀이  |     | 안전,  |        | 지진·화재  |     | 대피,  |\n| ---- | --- | ------ | --- | ----- | ---- | ----- | --- | ------- | --- | ---- | ------ | ------ | --- | ---- |\n| 감염병  | 및   | 약취·유인  |     | 예방    | 등을,  | 성인은   |     | 심폐소생술,  |     |      | 하임리히법  |        | 등   | 실제   |\n위기 상황에서 필요한 행동요령을 익히는 데 중점을 두었다.\n|  아울러,  |     | 지역축제  |     | 현장에도  |     | 안전체험을  |     | 위한  | 공간을  |     | 별도로  | 마련하는  |     | 등   |\n| ------ | --- | ----- | --- | ----- | --- | ------ | --- | --- | ---- | --- | ---- | ----- | --- | --- |\n각 지역 여건을 반영한 프로그램도 다양하게 운영할 예정이다.\n- 1 -\n\n|  김광용  | 재난안전관리본부장은  |     | “위기  | 상황에  | 닥쳤을  | 때  스스로의  | 안전을  |\n| ----- | ----------- | --- | ---- | ---- | ---- | -------- | ---- |\n지키기 위해서는, 단순 이론 교육을 넘어 미리 경험하고 익히는 체험형 안\n| 전교육이  | 필요하다”라며,  |     | “앞으로도  | 민·관  협력을  | 강화해  | 더욱  많은  | 국민  |\n| ----- | --------- | --- | ------ | --------- | ---- | ------- | --- |\n께서 안전을 직접 체험하고 배울 수 있도록 노력하겠다”라고 밝혔다.\n| 담당 부서 |     | 안전예방정책실 |     | 책임자 | 과  장  | 이영인(044-205-4270) |     |\n| ----- | --- | ------- | --- | --- | ----- | ----------------- | --- |\n|       |     | 안전문화교육과 |     | 담당자 | 서기관   | 금석윤(044-205-4281) |     |\n|       |     |         |     |     | 주무관   | 한지성(044-205-4276) |     |\n- 2 -"}, {"id": 5, "file": "260525_호우대비관계기관점검.md", "title": "5.25~26일 전국 호우 대비, 관계기관 대응 태세 점검", "dept": "자연재난대응과", "date": "2026.05.25", "raw": "<!-- 부서: 자연재난대응과 | 코드: 260525 | 원본PDF: 260525 (11시) 5.25~26일 호우 대비 관계기관 대응 태세 점검(자연재난대응과).pdf -->\n\n보도자료\n\n보도시점 (인터넷, 지면) 2026. 5. 25.(월) 11:00\n\n5.25~26일  전국  호우  대비,\n관계기관  대응  태세  점검\n\n  행정안전부(장관  윤호중)는  오늘(25일)  밤부터  전국에  많은  비가  내릴  것\n\n으로  예상됨에  따라,  김광용  재난안전관리본부장  주재로  관계기관  대책회\n\n의를  개최했다.\n\n  기상청에  따르면,  오늘(25일)  오전에  제주도,  남해안에  비가  시작되어,  내\n\n일(26일)  새벽에는  전국으로  확대되겠으며,  특히,  남해안,  지리산,  제주도를\n\n중심으로  80~150mm(최대  남해안.지리산  200mm  이상·제주산지  300mm\n\n이상)의  많은  비가  내리는  가운데,  곳에  따라  돌풍과  천둥·번개를  동반한\n\n시간당  50mm  안팎(제주산지  50~80mm)의  강한  비가  내릴  것으로  전망\n\n된다.\n\n  이번  회의는  지난  20~21일  전라·경상권을  중심으로  많은  비가  내린  데\n\n이어  또다시  전국적인  강수가  예보됨에  따라,  연휴  기간  각  기관의  호우\n\n대응  태세에  공백이  없는지  긴급  점검하기  위해  개최됐다.\n\n        ※  국조실,  행안·기후·국토부  등  15개  중앙행정기관,  17개  광역  지방정부,  4개  공공\n\n기관(한국수자원공사,  한국수력원자력,  한국농어촌공사,  국립공원공단)\n\n  특히  이번  호우는  돌풍과  천둥·번개가  동반되는  만큼  방치된  도로  표지\n\n판,  옥외광고물  등  대로변에  설치된  시설물을  집중  점검하고,  위험요인이\n\n확인될  경우  신속히  철거하거나  보수한다.\n\n  빗물받이,  우수관로,  배수펌프장  등  배수시설은  토사나  쓰레기로  물  흐름\n\n이  막히지  않도록  사전에  정비하고,  과거  침수가  발생했던  지역은  현장  예\n\n찰을  강화한다.\n\n  지하차도  등  침수  취약도로는  위험  징후가  보이면  즉시  통제하고,  반지하\n\n주택  등  저지대  주거지역은  차수벽,  물막이판과  같은  침수  방지시설  설치·\n\n관리  상태를  사전  점검한다.\n\n-  1  -\n\n\f  하천변  산책로,  둔치주차장,  세월교  등은  비가  지속될  경우  수위가  빠르\n\n게  상승할  수  있어  선제적인  통제를,  산사태  취약지역,  급경사지  등  지반\n\n이  약한  곳은  사전  예찰과  응급조치를  철저히  할  것을  강조했다.\n\n  아울러  5월은  각종  지역행사,  영농  등으로  야외활동이  늘어나는  시기인\n\n만큼  집중호우  시  하천변,  농수로,  공사장  주변  등  위험지역  접근을  자제\n\n하도록  국민행동요령을  적극  안내한다.\n\n  행정안전부는  지난  강수로  지반이  물을  많이  머금은  상황임을  고려해  경\n\n남  산청  등  산불피해지역을  중심으로  과장급  현장상황관리관을  파견한다.\n\n파견된  현장상황관리관은  지역의  주민대피  지원체계  운영,  위험요인  사전\n\n조치  상황을  집중적으로  살피고,  집중호우가  종료될  때까지  지방정부의  현\n\n장  대응을  지원할  계획이다.\n\n  김광용  재난안전관리본부장은  “지난  선행강수에  이어  이번에도  전국적으\n\n로  많은  비가  예보된  상황인  만큼,  관계기관  모두가  긴장을  늦추지  않고\n\n이번  호우에  철저히  대응하겠다”라며,  “국민  여러분께서도  기상정보와  재\n\n난문자를  수시로  확인하고,  산사태·하천변·지하공간  위험지역  등  위험한\n\n곳에는  접근하지  말아  주시길  부탁드린다”라고  당부했다.\n\n담당 부서\n\n자연재난실\n자연재난대응과\n\n책임자\n\n담당자\n\n담당자\n\n과  장\n\n신일철 (044-205-5230)\n\n서기관\n\n사무관\n\n현종일 (044-205-5234)\n\n전혜숙 (044-205-5231)\n\n-  2  -\n\n\f참  고   국민행동요령\n\n-  3  -\n\n\f-  4  -\n\n\f-  5  -\n\n\f-  6  -\n\n\f-  7  -\n\n"}, {"id": 6, "file": "260526a_소하천불법점용즉각조치.md", "title": "소하천 내 반복·상습적 불법 점용행위, 이젠 예고 없이 즉각 조치한다", "dept": "재난경감과", "date": "2026.05.26", "raw": "<!-- 부서: 재난경감과 | 코드: 260526a | 원본PDF: 260526 (국무회의 종료시) 소하천 내 반복상습적 불법 점용행위 이젠 예고없이 즉각 조치한다(재난경감과).pdf -->\n\n보도자료\n|      |     |     |     |         | 보도시점 |     | (온라인, 지면) 2026. 5. 26.(화) 국무회의 종료시 |     |      |        |     |     |     |\n| ---- | --- | --- | --- | ------- | ---- | --- | ---------------------------------- | --- | ---- | ------ | --- | --- | --- |\n| 소하천  |     |     | 내   | 반복·상습적  |      |     |                                    | 불법  |      | 점용행위,  |     |     |     |\n|      |     | 이젠  |     | 예고      |      | 없이  | 즉각                                 |     | 조치한다 |        |     |     |     |\n - 행정대집행 특례 확대, 이행강제금 부과 근거 내용을 담은 「소하천정비법」\n개정법률 공포안 국무회의 의결(5.26.)\n|  행정안전부(장관  |     |      | 윤호중)는  |        |     | 소하천  | 구역  | 내   | 불법  | 점용행위를     |     | 막기  | 위한  |\n| ---------- | --- | ---- | ------ | ------ | --- | ---- | --- | --- | --- | --------- | --- | --- | --- |\n| 행정대집행      |     | 특례와  |        | 이행강제금  |     | 부과   | 근거  | 등을  | 담은  | ｢소하천정비법｣  |     |     | 일부  |\n개정법률 공포안이 5월 26일(화) 국무회의에서 의결됐다고 밝혔다.\n|  앞으로는  |     | 소하천    | 구역  |      | 안에서  | ‘반복적·상습적으로  |     |      |       | 점용허가를  |     | 받지  | 않고   |\n| ------ | --- | ------ | --- | ---- | ---- | ----------- | --- | ---- | ----- | ------ | --- | --- | ---- |\n| 점용하는   |     | 경우’에는  |     | 신속한  | 조치를  |             | 위해  | 계고나  | 이행기간  |        | 부여  | 등   | 절차를  |\n거치지 않고 행정대집행이 가능하다.\n|  이와  | 함께  | 불법시설물에  |     |     | 대한  |     | 원상회복  | 명령이나  |     | 조치명령을  |     | 이행하지  |     |\n| ---- | --- | ------- | --- | --- | --- | --- | ----- | ----- | --- | ------ | --- | ----- | --- |\n않는 경우 1천만 원 이하의 이행강제금을 부과하도록 했다.\n|  아울러,  |     | 소하천  | 구역  | 점용과  |     | 관련된  | 제도의  | 지역  |     | 간  과도한  |     | 편차와  | 형평  |\n| ------ | --- | ---- | --- | ---- | --- | ---- | ---- | --- | --- | ------- | --- | ---- | --- |\n성 문제를 개선하기 위해, 점용료 인상률과 점용기간 산정 기준 등을 대통\n령령이 정하는 범위 안에서 조례로 정하도록 했다.\n 이번「소하천정비법」개정안은 공포일로부터 6개월 뒤 시행된다.\n|  윤호중  | 장관은  |     | “이번  | ｢소하천정비법｣  |     |     | 개정을  |     | 통해  | 불법  | 점용행위에  |     | 엄정  |\n| ----- | ---- | --- | ---- | --------- | --- | --- | ---- | --- | --- | --- | ------ | --- | --- |\n하고 신속하게 대응하기 위한 제도적 기반이 마련됐다”라며, “정부는 국민\n| 불편을  | 초래하고  |     | 안전을  |     | 위협하는  |     | 반복·상습적인  |     | 불법  | 점용행위가  |     |     | 되풀이  |\n| ---- | ----- | --- | ---- | --- | ----- | --- | -------- | --- | --- | ------ | --- | --- | ---- |\n되지 않도록 철저히 관리하겠다”라고 밝혔다.\n- 1 -\n\n| 담당 부서 | 자연재난실 | 책임자 | 과  장  | 차상화(044-205-5150) |\n| ----- | ----- | --- | ----- | ----------------- |\n|       | 재난경감과 | 담당자 | 주무관   | 배문성(044-205-5144) |\n- 2 -"}, {"id": 7, "file": "260526b_생명안전기본법제정.md", "title": "국민의 ‘안전권’을 기본권으로 명시한 ｢생명안전기본법｣ 제정", "dept": "안전정책총괄과", "date": "2026.05.26", "raw": "<!-- 부서: 안전정책총괄과 | 코드: 260526b | 원본PDF: 260526 (국무회의 종료시) 국민의 안전권을 기본권으로 명시한 ｢생명안전기본법｣ 제정(안전정책총괄과).pdf -->\n\n보도자료\n보도시점 (온라인, 지면) 2026. 5. 26.(화) 국무회의 종료시\n국민의 ‘안전권’을 기본권으로 명시한\n｢생명안전기본법｣ 제정\n- ｢생명안전기본법｣ 공포안, 5월 26일(화) 국무회의 의결\n- 국민 ‘안전권’ 및 국가의 보호 책무 명시, 독립조사기구 설치 등 생명존중\n안전사회 건설‧확립을 위한 기틀 마련\n행정안전부(장관 윤호중)는 모든 국민의 ‘안전하게 살 권리’를 보장하고\n국가의 생명·안전 보호 책무를 규정한 ｢생명안전기본법｣ 공포안이 5월 26\n일(화) 국무회의에서 의결됐다고 밝혔다.\n그동안 세월호, 이태원, 여객기 참사와 같은 대형 재난을 겪으면서 생명\n을 존중하는 안전 사회를 만들기 위해 시민사회단체 등을 중심으로 관련\n법 제정 요구가 지속되었다.\n이에 정부는 국민의 생명과 안전을 최우선에 두고 ｢생명안전기본법｣ 제\n정을 국정과제로 추진해 왔으며, 적극적인 입법노력을 통해 세월호 참사가\n발생한 지 12년 만에 결실을 맺게 되었다.\n｢생명안전기본법｣은 안전사고에 취약한 약자와 피해자의 권리를 폭넓게\n보장한다는 점에서 기존 법률과 차별되며, 특히 독립된 조사기구를 통해\n사고 조사의 공정성과 신뢰성을 확보한다는 점에서 그 의미가 크다.\n>> 국민 ‘안전권’ 명문화 및 국가의 보호 책무 명시\n먼저, 안전사고 위험으로부터 보호받고 ‘안전하게 살 권리’를 모든 국민이\n누려야 할 기본권으로 법률에 명문화했다. 이 권리는 대한민국 영토에 있\n는 외국인에게도 차별 없이 적용된다.\n과거 사회적 참사 발생 시 개별적인 특별법을 통해 보장받던 피해자의\n- 1 -\n\n| 세부      | 권리도  |      | 명시했다.  | 사고     | 예방부터  |      | 복구까지  |     | 전   | 과정에서   |     | 실질적으로  |     |     |\n| ------- | ---- | ---- | ------ | ------ | ----- | ---- | ----- | --- | --- | ------ | --- | ------ | --- | --- |\n| 참여하고    |      | 정확한  | 정보를    |        | 제공받을  | 권리,  | 사고원인  |     |     | 조사와    | 그   | 과정에    |     | 참여  |\n| 를  요구할  |      | 권리   | 등이     | 포함됐다.  |       | 이에   | 따라    | 중앙  | 및   | 지방정부,  |     | 기업     |     | 등은  |\n국민의 안전권을 보장하기 위한 책무를 이행해야 한다.\n>> 생명안전 전담기구 신설 및 종합계획 수립\n|  정부와            | 민간이  |     | 함께  | 참여해  | 국가  |      | 주요  안전  |     | 정책을  | 논의하는     |     | 대통령  |     | 소   |\n| --------------- | ---- | --- | --- | ---- | --- | ---- | ------- | --- | ---- | -------- | --- | ---- | --- | --- |\n| 속  ‘국민생명안전위원회’  |      |     |     |      | 설치  | 근거도  | 포함되었다.  |     |      | 이  위원회는  |     | 각    | 부처에 |     |\n서 추진하는 생명안전과 관련된 산업재해, 자살, 자연재난, 교통사고, 어린\n이 안전사고 등의 대책을 총괄한다.\n|  또한,  | 안전권  |     | 보장을   | 위해     | 5년마다  |     | 국가  | 차원의  | ‘생명안전종합계획’을  |     |        |     |      | 수   |\n| ----- | ---- | --- | ----- | ------ | ----- | --- | --- | ---- | ------------ | --- | ------ | --- | ---- | --- |\n| 립하고,  | 정책   |     | 이행력을  | 뒷받침하기  |       |     | 위해  | 안전과  | 관련된          |     | 재정·인력  |     | 확보를  |     |\n국가의 의무로 규정했다.\n>> 안전영향 분석·평가 제도 도입\n 앞으로 중앙 및 지방정부가 법령을 제·개정하거나 계획 및 사업을 시행할\n때 안전에 미치는 영향을 사전에 분석·평가하는 제도를 도입한다. 이에 따\n| 라,  각  | 기관은  |     | 안전사고  |     | 유발  | 가능성,  | 안전  | 확보의  |     | 실효성  |     | 등을  | 의무적으 |     |\n| ------ | ---- | --- | ----- | --- | --- | ----- | --- | ---- | --- | ---- | --- | --- | ---- | --- |\n로 검토해야 한다.\n 안전영향 분석·평가가 재해영향평가, 환경영향평가 등 현재 시행 중인 제\n| 도와  | 상충되거나  |     | 중복되지  |     | 않도록  |     | 평가  | 대상·방법·시기  |     |     | 등은  | 하위법령을  |     |     |\n| --- | ------ | --- | ----- | --- | ---- | --- | --- | --------- | --- | --- | --- | ------ | --- | --- |\n통해 마련할 계획이다.\n>> 독립조사기구 설치 및 피해자 지원 원칙 명시\n|  그간  | 각종   | 대형  | 재난을   |       | 겪으면서  |     | 독립적인            | 상설  |     | 조사기구가  |     | 필요하다는  |     |     |\n| ---- | ---- | --- | ----- | ----- | ----- | --- | --------------- | --- | --- | ------ | --- | ------ | --- | --- |\n| 사회적  | 요구를  |     | 반영해,  | 국무총리  |       | 소속  | ‘국가안전사고조사위원회’를  |     |     |        |     |        | 신설한 |     |\n다. 이를 통해 안전사고 발생 원인과 수습 과정의 적정성을 객관적이고 독\n립적으로 조사한다.\n- 2 -\n\n|  이와       | 함께  | 안전사고  |     | 피해자의   |      | 신체·정신·경제적  |      |      |     | 회복을    |      | 위한  지원계획을  |     |     |\n| --------- | --- | ----- | --- | ------ | ---- | ---------- | ---- | ---- | --- | ------ | ---- | ---------- | --- | --- |\n| 수립하고,     |     | 기업    | 등도  | 안전사고와  |      |            | 관련된  | 정보를  |     | 제공하도록  |      | 했다.        | 피해자 |     |\n| 와  피해지역에  |     |       | 대한  | 기억과    | 추모,  |            | 공동체  | 회복을  |     | 위한     | 사업을  | 체계적으로      |     |     |\n진행하기 위한 지원 기반도 구축했다.\n 정부는 이번 법률안이 공포된 이후 6개월 뒤 시행되는 일정에 맞춰 하위\n| 법령을  | 마련하고,  |     | 대통령  |     | 소속  | ‘국민생명안전위원회’  |     |     |     |     | 출범을  | 완료하는  |     | 등   |\n| ---- | ------ | --- | ---- | --- | --- | ------------ | --- | --- | --- | --- | ---- | ----- | --- | --- |\n법률 시행을 철저히 준비할 계획이다.\n|  윤호중  | 장관은  |       | “｢생명안전기본법｣  |      |      |     | 제정은  |      | 국민의  | 생명과   |     | 안전이   | 단순한  |     |\n| ----- | ---- | ----- | ----------- | ---- | ---- | --- | ---- | ---- | ---- | ----- | --- | ----- | ---- | --- |\n| 선언이나  |      | 추상적인  |             | 개념에  | 머물지  |     | 않고,  | 국가가  |      | 책임지고  |     | 보호해야  | 할    | 법   |\n적 권리로 명확히 규정했다는 점에서 큰 의    | 분석해  | 보면,  | 교차로에서  |     |\n| ----- | ------ | --- | ---- | --- | ---- | ------ | --- | ---- | ---- | ------ | --- |\n발생한 사고가 528건으로 전체의 57%를 차지했으며, 이 중 횡단보도에서\n| 발생한  | 사고가  | 236건에  |     | 달했다.  | 사고  |     | 유형별로는  | 보행사고(54%)가  |     |     | 가장  |\n| ---- | ---- | ------ | --- | ----- | --- | --- | ------ | ----------- | --- | --- | --- |\n많았고, 차량 탑승 중 사고(26%), 자전거 사고(19%)가 그 뒤를 이었다.\n 이에, 정부는 스쿨존 내 교통사고를 획기적으로 줄이기 위해 ▲선택과 집\n| 중을  | 통한  예산  | 투자효과  |     | 극대화  |     | ▲안전운전을  |     | 위한  | 홍보와  | 단속  강화  | ▲   |\n| --- | ------- | ----- | --- | ---- | --- | ------- | --- | --- | ---- | ------- | --- |\n취약 사고유형 중점 관리를 기본 방향으로 정하고, 사고 원인별 맞춤형 예\n방 대책을 시행한다.\n- 1 -\n\n>> 선택과 집중을 통한 예산 투자효과 극대화\n 보행환경 개선을 위해 학교 주변에 보도와 방호울타리 등 교통안전시설을\n늘려 차량과 보행자를 분리하고, 단속용 CCTV도 추가 설치해 운전자의 시\n| 야를  | 가리는  | 불법주정차를  |     |     | 막는다.  |     | 이를  | 위해  |     | 올해  | 재난안전특별교부세  |     |     |     |\n| --- | ---- | ------- | --- | --- | ----- | --- | --- | --- | --- | --- | ---------- | --- | --- | --- |\n146.2억 원을 투입해 보도(44개교)와 교통안전시설(104개소)을 확충한다.\n 신호등이나 횡단보도가 없는 교차로에는 일시정지 표지를 전수 설치하고,\n| 신호등이  |      | 있더라도  |       | 우회전  | 차량으로  |     | 인한    |      | 사고를  | 예방하기  |       | 위해  |     | 우회전  |\n| ----- | ---- | ----- | ----- | ---- | ----- | --- | ----- | ---- | ---- | ----- | ----- | --- | --- | ---- |\n| 신호등과  | 대각선  |       | 횡단보도  |      | 설치를   |     | 늘린다.  | 사고가  |      | 자주    | 발생하는  |     | 곳은  | 전    |\n수점검을 거쳐 도로구조 개선과 교통안전시설 정비 등을 추진한다.\n>> 안전운전을 위한 홍보·단속 강화\n 운전자가 잘 모르거나 헷갈리기 쉬운 스쿨존 내 교통법규를 집중 홍보한다.\n| 특히,  | 신호등이 없는  |     |     | 횡단보도 앞에서  |     |     | 무조건  |     | 정지, 우회전  |     |     | 시 일시정지,  |     | 주   |\n| ---- | -------- | --- | --- | --------- | --- | --- | ---- | --- | -------- | --- | --- | -------- | --- | --- |\n정차 금지 등 현장에서 혼선이 잦은 항목을 중심으로 홍보를 강화한다.\n 이와 함께, 스쿨존 내 교통법규 위반에 대한 현장 단속을 강화하고, 안전\n| 신문고를  | 활용한  |     | 교통법규  |     | 위반  | 신고를  |     | 활성화하기  |     | 위해  |     | 시민단체가  |     | 참여  |\n| ----- | ---- | --- | ----- | --- | --- | (02-3150-0611) |\n| ----- | --- | ---- | ----------------- |\n| 경찰청   | 책임자 | 과  장 | 유동배(02-3150-2052) |\n| 교통안전과 | 담당자 | 경  정 | 전영식(02-3150-2152) |\n\n- 3 -"}, {"id": 9, "file": "260529_빗물받이시설관리.md", "title": "여름철 집중호우 대비 빗물받이 시설 본격 관리", "dept": "재난관리정책과", "date": "2026.05.29", "raw": "<!-- 부서: 재난관리정책과 | 코드: 260529 | 원본PDF: 260529 (17시) 여름철 집중호우 대비 빗물받이 시설 본격 관리(재난관리정책과).pdf -->\n\n보도자료\n(온라인) 2026. 5. 28.(목) 17:00\n보도시점\n(지  면) 2026. 5. 29.(금) 조간\n여름철 집중호우 대비 빗물받이 시설 본격 관리\n- 행정안전부･기후에너지환경부 합동 ‘빗물받이 정비 TF’ 가동\n- 침수우려지역은 6월 15일까지 1차 정비 100% 완료\n|  행정안전부(장관  |     |      | 윤호중)는  |     |     | 여름철  | 집중호우에      |     |     | 대비해  | 빗물받이  |     | 점검과    |\n| ---------- | --- | ---- | ------ | --- | --- | ---- | ---------- | --- | --- | ---- | ----- | --- | ------ |\n| 청소  실적     |     | 관리를  | 강화하기   |     | 위해  |      | 기후에너지환경부와  |     |     |      | 합동으로  |     | ‘빗물받이  |\n정비 TF’를 구성했다.\n 올해 협의체(TF)는 지난해와 달리 단장을 국장급에서 실장급으로 격상했\n| 다.  이에      | 따라,  |     | 5월  | 28일(목)  |      | 김용균   | 행안부  |      | 자연재난실장과  |       |     | 조희송   | 기후  |\n| ----------- | ---- | --- | --- | ------- | ---- | ----- | ---- | ---- | -------- | ----- | --- | ----- | --- |\n| 부  물관리정책실장  |      |     |     | 공동      | 주재로  | 관계기관  |      | 회의를  |          | 개최하고  |     | 빗물받이  | 관리  |\n강화 방안을 논의했다.\n|  현재          | 전국에  |     | 설치된   | 빗물받이는  |     |      | 423만여         |     | 개소로  |       | 파악됐다.  |           | 이  중  |\n| ------------ | ---- | --- | ----- | ------ | --- | ---- | ------------- | --- | ---- | ----- | ------ | --------- | ----- |\n| 83.5%(353만여  |      |     | 개소)가  |        | 1차  | 정비를  | 완료(’26.5.22.  |     |      | 기준)해  |        | 지난해(’25.6 |       |\n월말 기준 84.9%)보다 빗물받이 정비에 속도를 내고 있다.\n|  올해에는     |        | 빗물받이뿐만  |       |       | 아니라  | 우수관로와  |     |     | 맨홀추락방지시설까지  |           |     |      | 관리    |\n| --------- | ------ | ------- | ----- | ----- | ---- | ------ | --- | --- | ----------- | --------- | --- | ---- | ----- |\n| 대상을       | 확대하고,  |         | 지방정부  |       | 등    | 관계기관의  |     | 정비  | 실적을         |           | 격주  | 단위로  | 공개    |\n| 한다.  특히,  |        | 본격적인    |       | 장마철이  |      | 시작되기   |     | 전인  | 6월          | 15일(월)까지  |     |      | 침수  우 |\n려지역은 빗물받이 정비를 모두 완료하고, 비 오기 전 점검과 비 온 후 청\n소를 반복하는 정비 체계도 확립한다.\n 김용균 자연재난실장은 “지난 5월 15일부터 여름철 자연재난 대책기간에\n| 돌입한  | 만큼,  | 관계기관과  |     |     | 함께  | 침수를  |     | 막는  | 첫  번째  |     | 방어시설인  |     | 빗물받이 |\n| ---- | ---- | ------ | --- | --- | --- | ---- | --- | --- | ------ | --- | ------ | --- | ---- |\n를 더욱 꼼꼼하게 관리하겠다”라며, “국민 여러분께서도 빗물받이가 제 기\n| 능을  유지할  |     | 수   | 있도록  | 쓰레기  |     | 버리지  |     | 않기  | 등  정비  |     | 활동에  | 적극  | 동참해  |\n| -------- | --- | --- | ---- | ---- | --- | ---- | --- | --- | ------ | --- | ---- | --- | ---- |\n주시기 바란다”라고 밝혔다.\n- 1 -\n\n| 책임자 | 과  장 | 송상훈(044-205-5110) |\n| --- | ---- | ----------------- |\n행정안전부\n담당 부서\n재난관리정책과\n| 담당자 | 사무관 | 오병곤(044-205-5116) |\n| --- | --- | ----------------- |\n- 2 -"}, {"id": 10, "file": "보도자료_125874.md", "title": "프로젝트 기반 인사교류 참여자 인사상 우대 확대", "dept": "지방인사제도과", "date": "2026.05.11", "raw": "﻿ **- 5월 11일부터 「지방공무원 임용령」 개정안 등 입법예고**\n\n **- 승진 소요 연수 최대 1년 단축 및 1년 이상 근무시 특별승진 기회**\n\n행정안전부(장관 윤호중)는 중앙부처와 지방정부, 그리고 민간기업 간의 벽을 허무는 ‘프로젝트 기반 인사교류’를 활성화하기 위해 교류 참여자에게 파격적인 인사상 우대 혜택을 제공한다고 밝혔다.\n\n행정안전부는 이 같은 내용을 핵심으로 하는 「지방공무원 임용령」, 「지방공무원 평정규칙」개정안을 5월 11일(월)부터 6월 10일(수)까지 입법예고 한다.\n\n이번 개정안은 청와대에서 발표한 ‘공직 역량 강화 테스크포스’ 운영성과의 일환이다. 국책사업이나 지역 현안 대응을 위해 신설되는 ‘핵심 인사교류’ 직위 근무자와 지역 투자 유치 등을 돕는 ‘민간기업 전담공무원’에게 파격적인 인센티브를 부여해 공직 사회의 경쟁력을 높이고 지역 경제에 활력을 불어넣을 계획이다.\n\n\\>> 승진은 빠르게, 평가는 후하게, 인사교류자 대상 파격 보상\n\n이번 개정안의 핵심은 교류 공무원에 대한 확실한 보상 체계 마련이다. 우선, 승진 소요 최저 연수를 단축한다. 핵심 인사교류 직위나 민간기업 전담공무원으로 근무할 경우, 최대 1년 내에서 해당 직위 교류 기간의 절반을 승진 소요 기간에서 감면해 준다.\n\n또한, 해당 직위에서 1년 이상 근무하며 우수한 성과를 낸 공무원에게는 ‘특별승진’의 기회를 부여한다. 아울러, 기존에는 인사교류자에게만 적용되던 ‘대우공무원 산정 시 교류 기간 경력 100% 단축’ 혜택을 민간기업 전담공무원에게도 동일하게 확대 적용한다.\n\n평가와 성과급에서의 불이익 우려도 원천 차단한다. 인사교류자는 일반 공무원들과 평정 단위를 분리하여, 근무성적평정에서는 최소 ‘우’ 등급 이상을, 성과급에서는 최소 ‘A’ 등급 이상을 의무적으로 보장받는다. 최상위 등급을 받은 우수 성과자에게는 특별성과가산금도 지급할 수 있도록 근거를 마련한다.\n\n\\>> 수험생 부담 낮추고 우수 인재·취약 청년 품는 채용제도 개선\n\n지방공무원 공채 및 경력경쟁 채용 제도 역시 시대 흐름에 맞게 대폭 개선된다. 우선, 수험생의 부담을 덜고 채용시험 간 호환성을 높이기 위해 2027년부터 8급 공개경쟁 채용시험의 한국사 과목을 9급과 동일하게 ’한국사능력검정시험(3급 이상)‘으로 대체한다.\n\n또한, 최신 경력 반영이 중요한 특정 분야 경채시험의 경우 필요 경력을 1년 범위 내에서 단축할 수 있는 근거를 마련하고, 현행 8급 이하로 운영하던 우수 인재 추천채용제 대상 직급도 7급까지 확대한다.\n\n경제적으로 취약한 청년층의 공직 진출 문턱도 낮춘다. 9급 공채 저소득층 구분모집 대상에 ’자립준비청년‘과 ’보호기간 연장청년‘을 새롭게 추가한다. 아울러 기초생활수급자나 한부모가족 지원 대상자에게 요구되던 2년 이상의 자격 유지 기간을 1년으로 완화하여 실질적인 지원을 강화한다.\n\n입법예고안은 5월 11일(월)부터 행정안전부 누리집 또는 대한민국 전자관보에서 확인할 수 있으며, 국민 누구나 일반 우편 또는 전자 우편 등을 통해 의견을 제출할 수 있다.\n\n윤호중 행정안전부 장관은 “이번 조치는 프로젝트 기반 인사 교류를 통해 대규모 국책사업 등에 참여하는 공무원에게 파격적인 인센티브를 부여해, 보다 성공적인 사업 추진을 돕기 위한 것”이라고 밝히며,\n\n“행정안전부는 앞으로도 공직사회의 개방성을 확대하고 활력을 제고할 수 있도록 지방인사제도를 적극적으로 개선해 나가겠다”고 밝혔다.\n\n\\* 담당자 : 지방인사제도과 김정민(044-205-3347)"}, {"id": 11, "file": "보도자료_125875.md", "title": "‘2025년 빗물받이 정비 우수사례집’ 지방정부 배포", "dept": "재난관리정책과", "date": "2026.05", "raw": "﻿**\\- ‘2025년 빗물받이 정비 우수사례집’ 지방정부 배포**\n\n**\\- 침수 위험지역 중심으로, 우기 전 빗물받이 집중 점검·정비**\n\n행정안전부(장관 윤호중)는 여름철 집중호우로 인한 침수 피해를 예방하기 위해 ‘2025년 빗물받이 정비 우수사례집’을 지방정부에 배포하고, 우기 전까지 빗물받이 정비를 강화한다.\n\n빗물받이는 도로나 주거지역에 내린 빗물을 하수관로로 유입시키는 핵심 배수시설이다. 빗물받이가 담배꽁초, 낙엽, 토사 등으로 막힐 경우 짧은 시간의 집중호우에도 도로 침수와 지하공간 역류 피해로 이어질 수 있다.\n\n특히 최근 기습적인 국지성 호우가 잦아지면서, 평상시 빗물받이를 꼼꼼하게 관리하는 것이 가장 기본적인 침수 예방 대책으로 강조되고 있다. 지난해에는 전국 408만여 개소의 빗물받이를 대상으로 점검·청소한 결과 정비율 241.9%\\*를 달성한 바 있다.\n\n\\* 빗물받이 1개소당 평균 2.4회 이상 점검 또는 청소를 실시했음을 의미\n\n이번 우수사례집에는 지방정부가 빗물받이 관리를 위해 진행한 일제점검, 민·관 합동 정비, 안전신문고 신고 활용, 시설 보강 등 다양한 현장 사례를 담았다.\n\n행정안전부는 각 지방정부가 지역 여건에 맞는 우수사례를 참고해 전통시장, 반지하주택 밀집지역, 지하차도 주변 등 침수 위험지역의 빗물받이를 우선 정비하도록 안내할 계획이다.\n\n앞서 행정안전부는 올해 3월, 지방정부의 빗물받이 정비를 위해 재난안전특별교부세 326억 원을 지원했다. 지방정부에서는 이를 활용해 빗물받이 점검과 청소뿐만 아니라, 지역의 실질적인 배수 능력을 높일 수 있도록 연결 관로 준설, 배수시설 정비 등도 실시하고 있다.\n\n또한, 누구나 주변의 막힌 빗물받이를 발견하면 안전신문고 등으로 신고할 수 있도록 홍보를 강화해, 지역 주민과 정부가 함께 참여하는 관리 체계를 확산해 나갈 방침이다.\n\n윤호중 장관은 “빗물받이는 작지만 우리 주변 곳곳의 침수 피해를 막는 첫 번째 방어시설”이라며, “정부는 빗물받이 정비 우수사례를 널리 알려 전국에 확산시키는 한편, 관계기관과 함께 정비 현장을 지속적으로 점검하며 여름철 침수 피해 예방에 최선을 다하겠다”라고 밝혔다.\n\n\\* 담당자 : 재난관리정책과 류해춘(044-205-5125)"}, {"id": 12, "file": "보도자료_125915.md", "title": "민생회복 소비쿠폰, 소상공인 순매출 5.86조원 증대 효과", "dept": "재정정책과", "date": "2026.05", "raw": "﻿ **- 13.52조원 소비쿠폰 지급으로 5.86조원의 소상공인 순매출 증대 효과 발생**\n\n **- 소비쿠폰 지급액의 43.3%가 소상공인 순매출 증대로 연결된 것으로 분석**\n\n행정안전부(윤호중 장관)는 한국조세재정연구원이 수행한 ‘민생회복 소비쿠폰의 경제적 효과 분석’ 연구용역(’25.11월~’26.4월) 결과, 민생회복 소비쿠폰이 5.86조원의 소상공인 순매출 증대 효과를 나타낸 것으로 분석되었다고 밝혔다.\n\n소비쿠폰 지급 이후 ‘소비자심리지수’(한국은행), ‘소상공인 경기체감지수’(중기부) 등 주요 경제지표가 개선된 바 있으며, 이번 연구는 신용카드 결제 데이터 등을 통해 소비쿠폰이 소상공인 매출, 민간소비 등에 미친 영향을 실증적으로 분석한 것이다.\n\n\\>> 연구 개요\n\n‘민생회복 소비쿠폰의 경제적 효과 분석’ 연구는 신한·삼성·현대·KB국민·BC·하나카드 등 국내 6개 주요 신용카드사의 결제 데이터를 기반으로 수행되었다. 해당 데이터는 전체 신용카드 결제액의 74.23%를 포괄한다.\n\n이번 연구는 미시 효과 분석(소상공인 경기 정상화 및 소비자 사용 효과성), 거시 효과 분석, 설문조사 분석을 통해 소비쿠폰의 정책 효과를 종합적으로 분석했다.\n\n\\>> 미시 효과 분석 결과\n\n소상공인 경기 정상화 효과 측면에서는 13.52조원의 소비쿠폰 지급으로 5.86조원의 소상공인 순매출 증대 효과가 발생한 것으로 나타났다. 이는 지급액의 43.3%가 소상공인 순매출 증대로 연결된 것이다.\n\n※ 기존 미국·일본·대만 등의 선행 연구에서 보고된 이전지출의 매출 증대 비율인 20~33% 수준을 상회하는 수치로, 저소득층에 대한 차등 지급, 사용처·사용기한 제한 등의 소비쿠폰 설계 방식이 높은 순매출 증대 효과에 기여한 것으로 해석됨\n\n업종별로는 음식점업과 종합소매업, 무점포소매업, 음식료품·담배소매업 등 생활밀착형 소비 업종에서 전체 순매출 증대 효과의 49.6%가 발생한 것으로 분석되었다. 자동차·오토바이 수리, 병원 등 비용부담으로 소비를 미뤄왔던 분야에서도 유의미한 매출 증가가 나타났고, 교육·여가·문화 관련 매출 증가도 확인되었다.\n\n※ (쿠폰 100만원당 순매출 증가액 상위 5개 업종) 기타상품전문소매업 5.67만원, 음식점업 4.90만원, 종합소매업 3.77만원, 무점포소매업 3.69만원, 음식료품 3.44만원\n\n지역별로는 비수도권·인구감소지역과 저소득·취약계층 비중이 높은 지역에서 상대적으로 높은 매출 증대율이 관측되었다. 반면, 수도권 대도시 중심부에서는 상대적으로 효과가 제한적인 것으로 나타났다.\n\n소비자 사용 효과 측면에서는 소비쿠폰 지급액의 34.7%가 추가 소비로 연결된 것으로 분석되었다. 소득별로는 중위소득 이상 지역에서는 지급액의 25.5%, 중위소득 미만 지역에서는 지급액의 53.2%, 취약계층 비중이 높은 지역에서는 지급액의 72.6%가 추가 소비로 연결된 것으로 분석되었다.\n\n\\>> 거시 효과 분석 결과\n\n거시 효과 분석 결과, 소비쿠폰 집행 시기에 민간소비·소매판매·서비스업 생산·고용 등 주요 거시지표에서 유의미한 상승이 확인되었다. 반면 정책 도입 전후 소비자물가 상승률에 통계적으로 유의미한 변화가 관측되지 않았다.\n\n또한, 동일한 재원을 소비쿠폰으로 지급한 경우와 현금으로 지급하는 경우를 시뮬레이션하여 비교한 결과, 소비쿠폰 지급 방식이 현금 지급 방식에 비해 소비 증가율과 GDP 성장률 기여 측면에서 상대적으로 높은 효과를 보인 것으로 나타났다.\n\n※ (시뮬레이션 결과) 소비 증가율 : 쿠폰 1.2%, 현금 1.0%, GDP 성장률 기여 : 쿠폰 0.6%, 현금 0.25%\n\n\\>> 설문조사 결과\n\n민생회복 소비쿠폰 정책에 대한 국민 인식 조사 결과, 응답자의 84.6%가 불황기 소비 진작 대책이 필요하다고 응답했다. 또한, 응답자의 73.6%가 소비쿠폰이 소상공인·자영업자의 매출 정상화에 기여했다고 응답했으며, 응답자의 67.9%가 소비쿠폰이 일반 국민 소비 정상화에 기여했다고 응답했다.\n\n아울러, 지급시기·금액·사용처 및 전반적 설계 모두 응답자의 80% 이상이 적절하거나 수용 가능한 수준이라고 응답했다.\n\n※ (설문조사 개요) 위탁기관 : 한국리서치, 조사목적 : 민생회복 소비쿠폰 국민 인식 조사  \n조사대상 : 전국 17개 시·도 만 20~69세 성인 남녀, 표본 수 : 1,000명\n\n상세 연구결과는 연구 수행기관인 한국조세재정연구원 홈페이지(https://www.kipf.re.kr)에서 확인할 수 있다.\n\n\\* 담당자 : 재정정책과 박진우(044-205-3705)"}, {"id": 13, "file": "보도자료_125917.md", "title": "한국-프랑스 수교 140주년 특별전 업무협약 체결", "dept": "대통령기록관 기록서비스과", "date": "2026.05.12", "raw": "﻿**\\- 1886년 수교 이후 쌓아온 우호 증진 위해 12일 업무협약 체결**\n\n**\\- 6월 3일부터 특별전 개최, 대통령기록물을 통해 본 양국 교류의 발자취**\n\n행정안전부 대통령기록관(관장 한성원)은 국가유산청 국립고궁박물관과 함께 한국과 프랑스 수교 140주년을 기념하는 특별전, ‘선물과 기록, 한국\\-프랑스 우정의 140년’을 성공적으로 개최하기 위해 5월 12일(화)에 업무협약을 체결한다.\n\n이번 특별전은 1886년 조불수호통상조약 체결 이후 140년이 되는 해를 맞아 양국의 우호를 증진하기 위해 마련했으며, 오는 6월 3일(수)부터 8월 2일(일)까지 두 달간 국립고궁박물관에서 열린다.\n\n대통령기록관과 국립고궁박물관은 이번 업무협약을 바탕으로 전시의 공동 기획 및 유물 대여, 전시 관련 자료의 협조 및 공유, 전시 관련 홍보 및 부대 행사 등 전시의 성공을 위해 다각적인 협력 활동을 추진하기로 뜻을 모았다.\n\n한성원 대통령기록관장은 “대통령기록관은 이번 국립고궁박물관과의 업무협약을 통해 한국과 프랑스 수교 140주년 기념 특별전에서 한국과 프랑스 수교와 관련된 의미 있는 대통령기록물을 선보일 수 있게 될 것”이라며, “앞으로도 관련 기관과의 지속적인 교류와 협력을 통해 다양한 대통령기록물이 국민에게 더 가까이 다가갈 수 있도록 힘쓰겠다”라고 말했다.\n\n\\* 담당자 : 대통령기록관 기록서비스과 김미연(044-211-2245)"}, {"id": 14, "file": "보도자료_125924.md", "title": "제27회 여성리더심화과정 운영", "dept": "지방자치인재개발원", "date": "2026.05.13", "raw": "﻿ **- 지방자치인재개발원, 5월 13일부터 3일간 전국 여성 공직자 180여 명 교육**\n\n **- 자치분권·인공지능(AI)·리더십 역량 강화로 지방정부 핵심 여성 리더 양성**\n\n행정안전부 지방자치인재개발원(원장 안준호)은 5월 13일(수)부터 15일(금)까지 3일 동안 인천 하버파크 호텔에서 전국 지방정부 여성 공직자 180여 명을 대상으로 ‘제27회 여성리더심화과정’을 운영한다.\n\n이번 과정은 ‘여성리더양성과정’ 역대 수료생 중 재직자를 대상으로 매년 열리는 심화 교육으로 자치분권에 기반한 균형 성장을 실현하기 위해 국정과제의 이해를 돕고, 인공지능(AI) 시대에 여성 지도자(리더)에게 필요한 지도력(리더십)과 대응 능력을 키우기 위해 마련했다.\n\n특히 팀장급 이상의 여성 공직자들이 한자리에 모여 정책 추진 경험을 나누고 급변하는 행정 환경에 대응하기 위한 미래 역량을 함께 고민하며 실질적인 협력 기반을 다지는 데 중점을 두었다.\n\n\\>> 자치분권부터 인공지능(AI)까지, 미래 행정을 위한 다채로운 강연\n\n교육 과정은 자치분권과 인공지능(AI), 공직 지도력(리더십)과 인문학 등 다양한 분야를 아우르는 전문가들의 강의로 채워졌다.\n\n첫째 날에는 이향수 건국대학교 교수(한국지방자치학회장)가 ‘지방시대 실현을 위한 분권 강화’를 주제로 자치분권의 필요성과 중앙과 지방 사이의 권한을 다시 배분하는 방향에 대해 설명한다.\n\n이어지는 둘째 날에는 강민구 법무법인 도울 대표 변호사(전 서울고등법원 부장판사)가 인공지능(AI) 확산에 따른 행정 환경의 변화와 공직자의 생존 전략을 담은 ‘인공지능(AI) 시대의 여성 공무원 자세와 생존 비책’을 전수한다. 이어서 김상한 서울시립대학교 초빙교수(전 서울특별시 행정1부시장)는 신뢰를 바탕으로 한 조직 관리와 지도 사례를 공유하며 ‘존경받는 공직자의 코칭 리더십’을 제시한다.\n\n마지막 날에는 구범준 ‘세상을 바꾸는 시간 15분(세바시)’ 대표 제작자(PD)가 ‘삶이 흔들릴 때 나를 지키는 법’을 주제로 변화 속에서도 개인의 정체성을 지키며 성장하는 방법을 다룬 인문학 강연으로 교육의 문을 닫는다.\n\n\\>> 32년 역사를 이어온 여성 공직 지도자(리더) 양성의 산실\n\n한편, 1994년 처음 개설된 ‘여성리더양성과정’은 국내에서 유일하게 6급 여성 공무원을 대상으로 하는 10개월 장기 교육 과정이다.\n\n지난해까지 총 32기에 걸쳐 1,577명의 수료생을 배출했으며, 올해도 43명의 여성 공무원이 참여하여 핵심 지도자(리더)로 거듭나기 위한 교육을 받고 있다. 이 과정은 명실상부한 여성 공직 지도자(리더) 양성의 대표적인 통로로 자리 잡았다.\n\n안준호 지방자치인재개발원장은 “여성리더심화과정을 통해 교육생들이 지방정부의 핵심 지도자(리더)로 우뚝 설 수 있도록 자치분권에 대한 정책 이해를 높이겠다”라며, “앞으로도 변화하는 행정 환경에 유연하게 대응할 수 있는 미래 역량을 강화하는 데 지원을 아끼지 않겠다”고 밝혔다.\n\n\\* 지방자치인재개발원 전문역량교육과 김경숙(063-907-5197)"}, {"id": 15, "file": "보도자료_126412.md", "title": "공무원 육아휴직 대상 자녀 12세 이하로 확대·난임휴직 신설", "dept": "지방인사제도과", "date": "2026.05.26", "raw": "﻿앞으로 12세 이하(초등학교 6학년) 자녀를 둔 공무원도 돌봄을 위해 육아휴직을 쓸 수 있고, 난임 치료를 위한 별도의 휴직을 보장받을 수 있게 된다.\n\n인사혁신처(처장 최동석)와 행정안전부(장관 윤호중)는 이 같은 내용을 담은 ｢국가공무원법｣, ｢지방공무원법｣ 공포안이 26일 국무회의에서 의결됐다고 밝혔다.\n\n먼저, 육아휴직 대상 자녀 나이를 상향한다.\n\n기존에는 8세 이하 또는 초등학교 2학년 이하의 자녀를 가진 공무원만이 육아휴직을 쓸 수 있었으나 앞으로는 12세 이하 또는 초등 6학년 자녀를 둔 공무원도 육아휴직을 쓸 수 있다.\n\n실제 돌봄이 필요한 때인 초등 의무교육 시기(학령기) 양육 과정에서 발생하는 돌봄 수요를 충분히 반영하기 위해서다.\n\n난임 휴직도 신설된다.\n\n지금까지 아이를 갖고자 하는 공무원이 난임 치료를 하려면, 질병 휴직을 사용할 수밖에 없었다.\n\n이번 법률 개정으로 난임 휴직을 별도의 휴직 사유로 신설해 필요한 시기에 공무원이 난임 휴직을 신청할 수 있도록 했다.\n\n육아휴직 대상 자녀 나이 상향은 오는 6월 개정법이 공포되는 대로 즉시 시행될 예정이다.\n\n난임 휴직은 공무원임용령 등 하위법령에서 법 시행을 위한 세부적인 사항을 정비할 수 있도록 6개월의 유예기간을 두고 시행된다.\n\n다만, 개정법이 시행되기 전까지 난임 치료를 위한 휴직은 종전과 같이 질병 휴직 활용이 가능하다.\n\n\\* 담당자 : 지방인사제도과 김정민(044-205-3347)"}];
const state={filtered:docs}; const $=s=>document.querySelector(s);
function cleanMarkdown(md){return md.replace(/<!--[\s\S]*?-->/g,' ').replace(/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/gm,' ').replace(/[|#>*_`\\]/g,' ').replace(/-\s*\d+\s*-/g,' ').replace(/\s+/g,' ').trim()}
function excerpt(md){let t=cleanMarkdown(md).replace(/^보도자료\s*/,'');return t.slice(0,220)+(t.length>220?'…':'')}
function normalize(s){return String(s).toLocaleLowerCase('ko-KR').replace(/\s+/g,' ').trim()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
docs.forEach(d=>{d.excerpt=excerpt(d.raw);d.search=normalize(d.title+' '+d.dept+' '+d.raw)});
function render(){const grid=$('#grid');$('#count').textContent=`결과 ${state.filtered.length}건`;if(!state.filtered.length){grid.innerHTML='<div class="empty">검색 결과가 없습니다. 다른 키워드로 검색해 보세요.</div>';return}grid.innerHTML=state.filtered.map(d=>`<article class="card"><div class="meta"><span class="badge">${escapeHtml(d.dept)}</span><span class="date">${escapeHtml(d.date)}</span></div><h2>${escapeHtml(d.title)}</h2><p class="excerpt">${escapeHtml(d.excerpt)}</p><div class="actions"><button class="open-btn" data-id="${d.id}">원문 보기</button></div></article>`).join('');grid.querySelectorAll('.open-btn').forEach(b=>b.onclick=()=>openDoc(Number(b.dataset.id)))}
function applyFilter(){const words=normalize($('#q').value).split(' ').filter(Boolean);state.filtered=docs.filter(d=>words.every(w=>d.search.includes(w)));render()}
function regexEscape(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function openDoc(id){const d=docs.find(x=>x.id===id);if(!d)return;$('#modalTitle').textContent=d.title;$('#modalMeta').innerHTML=`<span class="badge">${escapeHtml(d.dept)}</span><span class="date">${escapeHtml(d.date)}</span>`;let body=escapeHtml(d.raw);const words=normalize($('#q').value).split(' ').filter(Boolean);for(const w of words){body=body.replace(new RegExp('('+regexEscape(escapeHtml(w))+')','gi'),'<mark>$1</mark>')}$('#modalBody').innerHTML=body;$('#viewer').showModal()}
$('#q').addEventListener('input',applyFilter);$('#closeBtn').onclick=()=>$('#viewer').close();$('#viewer').addEventListener('click',e=>{if(e.target===$('#viewer'))$('#viewer').close()});render();
