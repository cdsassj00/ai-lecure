e, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\50.jpg", "segments": [{"start": 0.0, "end": 5.6, "text": "여러분 안녕하세요. 오늘 준비한 2, 3분짜리 핵심 브리핑. 정말 흥미로운 주제를 다릅니다.", "time": "00:00"}, {"start": 5.6, "end": 11.92, "text": "바로 성평등 가족부가 꽉 막힌 관료제를 안에서부터 어떻게 혁신하고 있는지 보여주는 사례인데요.", "time": "00:05"}, {"start": 11.92, "end": 17.24, "text": "놀랍게도 보완이 철저한 내부망 AI를 직원들이 직접 다루면서 일어나는 변화입니다.", "time": "00:11"}, {"start": 17.24, "end": 19.52, "text": "지체할 시간 없이 바로 들어가 보죠.", "time": "00:17"}, {"start": 19.52, "end": 25.16, "text": "솔직히 관료제 혹은 공무원 사회라고 하면 딱 떠오르는 이미지가 있죠?", "time": "00:19"}, {"start": 25.16, "end": 29.84, "text": "끊없는 수작업, 산더미 같은 보고서, 그리고 결제의 늡.", "time": "00:25"}, {"start": 29.84, "end": 30.84, "text": "그런데 말입니다.", "time": "00:29"}, {"start": 30.84, "end": 34.6, "text": "만약 공무원들이 누군가 만들어준 프로그램을 쓰는 게 아니라", "time": "00:30"}, {"start": 34.6, "end": 41.36, "text": "본인들의 일상적인 업무병목을 뚫어줄 AI 도구를 직접 만들도록 훈련 받는다면 어떨까요?", "time": "00:34"}, {"start": 41.36, "end": 45.52, "text": "상상만 하던 그 흥미로운 실험이 지금 실제로 벌어지고 있습니다.", "time": "00:41"}, {"start": 45.52, "end": 52.96, "text": "여기서 성평등가족부가 꺼내던 핵심 카드가 바로 AI-Agent-123 프로젝트입니다.", "time": "00:45"}, {"start": 52.96, "end": 55.04, "text": "이름부터 딱 감이 오시죠?", "time": "00:52"}, {"start": 55.04, "end": 64.76, "text": "직원 한 명이 2개의 AI 에이전트를 개발해서 최소 3명 이상의 동료가 함께 사용하게 만들자는 아주 직관적인 산의 혁신 운동입니다.", "time": "00:55"}, {"start": 64.76, "end": 76.56, "text": "붙여 내부에 강력한 PC급 GPU 서버를 안전하게 구축해 둬서 직원들이 보완 걱정 없이 자기 입맛에 맞는 맞춤형 AI를 뚝딱뚝딱 만들 수 있게 판을 깔아준 거죠.", "time": "01:04"}, {"start": 76.56, "end": 82.06, "text": "그럼 이걸 어떻게 현실로 만들까요? 그냥 AI 서보세요 하고 끝내는 게 아닙니다.", "time": "01:16"}, {"start": 82.06, "end": 85.66, "text": "아주 체계적인 두 가지 맞춤형 인증트랙을 짰어요.", "time": "01:22"}, {"start": 85.66, "end": 90.42, "text": "일반 직원 120명을 대상으로는 생성형 AI의 기본기를 탄탄하게 다져주는", "time": "01:25"}, {"start": 90.42, "end": 92.14, "text": "그린트랙을 운영하고요.", "time": "01:30"}, {"start": 92.14, "end": 97.7, "text": "산해 AI 동호회원 등 30명을 대상으로는 실제 바이브 코딩과 에이전트 개발을", "time": "01:32"}, {"start": 97.7, "end": 102.02, "text": "딥다입으로 파고 드는 전문가 과정, 즉 블루트랙을 가동합니다.", "time": "01:37"}, {"start": 102.02, "end": 104.26, "text": "속도감도 장난이 아닙니다.", "time": "01:42"}, {"start": 104.26, "end": 110.62, "text": "이 거대한 계획을 천천히 간보는 게 아니라 당장 2026년 4분기부터", "time": "01:44"}, {"start": 110.62, "end": 113.18, "text": "에이전트 개발 실습에 돌입합니다.", "time": "01:50"}, {"start": 113.18, "end": 119.14, "text": "그리고 2027년 내내 1분기부터 4분기까지 블루트랙과 그린트랙 교육을", "time": "01:53"}, {"start": 119.14, "end": 121.14, "text": "정신없이 쏟아 붙죠.", "time": "01:59"}, {"start": 121.14, "end": 127.14, "text": "책상머리 계획이 아니라 현장에서 즉각적으로 실행해 버리는 추진력이 대단합니다.", "time": "02:01"}, {"start": 127.14, "end": 128.78, "text": "백몬이 부려 일견이죠.", "time": "02:07"}, {"start": 128.78, "end": 132.06, "text": "실제로 이분들이 뭘 만들어냈는지 한번 볼까요.", "time": "02:08"}, {"start": 132.06, "end": 135.3, "text": "첫 번째 골칫거리는 언론 모니터링 이었습니다.", "time": "02:12"}, {"start": 135.3, "end": 136.38, "text": "상상해보세요.", "time": "02:15"}, {"start": 136.38, "end": 140.5, "text": "매일 아침 쏟아지는 수백 건의 기사를 일일이 눈으로 읽으면서", "time": "02:16"}, {"start": 140.5, "end": 145.1, "text": "이게 긍정적인 톤인지, 부정적인 톤인지 체크하고 보고서 쓰는 거", "time": "02:20"}, {"start": 145.1, "end": 147.26, "text": "정말 피곤한 수작업이잖아요.", "time": "02:25"}, {"start": 147.26, "end": 151.38, "text": "그래서 이들은 AI를 이용해 기사 감성을 즉시 분석하고", "time": "02:27"}, {"start": 151.38, "end": 155.86, "text": "보고서까지 자동으로 뽑아내는 해결책을 직접 만들어냈습니다.", "time": "02:31"}, {"start": 155.86, "end": 158.66, "text": "화면을 보시면 그 결과물이 딱 나옵니다.", "time": "02:35"}, {"start": 158.66, "end": 163.34, "text": "바이브 코딩을 활용해서 자체적으로 크롬 확장 프로그램을 만들어 버렸어요.", "time": "02:38"}, {"start": 163.34, "end": 169.06, "text": "보도 자료를 기반으로 관련 뉴스를 쫘악 긁어오면 내부 생성형 AI가 해당 기사들이", "time": "02:43"}, {"start": 169.06, "end": 174.94, "text": "긍정인지 부정인지 단 몇 주만에 판별해서 보고서 형태로 깔끔하게 정리해줍니다.", "time": "02:49"}, {"start": 174.94, "end": 177.66, "text": "이래 효율이 그야말로 수직 상승하는 거죠.", "time": "02:54"}, {"start": 177.66, "end": 181.78, "text": "자, 두 번째 벽은 내부 통계 데이터 찾기였습니다.", "time": "02:57"}, {"start": 181.78, "end": 184.26, "text": "아시다시피 공공기관은 보안 규정 때문에", "time": "03:01"}, {"start": 184.26, "end": 189.3, "text": "채 GPT 하튼 외부 AI를 업무데이터에 함부로 쓸 수가 없어요.", "time": "03:04"}, {"start": 189.3, "end": 193.14, "text": "그렇다고 그 두꺼운 통계 연보를 매번 수동으로 뒤적이는 건", "time": "03:09"}, {"start": 193.14, "end": 198.7, "text": "완전히 시간 낭비죠. 그래서 이들은 내부 통계 자료를 안전한 내부 AI에", "time": "03:13"}, {"start": 198.7, "end": 205.02, "text": "학습시키는 방식, 즉, RAG 시스템을 구축해서 이 딜레마를 단번에 깨 버렸습니다.", "time": "03:18"}, {"start": 205.02, "end": 209.94, "text": "이 내부 레그 시스템이 내놓는 결과물을 한번 보세요. 진짜 놀랍습니다.", "time": "03:25"}, {"start": 209.94, "end": 214.98, "text": "직원이 그냥 자연스러운 일상으로 질문만 툭 던져도 2025년 디지털", "time": "03:29"}, {"start": 214.98, "end": 219.9, "text": "성범죄 피해 유형 같은 복잡하고 방대한 통계를 즉시 분석해줍니다.", "time": "03:34"}, {"start": 219.9, "end": 227.02, "text": "더 대박인 건 자료집 53적처럼 정확한 페이지 출처까지 딱 찍어서 근고로 제시한다는 거예요.", "time": "03:39"}, {"start": 227.02, "end": 231.34, "text": "수십 분씩 걸리던 수작업 검색의 시대가 맑게도록 끝나버린 겁니다.", "time": "03:47"}, {"start": 231.34, "end": 236.86, "text": "자 오늘 이 3분짜리 컴팩트한 브리핑에서 우리가 가져가야 할 진짜 핵심은 이겁니다.", "time": "03:51"}, {"start": 236.86, "end": 240.26, "text": "현장에서 어디가 꽉 막혀 있는지 어떤 업무가 병목인지", "time": "03:56"}, {"start": 240.26, "end": 247.46, "text": "가장 뼈저리게 아는 실무자들의 손에 직접 AI를 만들 수 있는 힘과 무기를 주어주면 어떤 일이 바로 질까요?", "time": "04:00"}, {"start": 247.46, "end": 250.74, "text": "이건 담슨이 새로운 소프트웨어 하나를 도입하는 수준이 아닙니다.", "time": "04:07"}, {"start": 250.74, "end": 255.74, "text": "공공서비스가 움직이는 엔진과 그 속도 자체를 근본적으로 혁신하게 되는 거죠.", "time": "04:10"}, {"start": 255.74, "end": 259.9, "text": "과연 다른 공공기관들은 이 거대한 변화의 물결에 어떻게 올라탈까요?", "time": "04:15"}, {"start": 259.9, "end": 263.54, "text": "깊이 생각해 볼 만한 질문을 남기면서 오늘 브리핑은 여기서 마치겠습니다.", "time": "04:19"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/50/1FoVwpOkgpEWkSzAmyi9BUVd_EsccTe-D.avi", "frame": "../영상장면/50.jpg", "quotes": [{"start": 34.6, "end": 41.36, "text": "본인들의 일상적인 업무병목을 뚫어줄 AI 도구를 직접 만들도록 훈련 받는다 , {"start": 29.36, "end": 35.54, "text": "특히 폐쇄 방향 환경으로 최신 AI 도입과 자발적인 AX 흐름에 정체되어 있으며", "time": "00:29"}, {"start": 35.54, "end": 39.22, "text": "기존의 수동적인 교육 방식 역시 한계의 측면에 있습니다.", "time": "00:35"}, {"start": 39.22, "end": 42.66, "text": "이제는 보안 제약을 극복하고 전무성을 극대할 수 있는", "time": "00:39"}, {"start": 42.66, "end": 47.22, "text": "능동양 실무 교육이 필요한 시점입니다.", "time": "00:42"}, {"start": 47.22, "end": 52.94, "text": "이를 실현하기 위해 현업에서 즉시 적용 가능한 3단계 실현 계획을 추진하겠습니다.", "time": "00:47"}, {"start": 52.94, "end": 54.66, "text": "첫째 인프라 단계입니다.", "time": "00:52"}, {"start": 54.66, "end": 58.28, "text": "오프라인 폐쇄 방향 환경에서도 지연 없이 시스발 수 있도록", "time": "00:54"}, {"start": 58.28, "end": 64.4, "text": "튜토리얼을 제공하고 폐쇄 환경에서 최적화된 인프라 스킬을 체계적으로 제공하겠습니다.", "time": "00:58"}, {"start": 64.4, "end": 66.08, "text": "둘째, 자동화 단계입니다.", "time": "01:04"}, {"start": 66.08, "end": 73.26, "text": "메타프롬프팅과 바이브 코딩을 통해 실제 업무데이터로 데이터 처리 자동화를 직접 기획하고 구현하겠습니다.", "time": "01:06"}, {"start": 73.26, "end": 76.16, "text": "셋째, 데이터 분석 활용 단계입니다.", "time": "01:13"}, {"start": 76.16, "end": 81.72, "text": "기간에서 축적된 과거 장애 이력과 실탠 로그 데이터를 AI에 학습시켜", "time": "01:16"}, {"start": 81.72, "end": 90.12, "text": "이벤트 발생 시 원인을 신속하게 규몽하고 최적화 조치 방안을 즉각 도출하도록 실무에 적용하겠습니다.", "time": "01:21"}, {"start": 90.12, "end": 94.98, "text": "본 교육을 통한 기대 효과로 첫째 단순 반복 업무를 획기적으로 줄입니다.", "time": "01:30"}, {"start": 94.98, "end": 102.12, "text": "데이터 취약과 로그를 로그 정리를 자동하여 전문 인력이 고부가 같이 업무에 잔념하도록 전환합니다.", "time": "01:34"}, {"start": 102.12, "end": 105.52, "text": "둘째, 실탠 분석 및 관리 역량을 극대해야 합니다.", "time": "01:42"}, {"start": 105.52, "end": 112.48, "text": "장애 대항 시간을 대북 다추가여 정부 데이터 센터의 가동률과 시스템 품질을 한 단계 끌어올리겠습니다.", "time": "01:45"}, {"start": 112.48, "end": 115.28, "text": "셋째 자체 LLM 구축을 완성합니다.", "time": "01:52"}, {"start": 115.28, "end": 119.04, "text": "폐쇄 환경에서 시스템 전문가로서 전문성을 바탕으로", "time": "01:55"}, {"start": 119.04, "end": 122.8, "text": "기간에 최적화된 남한의 LLM을 직접 구축 운영하는", "time": "01:59"}, {"start": 122.8, "end": 128.1, "text": "독립적인 AX 인재를 양상할 수 있습니다.", "time": "02:02"}, {"start": 128.1, "end": 132.06, "text": "과거 인터넷에 등장으로 1인 유튜버가 방송을 대체하듯", "time": "02:08"}, {"start": 132.06, "end": 137.8, "text": "인정한 AX 시대는 기획력만으로 AI가 코딩하고 서비스하는 시대가 도래했습니다.", "time": "02:12"}, {"start": 137.8, "end": 144.82, "text": "관리하는 이미 장애 분석을 통한 문제의결의 전문적인 도매인 지식과 경험이 있습니다.", "time": "02:17"}, {"start": 144.82, "end": 154.94, "text": "실모형 퍼실리 데이터로서 탄탄한 전문성을 갖춘 직원들이 마치 1인 유튜버처럼 나만의 AI를 직접 구현할 수 있도록 밀접 가이드하겠습니다.", "time": "02:24"}, {"start": 154.94, "end": 164.38, "text": "체계적인 반복 숙달 교육을 통해 스스로 과제를 발굴하고 확산하는 자생적인 AX 체계를 완성하도록 재현하겠습니다.", "time": "02:34"}, {"start": 164.38, "end": 167.62, "text": "경청해 주셔서 감사합니다.", "time": "02:44"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/51/1NPG2HCXMMToCG_q0tjUsKbUQMYLUJrWl.mp4", "frame": "../영상장면/51.jpg", "quotes": [{"start": 64.4, "end": 66.08, "text": "둘째, 자동화 단계입니다.", "time": "01:04", "category": "AI 업무 활용 관련 기재"}, {"start": 154.94, "end": 164.38, "text": "체계적인 반복 숙달 교육을 통해 스스로 과제를 발굴하고 확산하는 자생적인 AX 체계를 완성하도록 재현하겠습니다.", "time": "02:34", "category": "기관 내 확산 계획 관련 기재"}, {"start": 35.54, "end": 39.22, "text": "기존의 수동적인 교육 방식 역시 한계의 측면에 있습니다.", "time": "00:35", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 51, "name": "김정웅", "title": "강사 양성과정 신청서(국가정보자원관리원_김정웅).pdf", "mime": "application/pdf", "bytes": 1111408, "downloaded": true, "url": "https://drive.google.com/file/d/1waWTc-TF2SKcsc5afP_-zbYIeoP0bblM/view?usp=drivesdk", "local": "../원본/51/1waWTc-TF2SKcsc5afP_-zbYIeoP0bblM.pdf", "id": "1waWTc-TF2SKcsc5afP_-zbYIeoP0bblM"}, {"n": 51, "name": "김정웅", "title": "기관 AI·데이터 역량강화 실행계획 3분 발표(국가정보자원관리원_김정웅).mp4", "mime": "video/mp4", "bytes": 47394863, "downloaded": true, "url": "https://drive.google.com/file/d/1NPG2HCXMMToCG_q0tjUsKbUQMYLUJrWl/view?usp=drivesdk", "local": "../원본/51/1NPG2HCXMMToCG_q0tjUsKbUQMYLUJrWl.mp4", "id": "1NPG2HCXMMToCG_q0tjUsKbUQMYLUJrWl"}], "doc_count": 1, "media_count": 1}, {"n": 52, "original_no": 52, "row": 53, "name": "최선화", "org": "행정안전부 국립재난안전연구원", Fziz/view?usp=drivesdk", "id": "1xeiIAN2SuXmKrYUSI2oQIdz93JbQFziz"}, {"text": "실현 가능한 계획을 제시해 주십시오 운영의 구체성실현 기능•통확산 효과 등을 종합 심사합니다. 1) 기관 자체 교육 운영 실적 기간", "source": "강사 양성과정 신청서(국립재난안전연구원_최선화).pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1xeiIAN2SuXmKrYUSI2oQIdz93JbQFziz/view?usp=drivesdk", "id": "1xeiIAN2SuXmKrYUSI2oQIdz93JbQFziz"}]}, "media": [{"n": 52, "id": "1OQwCevimQD1MKAVzoceZEoux1mwZemNz", "file": "기관 AI·데이터 역량강화 실행계획 3분 발표(국립재난안전연구원_최선화).mp3", "url": "https://drive.google.com/file/d/1OQwCevimQD1MKAVzoceZEoux1mwZemNz/view?usp=drivesdk", "duration": 187.056, "video": false, "audio": true, "segments": [{"start": 0.05, "end": 5.05, "text": "안녕하십니까. 국립체난안전연구원의 최선화연구관입니다.", "time": "00:00"}, {"start": 5.05, "end": 14.05, "text": "저희 기관은 재난안정정책과 기술을 연구 개발하는 연구기관으로 다양한 분야 전문가들로 구성되어 있습니다.", "time": "00:05"}, {"start": 14.05, "end": 22.05, "text": "연구 개발에서 데이터 AI 기술 활용은 전공관 무관하게 모든 연구자에게 요구되는 영향입니다.", "time": "00:14"}, {"start": 22.05, "end": 28.05, "text": "지금까지 연구자들은 각자 서울 등 타 지역에서 AI 교육을 수강해왔습니다.", "time": "00:22"}, {"start": 28.05, "end": 31.05, "text": "하지만 문제는 그 다음입니다.", "time": "00:28"}, {"start": 31.05, "end": 37.05, "text": "교육에서 배운 내용을 실제로 데이터분석, 시뮬레이션, 멋진 러닝을 활용해", "time": "00:31"}, {"start": 37.05, "end": 41.05, "text": "자신의 연구 과제 후 문제 해결에 적용해야 하지만", "time": "00:37"}, {"start": 41.05, "end": 48.05, "text": "교육 내용을 현실 과제에 직접 연결하여 해결을 하는데 어려움이 있어 포기하는 경우가 많았습니다.", "time": "00:41"}, {"start": 48.05, "end": 55.05, "text": "이 문제의 핵심은 교육 자체가 아니라 교육 이후에 적용 공백에 있다고 생각합니다.", "time": "00:48"}, {"start": 55.05, "end": 65.05, "text": "그래서 저는 봉강사 양성 과정을 지원하여 트랙2 노코드 데이터 분석 과정을 담당하는 기간 내부 강사가 되고자 합니다.", "time": "00:55"}, {"start": 65.05, "end": 67.05, "text": "운영 계획은 3단계입니다.", "time": "01:05"}, {"start": 67.05, "end": 75.05, "text": "첫째, 기초 과정을 통해 전부서 희망연구자를 대상으로 데이터 전철이와 분석의 기본기를 다집니다.", "time": "01:07"}, {"start": 75.05, "end": 82.05, "text": "둘째, 심화 워크샵에서는 각자 소속 부서가 실제로 다루는 재난 데이터", "time": "01:15"}, {"start": 82.05, "end": 88.05, "text": "예를 들어 도시침수, 감음, 삼불, 지진 데이터를 가지고 직접 실습합니다", "time": "01:22"}, {"start": 88.05, "end": 99.05, "text": "셋째, 프로젝트 워크샵을 통해 팀 단위로 실제 연구 주제 중 소규모 문제를 1년의 과정을 해결하여 산출물을 만들어냅니다", "time": "01:28"}, {"start": 99.05, "end": 110.05, "text": "이 모든 과정 이후 상시 멘토링 채널을 운영하여 연구자가 막히는 순간 바로 도움을 받을 수 있도록 하겠습니다.", "time": "01:39"}, {"start": 110.05, "end": 116.05, "text": "기대 효과는 크게 세 가지로 말씀드리겠습니다. 첫째, 활용도의 근본적 개선입니다.", "time": "01:50"}, {"start": 116.05, "end": 125.05, "text": "교육과 실무사이의 공백을 기간 내부에서 상시 매우줌으로서 배운 내용이 실제 연구 성과로 이어집니다.", "time": "01:56"}, {"start": 125.05, "end": 133.69, "text": "둘째, 같은 재난분여에 연구하는 동료가 강사이기 때문에 소통의 밀도가 다릅니다.", "time": "02:05"}, {"start": 133.69, "end": 142.97, "text": "셋째, 반복되는 출장 교육비와 여비를 절감하면서 동시에 지속 가능한 교육 인프라를 구축할 수 있습니다.", "time": "02:13"}, {"start": 142.97, "end": 146.01, "text": "수료 전은 세 가지 역할을 수행하고자 합니다.", "time": "02:22"}, {"start": 146.01, "end": 154.97, "text": "첫 번째는 트랙투 노코드 데이터 분석 교육을 기획하고 직접 운영하는 강사로서의 역할입니다.", "time": "02:26"}, {"start": 154.97, "end": 164.57, "text": "둘째, 교육이 끝난 뒤에는 연구자들의 질의에 상시응답하는 사후 지원 창구 역할입니다.", "time": "02:34"}, {"start": 164.57, "end": 172.83, "text": "셋째, 저희 기간의 고유의 연구 주제에 맞춘 실습 자료를 지속적으로 개발하고 보완하는 역할입니다.", "time": "02:44"}, {"start": 172.83, "end": 182.97, "text": "저는 이 과정이 단순히 기술 교육이 아니라 저희 기간의 AI 영향을 높여 연구 환경을 근본적으로 바꿀 수 있는 계기라고 확신합니다.", "time": "02:52"}, {"start": 182.97, "end": 184.27, "text": "감사합니다.", "time": "03:02"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/52/1OQwCevimQD1MKAVzoceZEoux1mwZemNz.mp3", "frame": null, "quotes": [{"start": 5.05, "end": 14.05, "text": "저희 기관은 재난안정정책과 기술을 연구 개발하는 연구기관으로 다양한 분야 전문가들로 구성되어 있습니다.", "time": "00:05", "category": "AI 업무 활용 관련 기재"}, {"start": 99.05, "end": 110.05, "text": "이 모든 과정 이후 상시 멘토링 채널을 운영하여 연구자가 막히는 순간 바로 도움을 받을 수 있도록 하겠습니다.", "time": "01:39", "category": "강의·학습 지원 관련 기재"}, {"start": 154.97, "end": 164.57, "text": "둘째, 교육이 끝난 뒤에는 연구자들의 질의에 상시응답하는 사후 지원 창구 역할입니다.", "time": "02:34", "category": "기관 내 확산 계획 관련 기재"}, {"s PpmxaYn1fG9DNjYlItOVWFTpnK"}], "과정·이유·검증 설명 관련 기재": [{"text": "나 초심자의 눈높이에 맞춰 전달하는 역량을 검증받았습니다. 2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 m 생성형 AI 및 프롬프트 엔지니어링 (업무 자동화 및 생산성 향상)", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서.pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1NnSMGUPpmxaYn1fG9DNjYlItOVWFTpnK/view?usp=drivesdk", "id": "1NnSMGUPpmxaYn1fG9DNjYlItOVWFTpnK"}, {"text": "- 공공 행정 보안 가이드라인을 준수하는 안전한 AI 활용법 및 환각 검증 기법 안내 가능 m 데이터 분석 및 머신러닝/통계 도구 (Python, R, 통계 패키지) - 활용 경험 : Python(Pandas, Scikit-learn) 및 R을 활용한 정형·비정형 공공 데이터", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서.pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1NnSMGUPpmxaYn1fG9DNjYlItOVWFTpnK/view?usp=drivesdk", "id": "1NnSMGUPpmxaYn1fG9DNjYlItOVWFTpnK"}, {"text": "직면하는 기술적 병목과 오류를 1:1로 즉각 피드백하고 해소하는 실습 조력자 역할을 수행 - 부서별 AI 행정 효율화 과제 발굴 및 사내 학습 네트워크 구축 단발성 교육 수료에 그치지 않고 수료생들이 실제 소관 부서의 반복·수작업 프로세스를 AI 도", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서.pdf", "page": 7, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1NnSMGUPpmxaYn1fG9DNjYlItOVWFTpnK/view?usp=drivesdk", "id": "1NnSMGUPpmxaYn1fG9DNjYlItOVWFTpnK"}]}, "media": [{"n": 53, "id": "1PdUiPTYpgUPpdHiJlf-Io7mMV0HKXr5J", "file": "창원특례시 AI 행정혁신 실행계획.mp4", "url": "https://drive.google.com/file/d/1PdUiPTYpgUPpdHiJlf-Io7mMV0HKXr5J/view?usp=drivesdk", "duration": 184.556825, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\53.jpg", "segments": [{"start": 0.5, "end": 6.0, "text": "안녕하십니까. 창원특래시 디지털 정책 담당관, 이재익 주무관입니다.", "time": "00:00"}, {"start": 6.0, "end": 11.38, "text": "창원특래시 AI 데이터 역량 강화 실행 계획에 대해 발표하겠습니다.", "time": "00:06"}, {"start": 11.38, "end": 16.82, "text": "행정 전문은 AI로 다이어트. AI 에러는 1대1 밀착 가외.", "time": "00:11"}, {"start": 16.82, "end": 21.7, "text": "학경 시간은 시민에게 우린하는 비전을 가지고 문제점을 해결해 보겠습니다.", "time": "00:16"}, {"start": 21.7, "end": 26.94, "text": "AI 도입에는 3대 걸림돌이 있습니다. 반복 행정이 가장 큰 문제인데요.", "time": "00:21"}, {"start": 26.94, "end": 32.54, "text": "이것에 너무 많은 시간이 소요되고 있어서 대민서비스 기획에 시간이 부족합니다.", "time": "00:26"}, {"start": 32.54, "end": 42.94, "text": "단발성 교육도 한계를 가지고 있으며 비정궁 직원들은 심리적 장벽이나 LLM 답변에 맥목적으로 의존하는 경영에서 이것을 해결하고자 저희는", "time": "00:32"}, {"start": 42.94, "end": 48.5, "text": "행암부 표준 교환 기반하여 4단계 자체 로드맵을 구성하였습니다.", "time": "00:42"}, {"start": 48.5, "end": 56.5, "text": "이 과정을 통해서 최종적으로는 행암부 AI 챔피언과 연계하여 부서에 발생할 수 있는 현압 문제를 해결하고", "time": "00:48"}, {"start": 56.5, "end": 61.74, "text": "P.O.C.모델을 만들어 새로운 사업가 있는 것이 목표입니다.", "time": "00:56"}, {"start": 61.74, "end": 67.98, "text": "핵심 차별점으로는 AI오피사와 맨토링을 고려하고 있는데", "time": "01:01"}, {"start": 67.98, "end": 75.78, "text": "주기적 피드백이 부제한 많은 직원들에게 직접 코칭하여 문제점을 해결해 줄 수 있도록 하겠습니다.", "time": "01:07"}, {"start": 75.78, "end": 81.18, "text": "이 성공이 자산화가 되고 선순한 구조로 이어질 수 있도록 하겠습니다.", "time": "01:15"}, {"start": 81.18, "end": 90.72, "text": "시간 단축과 저희는 교육 이수인원, 맞춤 프롬프트 자산화, 행정 차고 방지 이런 것을 정량적 목표를 하고 있는데", "time": "01:21"}, {"start": 90.72, "end": 103.28, "text": "가장 중요한 것은 주도적 문제 해결 역량을 내재하여 직원들이 스스로 문제를 해결하고 대민 서비스의 품질을 고도화 할 수 있는 것이 가장 중요하다고 생각합니다.", "time": "01:30"}, {"start": 103.28, "end": 107.4, "text": "저는 행정안전부 AI 챔피언 블루 과정을 수료하였고", "time": "01:43"}, {"start": 107.4, "end": 111.96, "text": "행정안전부에서 진행하는 공모전 프로젝트에서", "time": "01:47"}, {"start": 111.96, "end": 114.88, "text": "AI 예측 머신러닝 모델 개발을 통해", "time": "01:51"}, {"start": 114.88, "end": 117.92, "text": "행정안전부 장관상을 수상하였습니다.", "time": "01:54"}, {"start": 117.92, "end": 120.56, "text": "현업에서 AI 관련된 프로그램을", "time": "01:57"}, {"start": 120.56, "end": 122.12, "text": "20건 이상 개발하였고", "time": "02:00"}, {"start": 122.12, "end": 126.8, "text": "데이터 분석은 연 30건 정도 진행을 하고 있습니다.", "time": "02:02"}, {"start": 126.8, "end": 130.88, "text": "산의 퍼실레이터로서 3대 실천 다짐을 외쳐보겠습니다.", "time": "02:06"}, {"start": 130.88, "end": 135.24, "text": "밀착조력자 동료의 에러를 함께 푸는 퓨터가 되겠습니다.", "time": "02:10"}, {"start": 135.24, "end": 138.96, "text": "맞춤형, 직강, 행암부 표준 교환을", "time": "02:15"}, {"start": 138.96, "end": 142.44, "text": "시위의 행감, 보도자료, 구청, 민원 등", "time": "02:18"}, {"start": 142.44, "end": 146.88, "text": "창원시에 발생하는 고유 업무 서식과 직접 결합하여", "time": "02:22"}, {"start": 146.88, "end": 150.72, "text": "즉시 써먹는 교육을 진행할 수 있도록 하겠습니다.", "time": "02:26"}, {"start": 150.72, "end": 154.4, "text": "마지막으로 선순한 자생 네트워크를 안착시켜", "time": "02:30"}, {"start": 154.4, "end": 158.08, "text": "오피스아워 도입을 통해 POC를 발굴하고", "time": "02:34"}, {"start": 158.08, "end": 164.2, "text": "AI 챔피언 수료자를 늘릴 수 있도록 하겠습니다.", "time": "02:38"}, {"start": 164.2, "end": 168.56, "text": "저는 행정 비유율을 AI로 다이어트 하겠습니다.", "time": "02:44"}, {"start": 168.56, "end": 171.6, "text": "이러한 방법을 통해 창원특래시의 AI 데이터", "time": "02:48"}, {"start": 171.6, "end": 174.76, "text": "행정 협신 생태계 구축에 앞장사겠습니다.", "time": "02:51"}, {"start": 174.76, "end": 177.92, "text": "감사합니다. 이제 얘기입니다.", "time": "02:54"}, {"start": 177.92, "end": 181.8, "text": "KTX표도 이미 예매해뒀기 때문에 더 잘 부탁드립니다.", "time": "02:57"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/53/1PdUiPTYpgUPpdHiJlf-Io7mMV0HKXr5J.mp4", "frame": "../영상장면/53.jpg", "quotes": [{"start": 120.56, "end": 122.12, "text": "20건 이상 개발하였고", "time": "02:00", "category": "AI 업무 활용 관련 기재"}, {"start": 146.88, "end": 150.72, "text": "즉시 써먹는 교육을 진행할 수 있도록 하겠습니다.", "time": "02:26", "category": "강의·학습 지원 관련 기재"}, {"start": 32.54, "end": 42.94, "text": "단발성 교육도 한계를 가지고 있으며 비정궁 직원들은 심리적 장벽이나 LLM 답변에 맥목적으로 의존하는 경영에서 이것을 해결하고자 저희는", "time": "00:32", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 53, "name": "이재익", "title": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서.pdf", "mime": "application/pdf", "bytes": 1044575, "downloaded": true, "url": "https://drive.google.com/file/d/1NnSMGUPpmxaYn1fG9DNjYlItOVWFTpnK/view?usp=drivesdk", "local": "../원본/53/1NnSMGUPpmxaYn1fG9DNjYlItOVWFTpnK.pdf", "id": "1NnSMGUPpmxaYn1fG9DNjYlItOVWFTpnK"}, {"n": 53, "name": "이재익", "title": "창원특례시 AI 행정혁신 실행계획.mp4", "mime": "video/mp4", "bytes": 53018826, "downloaded": true, "url": ", "time": "00:09"}, {"start": 16.0, "end": 20.0, "text": "배경과 문제점, 실행전략순으로 말씀드리겠습니다.", "time": "00:16"}, {"start": 20.0, "end": 26.16, "text": "먼저 배경입니다.", "time": "00:20"}, {"start": 26.16, "end": 34.8, "text": "지난 10월 유연회는 방송통신 유연회 대체 방송, 미디어 통신 통합 규제 기구로 출범을 했고", "time": "00:26"}, {"start": 34.8, "end": 41.68, "text": "올해 2월에는 인공지능기본법상 기본계획인 대한민국 인공지능 행동계획이 발표되었는데", "time": "00:34"}, {"start": 41.68, "end": 53.0, "text": "그 안에서 AI 범죄 근절 및 대응 영향 강화와 K-Culture 산업의 AX 활성화 지원 등 중요한 업무를 우리 유연회가 총괄트록 되었습니다.", "time": "00:41"}, {"start": 53.0, "end": 57.58, "text": "이러한 계획의 일환으로 불법 허위주작정보를 유통을 방지하고자", "time": "00:53"}, {"start": 57.58, "end": 64.82, "text": "정보통신 망법을 개정하고 7월 7일 시행한 바 있습니다.", "time": "00:57"}, {"start": 64.82, "end": 70.08, "text": "개정된 정보통신 망법의 모든 불법 허위정보가 AI 생성물은 아니지만", "time": "01:04"}, {"start": 70.08, "end": 75.2, "text": "박미통의 업무가 AI와 밀접한 관계가 있으면 분명합니다.", "time": "01:10"}, {"start": 75.2, "end": 79.12, "text": "AI로 인해 불법 허위주작 정보가 확산되고 있고", "time": "01:15"}, {"start": 79.12, "end": 84.68, "text": "박미통이가 탐지하던 온라인 불법 유예정보 유형이 확대되고", "time": "01:19"}, {"start": 84.68, "end": 86.84, "text": "고도화되고 있기 때문입니다.", "time": "01:24"}, {"start": 86.84, "end": 88.28, "text": "그럼에도 불구하고", "time": "01:26"}, {"start": 88.28, "end": 91.04, "text": "위원회 내부 AI 영향 발전 속도는", "time": "01:28"}, {"start": 91.04, "end": 93.72, "text": "AI 관련 업무를 충분히 처리하기에", "time": "01:31"}, {"start": 93.72, "end": 96.6, "text": "아직 모자란 상황입니다.", "time": "01:33"}, {"start": 96.6, "end": 99.88, "text": "또한 위원회 내년 AI 관련 요산은 증가했지만", "time": "01:36"}, {"start": 99.88, "end": 103.8, "text": "정작 위원회 내부 직원을 위한 예산은 없습니다.", "time": "01:39"}, {"start": 103.8, "end": 105.6, "text": "이러한 상황에서 내년 초에", "time": "01:43"}, {"start": 105.6, "end": 108.36, "text": "온 AI 서비스가 도입될 예정인데요.", "time": "01:45"}, {"start": 108.36, "end": 109.92, "text": "AI를 활용하지 못한다라면", "time": "01:48"}, {"start": 109.92, "end": 112.92, "text": "만 혼란이 있을 것이라 예상되기도 하고", "time": "01:49"}, {"start": 112.92, "end": 117.6, "text": "온 AI를 통해 개선할 수 있는 놈과 무궁무진할 것이면서도 불구하고", "time": "01:52"}, {"start": 117.6, "end": 123.08, "text": "직원들의 역량이 충분치 않다라고 생각됩니다.", "time": "01:57"}, {"start": 123.08, "end": 127.16, "text": "이러한 상황을 극복하고자 제가 이 교육을 이수한 후", "time": "02:03"}, {"start": 127.16, "end": 132.56, "text": "연애 내부의 AI에 AX와 AI 활용 방법을 확산하고자 합니다.", "time": "02:07"}, {"start": 132.56, "end": 134.6, "text": "실행 전략은 다운 것 같습니다.", "time": "02:12"}, {"start": 134.6, "end": 139.68, "text": "상시 학습 체계를 구축하고 AI 기초부터 실전 제작까지", "time": "02:14"}, {"start": 139.68, "end": 142.96, "text": "상설 교육 과정을 정착시키고 싶습니다.", "time": "02:19"}, {"start": 142.96, "end": 147.16, "text": "콘텐츠 운영 표준으로 교환을 실물맞게 재구성하고", "time": "02:22"}, {"start": 147.16, "end": 150.56, "text": "유연의 CAI 의인 부위원장님의 보고를 마친", "time": "02:27"}, {"start": 150.56, "end": 153.26, "text": "성과 관리와 확산체계를 마련해서", "time": "02:30"}, {"start": 153.26, "end": 158.36, "text": "조직 전체가 확산의 주체가 될 수 있도록 할 계획입니다.", "time": "02:33"}, {"start": 158.36, "end": 161.72, "text": "2026년 시범 운영을 기반으로 하고", "time": "02:38"}, {"start": 161.72, "end": 164.42, "text": "2028년 고도화하는 것을 목표로", "time": "02:41"}, {"start": 164.42, "end": 169.54, "text": "단계에 맞춰 차근차근 추진하겠습니다.", "time": "02:44"}, {"start": 169.54, "end": 171.6, "text": "전 정책을 추진하고 민간에서", "time": "02:49"}, {"start": 171.6, "end": 175.36, "text": "AI 산업과 산업에서 근무한 경험을 가지고 있습니다.", "time": "02:51"}, {"start": 175.36, "end": 181.08, "text": "그리고 AI를 활용해서 다양한 업무와 연구를 추진한 경험도 가지고 있습니다.", "time": "02:55"}, {"start": 181.08, "end": 183.18, "text": "또 다양한 강의 경력도 있고요.", "time": "03:01"}, {"start": 183.18, "end": 187.74, "text": "이런 경험이 도움이 될 것이라고 생각합니다.", "time": "03:03"}, {"start": 187.74, "end": 190.18, "text": "정책 외에는 기술에 대한 이해도가 기반이 되어야", "time": "03:07"}, {"start": 190.18, "end": 193.64, "text": "올바른 정책이 수립이 될 수 있다고 생각합니다.", "time": "03:10"}, {"start": 193.64, "end": 197.62, "text": "제가 예전 스마트팜 정책 수립 과정에 참여한 적이 있었는데요.", "time": "03:13"}, {"start": 197.62, "end": 201.68, "text": "그 정책이 만들어질 때까지 전문적으로 농사를 지으셨던 분이", "time": "03:17"}, {"start": 201.68, "end": 203.68, "text": "참여를 하지 않으셨고요.", "time": "03:21"}, {"start": 203.68, "end": 208.96, "text": "그 결과 해당 정책이 농업 현장에서 공감을 이끌어내지 못했습니다.", "time": "03:23"}, {"start": 208.96, "end": 213.18, "text": "우리 위원회가 AA의 중요한 역할을 하고 있는 기관인 만큼", "time": "03:28"}, {"start": 213.18, "end": 220.38, "text": "AI와 관련된 다양한 기술, 활용 방법, 동양들을 전달해주는 사람이 꼭 필요하다고 생각이 되고", "time": "03:33"}, {"start": 220.38, "end": 222.82, "text": "그게 제가 하고자 합니다.", "time": "03:40"}, {"start": 222.82, "end": 228.42, "text": "위원회의 AI 역량 강화와 이를 통해 우리나라의 전반의 발전에 기여하고 싶습니다.", "time": "03:42"}, {"start": 228.42, "end": 229.92, "text": "감사합니다.", "time": "03:48"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/54/193wfW1rPVJpnraNpT7rZTgQ0qqZVLSeu.mp4", "frame": "../영상장면/54.jpg", "quotes": [{"start": 75.2, "end": 79.12, "text": "AI로 인해 불법 허위주작 정보가 확산되고 있고", "time": "01:15", "category": "기관 내 확산 계획 관련 기재"}, {"start": 53.0, "end": 57.58, "text": "이러한 계획의 일환으로 불법 허위주작정보를 유통을 방지하고자", "time": "00:53", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 54, "name": "기도형", "title": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성 과정 신청서_방송미디어통신위원회.pdf", "mime": "application/pdf", "bytes": 2264628, "downloaded": true, "url": "https://drive.google.com/file/d/1q6ZEM6RO2wSr0xdJxOkN3MFP1yqerBjk/view?usp=drivesdk", "local": "../원본/54/1q6ZEM6RO2wSr0xdJxOkN3MFP1yqerBjk.pdf", "id": "1q6ZEM6RO2wSr0xdJxOkN3MFP1yqerBjk"}, {"n": 54, "name": "기도형", "title": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 모집 안내(2차) 회신.pdf", "mime": "application/pdf", "bytes": 40040, "downloaded": true, "url": "https://drive.google.com/file/d/1gi2x5W5V3RQP6whA6jy6YQPttaB6nKJF/view?usp=drivesdk", "local": "../원본/54/1gi2x5W5V3RQP6whA6jy6YQPttaB6nKJF.pdf", "id": "1gi2x5W5V3RQP6whA6jy6YQPttaB6nKJF"}, {"n": 54, "name": "기도형", "title": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성 과정 발표_방송미디어통신위원회.mp4", "mime": "video/mp4", "bytes": 38830810, "downloaded": true, "url": "https://drive.google.com/file/d/193wfW1rPVJpnraNpT7rZTgQ0qqZVLSeu/view?usp=drivesdk", "local": "../원본/  {"start": 67.56, "end": 74.52, "text": "따라서 일반적인 인터넷 활용법이나 단순한 프롬프트 작성반만으로는", "time": "01:07"}, {"start": 74.52, "end": 76.2, "text": "충분하지 않습니다.", "time": "01:14"}, {"start": 76.2, "end": 81.8, "text": "또한 교육이 이루어지더라도 일회성 강의에 그치는 경우가 많습니다.", "time": "01:16"}, {"start": 81.8, "end": 86.84, "text": "교육을 받을 당시에는 AI를 활용해 결과물을 만들 수 있지만", "time": "01:21"}, {"start": 86.84, "end": 91.24, "text": "실제 업무연장으로 돌아가면 무엇부터 적용해야 할지", "time": "01:26"}, {"start": 91.24, "end": 95.64, "text": "몰라 기존 방식으로 돌아가는 문제가 발생합니다.", "time": "01:31"}, {"start": 95.64, "end": 100.88, "text": "저는 국민소통실에서 정책 여론과 빅데이터를 분석하면서", "time": "01:35"}, {"start": 100.88, "end": 108.4, "text": "다양한 비정용 자료를 수집하고 정리하여 정책적 의미를 도출하는 과정을 경험했습니다.", "time": "01:40"}, {"start": 108.4, "end": 115.04, "text": "이 과정에는 AI는 단순한 답변 도구가 아니라 자료의 구조화와 요약,", "time": "01:48"}, {"start": 115.04, "end": 120.9, "text": "쟁점, 분류, 분석 방향 설정, 보고서 초한 작성 등을 지원하는", "time": "01:55"}, {"start": 120.9, "end": 123.98, "text": "업무 파트너가 될 수 있다는 점을 확인했습니다.", "time": "02:00"}, {"start": 123.98, "end": 129.6, "text": "다만 AI가 제시한 결과를 그대로 사용한 것은 유용합니다.", "time": "02:03"}, {"start": 129.6, "end": 136.4, "text": "데이터의 출처와 정확성을 확인하고 분석 결과가 정책적으로 타당한지", "time": "02:09"}, {"start": 136.4, "end": 139.42, "text": "사람이 검토하는 과정이 반드시 필요합니다.", "time": "02:16"}, {"start": 139.42, "end": 144.76, "text": "이러한 경험을 바탕으로 다음과 같은 해결 방안을 제시합니다.", "time": "02:19"}, {"start": 144.76, "end": 150.52, "text": "첫째, 기관의 실제 업무를 중심으로 교육을 운영하겠습니다.", "time": "02:24"}, {"start": 150.52, "end": 156.72, "text": "예를 들어 정책 자료나 민원 여론 자료를 활용하여 자료를 분류하고", "time": "02:30"}, {"start": 156.72, "end": 164.68, "text": "핵심 쟁점을 도출하며 보고서 또는 정책 브리핑 자료로 발전시키는 실습을 진행할 수 있습니다.", "time": "02:36"}, {"start": 164.68, "end": 169.56, "text": "단순히 이 도구는 이렇게 사용합니다 라고 설명하는 방식이 아니라", "time": "02:44"}, {"start": 169.56, "end": 178.76, "text": "실제 행정 업무의 시작부터 결과물 완성까지 업무 사이클 전체를 경험하도록 하겠습니다.", "time": "02:49"}, {"start": 178.76, "end": 184.68, "text": "둘째 학습자의 수준에 따라 단계별로 지원하겠습니다.", "time": "02:58"}, {"start": 184.68, "end": 201.5, "text": "AI를 처음 적파하는 직원에게는 기본 개념과 안전한 활용 원칙을 안내하고 어느 정도 경험이 있는 직원에게는 데이터 분석과 업무 자동화, 정책 기획 등 보다 심화된 활용 방법을 제시하겠습니다.", "time": "03:04"}, {"start": 201.5, "end": 213.16, "text": "학습자 간 수준 차이를 고려하여 실습 과정에서는 개인별 또는 소그룹별로 막히는 지점을 확인하고 해결을 돕겠습니다.", "time": "03:21"}, {"start": 213.16, "end": 219.28, "text": "셋째, 교육 이외에도 활용이 이어줄 수 있는 지원체계를 만들겠습니다.", "time": "03:33"}, {"start": 219.28, "end": 224.2, "text": "교육 과정에서 완성한 결과물을 실제 업무에 적용할 수 있도록", "time": "03:39"}, {"start": 224.2, "end": 228.36, "text": "업무별 활용 사례와 프롬프트 예시를 축적하고", "time": "03:44"}, {"start": 228.36, "end": 233.2, "text": "직원들이 자주 묻는 질문과 해결 방법을 정리하겠습니다.", "time": "03:48"}, {"start": 233.2, "end": 238.52, "text": "또한 AI 챔피언 그린 블루 과정에 참여하고자 하는 직원들에게는", "time": "03:53"}, {"start": 238.52, "end": 246.52, "text": "사전준비와 학습동선을 안내하여 인증과정까지 연결되도록 지원하겠습니다.", "time": "03:58"}, {"start": 246.52, "end": 250.52, "text": "이를 통해 기대할 수 있는 효과는 3가지입니다.", "time": "04:06"}, {"start": 250.52, "end": 256.8, "text": "첫째, 직원들이 AI를 막연히 어려운 기술로 인식하는 데서 벗어나", "time": "04:10"}, {"start": 256.8, "end": 262.76, "text": "자신의 업무에 활용할 수 있는 실질적인 도구로 받아들일 것입니다.", "time": "04:16"}, {"start": 262.76, "end": 277.6, "text": "둘째, 정책자료와 비정용 데이터의 정리, 분석, 보고 과정이 효유로화되어 업무 시간을 줄이고 보다 신속하고 체계적인 정책 대응이 가능해질 것입니다.", "time": "04:22"}, {"start": 277.6, "end": 291.0, "text": "셋째, 개인의 활용 경험이 비관 전체의 지식과 사례로 축적되어 이랫성 교육이 아닌 지속 가능한 AI 학습 문화로 발전할 수 있습니다.", "time": "04:37"}, {"start": 291.0, "end": 300.26, "text": "나아가 부서별 업무 특성에 맞는 자체 교육과 AI 챔피언 확산에도 기여할 수 있을 것입니다.", "time": "04:51"}, {"start": 300.26, "end": 308.86, "text": "강사 양성의 과정에 선발된다면 저는 다음과 같은 역할을 충실히 수행하겠습니다.", "time": "05:00"}, {"start": 308.86, "end": 316.54, "text": "우선 행안부의 표준 교환과 00AI 트랙의 교육후룸을 정확히 이해하고", "time": "05:08"}, {"start": 316.54, "end": 323.3, "text": "담당 과목의 실습 시나리오와 학습자 동선을 충분히 숙지하겠습니다.", "time": "05:16"}, {"start": 323.3, "end": 330.7, "text": "그 다음, 기관구성원의 업무 수준을 고려하여 교육 내용을 구체화하겠습니다.", "time": "05:23"}, {"start": 330.7, "end": 334.62, "text": "강의식으로 지식을 전달하는데 그치지 않고", "time": "05:30"}, {"start": 334.62, "end": 338.7, "text": "학습자가 직접 질문하고 시도하며", "time": "05:34"}, {"start": 338.7, "end": 344.42, "text": "결과물을 완성할 수 있도록 도입는 퍼실러테이터가 되겠습니다.", "time": "05:38"}, {"start": 344.42, "end": 357.0, "text": "또한 교육과정에서 확인되는 개인정보보호, 보안, 사실 검증과 같은 공공부문 특유의 유의상을 빠짐없이 안내하겠습니다.", "time": "05:44"}, {"start": 357.0, "end": 371.72, "text": "AI의 결과를 무조건 신뢰하게 하는 것이 아니라 AI를 활용하되 최종적인 판단과 책임은 사람이 담당한다는 원칙도 강조하겠습니다.", "time": "05:57"}, {"start": 371.72, "end": 375.68, "text": "배운 내용을 제 업무에만 활용하는 데 그치지 않고", "time": "06:11"}, {"start": 375.68, "end": 385.12, "text": "동료와 기간에 확산하며 누구나 AI를 안전하고 효과적으로 활용할 수 있도록 돕겠습니다.", "time": "06:15"}, {"start": 385.12, "end": 386.12, "text": "고맙습니다.", "time": "06:25"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/55/1XkZUPKvkTnS94SQwL8py7v-bMsbZ-aRb.m4a", "frame": null, "quotes": [{"start": 184.68, "end": 201.5, "text": "AI를 처음 적파하는 직원에게는 기본 개념과 안전한 활용 원칙을 안내하고 어느 정도 경험이 있는 직원에게는 데이터 분석과 업무 자동화, 정책 기획 등 보다 심화된 활용 방법을 제시하겠습니다.", "time": "03:04", "category": "AI 업무 활용 관련 기재"}, {"start": 144.76, "end": 150.52, "text": "첫째, 기관의 실제 업무를 중심으로 교육을 운영하겠습니다.", "time": "02:24", "category": "강의·학습 지원 관련 기재"}, {"start": 219.28, "end": 224.2, "text": "교육 과정에서 완성한 결과물을 실제 업무에 적용할 수 있도록", "time": "03:39", "category": "기관 내 확산 계획 관련 기재"}, {"start": 57.72, "end": 64.24, "text": "특히 공공 부문의 업무는 개인정보와 보안, 사실관계 검증,", "time": "00:57", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 55, "name": "전용호", "title": "(문화체육관광부 공문) 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 교육 신청서 송부.pdf", "mime": "application/pdf", "bytes": 244877, "downloaded": true, "url": "https://drive.google.com/file/d/1Zv4VGu7bRO__3GYQF_X-U9lWZdbd9ybo/view?usp=drivesdk", "local": "../원본/55/1Zv4VGu7bRO__3GYQF_X-U9lWZdbd9ybo.pdf", "id": "1Zv4VGu7bRO__3GYQF_X-U9lWZdbd9ybo"}, {"n": 55, "name": "전용호", "title": "「강사 양성 과정」신청서.pdf", "mime": "application/pdf", "bytes": 1422077, "downloaded": true, "url": "https://drive.google.com/file/d/1GTIh-TIv8APUM5YXJ "기관 내 확산 계획 관련 기재": [{"text": "- 수료 후 1개월 이내 1회 실시하고 이후 분기별 1회 운영 ○ 직무별 AI 활용 실습교육 운영 - 행정·사업·데이터 담당자 등을 대상으로 보고서 작성, 규정 검토, 데이터 분석, 반복업무 자동화 실습", "source": "(붙임) 강사 양성 과정 신청서.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb/view?usp=drivesdk", "id": "1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb"}, {"text": "○ AI 업무과제 발굴 및 현업 확산 - 직원이 수행 중인 업무를 대상으로 AI 적용 가능성을 진단하고 활용과제 발굴 - 현행업무 분석부터 프롬프트 작성, 챗봇·에이전트 등 간단한 프로토타입 구현까지 지원", "source": "(붙임) 강사 양성 과정 신청서.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb/view?usp=drivesdk", "id": "1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb"}, {"text": "- 분기별 1회 과제 발굴 및 연중 수시 현업 컨설팅 추진 ○ 기관 내 AI 활용사례 확산 및 내재화 - 교육 및 현업 적용 과정에서 발굴된 우수 프롬프트와 AI 활용사례 공유", "source": "(붙임) 강사 양성 과정 신청서.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb/view?usp=drivesdk", "id": "1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb"}], "과정·이유·검증 설명 관련 기재": [{"text": "- 업무 목적에 맞는 프롬프트 작성 및 결과 검증·개선 가능 - 실제 행정·사업 업무를 기반으로 한 생성형 AI 활용 실습 안내 가능 ○ AI 에이전트를 활용한 반복업무 자동화 경험", "source": "(붙임) 강사 양성 과정 신청서.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb/view?usp=drivesdk", "id": "1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb"}, {"text": "직원이 GPT, Claude 등 생성형 AI를 업무 목적에 맞게 활용하고 결과를 검증·개선할 수 있는 실무역량 확보 - 교육 이수자를 부서별 AI 활용 확산의 거점으로 활용하여 자율적인 AI 학습 및 활용문화 조성 ○ 반복·행정업무 효율화를 통한 생산성 향상", "source": "(붙임) 강사 양성 과정 신청서.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb/view?usp=drivesdk", "id": "1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb"}]}, "media": [{"n": 56, "id": "1jx9oHhzhTAbiaHjDhauvnqY5Ujmv79rF", "file": "3분 발표 음성.mp4", "url": "https://drive.google.com/file/d/1jx9oHhzhTAbiaHjDhauvnqY5Ujmv79rF/view?usp=drivesdk", "duration": 213.0, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\56.jpg", "segments": [{"start": 0.34, "end": 5.34, "text": "안녕하십니까 축산물품질 평가원 지는 정보기액처 임선구 과장입니다.", "time": "00:00"}, {"start": 5.34, "end": 13.34, "text": "저는 기관 내 AI 데이터 역량 강화를 위해 교육과 실제 업무 적용이 연결되는 체계를 만들고자 합니다.", "time": "00:05"}, {"start": 13.34, "end": 15.34, "text": "먼저 문제점입니다.", "time": "00:13"}, {"start": 15.34, "end": 21.34, "text": "현재 생성형 AI에 대한 관심은 높지만 직원별 활용 수준에는 큰 차이가 있습니다.", "time": "00:15"}, {"start": 21.34, "end": 29.34, "text": "일부는 GPT나 Claude를 업무에 활용하고 있지만 많은 직원은 단순 검색이나 눈서 작성 수준에 머물러 있습니다.", "time": "00:21"}, {"start": 29.34, "end": 35.34, "text": "또한 교육을 받아도 본인의 실제 업무에 어떻게 적용해야 하는지 모르는 경우가 많습니다.", "time": "00:29"}, {"start": 35.34, "end": 41.34, "text": "저 역시 과거에는 매주 약 8개 해외 사이트의 가격 동향을 숙이로 정리했지만", "time": "00:35"}, {"start": 41.34, "end": 50.34, "text": "현재는 AI 아이션트를 활용해 정보수집, 데이터 추출, 변동 분석, 리포트 작성까지 자동화하고 있습니다.", "time": "00:41"}, {"start": 50.34, "end": 59.84, "text": "이를 통해 AI 교육은 단순 기능 설명보다 직원이 자신의 업무를 직접 AI로 바꿔보는 경험이 중요하다고 느꼈습니다.", "time": "00:50"}, {"start": 59.84, "end": 62.34, "text": "다음은 해결 방안입니다.", "time": "00:59"}, {"start": 62.34, "end": 72.84, "text": "강사 양성거정 수료 후 행암부 표준 교안을 기반으로 수료 후 6개월 이내 총 사회의 누적지 10명 이상을 대상으로 자체 교육을 운영하겠습니다.", "time": "01:02"}, {"start": 72.84, "end": 88.84, "text": "교육은 1차, 생성형 AI 기본 활용과 프롬버트 작성, 2차, 보구소 작성, 규정검도 등 행정 업무 활용, 3차, 데이터 분석과 제법 활용, 4차 AI 에이전트 기반 반복 업무 자동화 시습으로 구성하겠습니다.", "time": "01:12"}, {"start": 88.84, "end": 99.84, "text": "또한 직원이 실제 업무를 가져와 직접 적용해보는 시습형 교육을 운영하고, 교육 과정에서 부서별 AI 활용 아이디어를 10건 이상 발굴하겠습니다.", "time": "01:28"}, {"start": 99.84, "end": 101.84, "text": "다음은 기대 효과입니다.", "time": "01:39"}, {"start": 101.84, "end": 107.84, "text": "직원의 AI 활용 수준을 단순 검색에서 실제 업무수행 수준으로 높이고", "time": "01:41"}, {"start": 107.84, "end": 113.84, "text": "보고서 작성, 자료 조사, 규정 검토, 데이터 정리 등 반복 업무 시간을 줄일 수 있습니다.", "time": "01:47"}, {"start": 113.84, "end": 117.84, "text": "또한 우스프롬포트 활용 사례를 기간 내에 공유해", "time": "01:53"}, {"start": 117.84, "end": 123.84, "text": "교육, 업무 적용, 사례 공유, 신규 과제 발굴로 이어지는 선순한 책의를 만들겠습니다.", "time": "01:57"}, {"start": 123.84, "end": 125.84, "text": "마지막으로 저의 역할입니다.", "time": "02:03"}, {"start": 125.84, "end": 129.98, "text": "역할입니다. 저는 AI 기반 1억 신고 자동화와", "time": "02:05"}, {"start": 129.98, "end": 135.56, "text": "이행 점검 분석 지원 체보내제와 규점 감사 안무지원 체보� POC,", "time": "02:09"}, {"start": 135.56, "end": 141.3, "text": "EIP 데이터 활용사업을 담당했고 직접 AI 에이전트를 활용해 반복 업무를", "time": "02:15"}, {"start": 141.3, "end": 146.6, "text": "자동화한 경우도 있습니다. 이 경험을 바탕으로 단순히 AI 사용법을", "time": "02:21"}, {"start": 146.6, "end": 151.38, "text": "알려주는 강사가 아니라 직원의 업무를 함께 분석하고 실제 AI", "time": "02:26"}, {"start": 151.38, "end": 157.18, "text": "적용까지 연결하는 기간 내 AI 퍼실리테이터 효과를 수행하겠습니다.", "time": "02:31"}, {"start": 157.18, "end": 157.82, "text": "감사합니다.", "time": "02:37"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/56/1jx9oHhzhTAbiaHjDhauvnqY5Ujmv79rF.mp4", "frame": "../영상장면/56.jpg", "quotes": [{"start": 21.34, "end": 29.34, "text": "일부는 GPT나 Claude를 업무에 활용하고 있지만 많은 직원은 단순 검색이나 눈서 작성 수준에 머물러 있습니다.", "time": "00:21", "category": "AI 업무 활용 관련 기재"}, {"start": 62.34, "end": 72.84, "text": "강사 양성거정 수료 후 행암부 표준 교안을 기반으로 수료 후 6개월 이내 총 사회의 누적지 10명 이상을 대상으로 자체 교육을 운영하겠습니다.", "time": "01:02", "category": "강의·학습 지원 관련 기재"}, {"start": 88.84, "end": 99.84, "text": "또한 직원이 실제 업무를 가져와 직접 적용해보는 시습형 교육을 운영하고, 교육 과정에서 부서별 AI 활용 아이디어를 10건 이상 발굴하겠습니다.", "time": "01:28", "category": "기관 내 확산 계획 관련 기재"}]}], "issues": [], "files": [{"n": 56, "name": "임선구", "title": "(붙임) 강사 양성 과정 신청서.hwpx", "mime": "application/haansofthwpx", "bytes": 109557, "downloaded": true, "url": "https://drive.google.com/file/d/1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb/view?usp=drivesdk", "local": "../원본/56/1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb.hwpx", "id": "1SkD1_r6HRpfs_6yeuRrgYw4EJQJdHKdb"}, {"n": 56, "name": "임선구", "title": "3분 발표 음성.mp4", "mime": "video/mp4", "bytes": 1438652, "downloaded": true, "url": "https://drive.google.com/file/d/1jx9oHhzhTAbiaHjDhauvnqY5Ujmv79rF/view?usp=dr "text": "제가 말씀드릴 주제는 산림 R&D 현장의 AI 활용 확산 전략입니다.", "time": "00:05"}, {"start": 12.28, "end": 24.28, "text": "핵심은 하나입니다. AI를 잘 아는 사람을 많이 늘리는 것보다 연구 현장에서의 실제 병목을 AI로 해결하고 그 경험을 조직 전체로 확산시키는 것입니다.", "time": "00:12"}, {"start": 24.28, "end": 31.51, "text": "현재 한계에 대해 말씀드리겠습니다. 첫 번째 한계는 데이터 병목입니다.", "time": "00:24"}, {"start": 31.51, "end": 42.51, "text": "산림연구에서 산림생태, 기상, 지역, 연료처럼 대용양의 시공간 데이터를 다루기 있기 때문에 전철이와 검증에 많은 시간이 소유가 됩니다.", "time": "00:31"}, {"start": 42.51, "end": 52.51, "text": "두 번째는 개발 병목입니다. 알고리즘 구연뿐만 아니라 디버깅, 테스트, 기술 문서화까지 연구자가 직접 처리를 수행하고 있습니다.", "time": "00:42"}, {"start": 52.51, "end": 55.51, "text": "세 번째는 확산에 대한 병목입니다.", "time": "00:52"}, {"start": 55.51, "end": 63.51, "text": "개인이 AI를 잘 활용하더라도 노하우가 조직에 지식으로 남지 않으면 효과가 이례성에 그칩니다.", "time": "00:55"}, {"start": 63.51, "end": 73.72, "text": "따라서 범용 AI 교육이 아니라 실제 연구 업무에 맞춘 현장형 활용 모델이 필요합니다.", "time": "01:03"}, {"start": 73.72, "end": 75.72, "text": "해결 방안은 세 가지로 정리해 봤습니다.", "time": "01:13"}, {"start": 75.72, "end": 82.72, "text": "첫 번째로는 데이터 전처리부터 문서화까지 업무 단계별로 AI 활용 지점을 표준화하겠습니다.", "time": "01:15"}, {"start": 82.72, "end": 91.68, "text": "둘째로는 전 직원을 대상으로 기토 공통 과정과 연구 부서 실무자 대상 심화 실습으로 교육을 이원하겠습니다.", "time": "01:22"}, {"start": 91.68, "end": 101.82, "text": "세 번째로는 공공 데이터 보안과 정각성 확보를 위해서 복수 AI 교차 검증과 안전 활용 가이드를 함께 적용하겠습니다.", "time": "01:31"}, {"start": 101.82, "end": 112.12, "text": "사실 말해서 AI를 한 번 일회성으로 써보는 교육이 아니라 실제 업무 흐름에 붙이는 교육으로 설계를 했다고 말씀드릴 수 있겠습니다.", "time": "01:41"}, {"start": 112.72, "end": 121.72, "text": "저는 이미 산불 행동 분석과 확산 예측 알고리즘 개발해서 AI를 연구 결과에 적용했고, 현업에서 활용하고 있습니다.", "time": "01:52"}, {"start": 121.72, "end": 134.22, "text": "대용량 기상, 지형, 연료 데이터의 전철이병목을 찾아 백터화 시켰고, 가상 산불 시나리오의 테스트 케이스를 AI로 자동생성해서 수치 안정성을 검증했습니다.", "time": "02:01"}, {"start": 134.22, "end": 152.66, "text": "또한 클라우드 같은 경우에는 복잡한 알고리즘 설계와 리팩토링, 그리고 체즈피티는 GIS나 이제 파이썴 코드, 재미나이 같은 경우에는 최신 논문과 멀티모델 검토처럼 역할을 나눴고 동일 로직을 복수모델로 교차 검증했습니다.", "time": "02:14"}, {"start": 152.66, "end": 164.91, "text": "그 결과 2023년부터 26년까지 10건 이상의 소프트웨어 등록 성과로 연결을 시켰고 논문도 동기간 동안 14건을 작성했습니다.", "time": "02:32"}, {"start": 164.91, "end": 176.15, "text": "기대 효과도 3가지로 정리해 봤습니다 첫째는 데이터 정제와 반복 코드를 AI로 자동화 시켜서 데이터 준비 기간을 수일해서 수시간으로 줄이도록 하겠습니다", "time": "02:44"}, {"start": 176.15, "end": 183.79, "text": "둘째는 외부 교육 이전도를 낮추고 조중 내부에서 스스로 AI를 활용하는 연구 문화를 만들겠습니다", "time": "02:56"}, {"start": 183.79, "end": 194.18, "text": "마지막으로는 검증된 코드와 기술 문서를 지식 플랫폼에 축적해서 연구의 연속성과 재사용성을 높이겠습니다", "time": "03:03"}, {"start": 194.18, "end": 206.3, "text": "마지막으로 제 역할입니다. 저는 GIS 공간 데이터와 리모 센싱, 원격 탐사 자료 등을 직접 다루는 연구자이면서 현장의 문제를 AI로 해결해 본 경험이 있습니다.", "time": "03:14"}, {"start": 206.3, "end": 218.14, "text": "이 경험을 교육용 차례와 실습으로 표준화 시키겠습니다. 그리고 기초교육, 심화 워크쇼, 오피스 아워를 연결해서 학습이 실제 연구 성과로 이어지도록 돕겠습니다.", "time": "03:26"}, {"start": 218.14, "end": 227.82, "text": "마지막으로 보안 가이드와 검증 절차, 재사용 가능한 코드와 문서를 축적해서 개인의 경험을 기관의 지식 자산으로 전환하겠습니다.", "time": "03:38"}, {"start": 227.82, "end": 235.22, "text": "결국 제가 만들고 싶은 것은 AI를 아는 연구자가 아니라 AI로 연구를 더 빠르고 정확하게 하는 조직입니다.", "time": "03:47"}, {"start": 235.22, "end": 237.74, "text": "감사합니다.", "time": "03:55"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/60/1-bgYaC3dxxJUhgexJ0WeJ4cGqPoq9_6O.mp4", "frame": "../영상장면/60.jpg", "quotes": [{"start": 12.28, "end": 24.28, "text": "핵심은 하나입니다. AI를 잘 아는 사람을 많이 늘리는 것보다 연구 현장에서의 실제 병목을 AI로 해결하고 그 경험을 조직 전체로 확산시키는 것입니다.", "time": "00:12", "category": "AI 업무 활용 관련 기재"}, {"start": 5.28, "end": 12.28, "text": "제가 말씀드릴 주제는 산림 R&D 현장의 AI 활용 확산 전략입니다.", "time": "00:05", "category": "기관 내 확산 계획 관련 기재"}, {"start": 24.28, "end": 31.51, "text": "현재 한계에 대해 말씀드리겠습니다. 첫 번째 한계는 데이터 병목입니다.", "time": "00:24", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 60, "name": "차성은", "title": "2026년 AI역량 트랙 강사 양성과정 교육생 신청서_차성은.pdf", "mime": "application/pdf", "bytes": 462085, "downloaded": true, "url": "https://drive.google.com/file/d/1GwEBSRf5ZRSzo-UdNfRoMWBxY5jttPGk/view?usp=drivesdk", "local": "../원본/60/1GwEBSRf5ZRSzo-UdNfRoMWBxY5jttPGk.pdf", "id": "1GwEBSRf5ZRSzo-UdNfRoMWBxY5j rt": 108.46, "end": 116.8, "text": "이러한 가정을 통해서 어떤 것을 얻을 수 있을까 라고 했을 때 원내의 업무 혁신과 지속 가능한 AI 문화를 정착할 수 있습니다.", "time": "01:48"}, {"start": 116.8, "end": 124.08, "text": "단순 방법 행정이 경감하는 경감할 수 있고요.", "time": "01:56"}, {"start": 124.08, "end": 128.08, "text": "그리고 안전하고 실내받는 공공 AI 활용이 가능합니다.", "time": "02:04"}, {"start": 128.08, "end": 137.76, "text": "그리고 이러한 것을 확산했을 때 자발적 산에 AI의 학습 생태계를 구축할 수 있습니다.", "time": "02:08"}, {"start": 137.76, "end": 141.9, "text": "이를 위해서 이제 저의 역할은 일반적인 강사가 아니라", "time": "02:17"}, {"start": 141.9, "end": 146.76, "text": "곁에서 함께 뛰는 AI 페이스메이커로서 역할을 하고자 합니다.", "time": "02:21"}, {"start": 146.76, "end": 150.26, "text": "이를 뒷받침할 수 있는 저의 역량 같은 경우에는", "time": "02:26"}, {"start": 150.26, "end": 153.18, "text": "대학 전공강의 경험이 있어서", "time": "02:30"}, {"start": 153.18, "end": 160.34, "text": "이제 누군가의 학습자의 눈누피를 맞춘 단계별 설명과 피드백이 가능하고요.", "time": "02:33"}, {"start": 160.34, "end": 164.96, "text": "실무 연구에서 실제로 생성형 AI를 쓰고 이런 식으로", "time": "02:40"}, {"start": 164.96, "end": 169.4, "text": "인터랙티브 페이지를 만드는 등의 경험이 있기 때문에", "time": "02:44"}, {"start": 169.4, "end": 171.56, "text": "일을 전수하는데 문제가 없습니다.", "time": "02:49"}, {"start": 171.56, "end": 176.8, "text": "그리고 최종적으로는 행안부에서 진행하는 AI 챔피언 인증", "time": "02:51"}, {"start": 176.8, "end": 179.8, "text": "희망자에 대한 자료 멘토링을 진행을 하여서", "time": "02:56"}, {"start": 179.8, "end": 182.08, "text": "부담스럽게 강요하는 것이 아니라", "time": "02:59"}, {"start": 182.08, "end": 186.24, "text": "원내에서 하고자 하는 의지가 있는 사람들을 모아서", "time": "03:02"}, {"start": 186.24, "end": 188.04, "text": "이것을 멘토링해 줄 수 있는", "time": "03:06"}, {"start": 188.04, "end": 195.36, "text": "그리고 러닝 메이트가 될 수 있는 그런 역할을 하고자 합니다.", "time": "03:08"}, {"start": 195.36, "end": 198.04, "text": "이상으로 발표를 마치도록 하겠습니다.", "time": "03:15"}, {"start": 198.04, "end": 198.8, "text": "감사합니다.", "time": "03:18"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/61/1E9IDZ4MjTR0H1LO3j1dV8niqPS5jfsPW.mp4", "frame": "../영상장면/61.jpg", "quotes": [{"start": 150.26, "end": 153.18, "text": "대학 전 65, "end": 9.65, "text": "안녕하세요. 수풀 아는 사람들과 함께 만드는 모두의 AI, 그 길을 열고 싶은 국립살림과학원 이보라입니다.", "time": "00:01"}, {"start": 9.65, "end": 15.15, "text": "저는 AI를 잘하는 몇 사람보다 함께 활용할 수 있는 조직이 더 중요하다고 생각합니다.", "time": "00:09"}, {"start": 15.15, "end": 23.65, "text": "이번 과정에서 배운 내용을 연구자들과 나누며 우리 모두의 AI를 만들어 가고 싶어 지원했습니다.", "time": "00:15"}, {"start": 23.65, "end": 28.65, "text": "국립살림과학원에는 오랜 시간 쌓아 온 소중한 살림 관측 자료들이 있습니다.", "time": "00:23"}, {"start": 28.65, "end": 35.57, "text": "하지만 자료를 다루는 방법과 그 과정에서 얻는 시행 차구는 개인의 컴퓨터에 머무르는 경우가 많습니다.", "time": "00:28"}, {"start": 35.57, "end": 43.45, "text": "AI에 관심이 있어도 설치와 보완, 익숙하지 않은 오류, 바쁜 연구 일정 때문에 혼자 시작하기는 쉽지 않습니다.", "time": "00:35"}, {"start": 43.45, "end": 49.05, "text": "저는 이것이 개인 의지의 문제가 아니라 함께 시도할 수 있는 환경의 문제라고 생각합니다.", "time": "00:43"}, {"start": 49.05, "end": 58.45, "text": "최근 정부도 거대한 시스템을 먼저 만드는 것보다 현장을 잘 아는 사람이 작은 아이디어를 직접 시험하고 그 경험을 함께 확산하는 방향을 강조하고 있습니다.", "time": "00:49"}, {"start": 58.45, "end": 60.95, "text": "살림연구도 마찬가지라고 생각합니다.", "time": "00:58"}, {"start": 60.95, "end": 67.07, "text": "21만 장이 넘는 식물계절 이미지, 장기 시계열 데이터, 살림 공간 자료,", "time": "01:00"}, {"start": 67.07, "end": 71.51, "text": "이런 자료들의 의비를 가장 잘 아는 사람은 현장의 연구자입니다.", "time": "01:07"}, {"start": 71.51, "end": 75.07, "text": "데이터 분석과 바이브 코딩을 연구자의 경험과 연결한다면", "time": "01:11"}, {"start": 75.07, "end": 77.67, "text": "AI는 일부 담당자만의 기술이 아니라", "time": "01:15"}, {"start": 77.67, "end": 80.87, "text": "함께 사용하는 연구 도구가 될 수 있습니다.", "time": "01:17"}, {"start": 80.87, "end": 84.59, "text": "제가 만들고 싶은 교육은 연구자의 실제 업무에서 시작합니다.", "time": "01:20"}, {"start": 84.59, "end": 88.03, "text": "각자 반복하는 작업이나 분석 고민을 가져와", "time": "01:24"}, {"start": 88.03, "end": 92.47, "text": "일정시간 동안 동료와 함께 작은 부분부터 풀어보는 방식입니다.", "time": "01:28"}, {"start": 92.47, "end": 98.35, "text": "정답을 일방적으로 알려주기보다 두 사람이 함께 지문하고 확인할 수 있도록 돕겠습니다.", "time": "01:32"}, {"start": 98.35, "end": 106.79, "text": "교육이 끝난 뒤에도 자주 막히는 지정과 해결 방법을 차곡차곡 모아 다음 연구자가 조금 더 편하게 시작할 수 있도록 하고 싶습니다.", "time": "01:38"}, {"start": 106.79, "end": 111.63, "text": "처음부터 큰 변화를 약속하기보다 작은 성공 경험을 꾸준히 쌓고 싶습니다.", "time": "01:46"}, {"start": 111.63, "end": 118.83, "text": "한 사람이 줄인 반복 업무를 동료하나 놓고 한 부서의 분석 방법을 다른 부서에서도 다시 활용할 수 있게 남기는 것입니다.", "time": "01:51"}, {"start": 118.83, "end": 123.31, "text": "그렇게 경험이 모이면 연구자는 본연의 질문에 조금 더 집중할 수 있습니다.", "time": "01:58"}, {"start": 123.31, "end": 129.47, "text": "기간의 좋은 데이터도 국민에게 더 빠르고 유용한 살림 정보로 이어질 수 있다고 생각합니다.", "time": "02:03"}, {"start": 129.47, "end": 133.45, "text": "저는 정보와 전문 인력이 아닌 연구직으로 시작하였습니다.", "time": "02:09"}, {"start": 133.45, "end": 141.43, "text": "시민과학으로 모임 수십만 장의 식물 사진을 다루기 위해 AI를 활용한 플랫폼을 만들었지만 처음부터 잘했던 것은 아니었습니다.", "time": "02:13"}, {"start": 141.43, "end": 146.55, "text": "큰 문제를 작은 질문으로 나누고 여러 번 고치면서 조금씩 작동하게 만들었습니다.", "time": "02:21"}, {"start": 146.55, "end": 150.63, "text": "그래서 동료 연구자들에게도 완성된 정답을 보여주기보다", "time": "02:26"}, {"start": 150.63, "end": 155.19, "text": "낯선 도구 앞에서 함께 질문하고 시작하는 방법을 나누고 싶습니다.", "time": "02:30"}, {"start": 155.19, "end": 158.47, "text": "이번 과정에서 저 역시 열린 마음으로 배우겠습니다.", "time": "02:35"}, {"start": 158.47, "end": 162.95, "text": "그리고 배운 내용을 혼자 간직하지 않고 연구자들의 질문을 함께 불며", "time": "02:38"}, {"start": 162.95, "end": 165.15, "text": "경험과 시행착오를 나누겠습니다.", "time": "02:42"}, {"start": 165.15, "end": 167.51, "text": "AI가 누군가의 특별한 능력이 아니라", "time": "02:45"}, {"start": 167.51, "end": 171.63, "text": "우리 모두가 편안하게 활용하는 영부 도구가 되도록 곁에서 돕겠습니다.", "time": "02:47"}, {"start": 171.63, "end": 175.27, "text": "배워서 끝내지 않고 우리 모두의 AI로 이어가겠습니다.", "time": "02:51"}, {"start": 175.27, "end": 177.27, "text": "감사합니다.", "time": "02:55"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/62/1FAtcM9uAZHfFKU3iVrtlUm_wZC8fAc4z.mp4", "frame": "../영상장면/62.jpg", "quotes": [{"start": 171.63, "end": 175.27, "text": "배워서 끝내지 않고 우리 모두의 AI로 이어가겠습니다.", "time": "02:51", "category": "자기주도 학습 관련 기재"}, {"start": 49.05, "end": 58.45, "text": "최근 정부도 거대한 시스템을 먼저 만드는 것보다 현장을 잘 아는 사람이 작은 아이디어를 직접 시험하고 그 경험을 함께 확산하는 방향을 강조하고 있습니다.", "time": "00:49", "category": "기관 내 확산 계획 관련 기재"}, {"start": 35.57, "end": 43.45, "text": "AI에 관심이 있어도 설치와 보완, 익숙하지 않은 오류, 바쁜 연구 일정 때문에 혼자 시작하기는 쉽지 않습니다.", "time": "00:35", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 62, "name": "이보라", "title": "2026년 AI역량 트랙 강사 양성과정 교육생 신청서_이보라.pdf", "mime": "application/pdf", "bytes": 623205, "downloaded": true, "url": "https://drive.google.com/file/d/1QtibwkM1BxXEfInUQLRt6-nYwu65f9A6/view?usp=drivesdk", "local": "../원본/62/1QtibwkM1BxXEfInUQLRt6-nYwu65f9A6.pdf", "id": "1QtibwkM1BxXEfInUQLRt6-nYwu65f9A6"}, {"n": 62, "name": "이보라", "title": "발표영상_국립산림과학원(이보라).mp4", "mime": "video/mp4", "bytes": 6910645, "downloaded": true, "url": "https://drive.google.com/file/d/1FAtcM9uAZHfFKU3iVrtlUm_wZC8fAc4z/view?usp=drivesdk", "local": "../원본/62/1FAtcM9uAZHfFKU3iVrtlUm_wZC8fAc4z.mp4", "id": "1FAtcM9uAZHfFKU3iVrtlUm_wZC8fAc4z"}], "doc_count": 1, "media_count": 1}, {"n": 63, "original_no": 63, "row": 64, "name": "나은정", "org": "국민권익위원회", "folder_title": "63. 국가권익위원회_ 나은정", "folder_url": "https://drive.google.com/drive/folders/1W0D4OC8Mr8cAkythNf1G5Xq9leKPq7WO", "summary": "교육 만족도 자료 취합 자동화·VBA 검증과 직원 안내 경험을 기재. 청렴·권익·민원 업무를 활용한 표준교안 실습 및 사후지원을 계획함.", "evidence": {"자기주도 학습 관련 기재": [], "AI 업무 활용 관련 기재": [{"text": "ChatGPT 등을 활용한 데이터 분석 및 분석 결과 해석(2시간) 이수 ※ AI 챔피언 종합과정, 공공 AI역량 트랙 등 수강 이력이 있는 경우 우선 기재합니다.", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_국가청렴권익교육원 나은정.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1Tt317n-wSRCLp5Z__AftHQA34h640Ndy/view?usp=drivesdk", "id": "1Tt317n-wSRCLp5Z__AftHQA34h640Ndy"}, {"text": "2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 저는 생성형 AI를 단순한 개인 업무 보조 도구로 사용하는데 그치지 않고, 교육과정 기획, 강의자료 제작, 실습 지원, 데이터 분석 및 반복 행정업무 개선", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_국가청렴권익교육원 나은정.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1Tt317n-wSRCLp5Z__AftHQA34h640Ndy/view?usp=drivesdk", "id": "1Tt317n-wSRCLp5Z__AftHQA34h640Ndy"}, {"text": "에 적용하면서 실제 업무 활용 경험을 축적해 왔습니다. 2025년 행정안전부·한국지능정보사회진흥원의 「공공 LLM 프롬프트 해커톤」 과정에 참여하여 LLM 기반 프롬프트 설계와 행정업무 적용 방법을 학습하였고, 이후 AI챔피언 블루 인증을 취득하였습니다. 과정 중에는 Lovable을 활용한 바이브코딩 방식으로 ‘청렴단어 카드 매칭 게임’을 직접 구현하고 교육원 교육운영 담당자에게 공유하여 교육자료로 활용한 경험이 있습니다. 실제 교육에서는 ChatGPT·Gemini·Claude 등 생성형 AI를 활용하여 공직자가 자신의 업무 과제를 AI와 함께 해결하는 방법을 안내하고 있습니다. 예를 들어 공개된 반부패 법령·유권해석 자료 등을 활용해 질문에 대한 답변뿐 아니라 근거가 되는 출처를 함께 확인하는 RAG 기반 질의응답 방식", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_국가청렴권익교육원 나은정.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1Tt317n-wSRCLp5Z__AftHQA34h640Ndy/view?usp=drivesdk", "id": "1Tt317n-wSRCLp5Z__AftHQA34h640Ndy"}], "강의·학습 지원 관련 기재": [{"text": "1) 강의 실적 및 경험 기간 기관", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_국가청렴권익교육원 나은정.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1Tt317n-wSRCLp5Z__AftHQA34h640Ndy/view?usp=drivesdk", "id": "1Tt317n-wSRCLp5Z__AftHQA34h640Ndy"}, {"text": "하고 있습니다. 특히 2026년에는 교육원 직원 23명을 대상으로 맞춤형 AI·데이터 역량강화 교육의 강의안을 직접 제작하여 1시간 강의를 진행하였고, 청렴교육 전문강사 275명을 대상으로 빅데이터 분석을 활용한 교육 현업적용도 조사·분석 결과를 1시간 30분 동안 강의하였습니다. AI·데이터 활용 실습 교육을 기획하고 운영한 경험도 지속적으로 축적 하고 있습니다. 2026년 4월에는 각급기관 공직자 29명을 대상으로 11시간의 AI·데이터 활용 청렴·권익역량 강화 교육을 진행하였고, 5월에는 권익위 내부 직원 23명을 대상으로 노코드 데이터 분석과 생성형 AI 활용 교육을 14시간 운영하며 직접 실습을 지원하였습니다. 또한 10월 초 민원처리 담당 공직자 30명을 대상으로 AI·빅데이터 활용 민원 처리 실습 교육을 운영하기 위해 계획 수립과…", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_국가청렴권익교육원 나은정.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1Tt317n-wSRCLp5Z__AftHQA34h640Ndy/view?usp=drivesdk", "id": "1Tt317n-wSRCLp5Z__AftHQA34h640Ndy"}, {"text": "하고 있습니다. 2026년 4월에는 각급기관 공직자 29명을 대상으로 11시간의 AI·데이터 활용 청렴·권익역량 강화 교육을 진행하였고, 5월에는 권익위 내부 직원 23명을 대상으로 노코드 데이터 분석과 생성형 AI 활용 교육을 14시간 운영하며 직접 실습을 지원하였습니다. 또한 10월 초 민원처리 담당 공직자 30명을 대상으로 AI·빅데이터 활용 민원 처리 실습 교육을 운영하기 위해 계획 수립과 교육생 모집까지 완료한 상태입니다. 또한 2024년부터 청렴교육 전문강사를 대상으로 PPT와 AI를 활용한 강의안 작성 교육을 지속적으로 운영해 왔습니다. 이전 직장인 한국노인인력개발원과 한국직업능력연구원에서도 유사한 업무를 담당하였는데, 교안·강사용 지도서·교육 영상·NCS 학습모듈 등을 지속적으로 개발·배포", "source": "2026년 AI챔 "text": "이를 구거 지식으로 정지한 인력이 너무나 부족합니다.", "time": "00:51"}, {"start": 54.4, "end": 62.96, "text": "그래서 저는 AI를 활용한 방법론을 찾을 수밖에 없는 상황이라고 구건은 그런 상황이라고 보고 있습니다.", "time": "00:54"}, {"start": 62.96, "end": 66.36, "text": "그런데 이런 문제점들을 한 번에 해결할 수는 없습니다.", "time": "01:02"}, {"start": 66.36, "end": 71.84, "text": "그러나 많은 직원들이 AI가 자기 업무에 도움이 된다는 점을 직접 경험을 한다면", "time": "01:06"}, {"start": 71.84, "end": 75.4, "text": "생각이 모여서 더 큰 시너지가 날 수 있다고 생각합니다.", "time": "01:11"}, {"start": 75.4, "end": 81.44, "text": "그래서 행정안전부 트랙2 AI 융합교안을 구건 자료에 맞춰 운영하고자 합니다.", "time": "01:15"}, {"start": 81.44, "end": 87.12, "text": "먼저 10월에 전 직원 150명을 대상으로 00AI 영양트랙 설명해를 여겠습니다.", "time": "01:21"}, {"start": 87.12, "end": 93.4, "text": "그리고 이를 통해 구건 데이터를 AI를 분석하는데 관심 있는 실무자 10명을 모집하겠습니다.", "time": "01:27"}, {"start": 93.4, "end": 97.88, "text": "11월부터 2월까지 4시간씩 10번 40시간을 운영할 거고요.", "time": "01:33"}, {"start": 97.88, "end": 106.32, "text": "처음 2번은 사전 말뭉치 규범 데이터를 분석하는 데시보드를 1인 1건씩 만들면서 AI에게 친숙해지도록 하고", "time": "01:37"}, {"start": 106.32, "end": 111.24, "text": "다음 4번은 조별로 AI 기반 자동화도구 기획서를 쓰는 시간을 가질 거고요.", "time": "01:46"}, {"start": 111.24, "end": 117.44, "text": "마지막 네번은 그 기획서대로 실제 도구를 구현하는 그런 과정을 가져보려고 합니다.", "time": "01:51"}, {"start": 117.44, "end": 124.28, "text": "이런 경험이 쌓이면 실무자들이 각자의 분야에서 AI 기반 업무 장난을 이끌 수 있을 거라고 생각합니다.", "time": "01:57"}, {"start": 124.28, "end": 131.64, "text": "한편 관리자들은 실무자를 지원할 수 있도록 AI 리터러시 교육을 할 계획이고요.", "time": "02:04"}, {"start": 131.64, "end": 139.96, "text": "또 수류자 중 5명에게는 애의 챔피언 그린 인증에 도전하도록 또는 블루 인증에 도전하도록 엔터링을 진행하겠습니다.", "time": "02:11"}, {"start": 139.96, "end": 141.64, "text": "기대 효과 말씀드리겠습니다.", "time": "02:19"}, {"start": 141.64, "end": 144.4, "text": "10명이 각자 구거원 자료 분석 데시보드 하나,", "time": "02:21"}, {"start": 144.4, "end": 146.44, "text": "업무 자동화 도구 하나를 만들게 되고", "time": "02:24"}, {"start": 146.44, "end": 149.56, "text": "조별 기획서도 3건이 나오게 됩니다.", "time": "02:26"}, {"start": 149.56, "end": 152.6, "text": "그리고 이를 통해 정성적으로는 이 구성원들,", "time": "02:29"}, {"start": 152.6, "end": 155.6, "text": "이 수료자들의 자료 검태 품질이 높아지고", "time": "02:32"}, {"start": 155.6, "end": 158.56, "text": "업무 처리 시간이 줄어들 수 있을 것입니다.", "time": "02:35"}, {"start": 158.56, "end": 162.6, "text": "그 도구가 영향을 미치면 더 많은 사람들에게 도움이 될 수도 있겠죠.", "time": "02:38"}, {"start": 162.6, "end": 166.04, "text": "또한 교육 수료자를 AI 챔피언 인증 시험과 연계하여", "time": "02:42"}, {"start": 166.04, "end": 169.08, "text": "기관된 AI 전문가를 늘릴 수도 있고요.", "time": "02:46"}, {"start": 169.08, "end": 173.76, "text": "또 마지막으로 이런 방법 넣는 위킴로서 기관내 AX 동량을 확보하고", "time": "02:49"}, {"start": 173.76, "end": 178.6, "text": "공공 AX 성도 기관내로서 위상을 높일 수 있을 것입니다", "time": "02:53"}, {"start": 178.6, "end": 181.92, "text": "이를 위해 저는 구건 맞춤형 교환을 새로 만들기보다는", "time": "02:58"}, {"start": 181.92, "end": 186.1, "text": "행정원 전부 교환을 그대로 활용하되 실습 예제와 분석 데이터를", "time": "03:01"}, {"start": 186.1, "end": 188.88, "text": "구건 데이터로 받고 운영할 계획입니다", "time": "03:06"}, {"start": 188.88, "end": 193.32, "text": "사전교육과 실패자 AI 융합 과정을 중단없이 마무리하고", "time": "03:08"}, {"start": 193.32, "end": 195.28, "text": "강의실에서는 막힌 사람이 있다면", "time": "03:13"}, {"start": 195.28, "end": 197.88, "text": "옆에서 도와주면서 함께 고치겠습니다", "time": "03:15"}, {"start": 197.88, "end": 201.0, "text": "또 관리자의 인식 개선을 위해서도 노력하겠습니다.", "time": "03:17"}, {"start": 201.0, "end": 204.0, "text": "그리고 구건 사례를 문체부안에 적극 공유하여", "time": "03:21"}, {"start": 204.0, "end": 208.08, "text": "구건이 계속해서 공공 AX 선도 기관이 될 수 있도록 지원하겠습니다.", "time": "03:24"}, {"start": 208.08, "end": 208.88, "text": "네 감사합니다.", "time": "03:28"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/64/1sVONT7EErb8v12FC8oN40zEUTSuLd7bz.mp4", "frame": "../영상장면/64.jpg", "quotes": [{"start": 38.78, "end": 44.18, "text": "그리고 AI를 활용하여 업무를 자동화하고 효율을 할 수 있다는 점을 잘 모르기 때문에", "time": "00:38", "category": "AI 업무 활용 관련 기재"}, {"start": 201.0, "end": 204.0, "text": "그리고 구건 사례를 문체부안에 적극 공유하여", "time": "03:21", "category": "기관 내 확산 계획 관련 기재"}, {"start": 188.88, "end": 193.32, "text": "사전교육과 실패자 AI 융합 과정을 중단없이 마무리하고", "time": "03:08", "category": "과정·이유·검증 w?usp=drivesdk", "id": "1BlucXrBLVxrBH4GydgpkX3LKmlYIhcNv"}], "과정·이유·검증 설명 관련 기재": [{"text": "결과물 검토 및 수정 방법, 행정문서 초안 작성 실습, 회의자료 요약 실습, 도민회 안내문홍보문 작성 실습 등을 중심으로 안내할 계획임 3) 수료 후 강사 활동 계획", "source": "교육지원신청서_김명래.pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BlucXrBLVxrBH4GydgpkX3LKmlYIhcNv/view?usp=drivesdk", "id": "1BlucXrBLVxrBH4GydgpkX3LKmlYIhcNv"}, {"text": "실현 가능한 계획을 제시해 주십시오 운영의 구체성•실현 가능'항확산 효과 등을 종합 심사합니다. 1) 기관 자체 교육 운영 실적 월 2회", "source": "교육지원신청서_김명래.pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BlucXrBLVxrBH4GydgpkX3LKmlYIhcNv/view?usp=drivesdk", "id": "1BlucXrBLVxrBH4GydgpkX3LKmlYIhcNv"}, {"text": "어려움이 있습니다. 첫째, 실향민 1 세대의 고령화로 고향 이야기와 구술자료가 점자 사라지고 있습니다. 둘째, 2 세대3 세대4 세대로 갈수록 도민회와 위원회 사업에 대한 참여가 약화될 우려가 있습니다.", "source": "교육지원신청서_김명래.pdf", "page": 7, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BlucXrBLVxrBH4GydgpkX3LKmlYIhcNv/view?usp=drivesdk", "id": "1BlucXrBLVxrBH4GydgpkX3LKmlYIhcNv"}]}, "media": [{"n": 65, "id": "1K8-J0lsXXWIpT0cR3HiR7aGk5qItf7Vj", "file": "발표영상-김명래.m4a", "url": "https://drive.google.com/file/d/1K8-J0lsXXWIpT0cR3HiR7aGk5qItf7Vj/view?usp=drivesdk", "duration": 195.7089, "video": false, "audio": true, "segments": [{"start": 0.53, "end": 5.03, "text": "안녕하십니까. 이부고도위원회 평환남도에서 근무하고 있는 김명래입니다.", "time": "00:00"}, {"start": 5.03, "end": 18.03, "text": "제가 말씀드릴 기관 AI 데이터 역량 강화 실행 계획은 AI를 배우는 기관에서 AI를 실제 업무에 활용하는 기관으로 전환하는 것입니다.", "time": "00:05"}, {"start": 18.03, "end": 20.03, "text": "먼저 문제점입니다.", "time": "00:18"}, {"start": 20.03, "end": 29.53, "text": "현재 우리 기관은 축사, 보도자료, 행사 계획서, 결과보고서, 도민의 안내문 등 반복적인 행정 업무가 많습니다.", "time": "00:20"}, {"start": 29.53, "end": 40.53, "text": "하지만 직원별 AI 활용 경험과 역량에는 차이가 있고 기관, 차원의 체계적인 AI 교육과 활용 사례도 아직 충분하지 않습니다.", "time": "00:29"}, {"start": 40.53, "end": 55.53, "text": "특히 이북 오드위원회는 일반 행정 기관과 달리 시량민이 고향 이야기와 구술 자료, 향토 문화 자료를 보존하고 후세대와 연결해야 하는 중요한 역할을 가지고 있습니다.", "time": "00:40"}, {"start": 55.53, "end": 68.05, "text": "시량민 1세대의 고령화가 빠르게 진행되는 지금 이러한 자료를 어떻게 디지털화하고 다음 세대에게 전달할 것인지도 중요한 과제입니다.", "time": "00:55"}, {"start": 68.05, "end": 77.29, "text": "두번째는 해결 방안입니다. 저는 기관내부 AI 영향 강화 프로그램인 날레날레 AI를 운영하겠습니다.", "time": "01:08"}, {"start": 77.29, "end": 89.29, "text": "첫 단계에서는 직원들에게 생성형 AI 기본 활용법과 개인정보, 보안 등 공공기관에 더 반드시 알아야 할 활용 원칙을 교육하겠습니다.", "time": "01:17"}, {"start": 89.29, "end": 102.29, "text": "두 번째 단계에서는 실제 우리 기관이 업무 자료를 활용하여 축사, 보고서, 보도자료, 행사 안내문등을 직접 만들어보는 실습 교육을 진행하겠습니다.", "time": "01:29"}, {"start": 102.29, "end": 109.99, "text": "세 번째 단계에서는 단순한 문서 작성을 넘어 시낭민 구술 자료와 고향 이야기를 정리하고", "time": "01:42"}, {"start": 109.99, "end": 116.59, "text": "디지털 콘텐츠로 전환하는 등 이보호도위원회 만에 AI 활용 과제를 발굴하겠습니다.", "time": "01:49"}, {"start": 116.59, "end": 121.99, "text": "그리고 우수 사례는 각도 사무국과 도미네까지 확산하겠습니다.", "time": "01:56"}, {"start": 121.99, "end": 124.29, "text": "세 번째는 기대 효과입니다.", "time": "02:01"}, {"start": 124.29, "end": 130.59, "text": "직원들의 AI 활용 역량이 높아지고 반복적인 문서 작성 시간이 줄어들 것입니다.", "time": "02:04"}, {"start": 130.59, "end": 139.55, "text": "또한 개인 별로 흩어져 있던 AI 활용 방법이 기관의 표준적인 업무 방식과 사례로 축적될 수 있습니다.", "time": "02:10"}, {"start": 139.55, "end": 150.67, "text": "무엇보다 AI를 단순한 업무 자동화 도구가 아니라 시장민의 기억을 보존하고 후세대와 연결하는 행정수단으로 활용할 수 있습니다.", "time": "02:19"}, {"start": 150.67, "end": 163.67, "text": "마지막으로 저의 역할입니다. 저는 단순히 교육을 전달하는 방사가 아니라 기간의 AI 전환을 실제 업무까지 연결하는 내부 퍼실리 데이터가 되겠습니다.", "time": "02:30"}, {"start": 163.67, "end": 174.67, "text": "직원들이 교육을 듣는 것에서 끝나지 않고 내 업무에서 무엇을 AI로 바꿀 수 있는가를 직접 찾아서 적용할 수 있도록 지원하겠습니다.", "time": "02:43"}, {"start": 174.67, "end": 181.51, "text": "그리고 작은 성공 사례를 만들고 이를 각도 사무웃과 도미네로 확산시키겠습니다.", "time": "02:54"}, {"start": 181.51, "end": 193.55, "text": "전통과 기억을 지키는 이북 오도위원회가 이제는 AI와 데이터를 활용해 그 기억을 더 오래 보존하고 다음 세대와 연결하는 기관으로 발전하도록 하겠습니다.", "time": "03:01"}, {"start": 193.55, "end": 195.71, "text": "감사합니다.", "time": "03:13"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/65/1K8-J0lsXXWIpT0cR3HiR7aGk5qItf7Vj.m4a", "frame": null, "quotes": [{"start": 89.29, "end": 102.29, "text": "두 번째 단계에서는 실제 우리 기관이 업무 자료를 활용하여 축사, 보고서, 보도자료, 행사 안내문등을 직접 만들어보는 실습 교육을 진행하겠습니다.", "time": "01:29", "category": "AI 업무 활용 관련 기재"}, {"start": 116.59, "end": 121.99, "text": "그리고 우수 사례는 각도 사무국과 도미네까지 확산하겠습니다.", "time": "01:56", "category": "기관 내 확산 계획 관련 기재"}]}], "issues": [], "files": [{"n": 65, "name": "김명래", "title": "교육지원신청서_김명래.pdf", "mime": "application/pdf", "bytes": 4041017, "downloaded": true, "url": "https://drive.google.com/file/d/1BlucXrBLVxrBH4GydgpkX3LKmlYIhcNv/view?usp=drivesdk", "local": "../원본/65/1BlucXrBLVxrBH4GydgpkX3LKmlYIhcNv.pdf", "id": "1BlucXrBLVxrBH4GydgpkX3LKmlYIhcNv"}, {"n": 65, "name": "김명래", "title": "발표영상-김명래.m4a", "mime": "audio/x-m4a", "bytes": 3194192, "downloaded": true, "url": "https://drive.google.com/file/d/1K8-J0lsXXWIpT0cR3HiR7aGk5qItf7Vj/view?usp=drivesdk", "local": "../원본/65/1K8-J0lsXXWIpT0cR3HiR7aGk5qItf7Vj.m4a", "id": "1K8-J0lsXXWIpT0cR3HiR7aGk5qItf7Vj"}], "doc_count": 1, "media_count": 1}, {"n": 66, "original_no": 66, "row": 67, "name": "안상민", "org": "울산광역시", "folder_title": "66. 울산광역시_안상민", "folder_url": "https://drive.google.com/drive/folders/1y0TAgChDiwr2de2tUa-s1HHb6peC-YYk", "summary": "VBA·Python 독학과 생성형 AI 도구 제작, 직원 약 8명의 스터디 운영을 기재. 직접 만든 HTML 실습자료를 배포하는 학습 경험을 제시함.", "evidence": {"자기주도 학습 관련 기재": [{"text": "스터디장 (기획•진행) 수료/이수 수료(인증)", "source": "AI강사 양성과정 신청서(울산광역시_안상민).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1EDGZtcRDSjuh7BuTZBhXTFptDu7VAmtf/view?usp=drivesdk", "id": "1EDGZtcRDSjuh7BuTZBhXTFptDu7VAmtf"}, {"text": "- 사가 대중호t되기 이전부터 반복 업무 자동화에 관심을 갖고 VBA, Python 등을 독학하며 업무에 적용 해음. 이후 생성형 AI가 발전하면서 ChatGPT, CIaude, Gemini 등을 활용한 코드 작성빠이브코딩을 스스로 시도하며 실무 도구 제작 역량을 넓혀감", "source": "AI강사 양성과정 신청서(울산광역시_안상민).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1EDGZtcRDSjuh7BuTZBhXTFptDu7VAmtf/view?usp=drivesdk", "id": "1EDGZtcRDSjuh7BuTZBhXTFptDu7VAmtf"}, { 6.jpg", "segments": [{"start": 2.16, "end": 15.97, "text": "안녕하십니까. 이번 2회차 공공 AI 역량 트랙 강사광 양성과정을 신청한 울산광역시 농수산물 도매시장 관리사업소 안상민입니다.", "time": "00:02"}, {"start": 15.97, "end": 21.25, "text": "저는 지원 배경이 된 문제의식부터 말씀드리겠습니다.", "time": "00:15"}, {"start": 21.25, "end": 27.49, "text": "제가 근무하면서 느낀 문제점은 AI가 빠르게 발전하며 생활 깊숙이 스며들고 있지만", "time": "00:21"}, {"start": 27.49, "end": 33.01, "text": "아직 AI 사용이 낯설거나 경험이 적은 동료 직원들이 많다는 겁니다.", "time": "00:27"}, {"start": 33.01, "end": 38.51, "text": "이대로 시간이 지나면 활용 격차는 점점 벌어질 것입니다.", "time": "00:33"}, {"start": 38.51, "end": 42.67, "text": "저는 AI가 대중화되기 전부터 반복 업무 자동화에 관심을 갖고", "time": "00:38"}, {"start": 42.67, "end": 47.57, "text": "VBA나 파이선을 독학하며 업무에 적용해왔습니다.", "time": "00:42"}, {"start": 47.57, "end": 52.85, "text": "이런 경험을 살려 많은 직원들을 AI를 적합한 방법으로 활용해", "time": "00:47"}, {"start": 52.85, "end": 56.73, "text": "반복자극을 줄일 수 있도록 돕고 싶습니다.", "time": "00:52"}, {"start": 56.73, "end": 59.77, "text": "이에 대한 해결 방안으로 저는 올해 6월", "time": "00:56"}, {"start": 59.77, "end": 66.31, "text": "AI 챔피언 블루 과정을 이수하여 데이터군섭과 AI 서비스 구현 용량을 체계적으로 다졌고", "time": "00:59"}, {"start": 66.31, "end": 73.35, "text": "7월부터는 이를 바탕으로 소속 기간 직원 대상 자체 AI 스터디를 운영하고 있습니다.", "time": "01:06"}, {"start": 73.35, "end": 81.47, "text": "카드 뉴스와 실습 자료를 직접 제작해 문서 초안 작성부터 바이브 코딩, RAC 실습까지 다뤄왔습니다.", "time": "01:13"}, {"start": 81.47, "end": 89.75, "text": "다만 개인이 만든 스터디이다 보니 공간과 자원의 한계로 오픈 채팅방 중심 운영에 머무를 수밖에 없었습니다.", "time": "01:21"}, {"start": 89.75, "end": 93.71, "text": "이번 강사 과정을 수려하고 교육부서와 협업한다면", "time": "01:29"}, {"start": 93.71, "end": 96.83, "text": "표준 교환을 바탕으로 집합 교육을 실시하여", "time": "01:33"}, {"start": 96.83, "end": 101.51, "text": "더 많은 직원들과 함께할 수 있을 것이라 생각합니다.", "time": "01:36"}, {"start": 101.51, "end": 105.35, "text": "AI 직장 교육을 통해 얻을 수 있는 기대 효과는", "time": "01:41"}, {"start": 105.35, "end": 109.43, "text": "표준 교환을 바탕으로 분기 일회 정규 교육을 실시하여", "time": "01:45"}, {"start": 109.43, "end": 113.11, "text": "연일의 수준인 기존 직장 교육 체계를 보완하고", "time": "01:49"}, {"start": 113.11, "end": 117.27, "text": "문서 초환 작성 데이터 분석 반복 업무 자동화등", "time": "01:53"}, {"start": 117.27, "end": 122.91, "text": "실무에 바로 적용 가능한 AI 활용법을 알려드리고자 합니다.", "time": "01:57"}, {"start": 122.91, "end": 125.65, "text": "매분기 새로운 희망자를 대상으로 운영해", "time": "02:02"}, {"start": 125.65, "end": 129.03, "text": "연간 우적 80명까지 확산 효과를 기대하며", "time": "02:05"}, {"start": 129.03, "end": 134.31, "text": "수료자 중심 오픈 채팅 커뮤니티로 사후 관리도 이어가겠습니다.", "time": "02:09"}, {"start": 134.31, "end": 137.87, "text": "그리고 신청이 막여냈던 AI 챔피언 과정도 소개해", "time": "02:14"}, {"start": 137.87, "end": 142.67, "text": "더 체계적인 교육으로 이어질 수 있도록 동료하겠습니다.", "time": "02:17"}, {"start": 142.67, "end": 150.77, "text": "저는 AI 강의를 하며 AI가 낯선 직원에게는 쉽게 다가갈 수 있는 방법을 안내하고", "time": "02:22"}, {"start": 150.77, "end": 159.31, "text": "더 전문적으로 활용하고 싶은 직원에게는 제가 아는 범위 내에서 심화된 지식을 나누는 역할을 하고 싶습니다.", "time": "02:30"}, {"start": 159.31, "end": 165.01, "text": "함께 배우고 성장할 동료를 만들어가는 것이 이번 도전의 가장 큰 목표입니다.", "time": "02:39"}, {"start": 165.01, "end": 167.51, "text": "감사합니다.", "time": "02:45"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/66/1AkeYdWvCpQHShzBQy26-74pZs2xxssUY.mp4", "frame": "../영상장면/66.jpg", "quotes": [{"start": 42.67, "end": 47.57, "text": "VBA나 파이선을 독학하며 업무에 적용해왔습니다.", "time": "00:42", "category": "자기주도 학습 관련 기재"}, {"start": 38.51, "end": 42.67, "text": "저는 AI가 대중화되기 전부터 반복 업무 자동화에 관심을 갖고", "time": "00:38", "category": "AI 업무 활용 관련 기재"}, {"start": 2.16, "end": 15.97, "text": "안녕하십니까. 이번 2회차 공공 AI 역량 트랙 강사광 양성과정을 신청한 울산광역시 농수산물 도매시장 관리사업소 안상민입니다.", "time": "00:02", "category": "기관 내 확산 계획 관련 기재"}, {"start": 81.47, "end": 89.75, "text": "다만 개인이 만든 스터디이다 보니 공간과 자원의 한계로 오픈 채팅방 중심 운영에 머무를 수밖에 없었습니다.", "time": "01:21", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 66, "name": "안상민", "title": "AI강사 양성과정 신청서(울산광역시_안상민).pdf", "mime": "application/pdf", "bytes": 1415017, "downloaded": true, "url": "https://drive.google.com/file/d/1EDGZtcRDSjuh7BuTZBhXTFptDu7VAmtf/view?usp=drivesdk", "local": "../원본/66/1EDGZtcRDSjuh7BuTZBhXTFptDu7VAmtf.pdf", "id": "1EDGZtcRDSjuh7BuTZBhXTFptDu7VAmtf"}, {"n": 66, "name": "안상민", "title": "AI강사양성과정_기관AI데이터역량강화실행계(울산광역시 안상민).mp4", "mime": "video/mp4", "bytes": 188530533, "downloaded": true, "url": "https://drive.google.com/file/d/1AkeYdWvCpQHShzBQy26-74pZs2xxssUY/view?usp=drivesdk", "local": "../원본/66/1AkeYdWvCpQHShzBQy26-74pZs2xxssUY.mp4", "id": "1AkeYdWvCpQHShzBQy26-74pZs2xxssUY"}], "doc_count": 1, "media_count": 1}, {"n": 67, "original_no": 67, "row": 68, "name": "신현준", "org": "기후에너지환경부 수도권대기환경청", "folder_title": "67. 기후에너지환경부_신현준", "folder_url": "https://drive.google.com/drive/folders/1dfNrW5S8ZtJc1DH30YJ47m2vFdKJmpT2", "summary": "환경 업무 웹앱·분석·모델링 도구 개발 경험을 기재. 원시자료 대신 구조 설명으로 코드를 생성하는 실습과 연 4회 이상 내부교육을 제시함.", "evidence": {"자기주도 학습 관련 기재": [{"text": "AI활용 역량강화 연구모임 강의 COP 모임장, 자체강사 ※ 기관 내·외부 강의, 교육 운영, 멘토링, 퍼실리테이션 등 교육 진행 이력을 기재합니다.", "source": "강사 양성 과정 신청서_기후에너지환경부 신현준.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1bn-8vu1vayBo5m3TjEzHlRHQjPLPsT6l/view?usp=drivesdk", "id": "1bn-8vu1vayBo5m3TjEzHlRHQjPLPsT6l"}, {"text": "'26. 4분기 중 소속 직원 대상 표준 교안 기반 AI 리터러시 교육 1회 이상 시범 운영, '27년부터 기존 AI활용 역량강화 연구모임과 연계하여 분기 1회 이상 정례 운영. 신규 직원·청년인턴 입직 시기와 연계한 입문 교육을 상시 편성하고, 기존 대외 교육 채널(지자체·환경기술인협회)을 활용하여 확산 □ 자체 교육 운영 실적 및 계획 1) 기관 자체 교육 운영 실적", "source": "강사 양성 과정 신청서_기후에너지환경부 신현준.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1bn-8vu1vayBo5m3TjEzHlRHQjPLPsT6l/view?usp=drivesdk", "id": "1bn-8vu1vayBo5m3TjEzHlRHQjPLPsT6l"}, {"text": "AI활용 역량강화 연구모임 소속 구성원 및 외부인원 약 300명 정기 및 요청 시 AI강의 진행", "source": "강사 양성 과정 신청서_기후에너지환경부 신현준.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1bn-8vu1vayBo5m3TjEzHlRHQjPLPsT6l/view?usp=drivesdk", "id": "1bn-8vu1vayBo5m3TjEzHlRHQjPLPsT6l"}], "AI 업무 활용 관련 기재": [{"text": "AI기반 서비스 기획 구현(14) 수료 2025.6.27.,7.4,7.11", "source": "강사 양성 과정 신청서_기후에너지환경부 신현준.hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1bn-8vu1vayBo5m3Tj 수 있도록 돕기 위해선입니다.", "time": "00:13"}, {"start": 18.91, "end": 23.53, "text": "AI 리터러시와 업무 활용 과목을 체계적으로 배워", "time": "00:18"}, {"start": 23.53, "end": 26.57, "text": "흡수업 기관의 직원 교육부터 시작하고", "time": "00:23"}, {"start": 26.57, "end": 31.4, "text": "부은의 음량 강화에 기여하고자 합니다.", "time": "00:26"}, {"start": 31.4, "end": 38.9, "text": "교육의 목표는 직원들이 자기 업무에 맞게 AI를 활용할 수 있도록 하는 것입니다.", "time": "00:31"}, {"start": 38.9, "end": 44.9, "text": "먼저 생성형 AI가 잘하는 예과 한계를 이해하도록 돕겠습니다.", "time": "00:38"}, {"start": 44.9, "end": 52.1, "text": "다음으로 문서 초안 작성이나 자료 외약처럼 익숙한 업무를 실습하겠습니다.", "time": "00:44"}, {"start": 52.1, "end": 60.4, "text": "마지막으로 결과와 업무는 대조하고 입력해도 되는 자료인지 판단을 연습을 하겠습니다.", "time": "00:52"}, {"start": 60.4, "end": 70.54, "text": "AI가 낯선 직원도 기초부터 차근차근 따라올 수 있도록 과제를 구성하겠습니다.", "time": "01:00"}, {"start": 70.54, "end": 77.8, "text": "수업은 표준 교환을 바탕으로 짧은 설명과 직접 해보는 실습을 연결하겠습니다.", "time": "01:10"}, {"start": 77.8, "end": 85.32, "text": "예를 들어 공개된 환경 정책 자료를 한쪽으로 요약하는 과제를 활용할 수 있습니다.", "time": "01:17"}, {"start": 85.32, "end": 90.08, "text": "먼저 요약의 목적과 읽는 대상을 정합니다.", "time": "01:25"}, {"start": 90.08, "end": 94.44, "text": "이어 필요한 추격 형식을 담아 AI에 요청하고", "time": "01:30"}, {"start": 94.44, "end": 98.36, "text": "결과의 수치를 근거를 원문과 대조합니다.", "time": "01:34"}, {"start": 98.36, "end": 104.08, "text": "마지막에는 동료와 결과를 공유하며 요청문을 고쳐 보겠습니다.", "time": "01:38"}, {"start": 104.08, "end": 108.8, "text": "강사는 직원들이 막히는 지점을 실습을 돕고", "time": "01:44"}, {"start": 108.8, "end": 114.38, "text": "결과를 스스로 검토하도록 안내하겠습니다.", "time": "01:48"}, {"start": 114.38, "end": 119.7, "text": "후려후에는 수도권 대기안경청에서 시범 교육을 시작하겠습니다.", "time": "01:54"}, {"start": 119.7, "end": 129.9, "text": "2026년 11월에는 전지기원 50에서 90명 내외를 대상으로 표준 교환 기반의 교육을 계획하고 있습니다.", "time": "01:59"}, {"start": 129.9, "end": 137.94, "text": "12월에는 신규 직원과 학년 인턴 약 20명 내외를 위한 인문 교육을 운영하겠습니다.", "time": "02:09"}, {"start": 137.94, "end": 145.06, "text": "2027년부터는 기존 연구모임과 연계의 분기마다 교육을 이어가겠습니다.", "time": "02:17"}, {"start": 145.06, "end": 151.6, "text": "운영 목표는 연내 4회 이상, 연인원 100명 이상입니다.", "time": "02:25"}, {"start": 151.6, "end": 158.32, "text": "15원 운영에서 확인한 계산점을 다음 교육에 반영하겠습니다.", "time": "02:31"}, {"start": 158.32, "end": 164.16, "text": "한 번의 교육이 실제 업무 활용으로 이어지도록 4호 교육도 진행하겠습니다.", "time": "02:38"}, {"start": 164.16, "end": 168.48, "text": "교육 전에 직원들을 배우고 싶은 업무를 간단하게 조사하고", "time": "02:44"}, {"start": 168.48, "end": 172.0, "text": "교육 후에 학생할 과제를 돕겠습니다.", "time": "02:48"}, {"start": 172.0, "end": 176.44, "text": "초학습자의 AI 챔피언 인증 준비도 지원하겠습니다.", "time": "02:52"}, {"start": 178.32, "end": 181.68, "text": "저는 이번 과정을 통해 표준 교환을 추근실이 익히고", "time": "02:58"}, {"start": 181.68, "end": 185.36, "text": "직원 눈높이에 맞게 수업을 운영하는 방법을 배우겠습니다.", "time": "03:01"}, {"start": 185.36, "end": 190.52, "text": "쓰러요 교육 일정을 체계하고 실습을 돕고 피드백까지 해서", "time": "03:05"}, {"start": 190.52, "end": 195.44, "text": "저의 책임이 있는 강사 생활을 강사를 되도록 노력하겠습니다.", "time": "03:10"}, {"start": 195.44, "end": 196.24, "text": "감사합니다.", "time": "03:15"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/67/1A-_fm25YPZ8gVwpsxA15134d1iEwCcgm.mp4", "frame": "../영상장면/67.jpg", "quotes": [{"start": 18.91, "end": 23.53, "text": "AI 리터러시와 업무 활용 과목을 체계적으로 배워", "time": "00:18", "category": "자기주도 학습 관련 기재"}, {"start": 129.9, "end": 137.94, "text": "12월에는 신규 직원과 학년 인턴 약 20명 내외를 위한 인문 교육을 운영하겠습니다.", "time": "02:09", "category": "강의·학습 지원 관련 기재"}, {"start": 98.36, "end": 104.08, "text": "마지막에는 동료와 결과를 공유하며 요청문을 고쳐 보겠습니다.", "time": "01:38", "category": "기관 내 확산 계획 관련 기재"}, {"start": 38.9, "end": 44.9, "text": "먼저 생성형 AI가 잘하는 예과 한계를 이해하도록 돕겠습니다.", "time": "00:38", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 67, "name": "신현준", "title": "강사 양성 과정 신청서_기후에너지환경부 신현준.hwpx", "mime": "application/x-zip", "bytes": 104990, "downloaded": true, "url": "https://drive.google.com/file/d/1bn-8vu1vayBo5m3TjEzHlRHQjPLPsT6l/view?usp=drivesdk", "local": "../원본/67/1bn-8vu1vayBo5m3TjEzHlRHQjPLPsT6l.hwpx", "id": "1bn-8vu1vayBo5m3TjEzHlRHQjPLPsT6l"}, {"n": 67, "name": "신현준", "title": "강사 양성 과정
