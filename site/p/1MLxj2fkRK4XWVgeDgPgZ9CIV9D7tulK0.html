 "text": "소방 업무에는 자료 정리, 반복서식 작성, 통계처럼 AI와 데이터를 활용할 수 있는들이 많이 있습니다.", "time": "00:09"}, {"start": 17.53, "end": 25.53, "text": "하지만 직원마다 활용 경험이 다르고, 관심은 있어도 어디서부터 시작할지 모르는 직원이 많이 있습니다.", "time": "00:17"}, {"start": 25.53, "end": 29.73, "text": "여러 관서와 교대조로 나뉘고 출동도 잦아서", "time": "00:25"}, {"start": 29.73, "end": 34.53, "text": "한 번의 교육으로 전 직원에게 충분한 실습 기회를 주기 어렵습니다.", "time": "00:29"}, {"start": 34.53, "end": 37.53, "text": "수업 뒤 혼자 해보다 막혔을 때", "time": "00:34"}, {"start": 37.53, "end": 41.53, "text": "묻고 다시 해볼 수 있어야 배움이 업무로 이어집니다.", "time": "00:37"}, {"start": 41.53, "end": 46.53, "text": "과정 전에는 바이브 코딩 표준 교환을 미리 실습하겠습니다.", "time": "00:41"}, {"start": 46.53, "end": 50.53, "text": "3일 전 과정과 모의 수업의 성실이 참여하며", "time": "00:46"}, {"start": 50.53, "end": 54.53, "text": "처음 배우는 직원이 막히는 부분과 수업 준비사항을 정리해", "time": "00:50"}, {"start": 54.53, "end": 57.39, "text": "소방근무 여건에 맞는 운영안을 만들겠습니다.", "time": "00:54"}, {"start": 58.23, "end": 63.39, "text": "수류 후에는 교육 담당 부서의 완주 소방서 소규모 교육안을 제출해", "time": "00:58"}, {"start": 63.39, "end": 68.23, "text": "일정과 대상을 협의하고 승인된 첫 수업을 직접 맡겠습니다.", "time": "01:03"}, {"start": 68.79, "end": 71.55, "text": "표준 교안의 엑시미원 그대로 전달하고", "time": "01:08"}, {"start": 71.55, "end": 76.43, "text": "진행시간과 실습 지원은 교대 근무와 참여자의 경험에 맞추겠습니다.", "time": "01:11"}, {"start": 77.35, "end": 81.49, "text": "직원이 반복 업무 하나를 골라 필요한 자료를 정리하고", "time": "01:17"}, {"start": 81.49, "end": 84.23, "text": "AI로 간단한 업무 도구를 만든 뒤", "time": "01:21"}, {"start": 84.23, "end": 88.52, "text": "직접 확인하는 데까지 함께하겠습니다.", "time": "01:24"}, {"start": 88.52, "end": 93.52, "text": "수업에서 나온 질문과 해결 과정은 다음 교육에 반영하고", "time": "01:28"}, {"start": 93.52, "end": 99.96, "text": "교육 후에도 질문을 받으며 그린 블루 인증 좀비도 함께 돕겠습니다.", "time": "01:33"}, {"start": 99.96, "end": 106.92, "text": "내부 교육을 반복하면 비반이나 출동으로 놓친 직원도 다음 회차에 참여할 수 있습니다.", "time": "01:39"}, {"start": 106.92, "end": 113.28, "text": "직원은 자료를 고르고 정리해서 AI로 결과를 만들고 확인하는 과정을 익힙니다.", "time": "01:46"}, {"start": 113.28, "end": 118.28, "text": "소방에는 질문과 해결 방법, 운영, 경험이 쌓입니다.", "time": "01:53"}, {"start": 118.28, "end": 122.28, "text": "참여인원, 실습 완료 여부, 자주 막힌 단계,", "time": "01:58"}, {"start": 122.28, "end": 126.68, "text": "교육 후 활용 여부를 확인해 담당 부서와 공유하겠습니다.", "time": "02:02"}, {"start": 126.68, "end": 130.28, "text": "다음 매차를 보완하고 다른 관서에도 활용할 수 있는", "time": "02:06"}, {"start": 130.28, "end": 133.08, "text": "교육안으로 발전시키도록 하겠습니다.", "time": "02:10"}, {"start": 133.08, "end": 137.28, "text": "제 역할은 표준 교환을 전달하고 직원이 직접 해보도록", "time": "02:13"}, {"start": 137.28, "end": 140.48, "text": "곁에서 돕는 퍼실리테이터입니다.", "time": "02:17"}, {"start": 140.48, "end": 148.48, "text": "구조 장비도 직접 만지고 반복해야 익숙해지듯 AI와 데이터도 스스로 다뤄봐야 자기 것이 됩니다.", "time": "02:20"}, {"start": 148.48, "end": 156.68, "text": "저부터 교환을 충분히 익히고 교육 준비, 진행, 사후 질문, 결과 공유까지 직접 챙기겠습니다.", "time": "02:28"}, {"start": 156.68, "end": 162.16, "text": "완주 소방세에서 시작하되 교육 대상은 전북 소방 전 직원입니다.", "time": "02:36"}, {"start": 162.16, "end": 170.92, "text": "첫 교육의 경험을 다음 교육으로 연결하여 소방 안에서 AI 데이터 교육이 꾸준히 이어지도록 하겠습니다.", "time": "02:42"}, {"start": 170.92, "end": 171.92, "text": "감사합니다.", "time": "02:50"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/19/1d1ie4-9enjqcOWDsfORkkUJ3hJyg5uis.mp4", "frame": "../영상장면/19.jpg", "quotes": [{"start": 140.48, "end": 148.48, "text": "구조 장비도 직접 만지고 반복해야 익숙해지듯 AI와 데이터도 스스로 다뤄봐야 자기 것이 됩니다.", "time": "02:20", "category": "AI 업무 활용 관련 기재"}, {"start": 71.55, "end": 76.43, "text": "진행시간과 실습 지원은 교대 근무와 참여자의 경험에 맞추겠습니다.", "time": "01:11", "category": "강의·학습 지원 관련 기재"}, {"start": 99.96, "end": 106.92, "text": "내부 교육을 반복하면 비반이나 출동으로 놓친 직원도 다음 회차에 참여할 수 있습니다.", "time": "01:39", "category": "기관 내 확산 계획 관련 기재"}]}], "issues": [], "files": [{"n": 19, "name": "김무영", "title": "강사양성과정_신청서(김무영).hwpx", "mime": "application/haansofthwpx", "bytes": 189215, "downloaded": true, "url": "https://drive.google.com/file/d/1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD/view?usp=drivesdk", "local": "../원본/19/1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD.hwpx", "id": "1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD"}, {"n": 19, "name" 1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX/view?usp=drivesdk", "id": "1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX"}], "강의·학습 지원 관련 기재": [{"text": "1) 강의 실적 및 경험 기간 2026, 4,", "source": "강사 양성 과정 신청서(서명본).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX/view?usp=drivesdk", "id": "1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX"}], "기관 내 확산 계획 관련 기재": [{"text": "실현 기능한 계획을 제시해 주십시오 운영의 구체성•실현 가능성확산 효과 등을 종합 심사합니다. 1) 기관 자체 교육 운영 실적 기간", "source": "강사 양성 과정 신청서(서명본).pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX/view?usp=drivesdk", "id": "1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX"}, {"text": "- 정객 배경: 행정안전부는 2026. 9. 8. 국무회의에 「공무원의 시 활용 직접개발 활성화 및 확산 방안」을 보고 - 2030년까지 챔피언 2만 영, 우수 성과자에계 특별성과 포상금•연수•학습비 지원, 절자 준수 시 적극행정 면책 적용, 정부혁신 평가•왕중왕전에 AX 부문 신설•확대. 시를 잘 쓰는 직원을 기관 안에서", "source": "강사 양성 과정 신청서(서명본).pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX/view?usp=drivesdk", "id": "1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX"}, {"text": "- 운영 목표(정량): 2026. 11.~2027. 상반기 3기 운영, 교육 참여 10명 + 엔토렁 5명 내외. 참여 직원별 업무 적용 결과물 1건(첫해 10건), 그린 인증 도전자 5영. - 운영 목표(정성): 기는 도구이고 호기심•열정•판단•전문성은 사람의 몫•이라는 바른 이해가 직원에게 자", "source": "강사 양성 과정 신청서(서명본).pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX/view?usp=drivesdk", "id": "1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX"}], "과정·이유·검증 설명 관련 기재": [{"text": "배우는 사람이 막기는 지쪢계짬권한•프름프트 각성•결과 검증)을 직접 겪고 경리함. - (보완점) 김식 강의 실격은 않지 않음, 대신 비전공가로 시작에 처음 배우는 사람이 어디서 막히는지 알고 있어, 가로지기보다 옆에서 돕는 피실리리이션에 맞음.", "source": "강사 양성 과정 신청서(서명본).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX/view?usp=drivesdk", "id": "1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX"}, {"text": "습은 처음 쓰는 직원 눈높이에서 막힘 지점(계정•권한•프름프트 작성•결과 검증)을 안내 가능. - 유의사항 숙지: 개인정보•내부자료 입력 금지, 결과의 가변성과 검증 필요성을 실습 첫 시간에 다루도 록 설계.", "source": "강사 양성 과정 신청서(서명본).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX/view?usp=drivesdk", "id": "1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX"}, {"text": "- 유의사항 숙지: 개인정보•내부자료 입력 금지, 결과의 가변성과 검증 필요성을 실습 첫 시간에 다루도 록 설계. 3) 수료 후 강사 활동 계획", "source": "강사 양성 과정 신청서(서명본).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX/view?usp=drivesdk", "id": "1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX"}]}, "media": [{"n": 20, "id": "1xZDHa1W8qRSV-qkw8HAVgIdLf5smfwlb", "file": "서울시립과학관_권오혁_실행계획발표.mp4", "url": "https://drive.google.com/file/d/1xZDHa1W8qRSV-qkw8HAVgIdLf5smfwlb/view?usp=drivesdk", "duration": 175.8, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\20.jpg", "segments": [{"start": 1.81, "end": 5.25, "text": "안녕하세요. 서울시립과학관 전식과 권현룩입니다.", "time": "00:01"}, {"start": 5.25, "end": 9.05, "text": "저희 과학관의 실행 계획을 말씀드리겠습니다.", "time": "00:05"}, {"start": 9.05, "end": 22.21, "text": "행정안전부는 지난 9월 8일 국무회의에서 2030년까지 AI 챔피언 2만 명을 키우고 AI로 성과를 낸 공무원에게 포상과 학습 지원을 확대했다고 발표했습니다.", "time": "00:09"}, {"start": 22.21, "end": 27.85, "text": "그 흐름 속에서 과학관은 AI를 가장 많이 다뤄야 하는 기간 가운데 하나입니다.", "time": "00:22"}, {"start": 27.85, "end": 34.85, "text": "AI는 이 시대 가장 큰 과학 이야기이고 관람객은 이미 AI와 함께 살아가고 있습니다.", "time": "00:27"}, {"start": 34.85, "end": 39.29, "text": "저희가 관람객에게 전하고 싶은 것은 기술 자체가 아닙니다.", "time": "00:34"}, {"start": 39.29, "end": 47.21, "text": "AI를 오해하지 않도록 한계를 정확히 알리고 과학이 인간의 호기심과 열정으로 발전해왔던", "time": "00:39"}, {"start": 47.21, "end": 52.85, "text": "AI 시대에도 사람의 호기심과 열정, 판단이 더 중요하다는 것", "time": "00:47"}, {"start": 52.85, "end": 57.13, "text": "그리고 이 도구를 사람에게 선의를 갖고 잘 쓰는 법입니다.", "time": "00:52"}, {"start": 57.13, "end": 62.17, "text": "칼처럼 잘 알고 쓰면 돕고 모르고 쓰면 다치기 때문입니다.", "time": "00:57"}, {"start": 62.17, "end": 65.97, "text": "그러려면 직원부터 그 눈으로 AI를 써야 합니다.", "time": "01:02"}, {"start": 65.97, "end": 68.93, "text": "그런데 지금은 각자 자기 방식으로 쓰고 있어", "time": "01:05"}, {"start": 68.93, "end": 71.81, "text": "팀단위로 함께 쓰는 경험이 부족합니다.", "time": "01:08"}, {"start": 71.81, "end": 74.21, "text": "개인 영향을 어느 정도 표준화하고", "time": "01:11"}, {"start": 74.21, "end": 77.49, "text": "팀이 같이 쓰는 방식을 함께 고민하는 것", "time": "01:14"}, {"start": 77.49, "end": 80.89, "text": "행정 안전북 수준 교환이 그 출발점이라", "time": "01:17"}, {"start": 80.89, "end": 83.37, "text": "이 과정에 신청했습니다.", "time": "01:20"}, {"start": 83.37, "end": 87.21, "text": "휴준 교환으로 관내 자체 계획을 여는 것입니다.", "time": "01:23"}, {"start": 87.21, "end": 92.73, "text": "핵심은 한반 5명 그리고 매주 실제 업무에 적용해 보는 것입니다.", "time": "01:27"}, {"start": 92.73, "end": 97.53, "text": "1단계 올해 11월에 전시가 시간 5명으로 첫 단을 엽니다.", "time": "01:32"}, {"start": 97.53, "end": 104.97, "text": "트랙길, AI 털어시와 업무와 아룡 8시간을 주 1회 2시간으로 4주로 나눕니다.", "time": "01:37"}, {"start": 104.97, "end": 109.77, "text": "매주 배운 것을 전심을 개선 사업 같은 실제 업무에 적용해 오고", "time": "01:44"}, {"start": 109.77, "end": 113.57, "text": "마지막 주에 5명이 결과물을 하나씩 발표합니다.", "time": "01:49"}, {"start": 113.57, "end": 118.77, "text": "2단계, 내년 상반기에 희망자 5명으로 같은 방식으로", "time": "01:53"}, {"start": 118.77, "end": 125.81, "text": "트랙기, 노코드 데이터 분석을 이어가고 AI 챔피언 인증 준비자는 제가 멘토링합니다.", "time": "01:58"}, {"start": 125.81, "end": 132.49, "text": "기대 효과는 첫째, 참여한 직원마다 자기 업무의 AI를 적용한 결과물이 한 권씩 남습니다.", "time": "02:05"}, {"start": 132.49, "end": 141.25, "text": "둘째 같은 시간에 더 많은 업무를 수화하고 그렇게 번 시간으로 더 유익하고 재미있는 콘텐츠를 관람 개개 드릴 수 있습니다.", "time": "02:12"}, {"start": 141.25, "end": 149.25, "text": "셋째 같은 교환으로 함께 배우면 각자 쓰던 AI의 팀의 공통 기준이 생깁니다.", "time": "02:21"}, {"start": 149.25, "end": 158.93, "text": "저의 역할은 8월 AI 챔피언 그림 종합과정을 수료했고 전시회설 콘텐츠와 안내문 점검 도구를 AI로 직접 만들어서 써왔습니다.", "time": "02:29"}, {"start": 158.93, "end": 164.43, "text": "비전공자로 시작해 처음 배우는 직원이 어디서 막히는지 잘 알고 있습니다.", "time": "02:38"}, {"start": 164.43, "end": 173.89, "text": "강사 양성 과정에서 표준 교환 음영법을 익혀 서울시립과학관의 첫 AI 퍼실리테이터로 이 계획을 직접 운영하겠습니다.", "time": "02:44"}, {"start": 173.89, "end": 176.39, "text": "감사합니다.", "time": "02:53"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/20/1xZDHa1W8qRSV-qkw8HAVgIdLf5smfwlb.mp4", "frame": "../영상장면/20.jpg", "quotes": [{"start": 149.25, "end": 158.93, "text": "저의 역할은 8월 AI 챔피언 그림 종합과정을 수료했고 전시회설 콘텐츠와 안내문 점검 도구를 AI로 직접 만들어서 써왔습니다.", "time": "02:29", "category": "AI 업무 활용 관련 기재"}, {"start": 118.77, "end": 125.81, "text": "트랙기, 노코드 데이터 분석을 이어가고 AI 챔피언 인증 준비자는 제가 멘토링합니다.", "time": "01:58", "category": "강의·학습 지원 관련 기재"}, {"start": 39.29, "end": 47.21, "text": "AI를 오해하지 않도록 한계를 정확히 알리고 과학이 인간의 호기심과 열정으로 발전해왔던", "time": "00:39", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 20, "name": "권오혁", "title": "강사 양성 과정 신청서(서명본).pdf", "mime": "application/pdf", "bytes": 2990879, "downloaded": true, "url": "https://drive.google.com/file/d/1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX/view?usp=drivesdk", "local": "../원본/20/1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX.pdf", "id": "1-MrbVhg82UZYL1jCZlWRQ2pTrQQObMDX"}, {"n": 20, "name": "권오혁", "title": "서울시립과학관_권오혁_실행계획발표.mp4", "mime": "video/mp4", "bytes": 5231215, "downloaded": true, "url": "https://drive.google.com/file/d/1xZDHa1W8qRSV-qkw8HAVgIdLf5smfwlb/view?usp=drivesdk", "local": "../원본/20/1xZDHa1W8qRSV-qkw8HAVgIdLf5smfwlb.mp4", "id": "1xZDHa1W8qRSV-qkw8HAVgIdLf5smfwlb"}], "doc_count": 1, "media_count": 1}, {"n": 21, "original_no": 21, "row": 22, "name": "양영진", "org": "서울시설공단", "folder_title": "21.서울시설공단_양진영", "folder_url": "https://drive.google.com/drive/folders/1GSzaWDDvWjzJX74OsVwgPKY6hh-fCA-H", "summary": "공단 전임교수로서 강의 운영 경험을 기재. 시설관리 현장 과제와 연계해 회당 약 20명, 월 1~2회 자체교육을 계획함.", "evidence": {"자기주도 학습 관련 기재": [], "AI 업무 활용 관련 기재": [{"text": "口 트랙2(AI융합) : 노코드 데이터분석 ㉭ 시 행정 융합 기획 ㉭ 노코드AI 서비스 구현 口 트랙3(AI개발) : 0 데이터분석 심화 ㉭ 바이브 코딩 ※ 강사  "1qLzeWqPMQCLms6Xx5O2ZIZXJJ8c97USI"}, {"text": "- 운영 대상 및 예상 인원 • 운영대상 : 서울시설공단내 실무직원 약 3,000영 (31개부서, 7급보 ~ 4급) 회자별인원 : 회당 20명(실습장비 고러), 월 1-2회(연 20회 이상)", "source": "강사 양성 과정 신청서(서울시설공단 양영진).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1qLzeWqPMQCLms6Xx5O2ZIZXJJ8c97USI/view?usp=drivesdk", "id": "1qLzeWqPMQCLms6Xx5O2ZIZXJJ8c97USI"}], "과정·이유·검증 설명 관련 기재": [{"text": "편집프로그램(Clipchamp) 등을 활용하여 동영상을 수정 및 제작할 수 있음. 3) 수료 후 강사 활동 계획 - 현재 전임교수로서 수료 후에는 직원들에서 강의를 바로 시행할 수 있으며 AI강사(피실리EII이터)로서", "source": "강사 양성 과정 신청서(서울시설공단 양영진).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1qLzeWqPMQCLms6Xx5O2ZIZXJJ8c97USI/view?usp=drivesdk", "id": "1qLzeWqPMQCLms6Xx5O2ZIZXJJ8c97USI"}, {"text": "실현 가능한 계획을 제시해 주십시오 운영의 구제상실현 7능청확산 효과 등을 종합 심사합니다. 1) 기관 자제 교육 운영 실적 기간", "source": "강사 양성 과정 신청서(서울시설공단 양영진).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1qLzeWqPMQCLms6Xx5O2ZIZXJJ8c97USI/view?usp=drivesdk", "id": "1qLzeWqPMQCLms6Xx5O2ZIZXJJ8c97USI"}]}, "media": [{"n": 21, "id": "1CQU2DwcXDlnY-AnEtlwouFDj9-VK1Kiu", "file": "기관_AI·데이터_역량강화_실행계획_영상(서울시설공단_양영진).mp4", "url": "https://drive.google.com/file/d/1CQU2DwcXDlnY-AnEtlwouFDj9-VK1Kiu/view?usp=drivesdk", "duration": 175.134558, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\21.jpg", "segments": [{"start": 0.24, "end": 4.44, "text": "안녕하십니까. 서울시설공단에 근무하는 양영진입니다.", "time": "00:00"}, {"start": 4.44, "end": 10.64, "text": "저희 공단에 AI 디지털 역량 강화 실행 계획에 대해서 설명드리겠습니다.", "time": "00:04"}, {"start": 10.64, "end": 25.64, "text": "저희 서울시설공단은 1983년도에 설립되어 자동차 전용 도로 등 서울 시내 24개 핵심 인프라 사업을 약 3,700여 명의 인력으로 운영 관리하고 있으며", "time": "00:10"}, {"start": 25.64, "end": 31.72, "text": "경영 전반의 AI 기술 도입 등 디지털 선진화 추준에 노력하고 있습니다.", "time": "00:25"}, {"start": 31.72, "end": 36.28, "text": "그러나 부족한 예산 및 AI 전문 인력 부족 등으로", "time": "00:31"}, {"start": 36.28, "end": 39.68, "text": "전면적인 AI 기술 도입에는 한계가 있어", "time": "00:36"}, {"start": 39.68, "end": 46.08, "text": "보다 더 전사적인 AI 영향 강화 방안이 필요한 실정입니다.", "time": "00:39"}, {"start": 46.08, "end": 50.08, "text": "특히 현장 시설 관리의 문제점은 크게 세 가지로", "time": "00:46"}, {"start": 50.08, "end": 53.96, "text": "첫째, 4호 대비 중심 관리로 인력에 의존한", "time": "00:50"}, {"start": 53.96, "end": 59.46, "text": "모니터링 및 유관 점검 방식으로 선제적 예방에 풍개가 존재하며", "time": "00:53"}, {"start": 59.46, "end": 62.8, "text": "두째, 데이터 파편화 및 단절입니다.", "time": "00:59"}, {"start": 62.8, "end": 66.64, "text": "그리고 마지막으로 숙련자 의존성 심화로", "time": "01:02"}, {"start": 66.64, "end": 70.38, "text": "점검 및 안전진단 노화가 개인의 국한되어", "time": "01:06"}, {"start": 70.38, "end": 75.38, "text": "정령화된 AI 시스템 폐준화가 부재한 상태입니다.", "time": "01:10"}, {"start": 76.78, "end": 80.16, "text": "이에 해결 방안으로 3대 핵심 전략입니다.", "time": "01:16"}, {"start": 80.16, "end": 83.84, "text": "먼저 AI 오픈 맨 및 테스트 배드 사업으로", "time": "01:20"}, {"start": 83.84, "end": 88.2, "text": "월드컵 경기장 등 24개 핵심 인프라를 개방하여", "time": "01:23"}, {"start": 88.2, "end": 94.32, "text": "AI 임파관리 등 민관악 협력 AI 시층 세계를 조성하고 있습니다.", "time": "01:28"}, {"start": 94.32, "end": 98.28, "text": "두째, 데이터 기반 성능 자상관리 시스템 구축 및", "time": "01:34"}, {"start": 98.28, "end": 101.0, "text": "예측적 보수 정비 도입입니다.", "time": "01:38"}, {"start": 101.0, "end": 103.52, "text": "설계 정보 등 종합 분석을 통해", "time": "01:41"}, {"start": 103.52, "end": 107.32, "text": "노우도 및 결암 등을 사전 예측합니다.", "time": "01:43"}, {"start": 107.32, "end": 112.26, "text": "그리고 마지막으로 전사적 AI 영향 내제와 전략입니다.", "time": "01:47"}, {"start": 112.26, "end": 120.12, "text": "AI 전환 출시단 운영 고도함이 실무자 맞춤형 AI 액션 러닝 체계 도입이 되겠습니다.", "time": "01:52"}, {"start": 121.72, "end": 129.18, "text": "AI 3대 핵심 전략이 완성되면 도로의 경우 기대수명이 29년 이상 연장 효과가 있으며", "time": "02:01"}, {"start": 129.18, "end": 133.12, "text": "이는 1200억 상당의 비용 절감 효과입니다.", "time": "02:09"}, {"start": 133.12, "end": 145.9, "text": "또한 24시간 대응체계 유지민, 골든타임 확보로 사고 발생 사전 차단과 2차 사고 예방, 그리고 전검업무 효율 국대화가 이루어질 것으로 판단합니다.", "time": "02:13"}, {"start": 147.4, "end": 160.8, "text": "다음은 실행계획 내 본인의 역할로서는 AI 과제 발급 및 기획 협조, 그리고 민관악 협력 가계 역할에 자문 등을 통해 일정부분 도움을 줄 수 있을 것으로 판단되며", "time": "02:27"}, {"start": 160.8, "end": 167.5, "text": "이 선발에 두신다면 조직 내 AI 확산 포실리테이터로서 매월 현장 맞춤", "time": "02:40"}, {"start": 167.5, "end": 172.62, "text": "기획을 통해 전 직원 AI 영향 광화에 직선을 다하겠습니다.", "time": "02:47"}, {"start": 172.62, "end": 173.6, "text": "감사합니다.", "time": "02:52"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/21/1CQU2DwcXDlnY-AnEtlwouFDj9-VK1Kiu.mp4", "frame": "../영상장면/21.jpg", "quotes": [{"start": 160.8, "end": 167.5, "text": "이 선발에 두신다면 조직 내 AI 확산 포실리테이터로서 매월 현장 맞춤", "time": "02:40", "category": "기관 내 확산 계획 관련 기재"}, {"start": 36.28, "end": 39.68, "text": "전면적인 AI 기술 도입에는 한계가 있어", "time": "00:36", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": ["폴더명 양진영과 신청서·평가 양식 양영진이 다름. 성명·소속으로 대조."], "files": [{"n": 21, "name": "양영진", "title": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정(2차) 신청.hwp", "mime": "application/haansofthwp", "bytes": 176640, "downloaded": true, "url": "https://drive.google.com/file/d/1jdfBhSSuRNOBMYwaRFcAPPcUOTdk7B8f/view?usp=drivesdk", "local": "../원본/21/1jdfBhSSuRNOBMYwaRFcAPPcUOTdk7B8f.hwp", "id": "1jdfBhSSuRNOBMYwaRFcAPPcUOTdk7B8f"}, {"n": 21, "name": "양영진", "title": "강사 양성 과정 신청서(서울시설공단 양영진).pdf", "mime": "application/pdf", "bytes": 270645, "downloaded": true, "url": "https://drive.google.com/file/d/1qLzeWqPMQCLms6Xx5O2ZIZXJJ8c97USI/view?usp=drivesdk", "local": "../원본/21/1qLzeWqPMQCLms6Xx5O2ZIZXJJ8c97USI.pdf", "id": "1qLzeWqPMQCLms6Xx5O2ZIZXJJ8c97USI"}, {"n": 21, "name": "양영진", "title": "기관_AI·데이터_역량강화_실행계획_영상(서울시설공단_양영진).mp4", "mime": "video/mp4", "bytes": 81680725, "downloaded": true, "url": "https://drive.google.com/file/d/1CQU2DwcXDlnY-AnEtlwouFDj9-VK1Kiu/view?usp=drivesdk", "local": "../원본/21/1CQU2DwcXDlnY-AnEtlwouFDj9-VK1Kiu.mp4", "id": "1CQU2DwcXDlnY-AnEtlwouFDj9-VK1Kiu"}], "doc_count": 2, "media_count": 1}, {"n": 22, "original_no": 22, "row": 23, "name": "주선호", "org":  영상 이미지도 목적과 대상에 맞게 제작할 수 있도록 교육해 반복 수정에 드는 시간과 노력을 줄이겠습니다.", "time": "01:40"}, {"start": 112.35, "end": 120.35, "text": "경험이 쌓이면 스스로 문제를 찾고 해결하며 동료에게 전파하는 문화가 자리 잡을 것입니다.", "time": "01:52"}, {"start": 120.35, "end": 125.95, "text": "저 역할을 한마디 더 하겠습니다.", "time": "02:00"}, {"start": 125.95, "end": 132.91, "text": "지금 AI 챔피언 고급 과정을 이수하며 모르던 것을 배우고 현장의 문제를 새롭게 바라보고 있습니다.", "time": "02:05"}, {"start": 132.91, "end": 135.11, "text": "그 배움이 참 고맙습니다.", "time": "02:12"}, {"start": 135.11, "end": 140.31, "text": "제가 얻은 배움과 자신감을 동료들에게도 전하고 싶습니다.", "time": "02:15"}, {"start": 140.31, "end": 147.47, "text": "막막한 질문을 함께 정리하고 작은 성공을 경험할 때까지 돕겠습니다.", "time": "02:20"}, {"start": 147.47, "end": 154.07, "text": "한 사람의 배움이 조직으로 조직이 다시 시민의 안전으로 이어지도록 하겠습니다.", "time": "02:27"}, {"start": 154.07, "end": 160.31, "text": "그 연결을 만드는 기간의 거점 이도이자 AI 전문 강사 주선호가 되겠습니다.", "time": "02:34"}, {"start": 160.31, "end": 161.81, "text": "감사합니다.", "time": "02:40"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/22/12GJ64095sfoDjxmM2kr7OWalUwGRLnW0.mp3", "frame": null, "quotes": [{"start": 22.35, "end": 27.35, "text": "AI를 배워도 업무에 적용하기에는 쉽지가 않습니다.", "time": "00:22", "category": "자기주도 학습 관련 기재"}, {"start": 81.35, "end": 88.35, "text": "또한 AI, 챔피언, 그림블로 인증 희망자에게는 적극적인 멘토링으로 제공하겠습니다.", "time": "01:21", "category": "강의·학습 지원 관련 기재"}, {"start": 36.67, "end": 41.27, "text": "제가 받은 교육 과정에서 얻은 배움을 조직으로 넓히겠습니다.", "time": "00:36", "category": "기관 내 확산 계획 관련 기재"}, {"start": 100.35, "end": 112.35, "text": "시민 안내 자료와 안전교육 영상 이미지도 목적과 대상에 맞게 제작할 수 있도록 교육해 반복 수정에 드는 시간과 노력을 줄이겠습니다.", "time": "01:40", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 22, "name": "주선호", "title": "[공문] 2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청제출.pdf", "mime": "application/pdf", "bytes": 182481, "downloaded": true, "url": "https://drive.google.com/file/d/1bi9iSR6baQLsuxWO4H9agPPTtbNsrOg0/view?usp=drivesdk", "local": "../원본/22/1bi9iSR6baQLsuxWO4H9agPPTtbNsrOg0.pdf", "id": "1bi9iSR6baQLsuxWO4H9agPPTtbNsrOg0"}, {"n": 22, 정입니다.", "time": "00:43"}, {"start": 48.59, "end": 58.59, "text": "이제는 관행적인 행정에서 벗어나 데이터 중심의 과학적 행정으로의 체질 개선이 시급합니다.", "time": "00:48"}, {"start": 58.59, "end": 67.84, "text": "이를 해결하기 위해 우리 기간의 AI 데이터 영양 강화 실행 계획을 제한합니다.", "time": "00:58"}, {"start": 67.84, "end": 69.84, "text": "핵심은 3가지입니다.", "time": "01:07"}, {"start": 69.84, "end": 75.84, "text": "첫째, 부서간 데이터 표준화 및 연계 인프라 구축입니다.", "time": "01:09"}, {"start": 75.84, "end": 85.84, "text": "기간 내 모든 데이터를 한눈에 확인하고 활용할 수 있는 통화 데이터 플랫폼을 마련하겠습니다.", "time": "01:15"}, {"start": 85.84, "end": 92.84, "text": "둘째, 진무별 맞춤형 AI 영양 강화 교육 체계를 정립합니다.", "time": "01:25"}, {"start": 92.84, "end": 107.84, "text": "임원진 대상의 리더시 과정부터 실무자를 위한 프롬프트 엔지니어링, 데이터 분석, 도구 활용법까지 수준별 교육을 상시화하겠습니다.", "time": "01:32"}, {"start": 107.84, "end": 114.84, "text": "셋째, 현업 밀착형 AI 시범 사업을 추진합니다.", "time": "01:47"}, {"start": 114.84, "end": 128.84, "text": "민원 자동 분류 시스템이나 정책 효과 예측 모델 등 직원의 업무 부담을 줄이고 체감도가 높은 과제부터 우선 도입하겠습니다.", "time": "01:54"}, {"start": 128.84, "end": 136.84, "text": "본 계획이 실행되면 우리 기간은 완전히 새로운 모습으로 탈바꿈하게 됩니다.", "time": "02:08"}, {"start": 136.84, "end": 150.46, "text": "업무 효율성 극대와 단순 반복 업무의 70% 이상이 자동화되어 직원들이 더 가치 있는 정책 기획에 집중할 수 있습니다.", "time": "02:16"}, {"start": 150.46, "end": 161.76, "text": "의도된 과학적 행정 구현 데이터에 기반한 정확한 의사 결정으로 정책 오류를 최소화하고 국민 만족도를 높일 것입니다.", "time": "02:30"}, {"start": 161.76, "end": 168.86, "text": "디지털혁심문화정착. 전 직원이 AI를 도구로 다루는 디지털", "time": "02:41"}, {"start": 168.86, "end": 175.6, "text": "강소기간으로 거듭날 것입니다. 이 혁신의 중심에서 저는 디지털 전환의", "time": "02:48"}, {"start": 175.6, "end": 181.7, "text": "부딪지 역할을 수행하겠습니다. 제가 가진 데이터 분석영양과 부서관", "time": "02:55"}, {"start": 181.7, "end": 187.92, "text": "소통능력을 바탕으로 현업부서의 요구사항을 정확히 파악하고 기술", "time": "03:01"}, {"start": 187.92, "end": 193.7, "text": "부서와 조율하겠습니다. 단순한 기획에 그치지 않고 우리 기간의 모든", "time": "03:07"}, {"start": 193.7, "end": 201.36, "text": "구성원이 AI를 실무에 쉽게 적용할 수 있도록 교육 메뉴얼 제작가 현장", "time": "03:13"}, {"start": 201.36, "end": 205.22, "text": "지원을 가장 앞장서서 이끌겠습니다.", "time": "03:21"}, {"start": 205.22, "end": 210.56, "text": "우리 기간의 똑똑한 미래 제가 먼저 발로 뛰겠습니다. 감사합니다.", "time": "03:25"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/23/1as9ZqOBNuZ-aIW9GZ45Ppgqf-nbDD4V_.m4a", "frame": null, "quotes": [{"start": 136.84, "end": 150.46, "text": "업무 효율성 극대와 단순 반복 업무의 70% 이상이 자동화되어 직원들이 더 가치 있는 정책 기획에 집중할 수 있습니다.", "time": "02:16", "category": "AI 업무 활용 관련 기재"}, {"start": 15.59, "end": 23.59, "text": "낮은 데이터 활용도와 부서관 데이터 칸막이 현상이라는 큰 한계의 직면에 있습니다.", "time": "00:15", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": ["공유 폴더에 신청서가 없고 음성파일만 있음. 문서 기재 내용은 확인할 수 없음."], "files": [{"n": 23, "name": "박묘경", "title": "교육신청 발표물_260910_104536.m4a", "mime": "audio/x-m4a", "bytes": 3450174, "downloaded": true, "url": "https://drive.google.com/file/d/1as9ZqOBNuZ-aIW9GZ45Ppgqf-nbDD4V_/view?usp=drivesdk", "local": "../원본/23/1as9ZqOBNuZ-aIW9GZ45Ppgqf-nbDD4V_.m4a", "id": "1as9ZqOBNuZ-aIW9GZ45Ppgqf-nbDD4V_"}], "doc_count": 0, "media_count": 1}, {"n": 24, "original_no": 24, "row": 25, "name": "김백식", "org": "경기도", "folder_title": "24. 경기도_김백식", "folder_url": "https://drive.google.com/drive/folders/1-HgksoDUeFE9TMa1kyBULtE0Lfx8fptW", "summary": "계약 실무·정착 교육 경험과 정책 데이터 분석 경험을 기재. 관리자·실무자·시군 담당자로 확대하는 6회 이상 교육 및 30일 사후지원을 계획함.", "evidence": {"자기주도 학습 관련 기재": [{"text": "회 운영. AI챔피언 인증 준비 스터디 1회 운영 강의 6회(분반•순회 포함) 이상 및 인증 준비 스터디 1회, 누적 150명(1~4차 신규 이수자 기준) 이 상 교육 운영을 목표로 함", "source": "2.강사 양성과정 신청서(규제개혁과 김백식).pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1Oe5-UiAfjvHeKd27oEIJxXd_J-jr_yqV/view?usp=drivesdk", "id": "1Oe5-UiAfjvHeKd27oEIJxXd_J-jr_yqV"}, {"text": "강의 6회(분반•순회 포함) 이상 및 인증 준비 스터디 1회, 누적 150명(1~4차 신규 이수자 기준) 이 상 교육 운영을 목표로 함 - (사후 지원) 과정 종료 후 30일간 실습 산출물에 대한 피드백을 제공하고, 희망자를 대상으로", "source": "2.강사 양성과정 신청서(규제개혁과 김백식).pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1Oe5-UiAfjvHeKd27oEIJxXd_J-jr_yqV/view?usp=drivesdk", "id": "1Oe5-UiAfjvHeKd27oEIJxXd_J-jr_yqV"}, {"text": }, {"start": 28.78, "end": 34.1, "text": "이 세 가지가 없으면 교육을 받아도 다시 예전 방식으로 돌아갑니다.", "time": "00:28"}, {"start": 34.1, "end": 35.94, "text": "그래서 이 관리자부터 시작하겠습니다.", "time": "00:34"}, {"start": 35.94, "end": 39.1, "text": "10월에는 경제실 관리자 25명,", "time": "00:35"}, {"start": 39.1, "end": 41.06, "text": "11월에는 실무자 30명,", "time": "00:39"}, {"start": 41.06, "end": 45.78, "text": "12월에는 본청 관리자 50명을 교육하겠습니다.", "time": "00:41"}, {"start": 45.78, "end": 47.98, "text": "매년 상반기에는", "time": "00:45"}, {"start": 47.98, "end": 52.34, "text": "시군 규제 일자리 담당자 45명까지 넓히겠습니다.", "time": "00:47"}, {"start": 52.34, "end": 59.3, "text": "목표는 6개 이상 누적 150명 이상입니다.", "time": "00:52"}, {"start": 59.3, "end": 61.62, "text": "교육 내용도 현장에 맞추겠습니다.", "time": "00:59"}, {"start": 61.62, "end": 64.5, "text": "펴준 교환의 경기도의 실제 사례를 놓고", "time": "01:01"}, {"start": 64.5, "end": 68.86, "text": "교육이 끝난 지 30일 동안 경일과물을 함께 보겠습니다.", "time": "01:04"}, {"start": 68.86, "end": 75.06, "text": "희망자 30명은 행정안전부 에어 챔피언 초급 인중 준비도 돕겠습니다.", "time": "01:08"}, {"start": 75.06, "end": 77.7, "text": "그러면 법령과 사례를 찾는 시간이 줄어듭니다.", "time": "01:15"}, {"start": 77.7, "end": 84.5, "text": "그 시간은 현장 확인과 기업협의에 더 쓸 수 있습니다.", "time": "01:17"}, {"start": 84.5, "end": 90.38, "text": "기업위로 답변도 더 빠르고 더 고르게 만들 수 있습니다.", "time": "01:24"}, {"start": 90.38, "end": 95.42, "text": "무엇보다 관리자가 AI의 가능성과 한계를 함께 이해하게 됩니다.", "time": "01:30"}, {"start": 95.42, "end": 102.9, "text": "그때 AI는 부서에 안전하고 책임있는 업무 방식이 됩니다.", "time": "01:35"}, {"start": 102.9, "end": 105.46, "text": "저는 기술을 설명하는데 그치지 않고", "time": "01:42"}, {"start": 105.46, "end": 110.76, "text": "업무에 적용하도록 돕는 펄실리 데이터가 되겠습니다.", "time": "01:45"}, {"start": 110.76, "end": 117.22, "text": "동일부 한어안에서는 탈북자 정착 교육을 운영하고 지도하였습니다.", "time": "01:50"}, {"start": 117.22, "end": 122.14, "text": "배경과 수진이 다른 학습자를 직접 만났습니다.", "time": "01:57"}, {"start": 122.14, "end": 126.76, "text": "경기도회계가에서는 어려운 계약 실물을 사례로 쉽게 설명했습니다.", "time": "02:02"}, {"start": 126.76, "end": 130.34, "text": "그리고 행정학계 손흥문계제 박사 과정에서는 경기도시군의", "time": "02:06"}, {"start": 130.34, "end": 135.34, "text": "재난안전, 예산, 정책 등을 데이터로 분석했습니다.", "time": "02:10"}, {"start": 135.34, "end": 144.34, "text": "그래서 저는 학습자의 눈 높이를 이해하고 어려운 제도를 쉽게 풀며 데이터에서 실제 과제를 찾을 수 있습니다.", "time": "02:15"}, {"start": 144.34, "end": 151.94, "text": "이 경험으로 펴준 교원을 경기도의 업무원으로 바꾸겠습니다.", "time": "02:24"}, {"start": 151.94, "end": 154.98, "text": "3일 가정에 빠짐없이 참여하도록 하겠습니다.", "time": "02:31"}, {"start": 154.98, "end": 158.5, "text": "그리고 10월 첫 교육으로 결과를 보여드리겠습니다.", "time": "02:34"}, {"start": 158.5, "end": 159.7, "text": "저는 그렇게 생각합니다.", "time": "02:38"}, {"start": 159.7, "end": 165.54, "text": "여러분의 지원과 관심이 경기도의 AI 업무, 향상의", "time": "02:39"}, {"start": 165.54, "end": 171.28, "text": "지대한 발전을 이룩할 것이라고 생각합니다.", "time": "02:45"}, {"start": 171.28, "end": 177.08, "text": "이런 기회를 주신 담당자들께 깊은 감사의 말씀을 드립니다.", "time": "02:51"}, {"start": 177.08, "end": 177.58, "text": "감사합니다.", "time": "02:57"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/24/1aLowaRNShrz2grGoNF974u8NOMJNmFAP.mp4", "frame": "../영상장면/24.jpg", "quotes": [{"start": 117.22, "end": 122.14, "text": "배경과 수진이 다른 학습자를 직접 만났습니다.", "time": "01:57", "category": "AI 업무 활용 관련 기재"}, {"start": 110.76, "end": 117.22, "text": "동일부 한어안에서는 탈북자 정착 교육을 운영하고 지도하였습니다.", "time": "01:50", "category": "강의·학습 지원 관련 기재"}, {"start": 90.38, "end": 95.42, "text": "무엇보다 관리자가 AI의 가능성과 한계를 함께 이해하게 됩니다.", "time": "01:30", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 24, "name": "김백식", "title": "2.강사 양성과정 신청서(규제개혁과 김백식).pdf", "mime": "application/pdf", "bytes": 395776, "downloaded": true, "url": "https://drive.google.com/file/d/1Oe5-UiAfjvHeKd27oEIJxXd_J-jr_yqV/view?usp=drivesdk", "local": "../원본/24/1Oe5-UiAfjvHeKd27oEIJxXd_J-jr_yqV.pdf", "id": "1Oe5-UiAfjvHeKd27oEIJxXd_J-jr_yqV"}, {"n": 24, "name": "김백식", "title": "강사 양성과정 발표영상(경기도 규제개혁과 김백식).mp4", "mime": "video/mp4", "bytes": 88972208, "downloaded": true, "url": "https://drive.google.com/file/d/1aLowaRNShrz2grGoNF974u8NOMJNmFAP/view?usp=dri .", "time": "00:34"}, {"start": 37.6, "end": 42.04, "text": "또한 생성형 AI가 만든 결과에는 오류가 있을 수 있고", "time": "00:37"}, {"start": 42.04, "end": 48.28, "text": "개인 정보나 비공개 업무 정보를 잘못 입력하는 문제도 발생할 수 있기 때문에", "time": "00:42"}, {"start": 48.28, "end": 54.4, "text": "단순한 사용법보다 결과 검증과 안전화 활용 방법을 함께 익히는 것이 중요합니다.", "time": "00:48"}, {"start": 54.4, "end": 61.6, "text": "이번 과정을 통해 공공 AI 영향 표준 교환과 퍼시리 데이션 방법을 익히고", "time": "00:54"}, {"start": 61.6, "end": 65.64, "text": "수요 후에는 소속기관을 관련 부서 협의하여", "time": "01:01"}, {"start": 65.64, "end": 72.96, "text": "기관의 교육 수요와 운영 여건에 맞는 시스팸 교육을 제한하고자 합니다.", "time": "01:05"}, {"start": 72.96, "end": 88.16, "text": "구체적으로는 생성형 AI의 기본 이해와 프롬프트 작성부터 문서 작성, 자료 요약, 정보 구조와 업무 아이디어 도출까지 실제 행정 업무에 적용해 보는 실습을 중심으로 하고", "time": "01:12"}, {"start": 88.16, "end": 100.48, "text": "AI 결과 검증, 개인정보와 비공개 정보 보호 등 공공기관에 필요한 책임이 있는 AI 활용 원칙도 함께 다루고자 합니다.", "time": "01:28"}, {"start": 100.48, "end": 108.8, "text": "이러한 교육을 통해 직원들의 생성형 AI를 단순히 사용해보는 수준을 넘어 자신의 업무에 적절하게 활용하고", "time": "01:40"}, {"start": 108.8, "end": 113.64, "text": "결과 스스로 검증할 수 있는 영향을 높일 수 있다고 생각합니다.", "time": "01:48"}, {"start": 113.64, "end": 119.56, "text": "또한 교육과정에서 나온 질문과 피드백, 실제 업무 적용사를 축적하면", "time": "01:53"}, {"start": 119.56, "end": 130.0, "text": "향후 우정사업 조직의 AI 활용 영향 강화와 AX 확산에 기여할 수 있는 교육 모델로 발전시킬 수 있을 것입니다.", "time": "01:59"}, {"start": 130.0, "end": 134.96, "text": "저는 노인 AI 리트로시 교육을 주제로 박사학의 연구를 수행하면서", "time": "02:10"}, {"start": 134.96, "end": 141.36, "text": "교육 프로그램을 개발하고 실제 현장에서 적용해 효과를 검증한 경험이 있습니다.", "time": "02:14"}, {"start": 141.36, "end": 146.72, "text": "이외에도 다양한 현장에서 AI 리트로시 교육과 발표를 이어 왔습니다.", "time": "02:21"}, {"start": 146.72, "end": 152.88, "text": "또한 우정사업 현장에서 국민을 직접 응대하는 참고음을 수행하면서", "time": "02:26"}, {"start": 152.88, "end": 158.16, "text": "공공호 서비스가 국민에게 어떻게 전달되고 이용되는지 경험해왔습니다.", "time": "02:32"}, {"start": 158.16, "end": 178.04, "text": "이러한 AI 리트로시 연구와 교육서에게 경험, 그리고 현장 업무 경험을 결합하여 표준 교환을 단순히 전달하는 강사가 아니라 학습자의 수준과 실제 업무 상황에 맞춰 실습과 질문을 지원하는 내부 퍼실리 데이터 역할을 수행해 보자 합 )2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서.pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1kNM0_bpVNULBjl5uHXWmvTlEsJ6RiTCi/view?usp=drivesdk", "id": "1kNM0_bpVNULBjl5uHXWmvTlEsJ6RiTCi"}]}, "media": [{"n": 27, "id": "1YD4cMIossXZDiVR5ddXzLTTTSC6Tayie", "file": "(소상공인시장진흥공단_곽태혁)2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 인터뷰영상.mp4", "url": "https://drive.google.com/file/d/1YD4cMIossXZDiVR5ddXzLTTTSC6Tayie/view?usp=drivesdk", "duration": 173.066, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\27.jpg", "segments": [{"start": 0.0, "end": 7.0, "text": "안녕하십니까. 이번 공공 AI 역량 트랙 강사 양성과정 모집액 지원은 곽태혁입니다.", "time": "00:00"}, {"start": 7.0, "end": 16.0, "text": "저는 기관의 AI 데이터 역량 강화를 위해 AI를 도입하는 것을 넘어 지속 가능성에 기관에 정삭시키는 것이 가장 중요하다고 생각합니다.", "time": "00:07"}, {"start": 16.0, "end": 26.0, "text": "먼저 문제점입니다. 현재 AI의 기술은 빠르게 확산되고 있고, 직원 개인이 AI를 활용해 업무 자동 하나 다양한 결과물을 만드는 사례도 도련하고 있습니다.", "time": "00:16"}, {"start": 26.0, "end": 32.0, "text": "하지만 문제는 이러한 결과물이 기관이 지속 가능한 서비스로 이어지지 못한다는 점입니다.", "time": "00:26"}, {"start": 32.0, "end": 39.0, "text": "개인 PC에서 만든 결과물을 실제 기관이나 대구 및 서비스에 적용하는 순간 문제의 차원이 달라집니다.", "time": "00:32"}, {"start": 39.0, "end": 48.0, "text": "서버와 인프라가 필요하고 보안과 개인 정보를 검토해야 되고, 정보와 예상과 사업 델차, 그리고 무엇보다 지속적인 유지 관리가 필요합니다.", "time": "00:39"}, {"start": 48.0, "end": 54.18, "text": "하지만 아직은 AI를 몇 번 클릭하면 바로 서비스가 만들어지는 것을 기술로 인식하거나", "time": "00:48"}, {"start": 54.18, "end": 58.82, "text": "구축 이후에 누가 운영하고 유지할 것에 대한 고민이 부족한 경우가 많습니다.", "time": "00:54"}, {"start": 58.82, "end": 64.54, "text": "특히 AI 점념 조직과 인프라 보안 등 전문 인형이 충분하지 않은 공공기관에서는", "time": "00:58"}, {"start": 64.54, "end": 67.08, "text": "이런 문제가 더욱 크게 나타날 수 있습니다.", "time": "01:04"}, {"start": 67.08, "end": 68.32, "text": "해결방안입니다.", "time": "01:07"}, {"start": 68.32, "end": 72.22, "text": "저는 이를 교육과 실천으로 연결시키는 방식으로 해결하고자 합니다.", "time": "01:08"}, {"start": 72.22, "end": 77.78, "text": "먼저 신입사원에게는 제가 그동안 해왔던 정보화의 이해 교육을 계속해서 실시하겠습니다.", "time": "01:12"}, {"start": 77.78, "end": 87.78, "text": "AI의 결과물이 만드는 것에 기치지 않고 이것을 실제로 정보시지테면 어떻게 적용하기 위해서 하기 위한 방법들을 제가 처음부터 이해시키도록 하겠습니다.", "time": "01:17"}, {"start": 87.78, "end": 97.78, "text": "그리고 부사사항 이상 관리자에게는 지속 가능한 AI 실천과 교육을 통해서 AI 가능성 뿐만 아니라 현실적인 한계와 운영 조건까지 함께 전달하겠습니다.", "time": "01:27"}, {"start": 97.78, "end": 106.78, "text": "이를 통해서 AI에 대한 기대를 실제 가능한 수준으로 전환하고 필요한 예상과 인력, 유지관리까지 함께 고려하는 문화를 만들겠습니다.", "time": "01:37"}, {"start": 106.78, "end": 117.78, "text": "또 고급과정을 운영해서 현업에서 만들어진 실제 AI 3주모를 기관의 서비스에 어떻게 영역할 수 있는지에 대한 중간 실천 리더를 육성하였습니다.", "time": "01:46"}, {"start": 117.78, "end": 122.78, "text": "세 번째로 이 글 통해 기대하는 효과는 이것입니다.", "time": "01:57"}, {"start": 122.78, "end": 134.78, "text": "실무와 사례 중심으로 AI 데이터 영향으로 조직 내부에 내재하고 각 부서에서 스스로 과제를 발굴하고 시스템에 안착시키는 과정까지 하는 것입니다.", "time": "02:02"}, {"start": 134.78, "end": 143.78, "text": "또한 개개인별로 각각 만드는 방식에서 벗어나 공공데이터, AI 플랫폼, API 등을 환영하는 방법으로 업무를 표준화 하겠습니다.", "time": "02:14"}, {"start": 143.78, "end": 154.78, "text": "여러 부서가 공통으로 사용할 수 있는 AI 결과물은 개인의 결과물을 끝내지 않고 정식으로 정보와 과제와 예산으로 연결하여 유지관리에 가득한 기관의 자산으로 발전시키겠습니다.", "time": "02:23"}, {"start": 154.78, "end": 156.78, "text": "마지막으로 저의 역할입니다.", "time": "02:34"}, {"start": 156.78, "end": 162.78, "text": "저는 현압의 아이디어와 AI 기술 그리고 기관의 정부화책의 사이를 연결하는 역할을 하겠습니다.", "time": "02:36"}, {"start": 162.78, "end": 166.78, "text": "개인이 만든 AI 결과문의 실제 기관의 시스템이 되고", "time": "02:42"}, {"start": 166.78, "end": 171.78, "text": "일회성이 아닌 지속 가능한 서비스가 되도록 그 중간에 서겠습니다.", "time": "02:46"}, {"start": 171.78, "end": 172.78, "text": "감사합니다.", "time": "02:51"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/27/1YD4cMIossXZDiVR5ddXzLTTTSC6Tayie.mp4", "frame": "../영상장면/27.jpg", "quotes": [{"start": 16.0, "end": 26.0, "text": "먼저 문제점입니다. 현재 AI의 기술은 빠르게 확산되고 있고, 직원 개인이 AI를 활용해 업무 자동 하나 다양한 결과물을 만드는 사례도 도련하고 있습니다.", "time": "00:16", "category": "기관 내 확산 계획 관련 기재"}, {"start": 87.78, "end": 97.78, "text": "그리고 부사사항 이상 관리자에게는 지속 가능한 AI 실천과 교육을 통해서 AI 가능성 뿐만 아니라 현실적인 한계와 운영 조건까지 함께 전달하겠습니다.", "time": "01:27", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 27, "name": "곽태혁", "title": "(소상공인시장진흥공단_곽태혁) 2026년 공공 AI역량 트랙 강사 양성과정 신청.pdf", "mime": "application/pdf", "bytes": 54692, "downloaded": true, "url": "https://drive.google.com/file/d/1gKGbWhkpeJ2O8a2CzY2hcTBEDLIhz1wD/view?usp=drivesdk", "local": "../원본/27/1gKGbWhkpeJ2O8a2CzY2hcTBEDLIhz1wD.pdf", "id": "1gKGbWhkpeJ2O8a2CzY2hcTBEDLIhz1wD"}, {"n": 27, "name": "곽태혁", "title": "(소상공인시장진흥공단_곽태혁)2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서.pdf", "mime": "application/pdf", "bytes": 357799, "downloaded": true, "url": "https://drive.google.com/file/d/1kNM0_bpVNULBjl5uHXWmvTlEsJ6RiTCi/view?usp=drivesdk", "local": "../원본/27/1kNM0_bpVNULBjl5uHXWmvTlEsJ6RiTCi.pdf", "id": "1kNM0_bpVNULBjl5uHXWmvTlEsJ6RiTCi"}, {"n": 27, "name": "곽태혁", "title": "(소상공인시장진흥공단_곽태혁)2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 인터뷰영상.mp4", "mime": "video/mp4", "bytes": 4770840, "downloaded": true, "url": "https://drive.google.com/file/d/1YD4cMIossXZDiVR5ddXzLTTTSC6Tayie/view?usp=drivesdk", "local": "../원본/27/1YD4cMIossXZDiVR5ddXzLTTTSC6Tayie.mp4", "id": "1YD4cMIossXZDiVR5ddXzLTTTSC6Tayie"}], "doc_count": 2, "media_count": 1}, {"n": 28, "original_no": 28, "row": 29, "name": "최필선", "org": "병무청 대체역심사위원회", "folder_title": "28. 병무청 대체역심하위원회_최필선", "folder_url": "https://drive.google.com/drive/folders/1OzY7FpZbk4uX7GTxZM-ENE6NNg70QmNb", "summary": "연구·개발 및 데이터분석 경험을 교육으로 연결하는 계획을 기재. 목적 설정·입력 점검·실행 결과 검증·오류 수정과 후속 멘토링을 제시함.", "evidence": {"자기주도 학습 관련 기재": [], "AI 업무 활용 관련 기재": [{"text": "알고리즘을 연구하고 시스템 구현에 참여하였습니다. 병무청에서는 전산개발·DB 관리 업무를 수행하고, 병역판정검사 데이터를 활용한 지역별 BMI 분석과 범정부 데이터분석시스템(혜안)을 활용한 데이터 처리·시각화를 경험하였습니다. 이러한 경험을 데이터 품질 점검, 분석 결과 해석,", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(최필선).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy/view?usp=drivesdk", "id": "1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy"}, {"text": "2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 ○ 생성형 AI를 활용한 행정 문서 분석·작성 대체역 편입심사 사실조사 업무를 대상으로 업무 매뉴얼, 제출서류 기준, 보고서 양식을 반영한", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(최필선).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy/view?usp=drivesdk", "id": "1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy"}, {"text": "개발을 통해 해결방안을 구현·검증할 수 있도록 지원하겠습니다. 데이터분석 심화의 분석 결과를 바이브 코딩의 업무지원 도구 구현으로 연결하여, 학습이 실제 업무 적용으로 이어지는 자체 교육을 운영하고자 합니다.", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(최필선).pdf", "page": 5, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy/view?usp=drivesdk", "id": "1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy"}], "강의·학습 지원 관련 기재": [{"text": "1) 강의 실적 및 경험 기간 기관 강의·운영 내용, 대상 역할 비고 ※ 강의·교육 운영 실적은 확인 가능한 이력이 있는 경우 기재합니다.", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(최필선).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy/view?usp=drivesdk", "id": "1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy"}, {"text": "학습자 참여 유도, 수준별 실습 지원 방법을 익혀 기존의 연구·개발 경험을 교육 역량으로 연결하고자 합니다. 수료 후 트랙3의 ⑦ 데이터분석 심화와 ⑧ 바이브 코딩을 담당하여 교육 준비부터 실습 진행, 산출물 점검, 사후 멘토링까지 수행하겠습니다.", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(최필선).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy/view?usp=drivesdk", "id": "1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy"}, {"text": "준비부터 실습 진행, 산출물 점검, 사후 멘토링까지 수행하겠습니다. ○ 2026년 10월: 교육 준비와 대상자 선정 부서장 및 교육·정보화 담당부서와 협의하여 대체역심사위원회 및 병무청 내 교육 수요를", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(최필선).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy/view?usp=drivesdk", "id": "1lRCoOvGZm45kiL6_NYhpzFsP45QTlyRy"}], "기관 내 확산 계획 관련 기재": [{"text": "공유 순으로 진행하겠습니다. 공통 필수 과제와 추가 도전 과제를 구분하여 수준 차이에 대응하고, 조별로 분석 결과물과 업무지원 시제품을 완성하도록 지원하겠습니다. ○ 2026년 11~12월 및 교육 종료 후: 후속 지원", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(최필선).pdf", "page": 4, "method": " ", "url": "https://drive.google.com/file/d/1qmwnomNEd9uBHMeBSOAc-W2ee1b_o6xX/view?usp=drivesdk", "duration": 171.473, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\28.jpg", "segments": [{"start": 1.81, "end": 8.81, "text": "안녕하십니까. 대치역 심사위원회 심사기획과에서 정보와 업무를 담당하는 최패선입니다.", "time": "00:01"}, {"start": 8.81, "end": 18.81, "text": "저는 직원들이 자신의 업무에 AI를 적용하고 그 결과를 확인할 수 있도록 도입는 AX 전문 내부 강사가 되고자 지원했습니다.", "time": "00:08"}, {"start": 18.81, "end": 24.81, "text": "행정 현장에는 자료 정리, 통계 작성, 보고서 작성과 같은 반복 업무가 있습니다.", "time": "00:18"}, {"start": 24.81, "end": 34.81, "text": "이러한 업무를 AI로 개선하려면, 도구 사효법과 함께 자신의 업무를 구체적인 과제로 바꾸고, 결과의 정확성을 검증하는 경험이 필요합니다.", "time": "00:24"}, {"start": 34.81, "end": 41.81, "text": "이 과정에서 직원들이 어려움을 겪을 때, 곁에서 실습을 돕는 역할이 중요하다고 생각합니다.", "time": "00:34"}, {"start": 41.81, "end": 49.81, "text": "이를 위해 과정 수류 후에는 데이터 분석 심화와 바이브 코딩을 중심으로 자체 귤을 추진하겠습니다.", "time": "00:41"}, {"start": 49.81, "end": 54.57, "text": "올해 10월부터 12월까지 위원회 내 희망 직원을 대상으로 행정한", "time": "00:49"}, {"start": 54.57, "end": 59.33, "text": "두부 표준 교환을 활용한 실습 교육을 4차례 운영할 계획입니다.", "time": "00:54"}, {"start": 59.33, "end": 63.57, "text": "데이터 분석 심화에서는 병무청 언론 보도 기사 등 공개 업무 자료를", "time": "00:59"}, {"start": 63.57, "end": 68.49, "text": "정리 분석하고 바이브 코딩에서는 그 분석 결과를 조회할 수 있는", "time": "01:03"}, {"start": 68.49, "end": 71.93, "text": "베퍼용 정적 웹앱을 만들어 보도록 하겠습니다.", "time": "01:08"}, {"start": 71.93, "end": 76.57, "text": "두묘씩 짝을 이루어 실습하고 단계별로 결과를 확인하면서 하나의", "time": "01:11"}, {"start": 76.57, "end": 84.57, "text": "교육을 통해 직원들이 데이터의 오류를 확인하고 반복 업무를 개선할 수 있는 방법을 직접 경험하도록 하겠습니다.", "time": "01:16"}, {"start": 84.57, "end": 89.77, "text": "완성된 결과물 중 최소 두 개를 업무적인 검토 과제를 선정하고", "time": "01:24"}, {"start": 89.77, "end": 95.17, "text": "처리 시간과 오류 누락 여부를 비교하여 개선 효과를 확인하겠습니다.", "time": "01:29"}, {"start": 95.17, "end": 101.37, "text": "또한 후속 멘터링과 사례 공유를 통해 교육 이후에도 학습이 이어지도록 하겠습니다.", "time": "01:35"}, {"start": 101.37, " uzYlcFle/view?usp=drivesdk", "duration": 179.5, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\29.jpg", "segments": [{"start": 0.05, "end": 5.55, "text": "안녕하십니까. 방위사업청 데이터 기반 행정 업무 총과를 담당하고 있는", "time": "00:00"}, {"start": 5.55, "end": 8.35, "text": "정보와 데이터 담당 간 양영철 사무안입니다.", "time": "00:05"}, {"start": 8.35, "end": 14.95, "text": "저는 제한된 AI 활용 환경에서도 직원들이 스스로 업무를 개선하도록 돕는", "time": "00:08"}, {"start": 14.95, "end": 19.35, "text": "내부 강사가 되고자 본 과정에 지원했습니다.", "time": "00:14"}, {"start": 19.35, "end": 25.85, "text": "방위사업청은 국방분야 기관의 특성상 행정망과 별도로 국방망을 사용하여", "time": "00:19"}, {"start": 25.85, "end": 29.95, "text": "행정 안전부의 공통기반 AI 시스템을 이용할 수 없습니다.", "time": "00:25"}, {"start": 29.95, "end": 34.93, "text": "자체 생승형 AI인 답하다 시범 서비스를 운영하고 있지만", "time": "00:29"}, {"start": 34.93, "end": 41.03, "text": "2025년 개발 이후 개선은 주로 데이터 현행화에 머물러 있습니다.", "time": "00:34"}, {"start": 41.03, "end": 45.25, "text": "행정 업무의 본격적으로 AI를 활용할 수 있는 서비스는", "time": "00:41"}, {"start": 45.25, "end": 49.63, "text": "2028년 하반기에야 운영할 수 있는 상황입니다.", "time": "00:45"}, {"start": 49.63, "end": 53.79, "text": "따라서 직원들이 도구의 기능과 한계를 이해하고", "time": "00:49"}, {"start": 53.79, "end": 58.91, "text": "주어진 환경에서 AI를 활용하는 역량이 더욱 중요합니다.", "time": "00:53"}, {"start": 58.91, "end": 65.11, "text": "시스템이 갖춰지기를 기다리기보다 지금부터 사람의 역량을 준비해야 합니다.", "time": "00:58"}, {"start": 65.11, "end": 73.67, "text": "우리청은 2025년 기간 맞춤형 AI 샘피언 교육과정 10업 운영 기간 5권 중 하나로 선정되었고", "time": "01:05"}, {"start": 73.67, "end": 78.59, "text": "올해에는 기본과정인 그림과정을 두 차례 운영했습니다.", "time": "01:13"}, {"start": 78.59, "end": 85.11, "text": "직원들의 높은 호응을 통해 AI를 배우고 업무에 활용하려는 수요를 확인했습니다.", "time": "01:18"}, {"start": 85.11, "end": 90.71, "text": "이제 이러한 관심을 실제 업무 성과로 연결하고자 합니다.", "time": "01:25"}, {"start": 90.71, "end": 97.79, "text": "강사 양성과정에서 학습자의 참여를 이끌고 실습을 지원하는 교육기법을 익혀", "time": "01:30"}, {"start": 97.79, "end": 104.91, "text": "2027년에는 분기별 한 차례씩 총 4차례의 자체 교육을 추진하겠습니다.", "time": "01:37"}, {"start": 104.91, "end": 112.43, "text": "그린과 블루과정 각 2회씩, 회당 40명씩, 연인원 160명에게 단계적인", "time": "01:44"}, {"start": 112.43, "end": 115.43, "text": "영양 강화 기회를 제공하겠습니다.", "time": "01:52"}, {"start": 115.43, "end": 123.03, "text": "표준 교환을 바탕으로 우리청의 고유 업무와 AI 활용 환경을 반영하고", "time": "01:55"}, {"start": 123.03, "end": 128.71, "text": "보안을 준수하면서 업무 개선 과제를 찾아 해결방안을 구체화하고", "time": "02:03"}, {"start": 128.71, "end": 132.23, "text": "결과를 검증하는 실습에 집중하겠습니다.", "time": "02:08"}, {"start": 132.23, "end": 137.41, "text": "올해에는 바이브 코딩을 활용한 업무 시스템 개발 사례를 발굴하고자", "time": "02:12"}, {"start": 137.41, "end": 144.29, "text": "제1회 방위사업청 AI 데이터 미래영령 강화 공모전을 개최했습니다.", "time": "02:17"}, {"start": 144.29, "end": 151.17, "text": "내년에는 교육과 공모전을 연계하여 더 많은 AI 챔피언들의 참여를 이끌겠습니다.", "time": "02:24"}, {"start": 151.17, "end": 156.77, "text": "직원들이 필요한 행정 시스템을 직접 개발하고 반복 업무를 자동화하는 등", "time": "02:31"}, {"start": 156.77, "end": 160.05, "text": "내부 현안을 해결하도록 지원하겠습니다.", "time": "02:36"}, {"start": 160.05, "end": 167.21, "text": "저는 교육 기획과 운영 뿐만 아니라 수료, 지류응답과 활용사를 공유까지 책임지는", "time": "02:40"}, {"start": 167.21, "end": 170.01, "text": "내부 강사가 되겠습니다.", "time": "02:47"}, {"start": 170.01, "end": 173.05, "text": "직원들을 AI 역량이 업무 개선으로", "time": "02:50"}, {"start": 173.05, "end": 175.93, "text": "나아가 대국민 서비스의 품질 향상으로", "time": "02:53"}, {"start": 175.93, "end": 178.53, "text": "이어지는 기반을 만들겠습니다.", "time": "02:55"}, {"start": 178.53, "end": 179.53, "text": "감사합니다.", "time": "02:58"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/29/12IPexCoEA-KNJcs4rxkA-EBwuzYlcFle.mp4", "frame": "../영상장면/29.jpg", "quotes": [{"start": 78.59, "end": 85.11, "text": "직원들의 높은 호응을 통해 AI를 배우고 업무에 활용하려는 수요를 확인했습니다.", "time": "01:18", "category": "자기주도 학습 관련 기재"}, {"start": 151.17, "end": 156.77, "text": "직원들이 필요한 행정 시스템을 직접 개발하고 반복 업무를 자동화하는 등", "time": "02:31", "category": "AI 업무 활용 관련 기재"}, {"start": 65.11, "end": 73.67, "text": "우리청은 2025년 기간 맞춤형 AI 샘피언 교육과정 10업 운영 기간 5권 중 하나로 선정되었고", "time": "01:05", "category": "기관 내 확산 계획 관련 기재"}, {"start": 49.63, "end": 53.79, "text": "따라서 직원들이 도구의 기능과 한계를 이해하고", "time": "00:49", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 29, "name": "양경철", "title": "강사 양성 과정 신청서.pdf", "mime": "application/pdf", "bytes": 2479278, "downloaded": true, "url": "https://drive.google.com/file/d/1f33P1FC9-y_5saJYZgzkBAbKUFQhJ9Ik/view?usp=drivesdk", "local": "../원본/29/1f33P1FC9-y_5saJYZgzkBAbKUFQhJ9Ik.pdf", "id": "1f33P1FC9-y_5saJYZgzkBAbKUFQhJ9Ik"}, {"n": 29, "name": "양경철", "title": "방위사업청_AI강사과정_지원발표.mp4", "mime": "video/mp4", "bytes": 8710161, "downloaded": true, "url": "https://drive.google.com/file/d/12IPexCoEA-KNJcs4rxkA-EBwuzYlcFle/view?usp=drivesdk", "local": "../원본/29/12IPexCoEA-KNJcs4rxkA-EBwuzYlcFle.mp4", "id": "12IPexCoEA-KNJcs4rxkA-EBwuzYlcFle"}], "doc_count": 1, "media_count": 1}, {"n": 30, "original_no": 30, "row": 31, "name": "이수현", "org": "경상북도 상주시", "folder_title": "30. 경상북도 상주시_이수현", "folder_url": "https://drive.google.com/drive/folders/1y0B4wqoHUUkulIRvF7d3odQDApRze-i5", "summary": "상주시 직원 대상 AI 교육과 학습동아리 기반 확산을 제시. 수료 후 세부 운영 협의와 지속적 교육체계 마련 내용을 기재함.", "evidence": {"자기주도 학습 관련 기재": [{"text": "동아리 창단 15~20명 시 학습동아리 결성, 정기 모임 체계 구축 2회 / 회당 20명 (40명) 파일럿 교육(트랙1 ㉦ + 트랙2 ㉭) 2회 / 회당 30명 (60명) 파일럿 결과 반영 정규 과정", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 6, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}, {"text": "- (정량) 2027년까지 상주시 직원 500명 이상 교육 이수, AI 학습동아리 정착, AI챔피언 인증 도전자 10명 이상 배출 (정성) 본청에 머무르지 않고 읍•면•동 현장 부서까지 확산하여, 각 부서가 자기", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 8, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}, {"text": "- (핵심축) AI 학습동아리 15~20명 - 교육 이수자 중 지속 학습 의지가 있는 직원으로 구성하여 내부 강사 후보군을 육성함 _ (1차 파일럿) 읍•면•동 실무자 40명 - 반복 행정업무 비중이 커 효과가", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 8, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}], "AI 업무 활용 관련 기재": [{"text": "트랙2(AI융합) : ㉧ 노코드 데이터분석 ㉭ 행정 융합 기획 ㉭ 노코드 시 서비스 구현 口 트랙3(AI개발) : 데이터분석 심화 ㉭ 바이브 코딩 근무처", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 1, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}, {"text": "업무용 GPTs 제작•배 포 및 활용 안내 토목직 100명 대상", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}, {"text": "시 서비스 구현 (6시간 50분) 공공 AI역량 트랙 시 리터 리시와 업무 활용 (3시간)", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}], "강의·학습 지원 관련 기재": [{"text": "1) 강의 실적 및 경험 기간 2026. 8.~현재", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}, {"text": "- 넷째, AI챔피언 역량인증(그린•블루) 사전 준비 멘토링 ※ 네 가지 역할이 일회성으로 끝나지 않도록 상주시 AI 학습동아리를 결성하여 지속 구조로 운영할 예정임", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 6, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}, {"text": "- 상주시에는 AI챔피언 인증자가 없어 자체 교육을 운영할 내부 인력이 부재하며, 본 과정 수료가 자체 교육 체계를 갖추는 출발점이 됨 - 경북권은 수도권과 떨어져 있어 공공 AI 도입이 늦고 교육 기회가 제한적이며,", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 8, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}], "기관 내 확산 계획 관련 기재": [{"text": "평가 대비 정보 공유, 학습자 질의 대응 부운 영자 7인 편성 (상시)", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}, {"text": "토목직 100명 대상 (상시) 상주유치원(ONE)팀 팀장", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}, {"text": "사례•방법 공개 공유 (상시) 재학생 대상 시 활용", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}], "과정·이유·검증 설명 관련 기재": [{"text": "원인과 해결 방법을 정리 공유하여 동일 문제의 재발을 방지하였음 - 과정 종료 후 부운영자 7인을 편성하여 지원 체계를 지속 운영 중이며, 부운영자는 커뮤니티 참여도와 대화 내용을 분석하여 신정하였음", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}, {"text": "실현 기능한 계획을 제시해 주십시오 운영의 구제성실현 기능성확산 효과 등을 종합 심사합니다. 1) 기관 자체 교육 운영 실적 기간", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 7, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}, {"text": "데이터 기반 정책 판단이 확대되어, 감이 아닌 근거로 사업 대상지를 선정하게 됨 0 기관•지역 차원의 확산", "source": "「강사 양성 과정」 신청서(상주시).pdf", "page": 9, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}]}, "media": [{"n": 30, "id": "1YtVcpbLYw_7Vb3sokyh9r4c3jRnzE6Px", "file": "경북 상주시 ": 70.7, "end": 75.46, "text": "상주시에서도 자체의 학습 커뮤니티와 AI 동아리를 운영하겠습니다.", "time": "01:10"}, {"start": 75.46, "end": 77.74, "text": "AI 챔피언 인증 멘토릭입니다.", "time": "01:15"}, {"start": 77.74, "end": 82.82, "text": "그린 종합과정을 수료하면서 학습자들이 어디서 막히는지를 직접 겪었습니다.", "time": "01:17"}, {"start": 82.82, "end": 87.42, "text": "그 경험으로 미래의 상주시 AI 챔피언들을 배출해 내겠습니다", "time": "01:22"}, {"start": 87.42, "end": 89.02, "text": "세 번째 기대 효과입니다", "time": "01:27"}, {"start": 89.02, "end": 93.54, "text": "상주시에서는 저를 비롯하여 AI에 관심있는 직원들이", "time": "01:29"}, {"start": 93.54, "end": 97.74, "text": "수천만 원이 되는 설계 용역을 직접적으로 분석에 참여하거나", "time": "01:33"}, {"start": 97.74, "end": 102.14, "text": "소규모 기획 분석까지 직접 할 수 있게 될 것입니다", "time": "01:37"}, {"start": 102.14, "end": 106.5, "text": "2027년까지 상주시 직원 500명을 교육하겠습니다", "time": "01:42"}, {"start": 106.5, "end": 111.26, "text": "AI 챔피언 인증 도전자 10명을 목표로 하겠습니다", "time": "01:46"}, {"start": 111.26, "end": 116.62, "text": "상주시란 작은 지자체에서 하는 방식은 전국 지자체에 다 확산이 가능합니다", "time": "01:51"}, {"start": 116.62, "end": 122.34, "text": "교육이 성공리에 추진이 된다면 인근 지자체에 이런 과정들을 공유해 나갈 생각입니다", "time": "01:56"}, {"start": 122.34, "end": 126.98, "text": "저는 토목직 실무 9년차로 은면동과 본점을 모두 거쳤습니다", "time": "02:02"}, {"start": 126.98, "end": 129.5, "text": "현장에서 무엇이 필요한지를 알고 있습니다", "time": "02:06"}, {"start": 129.5, "end": 133.06, "text": "코드를 몰라도 업무 도구를 만들 수 있다는 걸 직접 경험했고", "time": "02:09"}, {"start": 133.06, "end": 137.66, "text": "2월에 만든 GPTS 상주시 토목직 100명에게 배포를 했고", "time": "02:13"}, {"start": 137.66, "end": 140.94, "text": "AI 챔피언 그린 종합 과정을 수료하게 되면서", "time": "02:17"}, {"start": 140.94, "end": 142.94, "text": "학습 커뮤니티를 운영하고 있고", "time": "02:20"}, {"start": 142.94, "end": 144.7, "text": "학습자가 어디가 막히는지", "time": "02:22"}, {"start": 144.7, "end": 146.9, "text": "어디가 국민인지를 잘 알고 있습니다", "time": "02:24"}, {"start": 146.9, "end": 150.74, "text": "그 경험으로 상주시 AI 강사로서", "time": "02:26"}, {"start": 150.74, "end": 152.5, "text": "역량을 펼쳐나가겠습니다", "time": "02:30"}, {"start": 152.5, "end": 153.5, "text": "감사합니다", "time": "02:32"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/30/1YtVcpbLYw_7Vb3sokyh9r4c3jRnzE6Px.mp4", "frame": "../영상장면/30.jpg", "quotes": [{"start": 64.38, "end": 70.7, "text": "학습자들은 강의보다 서로의 질문에 더 많이 배우고 막히는 지점도 거기서 드러났습니다.", "time": "01:04", "category": "자기주도 학습 관련 기재"}, {"start": 133.06, "end": 137.66, "text": "2월에 만든 GPTS 상주시 토목직 100명에게 배포를 했고", "time": "02:13", "category": "AI 업무 활용 관련 기재"}, {"start": 12.14, "end": 15.66, "text": "자체 교육을 운영할 내 굴력이 없다는 뜻입니다.", "time": "00:12", "category": "강의·학습 지원 관련 기재"}, {"start": 42.98, "end": 45.98, "text": "첫째, 자체 교육과정 편성 운영입니다.", "time": "00:42", "category": "기관 내 확산 계획 관련 기재"}]}], "issues": [], "files": [{"n": 30, "name": "이수현", "title": "경북 상주시 이수현(공공 AI역량 트랙 강사 양성과정).mp4", "mime": "video/mp4", "bytes": 286494307, "downloaded": true, "url": "https://drive.google.com/file/d/1YtVcpbLYw_7Vb3sokyh9r4c3jRnzE6Px/view?usp=drivesdk", "local": "../원본/30/1YtVcpbLYw_7Vb3sokyh9r4c3jRnzE6Px.mp4", "id": "1YtVcpbLYw_7Vb3sokyh9r4c3jRnzE6Px"}, {"n": 30, "name": "이수현", "title": "「강사 양성 과정」 신청서(상주시).pdf", "mime": "application/pdf", "bytes": 375725, "downloaded": true, "url": "https://drive.google.com/file/d/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI/view?usp=drivesdk", "local": "../원본/30/1RDRLUF8DcpCVusas644mjSQdJoKc7bmI.pdf", "id": "1RDRLUF8DcpCVusas644mjSQdJoKc7bmI"}], "doc_count": 1, "media_count": 1}, {"n": 31, "original_no": 31, "row": 32, "name": "김용석", "org": "제주특별자치도개발공사", "folder_title": "31. 제주특별자치도개발공사_김용석", "folder_url": "https://drive.google.com/drive/folders/1R-wro31Brl0IP4On2QxIS6S3e1gVK_H9", "summary": "비개발 실무자의 기능 요청·결과 확인·반복 수정 경험을 기재. 생산기획·설비보전 직원 대상 5명씩 2차 교육을 계획함.", "evidence": {"자기주도 학습 관련 기재": [{"text": "직원 간 지식 전파와 자기주도적 업무 개선을 지원하겠습니다 - 교육 후 실습 결과와 업무 적용 사레를 확인하여 개선효과를 점검하고, 생산•설비보전 업무의 정확성과 효율성 향상에 기어하겠습니다.", "source": "강사양성과정신청서(2차)_김용석.pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV/view?usp=drivesdk", "id": "1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV"}], "AI 업무 활용 관련 기재": [{"text": "트랙2(시융합) : 노코드 데이터분석 ㉭ 시 행정 융합 기획 ㉧ 노코드 씨 서비스 구현 口 트랙3(시개발) : 데이터분석 심화 (0 바이브 코딩 ※ 강사 양성 과정은 담당 트랙 1개를 선정하여 해당 교안을 사전 검토 후 참여합니다.", "source": "강사양성과정신청서(2차)_김용석.pdf", "page": 1, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV/view?usp=drivesdk", "id": "1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV"}, {"text": "2) 시 도구(ChatGPT•Claude•Gemini 등) 활용 경험 - AI챔피언 그린플루 종합과정을 이수한 후, 생성형 서를 생산설비 유지보수 업무에 적용하고 있습니다. 현재 PPT•PDF 형태의 설비 매뉴일을 정리로완하고, 직원이 필요한 내용을 질문하면 답변을 얻을 수", "source": "강사양성과정신청서(2차)_김용석.pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV/view?usp=drivesdk", "id": "1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV"}, {"text": "- 트랙2 「㉦ 노코드 시 서비스 구현」 표준 교안을 활용하여 생산기획 설비보전 관련 직원 중 사 기본 활용 경험과 업무 개선에 관심이 있는 직원을 대상으로 자제 교육을 문영하고자 합니다 - 2026년 하반기 1차 교육 후 운영 결과를 보완하여, 2027년 상반기에는 다른 직원을 대상으로 2자", "source": "강사양성과정신청서(2차)_김용석.pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV/view?usp=drivesdk", "id": "1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV"}], "강의·학습 지원 관련 기재": [{"text": "1) 강의 실적 및 경험 기간 24.12.08.~24.12.21.", "source": "강사양성과정신청서(2차)_김용석.pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV/view?usp=drivesdk", "id": "1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV"}, {"text": "- 학교 강의 경험을 통해 학습자의 이해 수준에 맞추어 내용을 설명하고, 질문과 활동으로 참여를 유도하는 경험을 쌓았습니다 생산설비 교육에서는 외국 기술 엔지니어와 공동으로 교육을 진행하며 생산팀 직원의 실습과 질의응답을 지원했습니다.", "source": "강사양성과정신청서(2차)_김용석.pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV/view?usp=drivesdk", "id": "1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV"}, {"text": "유도하는 경험을 쌓았습니다 생산설비 교육에서는 외국 기술 엔지니어와 공동으로 교육을 진행하며 생산팀 직원의 실습과 질의응답을 지원했습니다. - 업무에 대한 이해와 기존 신 교육 경험을 바탕으로, AI 설비 매뉴얼의 개발 과정과 내용을 회사  원하는 기능과 답변 조건을 구체적으로 설명하고, 생성된 결과를 확인한 후 다시 수정하는 방식으로 현장 활용 가능성을 높이고 있습니다. - 향후에는 비개발 실무자의 관점에서 필요한 기능을 신에 설명하고, 생성된 결과를 확인수정하는", "source": "강사양성과정신청서(2차)_김용석.pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV/view?usp=drivesdk", "id": "1EHbPCJdo41892FB7QUzmFZ31zqPcfAgV"}]}, "media": [{"n": 31, "id": "1Df9xBg3wtoKVMj5R2gNof2oRck67AXL7", "file": "3분발표(음성)_김용석.mp4", "url": "https://drive.google.com/file/d/1Df9xBg3wtoKVMj5R2gNof2oRck67AXL7/view?usp=drivesdk", "duration": 164.1186, "video": false, "audio": true, "segments": [{"start": 0.75, "end": 8.25, "text": "안녕하십니까. ChatGPT 자치도 개발공사 생산기획팀에서 살 비보전 업무를 담당하고 있는 김용석입니다.", "time": "00:00"}, {"start": 8.25, "end": 15.25, "text": "저는 현장 직원이 AI를 업무에 직접 활용할 수 있도록 노코드 AI 서비스 구현 자체 교육을 운영하고자 합니다.", "time": "00:08"}, {"start": 15.25, "end": 18.25, "text": "먼저 해결하고 싶은 문제입니다.", "time": "00:15"}, {"start": 18.25, "end": 24.75, "text": "살 비보전 업무에서는 메뉴얼을 찾아야 내용을 확인하고 자료를 정리하는 일이 반복됩니다.", "time": "00:18"}, {"start": 24.75, "end": 27.75, "text": "저는 이러한 업무의 AI를 적용하기 위해", "time": "00:24"}, {"start": 27.75, "end": 33.75, "text": "설비 메뉴얼의 지리응답체 뽓을 전목한 AI 설비 보전 메뉴얼을 개발하고 있습니다.", "time": "00:27"}, {"start": 33.75, "end": 39.25, "text": "이 과정에서 AI를 사용하는 것과 업무의 필요한 기능을 구체적으로 요청하고", "time": "00:33"}, {"start": 39.25, "end": 42.75, "text": "결과를 검증하는 것은 다르다는 점을 느꼈습니다.", "time": "00:39"}, {"start": 42.75, "end": 45.75, "text": "개인의 활용 경험을 동료에게 전달하고", "time": "00:42"}, {"start": 45.75, "end": 49.25, "text": "함께 실습할 수 있는 교육으로 응결하고자 합니다.", "time": "00:45"}, {"start": 49.25, "end": 54.25, "text": "이를 위한 해결방안은 표준 교환을 활용한 단계별 자체의 교육입니다.", "time": "00:49"}, {"start": 54.25, "end": 59.25, "text": "담당 희망감옥은 트랙2, 노코도 AI 서비스 구현입니다.", "time": "00:54"}, {"start": 59.25, "end": 67.25, "text": "생산계획과 살비 보정 관련 직원 중 AI 기본사용 경험과 업무 개선에 관심이 있는 직원을 대상으로 하겠습니다.", "time": "00:59"}, {"start": 67.25, "end": 78.25, "text": "2026년 하반기에는 약 5명에게 1차 교육을 실시하고 2027년 상반기에는 다른 직원 약 5명에게 같은 과정을 운영하겠습니다.", "time": "01:07"}, {"start": 78.25, "end": 88.25, "text": "차수별 16시간을 업무역간에 맞게 나누고 개념 설명, 예제시연, 실습, 피드백 순서로 진행하겠습니다.", "time": "01:18"}, {"start": 88.25, "end": 96.25, "text": "교육에서는 문서 처리 자동화, 간단 업무도구 제작, 로컷 AI 활용과 노코드 앱서비스 구현을 다루겠습니다.", "time": "01:28"}, {"start": 96.25, "end": 107.25, "text": "제가 메뉴얼을 개발하면서 경험한 기능 요청과 반복 수정 과정은 이해를 돕는 사례로 활용하고 실습은 표준경황과 교육용 자료를 중심으로 진행하겠습니다.", "time": "01:36"}, {"start": 107.25, "end": 115.25, "text": "기계 효과는 직원이 반복 업무의 개선 방법을 직접 잡고 간단한 도구를 만들어 활용하는다는 것입니다.", "time": "01:47"}, {"start": 115.25, "end": 123.25, "text": "문서 정리와 정권표 작성 등에 적용하여 업무 소요 시간과 수작업 오류를 줄이는데 기여하고자 합니다.", "time": "01:55"}, {"start": 123.25, "end": 133.25, "text": "또한 1차 교육의 질문과 실습 절과를 2차에 반영하고 교육 후 업무 적용 사례를 확인하여 교육 효과를 점검하겠습니다.", "time": "02:03"}, {"start": 133.25, "end": 135.25, "text": "마지막으로 저희 역할입니다.", "time": "02:13"}, {"start": 135.25, "end": 144.25, "text": "저는 학교 강의와 생산사비 공동교육 경험이 있으며 AI 챔피언, 그린, 블루 종합과정을 이수했습니다.", "time": "02:15"}, {"start": 144.25, "end": 154.25, "text": "이러한 경험에 바탕으로 교환을 사전 검토하고 예제를 직접 실행하며 직원의 수준에 맞춰 실습과 질의응답을 지원하겠습니다.", "time": "02:24"}, {"start": 154.25, "end": 164.25, "text": "기후 기후에도 피드백을 제공하여 배우 내용을 실질 업무에 활용하도록 돕는 기관내 사각 강사가 되겠습니다. 감사합니다.", "time": "02:34"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/31/1Df9xBg3wtoKVMj5R2gNof2oRck67AXL7.mp4", "frame": null, "quotes": [{"start": 0.75, "end": 8.25, "text": "안녕하십니까. ChatGPT 자치도 개발공사 생산기획팀에서 살 비보전 업무를 담당하고 있는 김용석입니다.", "time": "00:00", "category": "AI 업무 활용 관련 기재"}, {"start": 8.25, "end": 15.25, "text": "저는 현장 직원이 AI를 업무에 직접 활용할 수 있도록 노코드 AI 서비스 구현 자체 교육을 운영하고자 합니다.", "time": "00:08", "category": "강의·학습 지원 관련 기재"}, {"start": 39.25, "end": 42.75, "text": "결과를 검증하는 것은 다르다는 점을 느꼈습니다.", "time": "00:39", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 31, "name": "김용석", "title": "3분발표(음성)_김용석.mp4", "mime": "video/mp4", "bytes": 1998640, "downloaded": true, "url": "https://drive.google.com/file/d/1Df9xBg3wtoKVMj5R2gNof2oRck67AXL7/view?usp=dri NQD8IVw8fCEsiCmGM1EOMxKUJu1WeeGb"}]}, "media": [{"n": 32, "id": "1LOPeFAnLgm110ziKVf4-QoESjnrW8_bg", "file": "2-1.2026년 AI 챔피언 및 공공 AI역량 트랙 강사 양성 과정 교육생 모집(2차) 지원자 발표물(관세청_신수현).m4a", "url": "https://drive.google.com/file/d/1LOPeFAnLgm110ziKVf4-QoESjnrW8_bg/view?usp=drivesdk", "duration": 193.1276, "video": false, "audio": true, "segments": [{"start": 0.56, "end": 5.06, "text": "안녕하십니까. 관세청 데이터 담당 관실 신수연입니다.", "time": "00:00"}, {"start": 5.06, "end": 11.06, "text": "제가 추진하고 싶은 것은 관세청 AI 데이터 역량 강화입니다.", "time": "00:05"}, {"start": 11.06, "end": 18.06, "text": "공공 행정의 AI 전화는 단순히 AI 도구를 사용하는 데 그치지 않습니다.", "time": "00:11"}, {"start": 18.06, "end": 26.56, "text": "현장의 공무원이 스스로 문제를 발견하고 데이터를 활용해 해결하는 역량을 갖추는 것이 핵심입니다.", "time": "00:18"}, {"start": 26.56, "end": 32.56, "text": "행정안전부의 AI 챔피언 역시 전문 개발자에게만 의존하기보다", "time": "00:26"}, {"start": 32.56, "end": 37.0, "text": "현장 공무원이 AI로 행정 문제를 해결하고", "time": "00:32"}, {"start": 37.0, "end": 43.0, "text": "조지 간에 그 영향을 확산하는 것을 지향한다고 생각합니다.", "time": "00:37"}, {"start": 43.0, "end": 49.2, "text": "관세청은 신고, 통관, 무역 등 방대한 데이터를 보유하고 있고", "time": "00:43"}, {"start": 49.2, "end": 56.94, "text": "정형 데이터 분석도구 활용원 물련, 빅데이터와 생성형 AI 교육도 확대해왔습니다.", "time": "00:49"}, {"start": 56.94, "end": 69.74, "text": "하지만 앞으로는 소수의 전문 분석과 중심에서 퍼서나 일반 직원까지 자신의 업무데이터를 직접 분석하고 AI를 활용하도록 확산해야 합니다.", "time": "00:56"}, {"start": 69.74, "end": 80.42, "text": "즉, AI를 잘하는 전문가를 만든 것을 넘어 모든 직원이 AI와 데이터를 활용하는 조직으로 전환해야 합니다.", "time": "01:09"}, {"start": 80.42, "end": 86.94, "text": "이것이 저희 조직과 제가 생각하는 가장 중요한 과제입니다.", "time": "01:20"}, {"start": 86.94, "end": 93.62, "text": "저희 조직은 교육 실습, 확산의 3단계로 추진하겠습니다.", "time": "01:26"}, {"start": 93.62, "end": 101.34, "text": "먼저 관세행정 업무와 AI 교육을 연결해 업무 적용형 실습 교육으로 만들겠습니다.", "time": "01:33"}, {"start": 101.34, "end": 106.22, "text": "그리고 노코드 데이터 분석과 생성형 AI를 활용해", "time": "01:41"}, {"start": 106.22, "end": 111.06, "text": "질문하기, 분석하기, 해석하기, 업무에 적용하기", "time": "01:46"}, {"start": 111.06, "end": 116.26, "text": "이 전 과정을 직원들이 직접 경험하도록 하겠습니다.", "time": "01:51"}, {"start": 116.26, "end": 119.86, "text": "마지막으로 교육에서 끝내지 않겠습니다.", "time": "01:56"}, {"start": 119.86, "end": 123.26, "text": "현장에서 발굴된 우수 사례를 공유하고", "time": "01:59"}, {"start": 123.26, "end": 129.9, "text": "다시 교육 과제로 활용하는 AI 활용 선순한 체계를 만들겠습니다.", "time": "02:03"}, {"start": 129.9, "end": 134.14, "text": "직원은 데이터를 전문가에게 요청하는 사람에서", "time": "02:09"}, {"start": 134.14, "end": 141.18, "text": "스스로 데이터를 이해하고 AI로 업무 문제를 해결하는 사람으로 변화할 수 있습니다.", "time": "02:14"}, {"start": 141.18, "end": 145.82, "text": "또한 관세청 데이터가 단순히 보관되는 자산을 넘어", "time": "02:21"}, {"start": 145.82, "end": 150.46, "text": "통관, 심사, 조사, 위험관리의 의사 결정을 지원하는", "time": "02:25"}, {"start": 150.46, "end": 154.86, "text": "살아있는 데이터 자산으로 활용될 수 있습니다.", "time": "02:30"}, {"start": 154.86, "end": 157.16, "text": "마지막으로 저의 역할입니다.", "time": "02:34"}, {"start": 157.16, "end": 162.04, "text": "저는 데이터 품질관리와 시스템 데이터 분야의 경험을 바탕으로", "time": "02:37"}, {"start": 162.04, "end": 167.7, "text": "AI와 관세 행정을 연결하는 현장형 강사가 되겠습니다.", "time": "02:42"}, {"start": 167.7, "end": 174.74, "text": "특히 노코드 데이터 분석을 통해 직원들이 AI로 업무를 바꿀 수 있도록 돕겠습니다.", "time": "02:47"}, {"start": 174.74, "end": 180.62, "text": "AI 전환의 성폐는 기술이 아니라 사람의 역량에 달려 있습니다.", "time": "02:54"}, {"start": 180.62, "end": 191.44, "text": "저는 관세청 직원 한 사람 한 사람이 AI를 사용할 줄 아는 사람을 넘어 AI로 업무를 바꿀 수 있는 사람이 되도록 돕겠습니다.", "time": "03:00"}, {"start": 191.44, "end": 193.94, "text": "감사합니다.", "time": "03:11"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/32/1LOPeFAnLgm110ziKVf4-QoESjnrW8_bg.m4a", "frame": null, "quotes": [{"start": 37.0, "end": 43.0, "text": "조지 간에 그 영향을 확산하는 것을 지향한다고 생각합니다.", "time": "00:37", "category": "기관 내 확산 계획 관련 기재"}]}], "issues": ["33번과 동일한 2인 공동 PDF. 이 지원자는 PDF 1~4쪽만 연결."], "files": [{"n": 32, "name": "신수현", "title": "1.2026년 AI 챔피언 및 공공 AI역량 트랙 강사 양성 과정 교육생 모집(2차) 신청서(관세청_2명).pdf", "mime": "application/pdf", "bytes": 868050, "downloaded": true, "url": "https://drive.google.com/file/d/1NQD8IVw8fCEsiCmGM1EOMxKUJu1WeeGb/view?u 성 과정이 저에게 꼭 필요합니다.", "time": "01:31"}, {"start": 97.52, "end": 106.04, "text": "선발된다면 교육 전에 담당 표준 교환을 충분히 숙지하고 관세인정에 적용할 사례를 미리 준비하겠습니다.", "time": "01:37"}, {"start": 106.04, "end": 112.76, "text": "교육 기간에는 전 일정의 성실이 참여하고 동료 피드백에도 적극적으로 임하겠습니다.", "time": "01:46"}, {"start": 112.76, "end": 118.0, "text": "수류 후에는 배운 내용을 즉시 기간 자체 교육으로 연결하겠습니다.", "time": "01:52"}, {"start": 118.0, "end": 125.88, "text": "2026년 10월부터 방주 본부세관과 산하세관 전 직원 373명을 대상으로", "time": "01:58"}, {"start": 125.88, "end": 130.36, "text": "AI 리터리 씨와 업무 화령 교육을 단계적으로 실시하겠습니다.", "time": "02:05"}, {"start": 130.36, "end": 135.4, "text": "보고적 삭성, 법령, 지침, 비교 등 실제 업무 중심으로 교육하고", "time": "02:10"}, {"start": 135.4, "end": 140.0, "text": "직원 한 명이 업무 산출물 한 권을 완성하도록 지원하겠습니다.", "time": "02:15"}, {"start": 140.0, "end": 142.12, "text": "이후 심사과 직원을 대상으로", "time": "02:20"}, {"start": 142.12, "end": 145.42, "text": "FTA나 심사 업무 특허업구소구 운영하여", "time": "02:22"}, {"start": 145.42, "end": 150.0, "text": "AI 활용 사례 10권과 미니POC 3권을 배굴하겠습니다.", "time": "02:25"}, {"start": 150.0, "end": 153.16, "text": "우수사례와 표준프론프트 검증 체크리스트는", "time": "02:30"}, {"start": 153.16, "end": 157.68, "text": "교제와 영상으로 제작하여 전 직원에게 다시 공유하겠습니다.", "time": "02:33"}, {"start": 157.68, "end": 159.5, "text": "저는 이번 과정을 통해", "time": "02:37"}, {"start": 159.5, "end": 162.46, "text": "밤마다 혼자 시행착오를 겪으며 배운 길을", "time": "02:39"}, {"start": 162.46, "end": 166.54, "text": "동료들은 더 쉽고 안전하게 갈 수 있도록 듣고 싶습니다.", "time": "02:42"}, {"start": 166.54, "end": 169.74, "text": "이번에 선발해 주신 다음에 이제 한 사람의 경험을", "time": "02:46"}, {"start": 169.74, "end": 172.98, "text": "373명의 영향으로 바꾸겠습니다.", "time": "02:49"}, {"start": 172.98, "end": 173.78, "text": "감사합니다.", "time": "02:52"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/33/183RzY2Y53iEckSM-y-BBProoQALrHc62.mp4", "frame": "../영상장면/33.jpg", "quotes": [{"start": 4.98, "end": 13.9, "text": "저는 오늘 무엇을 더 배우고 싶은 지보다 이번 과정에서 배운 것을 조직을 위해 어떻게 실행할 것인지 말씀드리겠습니다.", "time": "00:04", "category": "자기주도 학습 관련 기재"}, {"start": 153.16, "e 만", "time": "00:34"}, {"start": 36.93, "end": 39.89, "text": "결국은 저는 이게 한두 명의 교육을 가지고", "time": "00:36"}, {"start": 39.89, "end": 43.69, "text": "자기 부서에서 AR 데이터 활용 습관을", "time": "00:39"}, {"start": 43.69, "end": 47.19, "text": "혁신을 넓히기에는 한계가 있다고 생각하거든요", "time": "00:43"}, {"start": 47.19, "end": 50.29, "text": "그래서 최대한 많은 직원에게", "time": "00:47"}, {"start": 50.29, "end": 52.79, "text": "한 번에 많은 직원들에게 교육을 하고", "time": "00:50"}, {"start": 52.79, "end": 55.79, "text": "이 교육을 이수한 경험을 해본 사람들이", "time": "00:52"}, {"start": 55.79, "end": 58.69, "text": "최대한 많게 하는 게 중요하다고 생각을 하고요", "time": "00:55"}, {"start": 58.69, "end": 60.29, "text": "또한 말로만 들어서는 안 되겠죠", "time": "00:58"}, {"start": 60.29, "end": 61.73, "text": "실습을 해야 됩니다.", "time": "01:00"}, {"start": 61.73, "end": 64.79, "text": "그런데 실습을 할 수 있는 PC 완개에 갖춰진 곳은", "time": "01:01"}, {"start": 64.79, "end": 67.33, "text": "저희 회사의 인재개발은 한 곳밖에 없습니다.", "time": "01:04"}, {"start": 67.33, "end": 71.15, "text": "모여서 일박일 교육하게 있는 많은 사람이 어렵죠.", "time": "01:07"}, {"start": 71.15, "end": 74.75, "text": "그래서 사실은 저는 여기 AI 챔피언 및", "time": "01:11"}, {"start": 74.75, "end": 78.59, "text": "본공 AI와 트랙 표준 교환을 활용을 하되", "time": "01:14"}, {"start": 78.59, "end": 82.67, "text": "그 안에서 최대한 스마트폰으로 할 수 있는 것들을", "time": "01:18"}, {"start": 82.67, "end": 84.97, "text": "현장에서 경험하고 보면서 교육을 하는 게", "time": "01:22"}, {"start": 84.97, "end": 86.71, "text": "먼저 중요하다는 생각을 하고요.", "time": "01:24"}, {"start": 86.71, "end": 93.51, "text": "교육의 기회도 별도의 교육 시간을 만들어 놓고 이렇게 하게 되면 안 모여요.", "time": "01:26"}, {"start": 93.51, "end": 98.59, "text": "왜냐하면 사람들이 가장 출장도 많고 그걸 위해 별도의 시간이 제일 어렵거든요.", "time": "01:33"}, {"start": 98.59, "end": 103.83, "text": "사실은 저희 기관에서는 각 부서마다 1년의 최소 1번, 상아방기,", "time": "01:38"}, {"start": 103.83, "end": 106.87, "text": "보통 2번 정도는 워크샷 같은 것들을 많이 합니다.", "time": "01:43"}, {"start": 106.87, "end": 112.31, "text": "그런 경우에 대해서 제가 열심히 내부적으로 홍보해서 그런 기회에 부르는 곳이 있으면", "time": "01:46"}, {"start": 112.31, "end": 115.95, "text": "어디든지 가서 교육을 할 수 있는 게 더 필요하다 생각하고 있거든요.", "time": "01:52"}, {"start": 115.95, "end": 122.67, "text": "그리고 같은 부서에 있는 사람들이 AI 스마트폰로 쉽게 접근할 수 있는 스마트폰을 통해서", "time": "01:55"}, {"start": 122.67, "end": 126.63, "text": "간단한 웹 html 방식이라든지 아니면 웹을 만들어 보는", "time": "02:02"}, {"start": 126.63, "end": 129.15, "text": "이런 경험은 많이 더 필요하다고 생각합니다.", "time": "02:06"}, {"start": 129.15, "end": 133.03, "text": "같은 부서에 있는 사람끼리 교육을 받았을 때 의견이 공유되거나", "time": "02:09"}, {"start": 133.03, "end": 136.43, "text": "쉽게 계산 포인트를 찾아내는 효과도 있다고 생각을 하거든요.", "time": "02:13"}, {"start": 136.43, "end": 138.83, "text": "제가 또 회사 내에서 인사보라든지", "time": "02:16"}, {"start": 138.83, "end": 141.75, "text": "아니면 다양한 동호회에서 총활동을 하면서", "time": "02:18"}, {"start": 141.75, "end": 143.79, "text": "회사 내부의 네트워크가 많습니다.", "time": "02:21"}, {"start": 143.79, "end": 150.31, "text": "덕분에 그런 인맥자원들이 기본이 된다면 회사 내에서 제가 말씀드렸던", "time": "02:23"}, {"start": 150.31, "end": 155.31, "text": "여러분이 다니는 그런 방식에 교육 기회를 만들 수 있다라고 저는 생각합니다.", "time": "02:30"}, {"start": 155.31, "end": 159.91, "text": "이상 지원자 김윤성이었습니다. 감사합니다.", "time": "02:35"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/34/1ylLPW4Fj2TGDPn2oLVXNBfr7oC1MHx28.mp4", "frame": "../영상장면/34.jpg", "quotes": [{"start": 129.15, "end": 133.03, "text": "같은 부서에 있는 사람끼리 교육을 받았을 때 의견이 공유되거나", "time": "02:09", "category": "기관 내 확산 계획 관련 기재"}, {"start": 13.07, "end": 17.45, "text": "사실은 사람들을 한 곳으로 모아서 집합 교육하기에는 한계가 있었습니다.", "time": "00:13", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 34, "name": "김윤성", "title": "1. 강사신청서_최종제출.pdf", "mime": "application/pdf", "bytes": 266505, "downloaded": true, "url": "https://drive.google.com/file/d/1RDtHDusOXoUAbMRwtQlcqVw0ZaPHytCz/view?usp=drivesdk", "local": "../원본/34/1RDtHDusOXoUAbMRwtQlcqVw0ZaPHytCz.pdf", "id": "1RDtHDusOXoUAbMRwtQlcqVw0ZaPHytCz"}, {"n": 34, "name": "김윤성", "title": "2.교육참여확약서(서명본).pdf", "mime": "application/pdf", "bytes": 44162, "downloaded": true, "url": "https://drive.google.com/file/d/1s3a8NNeQrSSZnh1fjeeMfpQndS4c9aYx/vi  관련 기재": [{"text": "지속가능한 ▪트랙1 수료 이후 자체 강사로서의 역할 수행을 (1~3차) 참가 및 ‘26년도 AI 확산체계구축 통해 내부 직원들의 역량을 높이는 순환 체계 조성 역량강화(중급, ’26.6. 참여) 및 심화과정(10월 참여 예정)", "source": "260910 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서 1부.pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC/view?usp=drivesdk", "id": "14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC"}], "기관 내 확산 계획 관련 기재": [{"text": "라. 자생적 확산체계 구축 - 교육 이수자 및 농식품인재개발원 주관 “AI 업무역량 강화 교육(기초, 중급, 심화) 과정 이수자 중 희망자를 보조 퍼실리테이터로 양성하여, 지원별(권역별) 자체 강사 양성을 추진(‘27년 2명 이상)", "source": "260910 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서 1부.pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC/view?usp=drivesdk", "id": "14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC"}, {"text": "기간 과정명 대상·인원 운영방식 본인 역할 비고 생성형 AI 활용 소속 공무원 2025.8.5. 대면교육 - -", "source": "260910 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서 1부.pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC/view?usp=drivesdk", "id": "14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC"}, {"text": "- 2027년 총 6회 이상 특강 운영을 통해 9개 지원(도 단위) 기관 소속 직원 2,000명 대상 교육 실시 - 교육 만족도 5점 만점 중 4.0점 이상 확보, 교육 수료 후 현업 적용 우수사례 지원별 3건 이상 발굴 추진 나. 정성적 목표", "source": "260910 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서 1부.pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC/view?usp=drivesdk", "id": "14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC"}], "과정·이유·검증 설명 관련 기재": [{"text": "- Gemini, Grok 등 2개 이상의 AI LLM과 Skill(md 형식)을 활용하여 인적 오류, 단순･반복적인 업무에 대한 개념을 정의, 이를 해소할 수 있는 개선방안 마련 - AI 시스템 구축 관련 용역 진행 전 주요 쟁점 사항, 과업 지시, 계약 사항 등 비전문가로서 놓칠 수 있는", "source": "260910 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서 1부.pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC/view?usp=drivesdk", "id": "14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC"}, {"text": "내용을 미리 실습하여 구축 방향성, 유의사항(폐쇄망 특성상 외부망과 유기적인 연결 어려움), 활용 가능한 기술(Skill, 스마트폰 연동 등)을 숙지하고, 숙지한 내용을 바탕으로 용역 업체 선정 - 일반적인 행정 조사 특성상 매번 반복되는 단순 업무(경로 최적화)를 Python, AI를 활용하여 자동화함", "source": "260910 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서 1부.pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC/view?usp=drivesdk", "id": "14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC"}]}, "media": [{"n": 35, "id": "1FhXfhay8uSHck8N4eicR_GLT2DRnHWSh", "file": "260910 농림축산식품부 국립농산물품질관리원 발표영상.mp4", "url": "https://drive.google.com/file/d/1FhXfhay8uSHck8N4eicR_GLT2DRnHWSh/view?usp=drivesdk", "duration": 251.2043, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\35.jpg", "segments": [{"start": 2.99, "end": 12.47, "text": "안녕하십니까? AI 챔피언 및 공공영양채 강사 양성과정에 참가 신청을 하게 된 공립농산물 품질관리원, 석영동입니다.", "time": "00:02"}, {"start": 12.47, "end": 20.7, "text": "공공 AI 기술을 넘어 현장의 언어로라는 제목으로 발표하겠습니다.", "time": "00:12"}, {"start": 20.7, "end": 28.26, "text": "저는 현장과 AI를 연결해온 준비된 사람이라고 말씀드릴 수 있겠습니다.", "time": "00:20"}, {"start": 28.26, "end": 34.12, "text": "농지조사, 원산지표시민원 등과 같이", "time": "00:28"}, {"start": 34.12, "end": 38.5, "text": "공립농산물품질관류원 특화, 도메인 지식을 갖추고 있고", "time": "00:34"}, {"start": 38.5, "end": 44.5, "text": "두 번째로 재미나이, 체즈피팅, 파일성과 같은 AI 기술을", "time": "00:38"}, {"start": 44.5, "end": 50.5, "text": "활용할 수 있는 역량을 전목해서 퍼실리티에이션을 해왔다는 것인데요", "time": "00:44"}, {"start": 50.5, "end": 56.0, "text": "파일성과 AI 기반, 현지조사 경로 최적화 프로그램을 개발해서", "time": "00:50"}, {"start": 56.0, "end": 59.0, "text": "인트라인에서의 개시 공유해야 했었고", "time": "00:56"}, {"start": 59.0, "end": 68.0, "text": "폐쇄망 등 특성을 고려한 AI 기반 원산지표시 민원챗보스를 개발하는 영역에도 참여하였으며", "time": "00:59"}, {"start": 68.0, "end": 74.0, "text": "내부적으로 실시한 AI 영향 강화 교육에도 참여를 하였습니다.", "time": "01:08"}, {"start": 74.0, "end": 82.24, "text": "현재 공공부문 AI 도입을 가로맞는 데에는 3가지 구조적 장벽이 있다고 생각합니다.", "time": "01:14"}, {"start": 82.24, "end": 91.65, "text": "일반적인 도구, 재미나이나 체치핏을 한번 써보자 하는 기술 위주에 교육만 하다 보니까", "time": "01:22"}, {"start": 91.65, "end": 97.65, "text": "현장과는 동떨어지는 기술이 문제라고 생각하고", "time": "01:31"}, {"start": 97.65, "end": 100.65, "text": "두 번째로는 공공인프라 특유의 한계", "time": "01:37"}, {"start": 100.65, "end": 104.65, "text": "폐쇄막이나 예산 확보 등이", "time": "01:40"}, {"start": 104.65, "end": 108.65, "text": "대표적인 환경적 제약이라고 할 수 있을 것이고", "time": "01:44"}, {"start": 108.65, "end": 111.65, "text": "세 번째로는 AI 리더십 부재", "time": "01:48"}, {"start": 111.65, "end": 114.65, "text": "그리고 경직된 업무 방식, 관행 등 같은", "time": "01:51"}, {"start": 114.65, "end": 120.65, "text": "조직문화가 구조적 장벽 중 하나라고 생각합니다", "time": "01:54"}, {"start": 120.65, "end": 125.65, "text": "행안부 표중 교환을 현장의 언어로 최속화하고자 합니다.", "time": "02:00"}, {"start": 125.65, "end": 129.65, "text": "실무데이터와 AI 영향을 존복한다면", "time": "02:05"}, {"start": 129.65, "end": 131.65, "text": "일방적 기술주의비 아니라", "time": "02:09"}, {"start": 131.65, "end": 136.65, "text": "상호작용기반, 현안 문제 해결에 역할을 톡톡히 할 수 있다고 생각합니다.", "time": "02:11"}, {"start": 136.65, "end": 140.22, "text": "저는 이방 교육을 수료하여", "time": "02:16"}, {"start": 140.22, "end": 143.22, "text": "창출할 수 있는 3대 실질적 임팩트가", "time": "02:20"}, {"start": 143.22, "end": 146.22, "text": "다음과 맞다고 생각합니다.", "time": "02:23"}, {"start": 146.22, "end": 150.22, "text": "첫 번째로는 행정생상성 극대화입니다.", "time": "02:26"}, {"start": 150.22, "end": 162.22, "text": "업무 처리 시간을 단축함으로써 정말로 역량이 투입되어야 하는 보고서 작성 등의 역할을 할 수 있도록 하여 행정 생산성을 극대화하고자 합니다.", "time": "02:30"}, {"start": 162.22, "end": 169.58, "text": "민원 처리 기간 획기적 당축과 같이 대공민 서비스를 향상하고자 하며", "time": "02:42"}, {"start": 169.58, "end": 176.78, "text": "AI 및 데이터 리터럿이 저변을 전 주권을 대상으로 확대하여", "time": "02:49"}, {"start": 176.78, "end": 181.54, "text": "이라는 방식을 혁신하는 데에도 임팩트가 있을 것이라고 생각합니다.", "time": "02:56"}, {"start": 181.54, "end": 187.96, "text": "조직 친주를 바꾸기 위해서 관리자 대상 AI 리더시 교육을", "time": "03:01"}, {"start": 187.96, "end": 199.34, "text": "1백 이상 실시하고 9개 지원 소속공무원 및 공무직 약 2천명을 대상으로 하는 AI 리터러시 교육을 실시하여", "time": "03:07"}, {"start": 199.34, "end": 211.21, "text": "실제 업무 사례를 교환을 활용한 현업 적용 교육을 실시하고자 합니다. 교육을 넘어 자체 강사 얌성을 한다든지", "time": "03:19"}, {"start": 211.21, "end": 215.33, "text": "기관 내부 사내게시판을 운영함으로써 지속적으로 사업 관리를 하고", "time": "03:31"}, {"start": 216.63, "end": 221.65, "text": "업무 분야 별 AI 활용 우수 사리를 공유하는 발표회를 갖는 등", "time": "03:36"}, {"start": 221.65, "end": 229.07, "text": "석과 공유 및 동기 부여를 하는 이러한 큰 틀에서의 자생적 AI 생태계를 구축하고자 합니다.", "time": "03:41"}, {"start": 230.29, "end": 236.79, "text": "해남부에 검증된 기술을 현장의 언어로 통역하는 퍼시리테이터 나 혼자가 아닌", "time": "03:50"}, {"start": 236.79, "end": 240.79, "text": "2000명이 함께하는 자생적 AI 생태계 구축,", "time": "03:56"}, {"start": 240.79, "end": 246.79, "text": "공립농선물 품질관리원의 스마트 등장 혁신의 역할을 하고자 합니다.", "time": "04:00"}, {"start": 246.79, "end": 249.79, "text": "이번 교육에 꼭 참여할 수 있도록 뽑아주시기 바랍니다.", "time": "04:06"}, {"start": 249.79, "end": 250.79, "text": "감사합니다.", "time": "04:09"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/35/1FhXfhay8uSHck8N4eicR_GLT2DRnHWSh.mp4", "frame": "../영상장면/35.jpg", "quotes": [{"start": 59.0, "end": 68.0, "text": "폐쇄망 등 특성을 고려한 AI 기반 원산지표시 민원챗보스를 개발하는 영역에도 참여하였으며", "time": "00:59", "category": "AI 업무 활용 관련 기재"}, {"start": 56.0, "end": 59.0, "text": "인트라인에서의 개시 공유해야 했었고", "time": "00:56", "category": "기관 내 확산 계획 관련 기재"}, {"start": 97.65, "end": 100.65, "text": "두 번째로는 공공인프라 특유의 한계", "time": "01:37", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 35, "name": "서경덕", "title": "260910 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서 1부.pdf", "mime": "application/pdf", "bytes": 234070, "downloaded": true, "url": "https://drive.google.com/file/d/14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC/view?usp=drivesdk", "local": "../원본/35/14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC.pdf", "id": "14MfyWUDoBV-0z8nAmK_ovMRkazQB5sLC"}, {"n": 35, "name": "서경덕", "title": "260910 농림축산식품부 국립농산물품질관리원 발표영상.mp4", "mime": "video/mp4", "bytes": 1290390581, "downloaded": true, "url": "https://drive.google.com/file/d/1FhXfhay8uSHck8N4eicR_GLT2DRnHWSh/view?usp=drivesdk", "local": "../원본/35/1FhXfhay8uSHck8N4eicR_GLT2DRnHWSh.mp4", "id": "1FhXfhay8uSHck8N4eicR_GLT2DRnHWSh"}], "doc_cou
