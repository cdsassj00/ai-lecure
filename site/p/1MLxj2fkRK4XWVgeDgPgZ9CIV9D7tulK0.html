7\n00:00:41,340 --> 00:00:48,110\n없는 것은 기술이 아니라, 기관 안에서 그 교안을 열어\n함께 실습해 줄 사람입니다.\n\n8\n00:00:49,009 --> 00:00:53,239\n그래서 실행계획의 핵심은 새 과정을 만드는 것이 아니라,\n\n9\n00:00:53,585 --> 00:00:58,215\n행정안전부 표준 교안을 사무처에 그대로 이식하는 것입니다.\n\n10\n00:00:58,917 --> 00:01:01,727\n대상은 세 단계로 넓힙니다.\n\n11\n00:01:02,077 --> 00:01:09,227\n1차는 조례와 의안을 다루는 정책지원관과 조사관, 2차는\n전문위원실 실무 직원,\n\n12\n00:01:09,579 --> 00:01:13,129\n3차는 사무처 희망 직원 전체입니다.\n\n13\n00:01:14,031 --> 00:01:16,681\n과정은 다섯 차수입니다.\n\n14\n00:01:17,029 --> 00:01:21,059\nAI 리터러시와 데이터 리터러시로 기초를 깔고,\n\n15\n00:01:21,407 --> 00:01:26,367\nAI 행정 융합 기획으로 의안 검토와 감사 자료에 적용해\n본 뒤,\n\n16\n00:01:26,715 --> 00:01:32,355\n제가 담당할 바이브 코딩에서 각 부서가 자기 업무 도구를\n직접 만들게 합니다.\n\n17\n00:01:32,707 --> 00:01:36,817\n마지막은 AI챔피언 인증 준비 멘토링입니다.\n\n18\n00:01:37,517 --> 00:01:44,407\n실습은 회차당 15명에서 20명, 1인 1노트북으로\n진행하겠습니다.\n\n19\n00:01:45,613 --> 00:01:48,313\n기대효과는 세 가지입니다.\n\n20\n00:01:49,007 --> 00:01:51,617\n첫째, 시간입니다.\n\n21\n00:01:51,969 --> 00:01:59,119\n상위법과 유사 조례를 손으로 찾던 몇 시간이, 근거가 붙은\n즉시 검색으로 바뀝니다.\n\n22\n00:01:59,821 --> 00:02:02,711\n둘째, 신뢰와 보안입니다.\n\n23\n00:02:03,062 --> 00:02:07,732\nAI가 없는 조문을 지어내지 못하게 막는 근거 검증\n절차와,\n\n24\n00:02:08,079 --> 00:02:13,099\n민감 자료를 밖으로 내보내지 않는 원칙을 교육에 그대로\n넣겠습니다.\n\n25\n00:02:13,795 --> 00:02:16,295\n셋째, 확산입니다.\n\n26\n00:02:16,652 --> 00:02:21,192\n2027년 상반기까지 누적 80명에서 100명 이수,\n\n27\n00:02:21,542 --> 00:02:26,292\n그중 10명 이상 AI챔피언 그린 인증을 목표로\n하겠습니다.\n\n28\n00:02:27,191 --> 00:02:30,781\n제 역할은 강사가 아니라 퍼실리테이터입니다.\n\n29\n00:02:31,128 --> 00:02:40,438\n표준 교안으로 과정을 편성해 운영하고, 실습에서 막히는\n직원을 1차로 지원하며, 인증 응시를 멘토링하고,\n\n30\n00:02:40,789 --> 00:02:44,159\n산출물을 점검해 사후까지 돕겠습니다.\n\n31\n00:02:44,856 --> 00:02:50,926\n저는 이미 만든 조례 지원 AI를 과에 공유하고 사용법을\n1대1로 안내해 왔습니다.\n\n32\n00:02:51,278 --> 00:02:58,058\n그 경험을 표준 교안에 맞춰 다듬어, 개인의 역량을 기관의\n절차로 남기겠습니다.\n\n33\n00:02:58,758 --> 00:03:02,578\n3일 전 과정에 100퍼센트 참석하겠습니다.\n\n34\n00:03:02,928 --> 00:03:04,688\n감사합니다.\n\n", "method": "내장 자막 추출", "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[ 과정에 개인정보•비공개자료 보호, 출처 및 근 거 검증, 계산•데이터•코드 재확인, 공무원의 최종 판단과 책임 원칙을 반영하여 안전하고 책임 있는 AI 활용 교육을 설계 및 강의하였다.", "source": "강사양성과정신청서.pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1zOZs6bo1FCuBQoZnAHNm-WIL9EvCEtpg/view?usp=drivesdk", "id": "1zOZs6bo1FCuBQoZnAHNm-WIL9EvCEtpg"}]}, "media": [{"n": 2, "id": "1MK-gNZsG8gvfZuDvSw4mZqe8ERqIsGZK", "file": "양성과정 윤우제.m4a", "url": "https://drive.google.com/file/d/1MK-gNZsG8gvfZuDvSw4mZqe8ERqIsGZK/view?usp=drivesdk", "duration": 230.2257, "video": false, "audio": true, "segments": [{"start": 0.4, "end": 4.3, "text": "안녕하십니까. 국가공모 인재개발원 윤우재입니다.", "time": "00:00"}, {"start": 4.3, "end": 15.4, "text": "저는 이번 발표에서 기관내 AI 데이터 역량 강화 실행 계획을 문제점, 해결 방안, 기대 효과, 그리고 수력 후 제 역할 순서대로 말씀드리기 있습니다.", "time": "00:04"}, {"start": 15.4, "end": 23.4, "text": "첫 번째 문제는 교육의 현장 적합성입니다. AI 활용 수요는 전부처와 전 직급으로 확산되고 있지만", "time": "00:15"}, {"start": 23.4, "end": 28.9, "text": "신규 실무자와 중앙관리자, 과장, 미 국장급이 필요를 하는 역량은 서로 다릅니다.", "time": "00:23"}, {"start": 28.9, "end": 34.54, "text": "신문자는 자료를 조사하고 문서를 작성하고 데이터를 분석을 하고요.", "time": "00:28"}, {"start": 34.54, "end": 37.94, "text": "관리자는 정책 문제의 구조와 대안 판단,", "time": "00:34"}, {"start": 37.94, "end": 43.18, "text": "고위 관리자는 AI, 전환과 조직 혁신을 이해해야 합니다.", "time": "00:37"}, {"start": 43.18, "end": 49.06, "text": "또한 단순 도구사연 교육뿐만 아니라 정책 현장에 바로 쓰기 어렵고", "time": "00:43"}, {"start": 49.06, "end": 57.46, "text": "개인정보와 비공개 자료, 입력, 오류 같은 안정 검증 리스크도 함께 관리해야 합니다.", "time": "00:49"}, {"start": 57.46, "end": 66.46, "text": "해결 방안은 행정 안전부 표준 교환을 국광문 인재개발원의 직급별 교육 경험과 결합형 운영에 나가는 것입니다.", "time": "00:57"}, {"start": 66.46, "end": 75.9, "text": "신규 실무자 과정은 체씨피티 클러드 재미나일을 활용한 자료조사, 문서 작성, 데이터, 탐색과 시악화에 집중하겠습니다.", "time": "01:06"}, {"start": 75.9, "end": 81.94, "text": "중간걸리자 과정은 정책 문제, 구조와 대한문석, 보고서 작성으로 연결하고", "time": "01:15"}, {"start": 81.94, "end": 87.98, "text": "과장민 국장급 과정을 AI 전환에 따른 정체 환경, 변화, 조직 혁신,", "time": "01:21"}, {"start": 87.98, "end": 92.18, "text": "데이터 기반의 의사 결정과 AI 리더십으로 설계하겠습니다.", "time": "01:27"}, {"start": 92.18, "end": 99.34, "text": "특히 모든 과정은 문제기반 방식, PBR 방식으로 실제 정책 행정사를 다루고", "time": "01:32"}, {"start": 99.34, "end": 108.88, "text": "개인정보보호, 출처 확인, 코드 검정, 공무원의 책임, 최종 책임 원칙을 전 과정에 반영하겠습니다.", "time": "01:39"}, {"start": 108.88, "end": 119.62, "text": "운영은 실현 가능성에 중심해 두겠습니다. 수료 셔트에는 연관 회차별로 20명에 30명, 내외 강의와 실습형 워크샵을 운영하겠습니다.", "time": "01:48"}, {"start": 119.62, "end": 126.06, "text": "생성의 AI 업무 활용과 기본 그리고 AI 기반 정체 기획 문제 해결 과정을 운영하고", "time": "01:59"}, {"start": 126.06, "end": 134.62, "text": "파이성과 비제 코딩을 활용한 데이터 기반 정체 분석 실습을 운영하겠습니다.", "time": "02:06"}, {"start": 134.62, "end": 141.06, "text": "과장민 국장급 대상으로는 AI 리더실 과정과 직급별 PBR 프로젝트를 확장하겠습니다.", "time": "02:14"}, {"start": 141.06, "end": 149.06, "text": "교육 후에는 만족도와 현업 활용들을 점검하고 90% 이상을 목표로 교육 내용을 개선하겠습니다.", "time": "02:21"}, {"start": 149.06, "end": 156.46, "text": "기대 효과는 4가지입니다. 첫째, 자료 탐색과 보고서 초안 작성도 반복 업무를 줄여 업무 효율을 높일 수 있습니다.", "time": "02:29"}, {"start": 156.46, "end": 164.34, "text": "둘째, 데이터와 AI를 활용해 정책 문제를 구조하고 근거를 비교함으로써 정책 보고서의 품질을 높일 수 있습니다.", "time": "02:36"}, {"start": 164.34, "end": 173.44, "text": "셋째, 개인정보보호와 출처 확인, 결과 재검조를 습관하여 안전화와 책임 있는 공공 부분 AI 활용 문화를 확산할 수 있습니다.", "time": "02:44"}, {"start": 173.44, "end": 185.9, "text": "넷째, 교육생의 실제 사례와 우스프럼프트 데이터 분석 사례를 축적해 국가홈머 인재개반의 직급별 AI 데이터 교육 표준 모듈로 발전시킬 수 있습니다.", "time": "02:53"}, {"start": 185.9, "end": 196.46, "text": "저의 역할은 네 가지입니다. 첫째, 국가홈머 인재개반에서 구급부터 국정 끝까지 교육과정을 운영해 온 경험을 바탕으로 직급별 교육을 설계하겠습니다.", "time": "03:05"}, {"start": 196.46, "end": 204.26, "text": "둘째, 표준 교환을 충신에 이행하고 기관 맥락에 맞게 강의와 퍼실리테이션을 수행하겠습니다.", "time": "03:16"}, {"start": 204.26, "end": 211.9, "text": "셋째, 학습자의 실은 과정에 막히는 부분을 지원하고 AI 챔피언 인증 준비와 사업 멘토링을 돕겠습니다.", "time": "03:24"}, {"start": 211.9, "end": 220.18, "text": "넷째, 현장에서 나온 정책 사례와 프롬부트 데이터 분석과 사례를 축적해 다음 교육에 반영하겠습니다.", "time": "03:31"}, {"start": 220.18, "end": 229.1, "text": "저는 이 과정이 통해서 공무원이 AI를 안전하게 쓰고 정책을 더 잘 만드는 교육으로 확산시키겠습니다.", "time": "03:40"}, {"start": 229.1, "end": 230.1, "text": 하겠습니다.", "time": "01:47", "category": "기관 내 확산 계획 관련 기재"}, {"start": 12.68, "end": 25.18, "text": "그러나, 직음마다 활용소전의 차이가 있고 교육을 받은 뒤에도 자신의 업무 어디에 AI를 적응해야 하는지 어려움을 느끼는 경우가 있습니다.", "time": "00:12", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 4, "name": "손원익", "title": "AI강사 양성과정 신청서(울산광역시_손원익).pdf", "mime": "application/pdf", "bytes": 267714, "downloaded": true, "url": "https://drive.google.com/file/d/16uWC7KSrbmM6EL3fhcbv0OIwIjPtBpgO/view?usp=drivesdk", "local": "../원본/04/16uWC7KSrbmM6EL3fhcbv0OIwIjPtBpgO.pdf", "id": "16uWC7KSrbmM6EL3fhcbv0OIwIjPtBpgO"}, {"n": 4, "name": "손원익", "title": "AI강사양성과정_기관AI데이터역량강화실행계획_손원익.mp4", "mime": "video/mp4", "bytes": 58757589, "downloaded": true, "url": "https://drive.google.com/file/d/1sUclzIyq_qsiNBq_tFO5lBa6H1CxKH5y/view?usp=drivesdk", "local": "../원본/04/1sUclzIyq_qsiNBq_tFO5lBa6H1CxKH5y.mp4", "id": "1sUclzIyq_qsiNBq_tFO5lBa6H1CxKH5y"}, {"n": 4, "name": "손원익", "title": "AI강사양성과정_기관AI데이터역량강화실행계획_손원익.pptx", "mime": "application/vnd.openxmlformats-officedocument.presentationml.presentation", "bytes": 40404104, "downloaded": true, "url": "https://docs.google.com/presentation/d/1_XsF494A8-swXG2mDdZkbeZterIbvYxU/edit?usp=drivesdk&ouid=104240081467156064618&rtpof=true&sd=true", "local": "../원본/04/1_XsF494A8-swXG2mDdZkbeZterIbvYxU.pptx", "id": "1_XsF494A8-swXG2mDdZkbeZterIbvYxU"}], "doc_count": 2, "media_count": 1}, {"n": 5, "original_no": 8, "row": 6, "name": "유도암", "org": "경찰청 경상북도경찰청", "folder_title": "5. 경북경찰청_유도암", "folder_url": "https://drive.google.com/drive/folders/1sxt8UTy_SxhTLLpAbpGlkwz7QMe_3-Bg", "summary": "PolSearch·PolVision 개발·배포와 동료의 사용 오류 해결 경험을 기재. 10~20명 학습모임을 제안하며 세부 일정·운영은 추가 협의 대상으로 명시함.", "evidence": {"자기주도 학습 관련 기재": [{"text": "AI챔피언 블루 자기주도형 수료 ‘25.6.30 ~ 7.11", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정(경북청 유도암).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF/view?usp=drivesdk", "id": "1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF"}, {"text": "저는 경주에서 근무하며 AI·데이터 분석 전문인재 양성과정에 참여하기 위해 서울을 오가고 있습니다. 이동과 시간 부담을 직접 경험한 만큼, 동료들이 근무지 가까이에서 질문하고 반복해서 실습할 기회를 만들고 싶습니다. 경주서 학습모임의 경험과 사례를 축적해 정규교육을 제안하고, 장기적으로 경북 관내 교육과 경찰청·경찰인재개발원 강의 참여까지 활동을 넓히고자 합니다. · 담당 과목과 수업 목표: 트랙1의 ‘AI 리터러시와 업무활용’을 희망합니다. 행정안전부 표준 교안을 바탕으로 ① AI의 기능·한계와 입력 가능한 자료를 판단하고 ② 목적·대상·조건을 담아 요청하며 ③ 결과를 원자료와 비교·수정하는 수업을 구성하겠습니다. 참여자가 결과물뿐 아니라 ‘무엇을 왜 고쳤는지’ 설명하고 자기 업무에 적용할 과제를 정하는 것을 목표로 삼겠습니다.", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정(경북청 유도암).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF/view?usp=drivesdk", "id": "1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF"}, {"text": "10~12월 경주서 관심 직원 10~20명 모집을 목표로 주 1회 90분의 학습모임을 추진하겠습니다. 첫 4회 시범 결과를 확인해 총 12회를 목표로 후속 운영을 협의하겠습니다. 짧은 설명·시연 뒤 직접 실습하고, 과제와 사례를 순환 발표하며 피드백을 나누도록 하겠습니다. 저는 사전 수준·환경 확인, 과제 설계와 질문 정리를 맡겠습니다. 초보자는 단계별로 돕고, 경험자는 다른 조건으로 응용하게 하며, 희망자에게 AI챔피언 준비와 후속 학습 경로를 안내하겠습니다. □ 자체 교육 운영 실적 및 계획 1) 기관 자체 교육 운영 실적", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정(경북청 유도암).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF/view?usp=drivesdk", "id": "1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF"}], "AI 업무 활용 관련 기재": [{"text": "직접 개발한 문서 검색 도구 PolSearch를 전국 경찰관에게 배포하고 사용 문의에 대응했습니다. 실행이 안 된다는 문의에는 내부 메신저의 원격 기능으로 함께 테스트했습니다. Microsoft 프로그램과의 충돌, 공유폴더까지 포함된 색인 범위 문제를 찾아 해결했고, 해당 동료가 도구를 원활하게 사용할 수 있게 했습니다. · 초보 학습자의 어려움에 대한 이해:", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정(경북청 유도암).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF/view?usp=drivesdk", "id": "1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF"}, {"text": "2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 Codex·Antigravity·Claude 등 AI로 업무 도구의 요구사항을 정리하고, 코드 작성·오류 수정·결과 확인을 반복해 왔습니다. 현장에서 필요한 작업을 작은 과제로 나누고, AI가 제안한 결과를 실제 사용 과정에서 확인하는 경험을 쌓았습니다. ·", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정(경북청 유도암).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1P-wUK9aBscU "start": 56.02, "end": 63.52, "text": "자료 선택, 요청과 실행, 근거 확인과 수정, 결과 발표의 4단계로 실습하겠습니다.", "time": "00:56"}, {"start": 63.52, "end": 72.92, "text": "공개 자료와 가상 자료의 날짜와 수치, 출처를 확인하고 AI가 만든 내용과 대조에 틀리거나 빠진 내용을 고칩니다.", "time": "01:03"}, {"start": 72.92, "end": 79.08, "text": "개인 정보와 민감한 내부 자료를 외부 AI에 입력하지 않는 원칙도 함께 익힙니다.", "time": "01:12"}, {"start": 79.08, "end": 87.04, "text": "매회 짧은 시연 뒤 직접 실습하고 과제와 경험을 돌아가며 발표해 피드백을 나누겠습니다.", "time": "01:19"}, {"start": 87.04, "end": 92.24, "text": "기대하는 변화는 결과를 스스로 검토하고 고치는 영향입니다.", "time": "01:27"}, {"start": 92.24, "end": 99.58, "text": "요청서식과 수정 사례도 모아 동료가 재사용할 수 있는 기간의 학습 자료로 남기겠습니다.", "time": "01:32"}, {"start": 99.58, "end": 105.18, "text": "첫 결과와 수정본 확인한 근거를 비교해 학습 성과를 살펴보겠습니다.", "time": "01:39"}, {"start": 105.18, "end": 113.06, "text": "참여 지속 여부와 과제 완성도를 점검한 뒤 정규 교육과 경북 관내 확산을 제안하겠습니다.", "time": "01:45"}, {"start": 113.06, "end": 118.02, "text": "저는 과제 설계와 환경 점검 수준별 실습 지원을 맡겠습니다.", "time": "01:53"}, {"start": 118.02, "end": 124.0, "text": "발표와 피드백을 이끌고 즉답하기 어려운 질문은 확인한 뒤 안내하겠습니다.", "time": "01:58"}, {"start": 124.0, "end": 132.46, "text": "직접 만든 폴서치를 배포하고 사용이 막힌 동료와 원격으로 함께 문제를 해결해 온 경험을 살리겠습니다.", "time": "02:04"}, {"start": 132.46, "end": 138.1, "text": "서울을 오가며 배운 내용을 경주에 가까운 학습 기회로 만들겠습니다.", "time": "02:12"}, {"start": 138.1, "end": 143.78, "text": "동료가 스스로 활용할 수 있도록 돕는 현장 강사가 되겠습니다.", "time": "02:18"}, {"start": 143.78, "end": 144.78, "text": "감사합니다.", "time": "02:23"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/05/1IaN7tbwQ7_iuK0ieh-m-kO8QjpRL_fgM.mp4", "frame": "../영상장면/05.jpg", "quotes": [{"start": 36.02, "end": 40.02, "text": "주 한 번 1시간 반의 학습 모임을 제안합니다.", "time": "00:36", "category": "자기주도 학습 관련 기재"}, {"start": 124.0, "end": 132.46, "text": "직접 만든 폴서치를 배포하고 사용이 막힌 동료와 원격으로 함께 문제를 해결해 온 경험을 살리겠습니다.", "time": "02:04", "category": "AI 업무 활용 관련 기재"}, {"start": 113.06, "end": 118.02, "text": "저는 과제 설계와 환경 점검 수준별 실습 지원을 맡겠습니다.", "time": "01:53", "category": "강의·학습 지원 관련 기재"}, {"start": 105.18, "end": 113.06, "text": "참여 지속 여부와 과제 완성도를 점검한 뒤 정규 교육과 경북 관내 확산을 제안하겠습니다.", "time": "01:45", "category": "기관 내 확산 계획 관련 기재"}, {"start": 56.02, "end": 63.52, "text": "자료 선택, 요청과 실행, 근거 확인과 수정, 결과 발표의 4단계로 실습하겠습니다.", "time": "00:56", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": ["드라이브 폴더 5번 / 평가 양식 NO 8 / 엑셀 6행. 번호 단독 매칭 금지."], "files": [{"n": 5, "name": "유도암", "title": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정(경북청 유도암).hwpx", "mime": "application/haansofthwpx", "bytes": 90166, "downloaded": true, "url": "https://drive.google.com/file/d/1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF/view?usp=drivesdk", "local": "../원본/05/1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF.hwpx", "id": "1P-wUK9aBscUX_CXbhZtICQGH11nV_nAF"}, {"n": 5, "name": "유도암", "title": "발표영상(경북청 유도암).mp4", "mime": "video/mp4", "bytes": 22434145, "downloaded": true, "url": "https://drive.google.com/file/d/1IaN7tbwQ7_iuK0ieh-m-kO8QjpRL_fgM/view?usp=drivesdk", "local": "../원본/05/1IaN7tbwQ7_iuK0ieh-m-kO8QjpRL_fgM.mp4", "id": "1IaN7tbwQ7_iuK0ieh-m-kO8QjpRL_fgM"}], "doc_count": 1, "media_count": 1}, {"n": 6, "original_no": 9, "row": 7, "name": "황인성", "org": "경찰청", "folder_title": "6. 경찰청_황인성", "folder_url": "https://drive.google.com/drive/folders/1wKJ7IS9-Lpj9NaxQg2xKJcMjxtK9JK2H", "summary": "경찰교육 교수요원 경험과 AI 치안 교육·프로젝트 수행을 기재. 공통기초·직무실습·현업 적용의 단계별 교육 및 검증·보안 안내를 제시함.", "evidence": {"자기주도 학습 관련 기재": [{"text": "학습동아리를 통해 지속적인 학습문화를 조성할 수 있습니다. 교육효과는 이수율, 실습 산출물, 만족도, 현업 적용사례, 대표업무의 수행시간 변화로 확인하겠습니다. - 6 -", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 6, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}], "AI 업무 활용 관련 기재": [{"text": "ChatGPT업무활용비법 2026.2. 9.~2. 10. 수료 2일 12시간", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}, {"text": "ChatGPT를 활용한 보고서 작성 스킬업 2025.8..28.~8.29. 수료 2일 12시간", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}, {"text": "인사혁신처 업무자동화 비법 2025.6. 9.~6. 10. 수료 국가공무원인재개발원 2일16시간", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}], "강의·학습 지원 관련 기재": [{"text": "23.2월~ 현재 중앙경찰학교 교무과(교수요원) 교육, 교안 개발, 강의·토의·실습 운영, 학습자 피드백 및 평가", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 1, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}, {"text": "1) 강의 실적 및 경험 기간 기관 강의·운영 내용, 대상 역할 비고 실적 기재", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}], "기관 내 확산 계획 관련 기재": [{"text": "운영 대상 중앙경찰학교, 아산 경찰 인재개발원, 수사연수원, 경찰대학 시범 인원 과별 15~25명, 총 45~75명 / 6회 누적 90~150명 내외 [기관 여건에 따라 조정] 운영 기간 수료 후 3개월 시범운영", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}, {"text": "운영 횟수 월 2회, 회당 2시간 / 총 6회·12시간 운영 방식 공통기초 40% + 직무실습 50% + 피드백 10%, 노트북 또는 업무용 실습환경 활용 참여자 1인 1개 업무 산출물 완성, 과별 활용사례 1건 이상 발굴, 재사용 가능한", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}, {"text": "확산 촉진자 AI 공부 동아리, 사례공유회, 온라인 콘텐츠를 통해 지속 가능한 내부 학습문화 조성 나. 단계별 실행 로드맵 단계 주요 활동 목표 산출물·지표", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}], "과정·이유·검증 설명 관련 기재": [{"text": "국가공무원인재개발원 2일16시간 AI이해와 활용", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}, {"text": "모든 직원이 AI의 기본 원리와 한계를 이해하고, 보안·검증 원칙을 지키면서 자신의 운영 목적 실제 업무에 기초 활용할 수 있도록 함", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}, {"text": "통해 더 많은 것을 이해할 수 있었으며, 그전 공무원 인재개발원에서 다양한 인공지능 기초에 대한 교육 수료를 통해 활용도에 자신감이 있습니다. 특히", "source": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}]}, "media": [{"n": 6, "id": "17BHWFobt_jwhPqJXGdXzqXuvDitI8-Bc", "file": "KakaoTalk_20260908_223642834.mp4", "url": "https://drive.google.com/file/d/17BHWFobt_jwhPqJXGdXzqXuvDitI8-Bc/view?usp=drivesdk", "duration": 200.715, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\06.jpg", "segments": [{"start": 1.1, "end": 8.1, "text": "안녕하세요. 저는 중앙경찰학교에서 교수원으로 근무하고 있는 황인성이라고 합니다.", "time": "00:01"}, {"start": 8.1, "end": 18.1, "text": "이번 AI 트랙 강사 과정에 참여를 하고 싶어서 이렇게 준비를 하고 있는데요.", "time": "00:08"}, {"start": 18.1, "end": 25.1, "text": "제가 볼 때는 현재 AI 교육에 대한 3가지에 대한 문제점이 있다고 생각합니다.", "time": "00:18"}, {"start": 25.1, "end": 36.7, "text": "세 가지에 대한 문제점인데요. 첫 번째, 이 AI에 대한 이해도와 활용 수준이 차이가 크다는 겁니다.", "time": "00:25"}, {"start": 36.7, "end": 45.8, "text": "모든 사람들이 한 도구를 가지고 어떤 이해도와 활용 수준의 차이가 크다는 거고. 두 번째,", "time": "00:36"}, {"start": 45.8, "end": 60.4, "text": "일반적으로 이 AI 교육은 업무하는 거리가 좀 있어서 교육을 받은 뒤에도 현장에서 바로 활용할 수가 없는 부분이 없지 않나 이렇게 보고 있습니다.", "time": "00:45"}, {"start": 60.4, "end": 73.92, "text": "그리고 세 번째. 그리고 저희가 쓰다 보면 개인정보, 비공개정보, 입력, 위험 또 AI의 오류, 출적 검증에 대한 체계적인 교육이 좀 부족한 것 같습니다.", "time": "01:00"}, {"start": 73.92, "end": 80.44, "text": "이런 세 가지 문제점은 저는 한번 생각해보았고요.", "time": "01:13"}, {"start": 80.44, "end": 88.34, "text": "이런 문제점을 해결하기 위해서 공공, AI 영향, 표준 교환을", "time": "01:20"}, {"start": 88.34, "end": 93.1, "text": "경찰 교육 기간의 업무와 보안 환경에 맞게", "time": "01:28"}, {"start": 93.1, "end": 97.34, "text": "제 설계를 한번 해서", "time": "01:33"}, {"start": 97.34, "end": 108.94, "text": "교육에 대한 공통기초 그리고 진무실, 그리고 현업에 적용하는 3단계로 운영을 하고 싶습니다.", "time": "01:37"}, {"start": 108.94, "end": 120.62, "text": "저는 최근에 국민 대학교 AI 치안, 영량 과정, 전문가 과정을 120시간 수료를 하면서", "time": "01:48"}, {"start": 120.62, "end": 128.78, "text": "프로젝트도 한번 수행하면서 제가 그동안 알지 못했던 api, mcp, dpi,", "time": "02:00"}, {"start": 128.78, "end": 136.9, "text": "체포 등 다양하게 한번 이렇게 연결해서 활용하고 보는 그런 시간이 되었습니다.", "time": "02:08"}, {"start": 136.9, "end": 150.58, "text": "그리고 chppt, clode, jmly, 모든 것을 활용해서 보고서를 한번 작성해 보고 자료조사, 연구계 어떤 수업설계에 대해서 한번 활용을 해 보았습니다.", "time": "02:16"}, {"start": 150.58, "end": 172.58, "text": "저는 AI 개발자가 아니고 이 과정을 통해서 공공 AI 역량 표준 교환을 가지고 이것을 실제로 사용할 수 있는 교육으로 바꾸어 현장에서 기획자이자 강사, 퍼실러테이터로 역할을 하고 싶습니다.", "time": "02:30"}, {"start": 172.58, "end": 179.58, "text": "경찰 교육기관부터 시작을 해서 교육을 확대를 하고 싶습니다.", "time": "02:52"}, {"start": 179.58, "end": 195.58, "text": "그리고 이 AI가 판단을 대신하는 것이 아니라 더 안전하고 정확한 판단을 돕는 도구로 가르치는 그런 공공 AI 강사가 한번 되도록 열심히 한번 해보고 싶습니다.", "time": "02:59"}, {"start": 195.58, "end": 200.58, "text": "꼭 참여해서 같이 하고 싶습니다. 감사합니다.", "time": "03:15"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/06/17BHWFobt_jwhPqJXGdXzqXuvDitI8-Bc.mp4", "frame": "../영상장면/06.jpg", "quotes": [{"start": 60.4, "end": 73.92, "text": "그리고 세 번째. 그리고 저희가 쓰다 보면 개인정보, 비공개정보, 입력, 위험 또 AI의 오류, 출적 검증에 대한 체계적인 교육이 좀 부족한 것 같습니다.", "time": "01:00", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": ["드라이브 폴더 6번 / 평가 양식 NO 9 / 엑셀 7행. 번호 단독 매칭 금지."], "files": [{"n": 6, "name": "황인성", "title": "(붙임) 강사 양성 과정 신청서(경감 황인성).pdf", "mime": "application/pdf", "bytes": 337535, "downloaded": true, "url": "https://drive.google.com/file/d/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV/view?usp=drivesdk", "local": "../원본/06/1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV.pdf", "id": "1SfePbCj2rmXv5rlG-cBivAiGXTJwDMCV"}, {"n": 6, "name": "황인성", "title": "KakaoTalk_20260908_223642834.mp4", "mime": "video/mp4", "bytes": 97020940, "downloaded": true, "url": "https://drive.google.com/file/d/17BHWFobt_jwhPqJXGdXzqXuvDitI8-Bc/view?usp=drivesdk", "local": "../원본/06/17BHWFobt_jwhPqJXGdXzqXuvDitI8-Bc.mp4", "id": "17BHWFobt_jwhPqJXGdXzqXuvDitI8-Bc"}], "doc_count": 1, "media_count": 1}, {"n": 7, "original_no": 5, "row": 8, "name": "박기현", "org": "한국공항공사", "folder_title": "7. 한국공항공사_박기현", "folder_url": "https://drive.google.com/drive/folders/1c9a4Mw__RMldfRY10Lpb_rIK_8NqFIAe", "summary": "사내 DX 강의·멘토링과 외부 강의, 자체 LLM 인프라 구축 경험을 기재. 공사 직원 대상 단계별 AI·데이터 교육과 내부 강사 확산을 계획함.", "evidence": {"자기주도 학습 관련 기재": [], "AI 업무 활용 관련 기재": [{"text": "2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 □ (AI도구 전문성) “AI를 아는가?” ○ (프로그래밍 경험) 공군 작통단에서 자바,C++ 프로그래밍 4년 경력", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}, {"text": "- Gitgub 자기저장소, VBA 작성, RSS 자동수집 ○ (바이브코딩) Open API 호출, Supabase 연결, 로컬 Ollama, Netlify, Vercel 등 - PRD(요구사항 정의서) → ADR(아케텍쳐 결정기록) → POC(개념 검증)", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}, {"text": "전환하고 - (예시) 자료 입력·검증 자동화, 업무 진행상태 자동 알림, 반복 조회·확인 업무 의 시스템 전환, 자료 검색·분류·활용 지원, 민원·문의사항 응대 지원, 서식·대장 기반 업무의 시스템화, 현장자료 수집·전송 방식 개선 등", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 6, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}], "강의·학습 지원 관련 기재": [{"text": "1) 강의 실적 및 경험 기간 기관 강의·운영 내용, 대상 역할 비고 ‘23.11.30 국가철도공단 DX관련 정보화기술 강의 강사", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}, {"text": "‘25.07~ 한국공항공사 AI전문가로서 멘토링 전문가 2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 □ (AI도구 전문성) “AI를 아는가?”", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}], "기관 내 확산 계획 관련 기재": [{"text": "데이터의 편향성 문제(Bias), 딥페이크 문제 등 윤리 관련 강의 등 문화 확산 - ‘13~ ’17년 개인정보보호 전문가로서 기업의 개인정보 비식별화 조치 등 - (전 직원대상) AI를 쉽게 활용할수 있도록 全 생애주기에 걸친 보편적 AI 교육 확대", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}, {"text": "기간 과정명 대상·인원 운영방식 본인 역할비고 7.23~9.30 차세대 AI 기술과 트랜드 2,000 온라인 7.23~9.30 행정현장의 AI동료, 어떻게 활용할까? 2,000 온라인", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 5, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}, {"text": "○ (운영목표) AI를 별도의 기술이 아닌 업무수행의 기본도구로 인식하도록 학습 경험 설계하여 보고서 작성 의사결정 문제해결 교육 등에 AI활용 실습 반영 - AI 챔피언 블루 인증, AI 챔피언 고급 과정(블랙) 습득 기술 기반으로 강의", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 5, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}], "과정·이유·검증 설명 관련 기재": [{"text": "- PRD(요구사항 정의서) → ADR(아케텍쳐 결정기록) → POC(개념 검증) - Fast API 백엔드 + Streamlit; 단일 HTML Node.js, Javascripts, 웹앱 - 에이전트 구조, 하네스 구조, MCP 표준, RAG, 파인튜닝 등 활용", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}, {"text": "○ (해결책) iFIS 데이터 및 데이터 플랫폼 데이터 활용 지연 원인분석 ○ (효 과) 고속탈출 유도로 활용하여 병목 완화 등 개선방안 제공(Simulation) 3) 수료 후 강사 활동 계획", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}, {"text": "- 객관적·비방어적·비판단적 태도를 유지하며 “모든 아이디어를 수용” ①“AI는 나의 역할을 대체하는 것이 아니라 보완해야 한다” ②“AI가 인간의 의사결정과 지적 발달을 지원해야지 훼손하거나 대체해서는 안된다”", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 신청서 최종.pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs/view?usp=drivesdk", "id": "1lrpG_jixOAudzkJyDKz9EgwZq54I6Dfs"}]}, "media": [{"n": 7, "id": "1brffe127KKtoUVjREY5XG3RmAhUchDVe", "file": "AI_강사지원_동영상.mp4", "url": "https://drive.google.com/file/d/1brffe127KKtoUVjREY5XG3RmAhUchDVe/view?usp=drivesdk", "duration": 177.375309, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\07.jpg", "segments": [{"start": 0.88, "end": 9.88, "text": "안녕하십니까. 한국공항우사 개념정국 박기현입니다. AI 데이터 역량 강화 실행 계획을 발표하겠습니다. 먼저 문제점입니다.", "time": "00:00"}, {"start": 9.88, "end": 19.88, "text": "공사는 37억 건의 데이터와 자체 LLM 인포라를 보유하고 있지만, 직원들의 AI 운영 단계는 전반적으로 낮고, 교육은 외부 강사의 의전에 왔습니다.", "time": "00:09"}, {"start": 19.88, "end": 31.88, "text": "그 결과 서무 치합 보고 같은 반복 업무의 시간이 소요되고 인사이동 때마다 노하우가 단절되며 전해 차 직원과 숙령 직원 간 서비스 편차가 발생하였습니다.", "time": "00:19"}, {"start": 31.88, "end": 35.88, "text": "인프라는 있는데 사람이 준비되지 않은 상태입니다.", "time": "00:31"}, {"start": 35.88, "end": 38.88, "text": "해결방항은 3단계 산해 교육 체계입니다.", "time": "00:35"}, {"start": 38.88, "end": 48.88, "text": "첫째, 전 직원 2000명을 대상으로 차세대 AI 기술과 트렌드 행정 현장의 AI 동료 온라인 과정을 운영해 보편적 소향을 갖추게 합니다.", "time": "00:38"}, {"start": 48.88, "end": 62.48, "text": "3. 인문에서 CIMA 전문가로 이어지는 학습 경로로 AI 데이터 활용, AI 챔피언 양성, AI 기반 기획 년야, 생성량 AI 업무 효율 개선 과정을 편성합니다.", "time": "00:48"}, {"start": 62.48, "end": 70.3, "text": "셋째, 모든 과정은 보고서 작성 의사결정 문제 해결에 AI를 직접 쓰는 실습 중심으로 설계하고", "time": "01:02"}, {"start": 70.3, "end": 79.42, "text": "한기원 계층 직무 과정에서도 AI 소향 과목을 편성해 AI를 별도 기술이 아닌 기본 업무 독으로 자리 잡게 합니다.", "time": "01:10"}, {"start": 79.42, "end": 86.78, "text": "기대 효과입니다. 첫째, 없애고 줄이고 전환하는 업무 패러다임 전환이 가속화됩니다.", "time": "01:19"}, {"start": 86.78, "end": 98.1, "text": "직원들의 영향이 강화되어 소관 업무에 소행 관행적 확인 자료를 없애고 취업 보고 절차를 줄이고 반복 업무를 AI와 시스템으로 전환하게 됩니다.", "time": "01:26"}, {"start": 98.1, "end": 107.78, "text": "둘째, 부서블 서무 업무 50% 절감으로 연 35가 AI 인프라 가상화 전환으로 유지관림이 약 24억 원 절감을 예상합니다.", "time": "01:38"}, {"start": 107.78, "end": 119.1, "text": "셋째, 관심에서 학습, 인정 활용으로 이어지는 AI 인제 확보 체계를 수립해 다음 교육을 이끌 내부 퍼실리 데이터를 배출합니다.", "time": "01:47"}, {"start": 119.1, "end": 126.43, "text": "AI 메뉴얼로 인사시즌 노하우 단절도 마가 대국민서비스 변차를 죽입니다.", "time": "01:59"}, {"start": 126.43, "end": 128.43, "text": "마지막으로 제 역할입니다.", "time": "02:06"}, {"start": 128.43, "end": 138.75, "text": "저는 17년가 IT 전문가로서 19년부터 멘토린과 산에 DX 강의를 맡았고 국가철도공단 세망근 개발 공사던 외부 강의 경험도 있습니다.", "time": "02:08"}, {"start": 138.75, "end": 147.99, "text": "AI 챔피언 블루 인증과 고급과정을 이수 중이며 교육학 석사 졸업 AI 박사 과정 진학 중입니다.", "time": "02:18"}, {"start": 147.99, "end": 157.23, "text": "이번 강사 양성 과정 트랙 2번 AI 용압을 통해 노코드 데이터 분석과 AI 행정 용압 기획 교환을 산회에 전파하겠습니다.", "time": "02:27"}, {"start": 157.23, "end": 166.87, "text": "자체 LNM 서버 구축한 경험으로 실습 환경을 준비하고 개인정보보호 전문가 경력으로 환각, 편향, 윤리 교육도 함께 맞겠습니다.", "time": "02:37"}, {"start": 166.87, "end": 174.19, "text": "목표는 2천 명 데이터 기반 인재 양산과 데이터를 근거로 의사 결정하고 소통하는 조직 생태계 구축입니다.", "time": "02:46"}, {"start": 174.19, "end": 178.19, "text": "이상 경청해 주셔서 감사드립니다.", "time": "02:54"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/07/1brffe127KKtoUVjREY5XG3 GI3UYCNAPdBEGc3O/view?usp=drivesdk", "duration": 176.448146, "video": false, "audio": true, "segments": [{"start": 23.66, "end": 30.76, "text": "먼저, 현재 우리 우정사업 물류와 행정 현장이 마주한 문제점입니다. 크게 두 가지입니다.", "time": "00:23"}, {"start": 30.76, "end": 36.06, "text": "첫째, 방대하는 우편 물류 관련 데이터가 쌓이고 있음에도 불구하고,", "time": "00:30"}, {"start": 36.06, "end": 42.96, "text": "소요력 예측이나 자원배부는 여전히 현장 실무자의 경험과 감회 크게 의존하고 있습니다.", "time": "00:36"}, {"start": 42.96, "end": 51.96, "text": "둘째, 직원들 역시 데이터기반 행정이 중요성 공감하지만 내 실무에 당장 어떻게 AI를 써야 할지 모르는", "time": "00:42"}, {"start": 51.96, "end": 57.8, "text": "이른바 기술과 현혹 간의 괴리, 즉 AI 리터러시 장벽이 존재합니다.", "time": "00:51"}, {"start": 57.8, "end": 63.62, "text": "저는 이런 문제를 해결하기 위해 행안부의 00AI 영향 트랙을", "time": "00:57"}, {"start": 63.62, "end": 69.12, "text": "우정사업 현장 맞춤형으로 재설기하여 자체 교육을 실행하겠습니다.", "time": "01:03"}, {"start": 69.12, "end": 72.24, "text": "무조건 어려운 코딩을 가르치는 것이 아닙니다.", "time": "01:09"}, {"start": 72.24, "end": 76.76, "text": "초기에는 생성형 AI의 안전화룡법을 익히고", "time": "01:12"}, {"start": 76.76, "end": 82.88, "text": "복잡한 규정이나 법령을 수초만의 요약 및 생성하는 컨텍스트 실습으로", "time": "01:16"}, {"start": 82.88, "end": 87.28, "text": "직원들에게 작은 성공 경험을 제공하겠습니다.", "time": "01:22"}, {"start": 87.28, "end": 94.08, "text": "나아가 심하단계에서는 파이서를 활용해 옥편소통량 트래픽을 시각해보고", "time": "01:27"}, {"start": 94.08, "end": 101.12, "text": "현장 물류 데이터를 직접 분석하고 예측하는 실습 중심의 과정을 운영하겠습니다.", "time": "01:34"}, {"start": 101.12, "end": 103.8, "text": "이러한 교육의 기대 효과는 명확합니다.", "time": "01:41"}, {"start": 103.8, "end": 112.8, "text": "첫째, 직관이 아닌 데이터를 기반으로 소요 인력을 예측하게 되어 물류 효율상이 극대화되고 불필요한 비용이 절간됩니다.", "time": "01:43"}, {"start": 112.8, "end": 127.8, "text": "둘째, 외부 전문가의 기대는 것이 아니라 직원들 스스로 일상적인 업무 비유의를 찾아내고 AI도구로 해결하는 자생적인 AI 생태계가 우리 기관이의 정착되게 될 것입니다.", "time": "01:52"}, {"start": 127.8, "end": 130.8, "text": "마지막으로 이 과정에서 저의 역할입니다.", "time": "02:07"}, {"start": 130.8, "end": 135.8, "text": "저는 단순히 지식을 전달하는 단방행적 강사가 되지 않겠습니다.", "time": "02:10"}, {"start": 135.8, "end": 145.8, "text": "과거에 5구 분제로 앱을 개합하라고 스마트플로우 AI 인력 예측 ": "https://drive.google.com/file/d/1ySUWJOb0IdcKDWyHxu1sGtBSaxfVUNfr/view?usp=drivesdk", "duration": 211.178667, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\10.jpg", "segments": [{"start": 5.81, "end": 14.41, "text": "안녕하십니까. 경기도 김포시 정보통신과 행정정보팀장을 맡고 있는 이지은입니다.", "time": "00:05"}, {"start": 14.41, "end": 24.51, "text": "저는 2025년부터 2년간 AI를 행정에 활용하는 방법을 공부하는 자발적 학습조직을 운영해 왔습니다.", "time": "00:14"}, {"start": 24.51, "end": 28.61, "text": "운영하면서 반복적으로 겪은 문제가 있었는데요.", "time": "00:24"}, {"start": 28.61, "end": 35.81, "text": "외부 강사를 초빙에서 AI 교육을 들어도 실제 행정망에서 적용하려고 하면", "time": "00:28"}, {"start": 35.81, "end": 41.01, "text": "보안 정책의 저촉이 되거나 접속 자체가 되지 않는 경우가 많았습니다.", "time": "00:35"}, {"start": 41.01, "end": 46.21, "text": "배운 내용과 실제 업무 환경 사이에 이렇게 간극이 컸던 거죠.", "time": "00:41"}, {"start": 46.21, "end": 51.41, "text": "그러다 최근에 행암부가 범정부 AI 공통기반을 공개하고", "time": "00:46"}, {"start": 51.41, "end": 57.41, "text": "온 AI 그리고 정부 AI 실험실, 긴랩 활용 방법들을 접하게 되었고", "time": "00:51"}, {"start": 57.41, "end": 63.13, "text": "행정망에서 실제로 작동하는 도구라는 점에서 확신을 갖게 되었습니다.", "time": "00:57"}, {"start": 63.13, "end": 75.53, "text": "마침 저희 씨는 총목과 인재성장팀과 미래전략가에서 AI 교육을 기관 자체적으로 많이 진행을 하고 있었고", "time": "01:03"}, {"start": 75.53, "end": 81.53, "text": "인재성장팀에서는 산회강사 양성 정책을 함께 추진하게 되었는데요.", "time": "01:15"}, {"start": 81.53, "end": 89.27, "text": "저는 이 흐름 속에서 올해 8월 산의 강사 AI 활용 담당 감옥 강사로 위축되었습니다.", "time": "01:21"}, {"start": 89.27, "end": 98.47, "text": "이번 강사 양성 과정을 통해 행안부 표존 교환을 익혀서 제 역할을 체계화하고자 지원을 하게 되었습니다.", "time": "01:29"}, {"start": 98.47, "end": 104.46, "text": "기대하는 효과는 전 세 가지입니다.", "time": "01:38"}, {"start": 104.46, "end": 110.6, "text": "첫째, 대규모 기술제 교육만으로는 체육이 어려운 실무자, 실무 밀착형 실습,", "time": "01:44"}, {"start": 110.6, "end": 116.6, "text": "그리고 저연차 대상, 도구 개발, 실습의 공백을 산해 강사체제로 보완할 수 있습니다.", "time": "01:50"}, {"start": 116.6, "end": 122.3, "text": "그리고 둘째, 배운 내용과 실제 업무 환경 사이의 궤리를 해소할 수 있습니다.", "time": "01:56"}, {"start": 122.3, "end": 127.9, "text": "흉정망에서 실제로 작동하는 도구를 기준으로 교육하기 때문입니다.", "time": "02:02"}, {"start": 127.9, "end": 134.7, "text": "그리고 세 번째, 개인 학습 조직 활동을 이제 기관 정책안으로 편입시켜서", "time": "02:07"}, {"start": 134.7, "end": 138.4, "text": "지속 가능한 AI 교육체계로 이어갈 수 있습니다.", "time": "02:14"}, {"start": 138.4, "end": 144.94, "text": "저는 수류 후에는 두 가지 과정을 편성할 계획을 가지고 있습니다.", "time": "02:18"}, {"start": 144.94, "end": 150.76, "text": "신규 이명자 대상으로는 온 AI 에이전트를 활용한 문서 초안, 메일 봉지,", "time": "02:24"}, {"start": 150.76, "end": 157.0, "text": "요약 법령 비서를 활용하는 실습과 더불어 행정망에서 LLM을 활용해서", "time": "02:30"}, {"start": 157.0, "end": 160.2, "text": "엑셀 데이터를 안전하게 다루는 법을 가르치겠습니다.", "time": "02:37"}, {"start": 160.2, "end": 163.76, "text": "그리고 7급 이하 저연차 공망을 대상으로는", "time": "02:40"}, {"start": 163.76, "end": 167.12, "text": "김포시 AI 실험실을 부축했거든요.", "time": "02:43"}, {"start": 167.12, "end": 171.2, "text": "학습 조직에서 이 실험실 구조를 소개하면서", "time": "02:47"}, {"start": 171.2, "end": 175.64, "text": "바이브 코딩으로 간단하게 메모나 할리 랩 같은", "time": "02:51"}, {"start": 175.64, "end": 179.28, "text": "나만의 도구를 직접 만들어보는 실습을 진행해 보겠습니다.", "time": "02:55"}, {"start": 179.28, "end": 183.36, "text": "그리고 이후에는 AI 챔피언 역량 인증을 준비하는", "time": "02:59"}, {"start": 183.36, "end": 186.68, "text": "직원들에게 사전 멘토링을 이어가면서", "time": "03:03"}, {"start": 186.68, "end": 193.28, "text": "단발성 교육이 아닌 기관 전체의 AI 활용 문화로 확산시키겠습니다.", "time": "03:06"}, {"start": 193.28, "end": 199.24, "text": "2년간 학습 조직 운영 경험을 이제 기관의 정식 교육 체제 안에서", "time": "03:13"}, {"start": 199.24, "end": 204.76, "text": "신규자와 또 직원 모두에게 전달할 수 있는 계기로 삼을 수 있었으면 좋겠습니다.", "time": "03:19"}, {"start": 204.76, "end": 205.76, "text": "감사합니다.", "time": "03:24"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/10/1ySUWJOb0IdcKDWyHxu1sGtBSaxfVUNfr.mp4", "frame": "../영상장면/10.jpg", "quotes": [{"start": 14.41, "end": 24.51, "text": "저는 2025년부터 2년간 AI를 행정에 활용하는 방법을 공부하는 자발적 학습조직을 운영해 왔습니다.", "time": "00:14", "category": "자기주도 학습 관련 기재"}, {"start": 175.64, "end": 179.28, "text": "나  기획·개발하고, 합동 공공데이터 활용 AI 경진대회 대상을 수상하였습니다.", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_박정민(2차) .hwpx", "page": 1, "method": "HWP 본문 구역", "url": "https://drive.google.com/file/d/15RTlwJuTtrYimYpdmt6ceAmWqI7uN7ci/view?usp=drivesdk", "id": "15RTlwJuTtrYimYpdmt6ceAmWqI7uN7ci"}, {"text": "○ 공공데이터와 AI(Codex) 바이브코딩을 활용해 병역명문가·나라사랑가게·병무청 지정병원 등 분산된 정보를 한 곳에서 조회하는 지도 앱 「밀리맵」을 직접 기획·개발하고, 합동 공공데이터 활용 AI 경진대회 대상을 수상하였습니다. ○ AI 활용 시 업무 문제와 목표·조건을 구체화하고, 생성 결과를 검증·수정하는 반복 방식으로 활용합니다. 이를 바탕으로 문제정의 → 프롬프트 작성 →결과 검증 → 간단한 구현의 실습 흐름을 안내할 수 있습니다. ○ 특히 바이브 코딩 실습에서 학습자가 막히는 지점을 함께 확인하고 AI에 재질문하는 방법, 결과의 가변성과 검증 필요성, 행정업무의 개인정보·보안 유의사항을 안내할 수 있습니다.", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_박정민(2차) .hwpx", "page": 1, "method": "HWP 본문 구역", "url": "https://drive.google.com/file/d/15RTlwJuTtrYimYpdmt6ceAmWqI7uN7ci/view?usp=drivesdk", "id": "15RTlwJuTtrYimYpdmt6ceAmWqI7uN7ci"}], "강의·학습 지원 관련 기재": [{"text": "신규 지역인재 공무원 AI활용방법 멘토링 (1시간) 멘토링 ※ 기관 내·외부 강의, 교육 운영, 멘토링, 퍼실리테이션 등 교육 진행 이력을 기재합니다.", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_박정민(2차) .hwpx", "page": 1, "method": "HWP 본문 구역", "url": "https://drive.google.com/file/d/15RTlwJuTtrYimYpdmt6ceAmWqI7uN7ci/view?usp=drivesdk", "id": "15RTlwJuTtrYimYpdmt6ceAmWqI7uN7ci"}, {"text": "1) 강의 실적 및 경험 氠瑢 기간", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_박정민(2차) .hwpx", "page": 1, "method": "HWP 본문 구역", "url": "https://drive.google.com/file/d/15RTlwJuTtrYimYpdmt6ceAmWqI7uN7ci/view?usp=drivesdk", "id": "15RTlwJuTtrYimYpdmt6ceAmWqI7uN7ci"}, {"text": "지역인재 신규공무원 AI활용방법 멘토링 (지역인재 신규공무원) 멘토링(멘토) ※ 강의 실적을 기재. 실적이 없는 경우 공란으로 두고 계획 위주로 작성", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_박정민(2차) .hwpx", "page": 1, "method": "HWP 본문 구역", "url": "https://drive.google.com/file/d/15RTlwJuTtrYimYpdmt6ceAmWqI7uN7ci/view?usp=drivesdk", "id": "15RTlwJuTtrYimYpdmt6ceAmWqI7uN7ci"}], "기관 내 확산 계획 관련 기재": [{"text": "신규자 교육과 정 자치회 운영 지원, 교육생 의견 수렴·조율 및 소통 지원 (4주) 자치회 부회장(교육 운영 보조) 26. 6. 17.", "source": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서_박정민(2차) . "time": "00:10"}, {"start": 13.34, "end": 17.18, "text": "공직사회 내에서 AI에 대한 관심이 말 그대로 정말 뜨거웠죠.", "time": "00:13"}, {"start": 17.18, "end": 19.66, "text": "하지만 막상 현장을 들여다보면 어땠을까요?", "time": "00:17"}, {"start": 19.66, "end": 22.3, "text": "안타깝게도 세 가지 분명한 한계에 부딪혀 있었습니다.", "time": "00:19"}, {"start": 22.3, "end": 25.16, "text": "가장 큰 문제는 교육이 그저 단순한 도구 체험이나", "time": "00:22"}, {"start": 25.16, "end": 27.66, "text": "프럼프트 몇 줄 써보는 수준에 머물렀다는 겁니다.", "time": "00:25"}, {"start": 27.66, "end": 31.54, "text": "이러니 실질적인 행정 프로세스 혁신으로는 절대 이어질 수가 없었죠.", "time": "00:27"}, {"start": 31.54, "end": 34.34, "text": "게다가 교육 내용도 민간기업 예제 중심이다 보니까", "time": "00:31"}, {"start": 34.34, "end": 37.42, "text": "인천에 아주 복잡하고 실제적인 행정 데이터를 다루는 데는", "time": "00:34"}, {"start": 37.42, "end": 38.98, "text": "제약이 너무 많았습니다.", "time": "00:37"}, {"start": 38.98, "end": 41.94, "text": "마지막으로 외부 전문 강사에게 전적으로 위조나다 보니", "time": "00:38"}, {"start": 41.94, "end": 45.58, "text": "딱 교육이 끝나는 순간 지속적인 코칭이나 사후 연계가 완전히 끊어지는", "time": "00:41"}, {"start": 45.58, "end": 47.42, "text": "구조적인 맹점까지 있었습니다.", "time": "00:45"}, {"start": 47.42, "end": 50.74, "text": "자, 그래서 저희 인천광역 씨가 해답을 준비했습니다.", "time": "00:47"}, {"start": 50.74, "end": 53.18, "text": "2027년 행정안전부와 연계에서", "time": "00:50"}, {"start": 53.18, "end": 56.98, "text": "기관 맞춤형 AI 챔피언 양성 체계를 본격적으로 가동합니다.", "time": "00:53"}, {"start": 56.98, "end": 59.6, "text": "이제 단발성 교육은 과감이 벌이겠습니다.", "time": "00:56"}, {"start": 59.6, "end": 61.66, "text": "우리의 핵심적이고 구체적인 목표는", "time": "00:59"}, {"start": 61.66, "end": 65.2, "text": "연관 사계 기술을 운영해 총 120명의 공인된 AI 챔피언을", "time": "01:01"}, {"start": 65.2, "end": 67.46, "text": "아주 체계적으로 육성해내는 것입니다.", "time": "01:05"}, {"start": 67.46, "end": 69.7, "text": "이게 그저 선언으로만 끝나는 게 아닙니다.", "time": "01:07"}, {"start": 69.7, "end": 73.2, "text": "본청 정보와 담당관실이 든든하게 데이터와 예산을 지원하고", "time": "01:09"}, {"start": 73.2, "end": 76.74, "text": "저희 인재개발원의 탄탄한 교역 인프라를 하나로 결합할 겁니다.", "time": "01:13"}, {"start": 76.74, "end": 80.94, "text": "실무 공무원들을 대상으로 초급부터 중국까지 아주 세분화된 공식드래그를 마련해서", "time": "01:16"}, {"start": 80.94, "end": 84.9, "text": "업무 공백 없이 자연스럽게 현업에 녹아드는 체계적인 교육을 제공하겠습니다.", "time": "01:20"}, {"start": 84.9, "end": 87.3, "text": "커리큘론도 완전히 뜯어 고쳤습니다.", "time": "01:24"}, {"start": 87.3, "end": 91.5, "text": "예전처럼 강사가 앞에서 떠들고 끝나는 주입식 이제 아닙니다.", "time": "01:27"}, {"start": 91.5, "end": 94.5, "text": "먼저 사전 이러닝으로 탄탄하게 기초를 다지고요.", "time": "01:31"}, {"start": 94.5, "end": 98.74, "text": "그다음 이틀 동안 대면으로 아주 빡빡하게 집중실습을 진행합니다.", "time": "01:34"}, {"start": 98.74, "end": 102.14, "text": "그리고 최종적으로 행정안전부 CBT 역량 인증까지", "time": "01:38"}, {"start": 102.14, "end": 106.34, "text": "한 번에 쭉 이어지는 그야말로 원스톱 완결형 파이프라인으로 추진될 겁니다.", "time": "01:42"}, {"start": 106.34, "end": 110.14, "text": "특히 이번 교육이 진짜 실효성을 가지려면 어떻게 해야 할까요?", "time": "01:46"}, {"start": 110.14, "end": 114.22, "text": "맞습니다. 우리 지역의 현업 데이터를 직접 만져봐야죠.", "time": "01:50"}, {"start": 114.22, "end": 119.16, "text": "그래서 군과 구의 현안을 종합 분석하고 청년 복지 데이터를 정량 분석하며", "time": "01:54"}, {"start": 119.16, "end": 122.84, "text": "조례를 기반으로 한 자격 판별 단일 웹도구를 직접 제작해보는", "time": "01:59"}, {"start": 122.84, "end": 126.6, "text": "인천고유 행정 데이터 기반 3대 실습 시나리오를 잤습니다.", "time": "02:02"}, {"start": 126.6, "end": 130.44, "text": "현장에 바로 써먹을 수 있는 진짜 역량을 내재화시키는 거죠.", "time": "02:06"}, {"start": 130.44, "end": 132.84, "text": "자 이렇게 되면 어떤 변화가 찾아올까요?", "time": "02:10"}, {"start": 132.84, "end": 136.28, "text": "가장 놀랍고 직관적인 성과 하나를 먼저 말씀드리겠습니다.", "time": "02:12"}, {"start": 136.28, "end": 138.08, "text": "바로 50%입니다.", "time": "02:16"}, {"start": 138.08, "end": 141.68, "text": "매번 반복되던 골치 아픈 보고서 취압과 데이터 분석 업무", "time": "02:18"}, {"start": 141.68, "end": 145.38, "text": "이거 전부 자동화 시켜서 우리 직원들의 뺏기던 행정 업무 시간을", "time": "02:21"}, {"start": 145.38, "end": 147.18, "text": "절반 이상 확 줄여버리겠습니다.", "time": "02:25"}, {"start": 147.18, "end": 149.52, "text": "업무 시간만 줄어드는 게 아닙니다.", "time": "02:27"}, {"start": 149.52, "end": 152.86, "text": "우리 실무자가 직접 시민들이 쓰기 편한 경량 웹독을 만들어서", "time": "02:29"}, {"start": 152.86, "end": 155.76, "text": "배포하게 될 테니 결과적으로 시민들의 민원철이 되기", "time": "02:32"}, {"start": 155.76, "end": 158.02, "text": "시간도 획기적으로 줄어들게 됩니다.", "time": "02:35"}, {"start": 158.02, "end": 159.66, "text": "게다가 더 중요한 건요.", "time": "02:38"}, {"start": 159.66, "end": 163.86, "text": "이런 인천형 실습 교황과 문제은행을 전부 우리만의 자산으로 만든다는 겁니다.", "time": "02:39"}, {"start": 163.86, "end": 167.2, "text": "매년 낭비되던 외부 용역비 이제 확 줄일 수 있습니다.", "time": "02:43"}, {"start": 167.2, "end": 171.3, "text": "우리 지자체 스스로 굴러가는 완벽한 AI 교역 자립 생태계가 완성되는 거죠.", "time": "02:47"}, {"start": 171.68, "end": 176.24, "text": "이 거대한 계획을 현실로 만들기 위해 저는 아주 명확한 각오를 다지고 있습니다.", "time": "02:51"}, {"start": 176.24, "end": 180.2, "text": "저는 뒤에서 행정이나 챙기는 단순한 과정 운영자로 남지 않을 겁니다.", "time": "02:56"}, {"start": 180.2, "end": 182.04, "text": "이번 강사 양성 과정을 뼈대 삼아", "time": "03:00"}, {"start": 182.04, "end": 184.52, "text": "이 모든 과정을 이끄는 메인 퍼실리테이터이자", "time": "03:02"}, {"start": 184.52, "end": 188.8, "text": "인천시의 사내 코칭 총괄 강사로서 제가 직접 밟았고 나서겠습니다.", "time": "03:04"}, {"start": 188.8, "end": 191.52, "text": "평가위원 여러분께 확실한 수치로 약속드립니다.", "time": "03:08"}, {"start": 191.52, "end": 195.0, "text": "학습자 한 명 한 명 눈 높이에 맞춘 1대1 밀착 코칭을 통해", "time": "03:11"}, {"start": 195.0, "end": 198.88, "text": "수료율 95% 그리고 인증 취등률 80% 이상이라는", "time": "03:15"}, {"start": 198.88, "end": 201.28, "text": "놀라운 목표를 반드시 달성해 내겠습니다.", "time": "03:18"}, {"start": 201.28, "end": 203.04, "text": "자격증 땄다고 끝이 아닙니다.", "time": "03:21"}, {"start": 203.04, "end": 205.78, "text": "인증 후에도 산의 연구 모임의 멘토로 계속 남아서", "time": "03:23"}, {"start": 205.78, "end": 209.4, "text": "이게 진짜 행정 혁신으로 이어지도록 끝까지 책임지고 이끌겠습니다.", "time": "03:25"}, {"start": 209.4, "end": 210.96, "text": "자, 마무리하겠습니다.", "time": "03:29"}, {"start": 210.96, "end": 214.4, "text": "이번 실행계획은요, 그냥 유행하는 신기술 하나 드려오는 게 아닙니다.", "time": "03:30"}, {"start": 214.4, "end": 217.52, "text": "우리가 일하는 방식 그 자체를 완전히 뒤집는 혁신입니다.", "time": "03:34"}, {"start": 217.52, "end": 221.46, "text": "우리 인천이 공공부문 AI 대전 완에 가장 완벽하고 모범적인 선도 모델로", "time": "03:37"}, {"start": 221.46, "end": 224.52, "text": "웃뚝 설 수 있도록 제 모든 영향을 쏟아붓겠습니다.", "time": "03:41"}, {"start": 224.52, "end": 226.72, "text": "경청해주셔서 진심으로 감사합니다.", "time": "03:44"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/12/1THsOxTICB0m-4L3PvehGX0ur2RF8tbS8.mp4", "frame": "../영상장면/12.jpg", "quotes": [{"start": 203.04, "end": 205.78, "text": "인증 후에도 산의 연구 모임의 멘토로 계속 남아서", "time": "03:23", "category": "자기주도 학습 관련 기재"}, {"start": 110.14, "end": 114.22, "text": "맞습니다. 우리 지역의 현업 데이터를 직접 만져봐야죠.", "time": "01:50", "category": "AI 업무 활용 관련 기재"}, {"start": 184.52, "end": 188.8, "text": "인천시의 사내 코칭 총괄 강사로서 제가 직접 밟았고 나서겠습니다.", "time": "03:04", "category": "강의·학습 지원 관련 기재"}, {"start": 19.66, "end": 22.3, "text": "안타깝게도 세 가지 분명한 한계에 부딪혀 있었습니다.", "time": "00:19", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 12, "name": "안선기", "title": "AI챔피언 및 공공 AI역량 트랙 강사 양성 신청서(2차).pdf", "mime": "application/pdf", "bytes": 1760185, "downloaded": true, "url": "https://drive.google.com/file/d/1C0Pr3-Qem_IVEYbkHrXTCZqP5eCa6A7z/view?usp=drivesdk", "local": "../원본/12/1C0Pr3-Qem_IVEYbkHrXTCZqP5eCa6A7z.pdf", "id": "1C0Pr3-Qem_IVEYbkHrXTCZqP5eCa6A7z"}, {"n": 12, "name": "안선기", "title": "발표자료(2027_맞춤형_AI챔피언_실행계획_3분).mp4", "mime": "video/mp4", "bytes": 16214809, "downloaded": true, "url": "https://drive.google.com/file/d/1THsOxTICB0m-4L3PvehGX0ur2RF8tbS8/view?usp=drivesdk", "local": "../원본/12/1THsOxTICB0m-4L3PvehGX0ur2RF8tbS8.mp4", "id": "1THsOxTICB0m-4L3PvehGX0ur2RF8tbS8"}], "doc_count": 1, "media_count": 1}, {"n": 13, "original_no": 13, "row": 14, "name": "이승번", "org": "한국승강기안전공단", "folder_title": "13. 한국승강기안전공단_이승번", "folder_url": "https://drive.google.com/drive/folders/1e3zk042hbJsZU9Mx4ojqc6cY2mvzJ37v", "summary": "AI챔피언 그린 과정 이수와 내부 교육·멘토링 경험을 기재. AI 앰배서더 80명을 통한 단계별 교육 확산 및 자체 콘텐츠 운영을 계획함.", "evidence": {"자기주도 학습 관련 기재": [{"text": "⦁선수과목 → 지정 이러닝 → 집중수업 → 셀프스터디 → 수행평가의 표준 동선 완주(41시간) - (도구)", "source": "붙임 1. 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(hwp).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs/view?usp=drivesdk", "id": "1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs"}, {"text": "- 사전학습 집중수업 셀프스터디 수행평가 •AI 시대, 실전에서 통하는 A1 리터러시 단시간) • 인공지능시대를 말하다 (2시간)", "source": "붙임 2. 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(pdf).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1oCyn0040trFlZE1NDGvmvYYRvrUE1Fce/view?usp=drivesdk", "id": "1oCyn0040trFlZE1NDGvmvYYRvrUE1Fce"}], "AI 업무 활용 관련 기재": [{"text": "디지털리터러시 – ChatGPT를 활용한 업무 자동화 (7시간) 수료 □ AI·데이터 관련 자격증", "source": "붙임 1. 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(hwp).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs/view?usp=drivesdk", "id": "1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs"}, {"text": "2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 - (인증)", "source": "붙임 1. 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(hwp).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs/view?usp=drivesdk", "id": "1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs"}, {"text": "ChatGPT, Claude, Gemini를 업무에 병행 사용하며, - (실무 산출)", "source": "붙임 1. 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(hwp).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs/view?usp=drivesdk", "id": "1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs"}], "강의·학습 지원 관련 기재": [{"text": "1) 강의 실적 및 경험 기간 기관", "source": "붙임 1. 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(hwp).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs/view?usp=drivesdk", "id": "1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs"}, {"text": "일경험 수련생 및 체험형 인턴 직무 멘토링 멘토 5년 연속 수행 중", "source": "붙임 1. 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(hwp).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs/view?usp=drivesdk", "id": "1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs"}, {"text": "대집단 강의(90명), 2/view?usp=drivesdk", "duration": 251.648, "video": true, "audio": true, "method": "Whisper small 한국어 자동전사(내장 자막은 Sharing Started만 포함)", "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\13.jpg", "segments": [{"start": 7.54, "end": 12.64, "text": "안녕하십니까. 한국 승관계안정문단 AI전략실 이승번 과장입니다.", "time": "00:07"}, {"start": 12.64, "end": 18.94, "text": "지금부터 기관 AI 데이터 역량 강화 실행 계획에 대해서 말씀드리겠습니다.", "time": "00:12"}, {"start": 18.94, "end": 24.97, "text": "시작을 강렬하게 다소 도전적으로 문구잡아봤습니다.", "time": "00:18"}, {"start": 24.97, "end": 30.97, "text": "단 한 문장 교육 체계는 있다 하지만 콘텐츠가 없다입니다.", "time": "00:24"}, {"start": 30.97, "end": 38.47, "text": "네, 그렇습니다. 공단은 AI중용성을 격하게 실감하고 AI전략실을 올해 신설하였습니다.", "time": "00:30"}, {"start": 38.47, "end": 51.97, "text": "저는 여기서 직원들의 AI 활용 역량 상향 평준화를 위해서 AI 교육체계를 직무 중심으로 전 직원을 대상으로 8개 과정을 설계하였습니다.", "time": "00:38"}, {"start": 51.97, "end": 55.87, "text": "하지만 문제는 그 안을 채울 콘텐츠입니다.", "time": "00:51"}, {"start": 55.87, "end": 63.97, "text": "8개의 교육 과정 중에서 5개가 디지털 배움더, 디지털 윤리 또는 민간 업체의 자료입니다.", "time": "00:55"}, {"start": 63.97, "end": 68.17, "text": "그러다 보니 승관계 업무와의 연관성이 전혀 없습니다.", "time": "01:03"}, {"start": 68.17, "end": 73.67, "text": "또 지난 7월에는 민가업체가 강자를 가지고 있지 않다는 이유로", "time": "01:08"}, {"start": 73.67, "end": 79.67, "text": "커리클룸을 통째로 바꾸는 그런 상황도 벌어졌었습니다.", "time": "01:13"}, {"start": 79.67, "end": 84.67, "text": "즉 태울 콘텐츠도 운영할 사람도 없는 상태입니다.", "time": "01:19"}, {"start": 84.67, "end": 91.67, "text": "하지만 행정안전무 표준교안이 그 빈자리를 정확히 채워줄 것이로 생각합니다.", "time": "01:24"}, {"start": 91.67, "end": 95.17, "text": "검증된 콘텐츠를 무상으로 확보하고", "time": "01:31"}, {"start": 95.17, "end": 101.91, "text": "승간기 업무와 관련한 실습 시나리오만 우리 업무로 바꾸면 된다고 생각합니다.", "time": "01:35"}, {"start": 101.91, "end": 105.91, "text": "그렇다면 이제 남은 현안은 누가 운영하는지 아닙니다.", "time": "01:41"}, {"start": 105.91, "end": 111.91, "text": "이를 위해 확산 경로는 보시는 바와 같이 이미 전북에 펼쳐져 있습니다.", "time": "01:45"}, {"start": 111.91, "end": 121.41, "text": "공단 본부인 진주와 거창을 비롯해서 전국 53개 지역 사무소에 모두 80여 명의 AI 엠베스다가 위치해 있습니다.", "time": "01:51"}, {"start": 121.41, "end": 128.15, "text": "올해 10월 AI 엠베스더 80명으로 시작해서 내년 상반기 중에는", "time": "02:01"}, {"start": 128.15, "end": 132.35, "text": "1600여 명의 전 직원을 대상으로 교육을 확장하고", "time": "02:08"}, {"start": 132.35, "end": 141.17, "text": "또 하반기에는 AI 챔피언, 그린 과정, 블루 과정 인증으로 방점을 찍겠습니다.", "time": "02:12"}, {"start": 141.17, "end": 144.63, "text": "이를 통해서 기대 되는 효과 3가지는", "time": "02:21"}, {"start": 144.63, "end": 146.93, "text": "화면에 보시는 것 같이 순서대로 말씀드리겠습니다.", "time": "02:24"}, {"start": 146.93, "end": 149.89, "text": "첫 번째는 콘텐츠 자립입니다.", "time": "02:26"}, {"start": 149.89, "end": 154.99, "text": "더 이상 민간업체의 사정에 교육 커리클롬이 흔들리지 않겠습니다", "time": "02:29"}, {"start": 154.99, "end": 163.71, "text": "두 번째는 기술직, 현장검사원과 행정사무직의 AI 활용 수준 격차가 34점이었는데", "time": "02:34"}, {"start": 163.71, "end": 167.79, "text": "이를 줄어들일 수 있을 것으로 예상합니다", "time": "02:43"}, {"start": 167.79, "end": 177.35, "text": "그리고 마지막 세 번째는 내년 1월 공단만의 온프레미스 시스템인 AI 플랫폼 가칭 엘리아가 오픈됩니다", "time": "02:47"}, {"start": 177.35, "end": 184.35, "text": "이때 교육이 따라붙음으로써 현업 활용도가 극대화될 것이라고 기대하고 있습니다.", "time": "02:57"}, {"start": 184.35, "end": 192.69, "text": "그리고 마지막으로 내년도 예산 2,500여 만원은 이미 편성 완료되었습니다.", "time": "03:04"}, {"start": 192.69, "end": 200.49, "text": "저는 지난 7월 AI 챔피언 그린 종합과정을 수강하고 인증 또한 지득하였습니다.", "time": "03:12"}, {"start": 200.49, "end": 207.77, "text": "선수 감옥부터 수강하고 최종 수행 평가까지 표준 동선을 한걸음 한걸음 걸었습니다.", "time": "03:20"}, {"start": 207.77, "end": 212.75, "text": "또한 이사장님을 비롯한 경영진과 관리직 90명을 대상으로", "time": "03:27"}, {"start": 212.75, "end": 217.23, "text": "공단의 AI 과제에 대한 설명과 AI를 활용하며 있어서", "time": "03:32"}, {"start": 217.23, "end": 221.63, "text": "유의해야 할 기본적인 보안사항까지 강의하였습니다.", "time": "03:37"}, {"start": 221.63, "end": 225.35, "text": "이후로도 쉬지 않고 후속 교육이 있어야 되는데", "time": "03:41"}, {"start": 225.35, "end": 229.63, "text": "운영할 표준 컨텐츠가 없어서 멈춰있는 상태입니다.", "time": "03:45"}, {"start": 229.63, "end": 234.69, "text": "제가 학습자에서 진정한 공단의 퍼실리테이터로", "time": "03:49"}, {"start": 234.69, "end": 240.81, "text": "역할할 수 있도록 꼭 이 양성 과정을 수강할 수 있는 기회를 주시기를 바라며", "time": "03:54"}, {"start": 240.81, "end": 244.69, "text": "발표를 마치겠습니다. 감사합니다.", "time": "04:00"}], "technical_subtitle": "1\n00:00:00,000 --> 00:04:11,650\nSharing Started\n\n", "local": "../원본/13/14QhAX0gT-VJoU7PHq2KQBsKtaXVgtK42.mp4", "frame": "../영상장면/13.jpg", "quotes": [{"start": 217.23, "end": 221.63, "text": "유의해야 할 기본적인 보안사항까지 강의하였습니다.", "time": "03:37", "category": "강의·학습 지원 관련 기재"}, {"start": 55.87, "end": 63.97, "text": "8개의 교육 과정 중에서 5개가 디지털 배움더, 디지털 윤리 또는 민간 업체의 자료입니다.", "time": "00:55", "category": "기관 내 확산 계획 관련 기재"}, {"start": 91.67, "end": 95.17, "text": "검증된 콘텐츠를 무상으로 확보하고", "time": "01:31", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 13, "name": "이승번", "title": "붙임 1. 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(hwp).hwpx", "mime": "application/haansofthwpx", "bytes": 100758, "downloaded": true, "url": "https://drive.google.com/file/d/1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs/view?usp=drivesdk", "local": "../원본/13/1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs.hwpx", "id": "1OjvfNbTSMGIPy74JTunqtrUvYyTXbiWs"}, {"n": 13, "name": "이승번", "title": "붙임 2. 2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서(pdf).pdf", "mime": "application/pdf", "bytes": 3957800, "downloaded": true, "url": "https://drive.google.com/file/d/1oCyn0040trFlZE1NDGvmvYYRvrUE1Fce/view?usp=drivesdk", "local": "../원본/13/1oCyn0040trFlZE1NDGvmvYYRvrUE1Fce.pdf", "id": "1oCyn0040trFlZE1NDGvmvYYRvrUE1Fce"}, {"n": 13, "name": "이승번", "title": "붙임 3. 한국승강기안전공단 AI·데이터 역량강화 실행계획 발표 영상.mp4", "mime": "video/mp4", "bytes": 5051243, "downloaded": true, "url": "https://drive.google.com/file/d/14QhAX0gT-VJoU7PHq2KQBsKtaXVgtK42/view?usp=drivesdk", "local": "../원본/13/14QhAX0gT-VJoU7PHq2KQBsKtaXVgtK42.mp4", "id": "14QhAX0gT-VJoU7PHq2KQBsKtaXVgtK42"}], "doc_count": 2, "media_count": 1}, {"n": 14, "original_no": 14, "row": 15, "name": "현광남", "org": "제주특별자치도 서귀포시", "folder_title": "14. 제주 특별자치도 서귀포시_현광남", "folder_url": "https://drive.google.com/dr 1, "end": 9.11, "text": "안녕하세요. 저는 AI 챔피언 빅 공공 AI 역량 강사에 지원하게 된 끄기꽃 시정에 공부하고 있는 디지털 운영진자, 칸광북남입니다.", "time": "00:00"}, {"start": 9.11, "end": 15.11, "text": "저희 성인꽃 시에서는 원래 1월부터 공직자 AI 활용 교육을 진행해 왔습니다.", "time": "00:09"}, {"start": 15.11, "end": 18.11, "text": "그 과정에서 여러 가지 제약사항을 발견했습니다.", "time": "00:15"}, {"start": 18.11, "end": 25.11, "text": "첫째, 지지적 제약입니다. 성인꽃 시에서 도의지약이나 제주시에서 진행되는 교육에 참여하는데,", "time": "00:18"}, {"start": 25.11, "end": 28.11, "text": "시간적 경제적 제한이 많습니다.", "time": "00:25"}, {"start": 28.11, "end": 32.69, "text": "이로 인해 직원단의 영향도 많은 격차가 나는 상황입니다.", "time": "00:28"}, {"start": 32.69, "end": 35.25, "text": "뿐만 아니라", "time": "00:32"}, {"start": 35.25, "end": 39.21, "text": "배우광사를 활용한 교육은 배원 것과 실제 업무 시곤", "time": "00:35"}, {"start": 39.21, "end": 42.29, "text": "사회가 동결되어 있지 않는 경우가 많습니다.", "time": "00:39"}, {"start": 42.29, "end": 45.69, "text": "마지막으로 문연동 사업소 직원의 접근성입니다.", "time": "00:42"}, {"start": 45.69, "end": 47.79, "text": "혁인 분시 전체가 넓게 흡화져 있어", "time": "00:45"}, {"start": 47.79, "end": 51.85, "text": "본정 깊합 교육만으로는 현장 직원에게 닿지 않습니다.", "time": "00:47"}, {"start": 51.85, "end": 54.59, "text": "여기에 개인정보 유출 우려로 아예 사용하지 않는", "time": "00:51"}, {"start": 54.59, "end": 57.79, "text": "소혹적 배원관이 겹쳐 있습니다.", "time": "00:54"}, {"start": 57.79, "end": 64.13, "text": "이 문제를 해결하기 위해 저희는 데려오는 교육이 아니라 안에서 연구교육을 진행하고자 합니다.", "time": "00:57"}, {"start": 64.13, "end": 72.05, "text": "전 직원을 대상으로 한 기본 교육과 부서별 AI 담당자를 지지하여 일부서비일 담당자 체계를 만듭니다.", "time": "01:04"}, {"start": 72.05, "end": 78.25, "text": "AI 챔피언 글린 블루인진 취급자를 위한 멘트림을 실시해 나가겠습니다.", "time": "01:12"}, {"start": 78.25, "end": 83.25, "text": "운영 방식은 주 1일에 정례 교육과 공기별 집합 교육으로 전문가를 향상하고", "time": "01:18"}, {"start": 83.25, "end": 89.43, "text": "운면동 손해 교육을 통해서 한 잔까지 기척 찾아가도록 하겠습니다.", "time": "01:23"}, {"start": 89.43, "end": 93.01, "text": "예를 들을 위해 석잇뽓이의 업무로 교환을 재고상하고", "time": "01:29"}, {"start": 93.01, "end": 99.49, "text": "일부사 여유가자를 통해 교육위수감, 목적이 아닌 업무 개선으로 이어주신 도록 하겠습니다.", "time": "01:33"}, {"start": 99.49, "end": 103.93, "text": "또한 모든 과정의 개인정보, 보안위의사항을 필수모두를 판단하여", "time": "01:39"}, {"start": 103.93, "end": 109.05, "text": "기관 자체, AI 아이드라인을 함께 마련하겠습니다.", "time": "01:43"}, {"start": 109.05, "end": 114.91, "text": "이를 통해 흑인꽃이 직원의 AI염령 학대와 업무 효과를 위로하내겠습니다.", "time": "01:49"}, {"start": 114.91, "end": 121.35, "text": "또한 외국 관계사에 여전하지 않고 필요할 때 즉시 교육할 수 있는 자리적 운영체기를 마련하고", "time": "01:54"}, {"start": 121.35, "end": 127.58, "text": "축적된 맞축면 교환은 제주도와 다른 행정 시에도 고민하겠습니다.", "time": "02:01"}, {"start": 127.58, "end": 132.3, "text": "저는 AI염무를 담당하는 디지털운전 운영진장으로써 교육을 기획하고", "time": "02:07"}, {"start": 132.3, "end": 137.46, "text": "계산과 일정을 현상에 실행까지 책임질 수 있는 위치에 있습니다.", "time": "02:12"}, {"start": 137.46, "end": 140.34, "text": "MG세대와 비교해서 조건을 많이 냈습니다.", "time": "02:17"}, {"start": 140.34, "end": 146.5, "text": "하지만 일을 보완하기 위해 공공예의, 아예 영양 트랙과 목을 모두 이수는 바였고", "time": "02:20"}, {"start": 146.5, "end": 150.58, "text": "AI 챔피언 브린 종합과정을 쓰러했습니다.", "time": "02:26"}, {"start": 150.58, "end": 153.5, "text": "정보 판민다 교사 자격증을 보유하고 있습니다.", "time": "02:30"}, {"start": 153.5, "end": 156.78, "text": "개인정보 보호, 감사 활동을 동의한 만큼", "time": "02:33"}, {"start": 156.78, "end": 160.94, "text": "반전한 AI 활용까지 함께 주단할 수 있습니다.", "time": "02:36"}, {"start": 160.94, "end": 164.7, "text": "허기포시는 외국 의혹을 찾아가기 어려운 만큼", "time": "02:40"}, {"start": 164.7, "end": 168.7, "text": "안에서 가르칠 사람이 반드시 필요합니다.", "time": "02:44"}, {"start": 168.7, "end": 171.1, "text": "제가 의혹을 맡겠습니다. 감사합니다.", "time": "02:48"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/14/1xNfb3KAkUCIwH9Vi_OizLnfxnPPdv5Mo.mp4", "frame": "../영상장면/14.jpg", "quotes": [{"start": 9.11, "end": 15.11, "text": "저희 성인꽃 시에서는 원래 1월부터 공직자 AI 활용 교육을 진행해 왔습니다.", "time": "00:09", "category": "강의·학습 지원 관련 기재"}, {"start": 99.49, "end": 103.93, "text": "또한 모든 과정의 개인정보, 보안위의사항을 필수모두를 판단하여", "time": "01:39", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 14, "name": "현광남", "title": "2026년 강사 양성과정 교육 신청서 제출.pdf", "mime": "application/pdf", "bytes": 13 .75, "end": 58.52, "text": "화려한 이론 강사가 아니라 내 행정서식을 함께 열어보고 다뤄줄 내부 안내자가 필요하다는 것이었습니다.", "time": "00:48"}, {"start": 58.52, "end": 63.04, "text": "제가 교육을 진행하면서 부딪힌 벽은 크게 세 가지였습니다.", "time": "00:58"}, {"start": 63.04, "end": 71.6, "text": "첫째, 외부 AI 강사를 섭외하는데 한 달 정도 걸렸고 시간당 최소 20만원을 줘야 했습니다.", "time": "01:03"}, {"start": 71.6, "end": 75.2, "text": "둘째, 정작 그분들은 우리 공문서 서식도", "time": "01:11"}, {"start": 75.2, "end": 80.6, "text": "데이터 보안 규정도 자세히 몰라서 일반적인 이름만 반복이 되었습니다", "time": "01:15"}, {"start": 80.6, "end": 87.12, "text": "그리고 마지막으로 정부 핵심 정책인 AI 챔피언 제도도 직원들에게는 여전히 먼 이야기였습니다", "time": "01:20"}, {"start": 87.12, "end": 90.08, "text": "그래서 답은 명확해졌습니다", "time": "01:27"}, {"start": 90.08, "end": 93.08, "text": "우리가 행정을 잘 아는 내부 퍼실리테이터가", "time": "01:30"}, {"start": 93.08, "end": 98.08, "text": "100% 실습 교육으로 AI 챔피언 제도와 시정을 연결하는 것", "time": "01:33"}, {"start": 98.08, "end": 103.11, "text": "이것이 제가 생각한 해법이었습니다", "time": "01:38"}, {"start": 103.11, "end": 110.11, "text": "그래서 우선 저는 행안부 AI 챔피언 온라인 교육을 안양시 시정에 가장 먼저 녹여냈습니다.", "time": "01:43"}, {"start": 110.11, "end": 117.75, "text": "전직원 대상 온라인 사전 학습을 시정 교육과 연결해 현재까지 1231명이 수료했고", "time": "01:50"}, {"start": 117.75, "end": 123.31, "text": "이 이수유를 부서평가 지표에 직접 반영하는 우수 부서 제도를 신설했습니다.", "time": "01:57"}, {"start": 123.31, "end": 126.67, "text": "그러자 전 부서가 자발적으로 움직이기 시작했는데요.", "time": "02:03"}, {"start": 126.67, "end": 135.93, "text": "대규모 3번의 컴퍼런스와 실습 아카데미까지 세 단계 교육으로 지금까지 3344명이 수료했습니다.", "time": "02:06"}, {"start": 135.93, "end": 144.87, "text": "이론에 그치지 않고 제도를 인사 평가 시스템에 실제로 심었다는 점이 핵심입니다.", "time": "02:15"}, {"start": 144.87, "end": 152.25, "text": "저는 부서가 함께 움직이고 직원 한 사람 한 사람의 AI 활용 능력을 마음껏 표출시키고자", "time": "02:24"}, {"start": 152.25, "end": 159.21, "text": "스마트 아냥 AI 업무 혁신과 전 직원 AI 활용 경진내를 직접 기획했습니다.", "time": "02:32"}, {"start": 159.21, "end": 162.13, "text": "그 결과 숫자로 나타났는데요.", "time": "02:39"}, {"start": 162.13, "end": 169.33, "text": "업무 사례 기준으로 252분 걸리던 업무가 45분으로 82% 줄어들었습니다.", "time": "02:42"}, {"start": 169.33, "end": 178.09, "text": "또한 114개의 전부서가 자발적으로 참여했고 124건에 개선 사례를 발굴했습니다.", "time": "02:49"}, {"start": 178.09, "end": 183.77, "text": "시키는 교육이 아니라 부서와 개인이 스스로 참여하도록 판을 설겠다는 것", "time": "02:58"}, {"start": 183.77, "end": 188.24, "text": "그것이 이 성과의 진짜 의미입니다", "time": "03:03"}, {"start": 188.24, "end": 192.9, "text": "이렇게 다양하게 언론 보도까지 나게 되었습니다", "time": "03:08"}, {"start": 192.9, "end": 194.98, "text": "그리고 저는 말로만 하지 않았습니다", "time": "03:12"}, {"start": 194.98, "end": 198.02, "text": "담당자인 제가 먼저 증명을 했는데요", "time": "03:14"}, {"start": 198.02, "end": 201.44, "text": "직원들에게 권하기 전에 제가 먼저 시험을 보고", "time": "03:18"}, {"start": 201.44, "end": 205.34, "text": "에이스 어섀시에이트 자격증을 취득했고", "time": "03:21"}, {"start": 205.34, "end": 209.68, "text": "행안부 AI 챔피언 블루 자격증도 곧 취득을 앞두고 있습니다.", "time": "03:25"}, {"start": 209.68, "end": 217.12, "text": "공직 10년 노하우의 정보통신공학학사와 방송통신 직렬이라는 IT 전문성을 더했습니다.", "time": "03:29"}, {"start": 217.12, "end": 222.32, "text": "특히 2026년 행안부 AI 해커톤에서는 팀 아냥시그놀로", "time": "03:37"}, {"start": 222.32, "end": 227.14, "text": "전국 공직자와 경쟁에 본선에 올랐고 본선에선 바이브 코딩으로", "time": "03:42"}, {"start": 227.14, "end": 233.74, "text": "어르신 복지 혜택을 찾아주는 앱도 직접 개발하게 되었습니다.", "time": "03:47"}, {"start": 233.74, "end": 240.97, "text": "행정을 아는 기획자가 직접 만드는 서비스 그게 제 장점입니다.", "time": "03:53"}, {"start": 240.97, "end": 244.97, "text": "이렇게 증빙 자료도 보실 수 있습니다.", "time": "04:00"}, {"start": 244.97, "end": 247.97, "text": "그리고 이미 가르칠 준비도 이미 되어 있는데요.", "time": "04:04"}, {"start": 247.97, "end": 254.97, "text": "저는 최근 생성형 AI 실무 활용 분야 산해 강사 안양 1%로 공식 선발이 되었고", "time": "04:07"}, {"start": 254.97, "end": 259.81, "text": "안양시 스마트 도시 통합센터에서 수십회에 대해 브리핑을 하며", "time": "04:14"}, {"start": 259.81, "end": 263.57, "text": "어려운 기술을 눈 높이에 맞춰 전달에 왔습니다.", "time": "04:19"}, {"start": 263.57, "end": 273.6, "text": "또한 AI 특화 교육장을 계획부터 예산, 공사까지 직접 추진해 고성능 노트북 인프라까지 완비했습니다.", "time": "04:23"}, {"start": 273.6, "end": 279.14, "text": "그리고 제가 선택한 트랙2 표준 교환은 그 안양시 실물을 더했는데요.", "time": "04:33"}, {"start": 279.14, "end": 284.86, "text": "엑셀 데이터 분석과 자동 연산, 그리고 내 업무 진단을 통한 옥히조,", "time": "04:39"}, {"start": 284.86, "end": 288.26, "text": "그리고 노크코드, 에이전트 보트 제작까지", "time": "04:44"}, {"start": 288.26, "end": 296.46, "text": "모두 우리 시의 실제 AI 업무 개선 사례와 경진대의 우수 사례를 그대로 가져와 실습하도록 하겠습니다.", "time": "04:48"}, {"start": 296.46, "end": 303.94, "text": "마지막, 명량 인증 대비반에서는 그린 블루 인증 모의 평가와 1대1 투터링을 통해서", "time": "04:56"}, {"start": 303.94, "end": 308.1, "text": "20명 이상의 인증 취급자를 배출하도록 하겠습니다.", "time": "05:03"}, {"start": 308.1, "end": 313.91, "text": "전 가정은 100% 실습으로 진행하고자 합니다.", "time": "05:08"}, {"start": 313.91, "end": 315.91, "text": "실행 로드맵은 4단계입니다.", "time": "05:13"}, {"start": 315.91, "end": 318.75, "text": "먼저 제 2회 경진대회야", "time": "05:15"}, {"start": 318.75, "end": 325.71, "text": "그 AI 동아리로 학습 분위기를 만들고 10명의 소수정의 집중반을 통해서", "time": "05:18"}, {"start": 325.71, "end": 328.43, "text": "10월 4회 운영하고자 합니다.", "time": "05:25"}, {"start": 328.43, "end": 331.35, "text": "그렇게 그린 블루 인증자를 배출하고", "time": "05:28"}, {"start": 331.35, "end": 337.63, "text": "마지막엔 부서평가 가점으로 연결해 우수 부서의 0.5점을 부여하도록 하겠습니다.", "time": "05:31"}, {"start": 337.63, "end": 343.07, "text": "배우는 것이 자격과 평가로 이어지는 선순환입니다.", "time": "05:37"}, {"start": 343.07, "end": 348.59, "text": "마지막으로 저는 강의가 좋았다는 후기로 끝내고 싶지 않습니다.", "time": "05:43"}, {"start": 348.59, "end": 357.07, "text": "10명의 소수, 정해, 그리고 인증치득 20명 이상, 그리고 1인당 최소 한 건의 실제 업무 개선", "time": "05:48"}, {"start": 357.07, "end": 360.55, "text": "이 약속을 반드시 숫자로 지키겠습니다.", "time": "05:57"}, {"start": 360.55, "end": 369.35, "text": "비싼 외부 AI 강의 대신 동료의 일을 실제로 바꾸는 00AI 실무 파실리테이터가 되겠습니다.", "time": "06:00"}, {"start": 369.35, "end": 373.43, "text": "안녕히 계세요. 오세인 주무관 이었습니다. 감사합니다.", "time": "06:09"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/16/1pmT-jsBS1UYyMZSVMPbZGVeFL6tUTUmZ.mp4", "frame": "../영상장면/16.jpg", "quotes": [{"start": 152.25, "end": 159.21, "text": "스마트 아냥 AI 업무 혁신과 전 직원 AI 활용 경진내를 직접 기획했습니다.", "time": "02:32", "category": "AI 업무 활용 관련 기재"}, {"start": 58.52, "end": 63.04, "text": "제가 교육을 10RZWpt3SM06bRFvP4vKMxh3VFXkXwYJ/view?usp=drivesdk", "id": "110RZWpt3SM06bRFvP4vKMxh3VFXkXwYJ"}, {"text": "직관적 이해 · 단순 조건문(IF-THEN) 기기의 한계 지적 · 실제 추론형 AI를 판별하는 기준점 확보 확보 · AI는 '내가 듣고 싶은 답을 찾아주는 기계'임을 · 텍스트 입력이 결과물에 영향을 미침을 증명하여", "source": "(증빙자료)강의계획안_AI에 상상력 더하기 (청년센터 강의용).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/110RZWpt3SM06bRFvP4vKMxh3VFXkXwYJ/view?usp=drivesdk", "id": "110RZWpt3SM06bRFvP4vKMxh3VFXkXwYJ"}]}, "media": [{"n": 17, "id": "1gWqndHdGirw8sQ4j9xlL92ocAvwTDw1Q", "file": "지원영상.mp4", "url": "https://drive.google.com/file/d/1gWqndHdGirw8sQ4j9xlL92ocAvwTDw1Q/view?usp=drivesdk", "duration": 184.767, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\17.jpg", "segments": [{"start": 1.01, "end": 8.75, "text": "네, 안녕하십니까. 이번 강사 양성과정에 지원한 제주도청의 신주영이라고 합니다.", "time": "00:01"}, {"start": 8.75, "end": 14.53, "text": "현재 우리 도에서는 AI에게 많은 AI 교육들을 진행하고 있습니다.", "time": "00:08"}, {"start": 14.53, "end": 18.31, "text": "다 지자체도 마찬가지일 거라고 생각해요.", "time": "00:14"}, {"start": 18.31, "end": 21.51, "text": "저도 이걸 들으면서 많은 것들을 배우는데요.", "time": "00:18"}, {"start": 21.51, "end": 27.55, "text": "그 외부 AI 강사분들의 강의를 듣게 되면 그 지식의 수준은 정말 높지만", "time": "00:21"}, {"start": 27.55, "end": 37.31, "text": "행정에서 원하는 바가 무엇인가를 이해하는 데는 아무래도 조금은 이해도가 떨어지신다는 생각이 들더라고요.", "time": "00:27"}, {"start": 37.31, "end": 43.47, "text": "단적인 예로 행정에서 가장 원하는 것은 무엇보다도 효율적인 공룬서 자성이겠죠.", "time": "00:37"}, {"start": 43.47, "end": 50.55, "text": "두 번째는 정돈되지 않은 Excel 파일들을 가지러니 보기 좋게 정리하는 거일 겁니다.", "time": "00:43"}, {"start": 50.55, "end": 58.11, "text": "더해에 과업 지시서 같은 거 나갈 때도 한 번 AI를 통해서 일상으로 번역을 하고", "time": "00:50"}, {"start": 58.11, "end": 69.83, "text": "이것을 살펴본 후에 뭔가 용역을 준다거나 하면 좋겠다는 생각이 강인들을 들으면서 많이 들더라고요.", "time": "00:58"}, {"start": 69.83, "end": 74.59, "text": "이런 점 때문에 아무리 뛰어난 외부 강사들이 있다고 하더라도", "time": "01:09"}, {"start": 74.59, "end": 85.03, "text": "실제로 실무해서 필요한 영역이 무엇인지에 대해서 아는 내부 AI 강사가 반드시 필요하다고 저는 생각합니다.", "time": "01:14"}, {"start": 85.03, "end": 91.15, "text": "저는 현재 제주에서는 수출 지원 업무를 담당하고 있는 실무자고요.", "time": "01:25"}, {"start": 91.15, "end": 97.75, "text": "동시에 AI를 통해서 문제 해결을 해나가는 AI 설계자이기도 하고", "time": "01:31"}, {"start": 97.75, "end": 102.63, "text": "국어 교육을 전공한 교육전공자이기도 합니다.", "time": "01:37"}, {"start": 102.63, "end": 108.71, "text": "만약 제가 이 과정에 선발된다면 행정안전부의 표준 교환과", "time": "01:42"}, {"start": 108.71, "end": 116.55, "text": "제주의 실모를 적용해서 교육과정을 편성하고 운영해 보고 싶은 마음이 있습니다.", "time": "01:48"}, {"start": 116.55, "end": 123.19, "text": "처음부터는 당연히 AI 입문자 과정이 우선이 되어야 되겠죠?", "time": "01:56"}, {"start": 123.19, "end": 128.11, "text": "여기서는 AI의 가동원리를 안내하고", "time": "02:03"}, {"start": 128.11, "end": 134.87, "text": "제가 아까 말씀드렸던 행정 업무의 필요한 AI 업무들에 대해서 알려드릴 거고요.", "time": "02:08"}, {"start": 134.87, "end": 140.11, "text": "더 나아가서는 AI를 활용한 타당성 검증이라던가", "time": "02:14"}, {"start": 140.11, "end": 148.79, "text": "문제 해결을 할 때 있어서 AI를 적극적으로 활용하는 방법들에 대해서도 한번 안내를 해보고 싶습니다.", "time": "02:20"}, {"start": 148.79, "end": 156.67, "text": "더 나아가 부서에 분명 AI를 잘 쓰시는 직원분들이 많이 계실 거라고 생각합니다.", "time": "02:28"}, {"start": 156.67, "end": 161.43, "text": "저는 교육을 통해 이분들을 발굴해서 네트워크를 형성하고요.", "time": "02:36"}, {"start": 161.43, "end": 167.47, "text": "이분들을 또 행정안정부의 AI 챔피언 제도로 좀 안내를 해서", "time": "02:41"}, {"start": 167.47, "end": 176.47, "text": "도의 자생적이고, 그리고 건강한 AI 제도가 정착될 수 있도록 하는데 기여하고 싶습니다.", "time": "02:47"}, {"start": 176.47, "end": 178.47, "text": "긴말 들어주셔서 감사합니다.", "time": "02:56"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/17/1gWqndHdGirw8sQ4j9xlL92ocAvwTDw1Q.mp4", "frame": "../영상장면/17.jpg", "quotes": [{"start": 108.71, "end": 116.55, "text": "제주의 실모를 적용해서 교육과정을 편성하고 운영해 보고 싶은 마음이 있습니다.", "time": "01:48", "category": "기관 내 확산 계획 관련 기재"}, {"start": 134.87, "end": 140.11, "text": "더 나아가서는 AI를 활용한 타당성 검증이라던가", "time": "02:14", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 17, "name": "신주영", "title": "(증빙자료)강의계획안_AI에 자기주도 학습 관련 기재": [], "AI 업무 활용 관련 기재": [{"text": "口 트랙2(AI융합) : @ 노코드 데이터분석 ㉭ 시 행정 융합 기획 ㉭ 노코드 시 서비스 구현 口 트랙3(AI개발) : 데이터분석 심화 ㉭ 바이브 코딩 ※ 강사 양성 과정은 담당 트랙 1개를 선정하여 해당 교안을 사전 검토 후 참여합니다.", "source": "강사양성과정신청서(김민희).pdf", "page": 1, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0/view?usp=drivesdk", "id": "1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0"}, {"text": "Gemini 사용법 및 활용 AI 챔피언(그린) 문제 풀이 주요업무", "source": "강사양성과정신청서(김민희).pdf", "page": 1, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0/view?usp=drivesdk", "id": "1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0"}, {"text": "Gemini 사용법 및 활용 AI 챔피언(그린) 문제 풀이 역할", "source": "강사양성과정신청서(김민희).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0/view?usp=drivesdk", "id": "1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0"}], "강의·학습 지원 관련 기재": [{"text": "1) 강의 실적 및 경험 기간 20262.23.", "source": "강사양성과정신청서(김민희).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0/view?usp=drivesdk", "id": "1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0"}, {"text": "- 생성형 인공지능 활용 노하우 공유 및 교내 업무 분아별 AI활용 능력 향상 교육을 진행하며 각 업무별 보안 관련 정보(데이터) 확보, 보안 취약점 분석 후 가이드라인 자제 제작으로 기관 보안관리 및 저작권 등 생성형 인공지능 활용뿐만 아니라 기관 보안을 고러한 업무 추진", "source": "강사양성과정신청서(김민희).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0/view?usp=drivesdk", "id": "1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0"}], "기관 내 확산 계획 관련 기재": [{"text": "공유하는 모임입니다. 동호회 내에서 각 회원의 관련 정보 공유 시 단순한 검색 방식이 아닌 활용의 심화가 더 해진 경우 학교가 보유한 전산실 자원을 활용하여. 실습의 기회도 가지고 AI 챔피언 문제 유형과 같은 업무에 적용할 수 있는 시간을 정기석으로 가지고 있습니다", "source": "강사양성과정신청서(김민희).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0/view?usp=drivesdk", "id": "1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0"}, {"text": "현행학(유지를 위한) 프롬프트 개발로 부서원들과 공유하는 피실己1데이터로 활동 - 교직원 대상으로 분기 1회 이상 또는 신규자(전입자) 대상 수시 실습 추진 - 업무 자동화 개발 후 유지관리를 위한 각 담당자 마크 교육", "source": "강사양성과정신청서(김민희).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0/view?usp=drivesdk", "id": "1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0"}, {"text": "- 교직원 대상으로 분기 1회 이상 또는 신규자(전입자) 대상 수시 실습 추진 - 업무 자동화 개발 후 유지관리를 위한 각 담당자 마크 교육", "source": "강사양성과정신청서(김민희).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0/view?usp=drivesdk", "id": "1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0"}], "과정·이유·검증 설명 관련 기재": [{"text": "실현 가능한 계획을 제시해 주십시오 운영의 구제상실현 기능통획산 효과 등을 종합 심사합니다. 1) 기관 자체 교육 운영 실적 기간", "source": "강사양성과정신청서(김민희).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0/view?usp=drivesdk", "id": "1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0"}]}, "media": [{"n": 18, "id": "1QX_jfo2WpEe_PCjWzDWkc_-e1RLznmhs", "file": "20260909_160457.mp4", "url": "https://drive.google.com/file/d/1QX_jfo2WpEe_PCjWzDWkc_-e1RLznmhs/view?usp=drivesdk", "duration": 179.8992, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\18.jpg", "segments": [{"start": 0.0, "end": 6.0, "text": "안녕하십니까 AI 활용 강사 양성과정에 지원한 김민희입니다.", "time": "00:00"}, {"start": 6.0, "end": 10.68, "text": "오늘 저는 저희 기간의 업무 현장에서 치감한 문제점을 바탕으로", "time": "00:06"}, {"start": 10.68, "end": 17.68, "text": "인공지능과 데이터 역량을 현실적으로 강화하기 위한 시랜 계획을 말씀드리고자 합니다.", "time": "00:10"}, {"start": 17.68, "end": 20.64, "text": "현재 문제점을 말씀드리겠습니다.", "time": "00:17"}, {"start": 20.64, "end": 25.6, "text": "많은 직원들이 생성형 AI의 필요성에는 많이 공감하고 있는데요.", "time": "00:20"}, {"start": 25.6, "end": 34.36, "text": "하지만 실제 업무 현장에서는 심리적 진입 정병에 높다 보니 AI를 활용하는 데 두려움이 많이 있습니다.", "time": "00:25"}, {"start": 34.36, "end": 43.04, "text": "결국 반복적인 공무초환 작성이라든지 자료의 요약, 서식 만들기 등 이런 부분에 많은 시간을 쏟고 있고", "time": "00:34"}, {"start": 43.04, "end": 52.24, "text": "저희 부서 내에서도 개인의 관심도에 따라서 디지털 활용 격차가 상당히 벌어지고 있는 것이 보여지고 있습니다.", "time": "00:43"}, {"start": 52.24, "end": 57.92, "text": "두 번째는 그 문제점에 대해서 해결 방안을 말씀드리고 싶은데요.", "time": "00:52"}, {"start": 57.92, "end": 63.68, "text": "어렵게 기술을 어떻게 활용한다라고 하면 교직원들도 그렇고 일반인들도", "time": "00:57"}, {"start": 63.68, "end": 66.0, "text": "적근하게 어려움이 있을 텐데요.", "time": "01:03"}, {"start": 66.0, "end": 72.84, "text": "당장 내일이라도 업무에 적용할 수 있게끔 실무 밀착형 기초 교육을 하고 싶습니다.", "time": "01:06"}, {"start": 72.84, "end": 78.76, "text": "가장 많이 보급되어 있는 챗 GPT라든지 재미나이 같은 도구를 활용해서", "time": "01:12"}, {"start": 78.76, "end": 86.0, "text": "업무 맥락을 어떤 식으로 시작해야 되는지 기초 프론프트를 넣는 방법부터 시작하고자 하는데요.", "time": "01:18"}, {"start": 86.0, "end": 94.2, "text": "자주 저희 기간에서 쓰는 행사 안내문만들기, 공문서 초안 만들기, 그리고 교육생을 위한 안내문만들기 등", "time": "01:26"}, {"start": 94.2, "end": 101.76, "text": "실제 행정 업무 사례를 중심으로 15명 내외에 소규모 실습을 하고자 합니다.", "time": "01:34"}, {"start": 101.76, "end": 107.72, "text": "그리고 직원들이 언제든지 꺼내 쓸 수 있도록 자주 쓰는 업무가 어떤 건지 정리해서", "time": "01:41"}, {"start": 107.72, "end": 112.04, "text": "우리 기간 내에 공유하는 방안도 고민하고 있습니다.", "time": "01:47"}, {"start": 112.04, "end": 116.16, "text": "이렇게 하게 되면 아마 일상적인 문서 작성이라든지", "time": "01:52"}, {"start": 116.16, "end": 119.12, "text": "자료 정리 시간이 아마 많이 잔축되어서", "time": "01:56"}, {"start": 119.12, "end": 123.92, "text": "기획과 소통 등 본연의 핵심 업무에 더 몰입할 수 있지 않을까 합니다.", "time": "01:59"}, {"start": 123.92, "end": 128.04, "text": "그리고 두 번째로 AI에 대한 두려움이 사라지지 않을까 합니다.", "time": "02:03"}, {"start": 128.04, "end": 130.84, "text": "그러면 자연스럽게 AI를 활용한", "time": "02:08"}, {"start": 130.84, "end": 134.56, "text": "스마트한 업무 문화가 정탁될 거라 예상합니다.", "time": "02:10"}, {"start": 134.56, "end": 137.6, "text": "마지막으로 저의 역할을 말씀드리고 싶은데요.", "time": "02:14"}, {"start": 137.6, "end": 142.04, "text": "저는 거창한 기술을 가르치는 그런 일방적인 강사가 아니라", "time": "02:17"}, {"start": 142.04, "end": 145.84, "text": "동료가 실제로 적용할 수 있도록 1대1 마크를 하는", "time": "02:22"}, {"start": 145.84, "end": 148.68, "text": "그리고 달리기 할 때 옆에서 도와주는 사람처럼", "time": "02:25"}, {"start": 148.68, "end": 151.08, "text": "그 페이스메이커가 되고 싶습니다", "time": "02:28"}, {"start": 151.08, "end": 155.12, "text": "저 또한 실무에서 AI를 하나씩 알아봐 가면서", "time": "02:31"}, {"start": 155.12, "end": 157.72, "text": "AI의 도움을 받았던 경험이 있었고", "time": "02:35"}, {"start": 157.72, "end": 161.64, "text": "초고자일 때 그 답답한 마음을 누구보다 잘 알고 있고", "time": "02:37"}, {"start": 161.64, "end": 165.44, "text": "어떤 부분이 막힐지에 대해서 잘 알고 있기 때문에", "time": "02:41"}, {"start": 165.44, "end": 171.44, "text": "이번 양성 과정을 통해서 저의 이런 역량을 좀 더 체계적으로 배워", "time": "02:45"}, {"start": 171.44, "end": 175.44, "text": "우리 기간 동료들이 AI를 유용하게 활용할 수 있도록", "time": "02:51"}, {"start": 175.44, "end": 178.16, "text": "도록자 역할을 하고 싶습니다.", "time": "02:55"}, {"start": 178.16, "end": 179.16, "text": "감사합니다.", "time": "02:58"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/18/1QX_jfo2WpEe_PCjWzDWkc_-e1RLznmhs.mp4", "frame": "../영상장면/18.jpg", "quotes": [{"start": 165.44, "end": 171.44, "text": "이번 양성 과정을 통해서 저의 이런 역량을 좀 더 체계적으로 배워", "time": "02:45", "category": "자기주도 학습 관련 기재"}, {"start": 72.84, "end": 78.76, "text": "가장 많이 보급되어 있는 챗 GPT라든지 재미나이 같은 도구를 활용해서", "time": "01:12", "category": "AI 업무 활용 관련 기재"}, {"start": 107.72, "end": 112.04, "text": "우리 기간 내에 공유하는 방안도 고민하고 있습니다.", "time": "01:47", "category": "기관 내 확산 계획 관련 기재"}, {"start": 63.68, "end": 66.0, "text": "적근하게 어려움이 있을 텐데요.", "time": "01:03", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 18, "name": "김민희", "title": "20260909_160457.mp4", "mime": "video/mp4", "bytes": 387960290, "downloaded": true, "url": "https://drive.google.com/file/d/1QX_jfo2WpEe_PCjWzDWkc_-e1RLznmhs/view?usp=drivesdk", "local": "../원본/18/1QX_jfo2WpEe_PCjWzDWkc_-e1RLznmhs.mp4", "id": "1QX_jfo2WpEe_PCjWzDWkc_-e1RLznmhs"}, {"n": 18, "name": "김민희", "title": "강사양성과정신청서(김민희).pdf", "mime": "application/pdf", "bytes": 227378, "downloaded": true, "url": "https://drive.google.com/file/d/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0/view?usp=drivesdk", "local": "../원본/18/1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0.pdf", "id": "1BOSBQdBtdJo3Yvwys6apIvl55iB2NDs0"}], "doc_count": 1, "media_count": 1}, {"n": 19, "original_no": 19, "row": 20, "name": "김무영", "org": "전북특별자치도 완주소방서", "folder_title": "19.전주특별자치도 완주소방소_김무영", "folder_url": "https://drive.google.com/drive/folders/11taVIl31jTknCoKcmJ4NZV7iuT-7Q_Lo", "summary": "119구조대 업무관리·객체탐지 GUI·교육자료 제작 도구의 구현·수정 경험을 기재. 소규모 교육안을 제출하고 승인 후 직접 운영하는 계획을 제시함.", "evidence": {"자기주도 학습 관련 기재": [], "AI 업무 활용 관련 기재": [{"text": "2025년 6월 25일과 2026년 4월 29일에는 AI객체탐지 활용 교육을 각각 2시간씩 진행했습니다. 처음 사용하는 대원들은 초기 설정과 오류 대응에서 어려움을 겪었습니다. 이를 돕기 위해 GUI 프로그램을 직접 개발해 수업에 적용했습니다. 바로 답하기 어려운 질문은 따로 확인해 다음 회차에 안내했습니다. ③ 장비 교육에서 익힌 지도 방식 119구조대에서는 선임이 후임에게 장비 운용법을 직접 가르칩니다. 저도 장비 담당으로 대원을 지도하면서 설명을 듣는 것과 직접 해 보는 것에는 차이가 있음을 느꼈습니다. 교육에서도 설명 뒤에 실습하고 다시 확인하는 시간을 충분히 두려고 합니다.", "source": "강사양성과정_신청서(김무영).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD/view?usp=drivesdk", "id": "1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD"}, {"text": "2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 - AI agent(Codex, Claude Code)를 활용해 「119구조대 업무관리 시스템」을 직접 기획하고 구현했습니다. Vercel과 Supabase로 배포하고, 공개 가능한 매뉴얼·규정 자료를 검색·요약하는 RAG 기반 AI챗봇을 연결했습니다. 이 사례로 2026년도 상반기 전북특별자치도 적극행정 우수사례에 선발됐습니다. - 오픈소스 YOLO를 활용하여 'AI객체탐지 프로그램'을 대원이 화면에서 실행할 수 있도록 GUI 프로그램으로 구현·개선해 왔습니다. LLM의 도움을 받아 오류를 수정하고 기능을 보완하며 버전을 올리고 있습니다.", "source": "강사양성과정_신청서(김무영).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD/view?usp=drivesdk", "id": "1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD"}, {"text": "- AI agent(Codex, Claude Code)를 활용해 「119구조대 업무관리 시스템」을 직접 기획하고 구현했습니다. Vercel과 Supabase로 배포하고, 공개 가능한 매뉴얼·규정 자료를 검색·요약하는 RAG 기반 AI챗봇을 연결했습니다. 이 사례로 2026년도 상반기 전북특별자치도 적극행정 우수사례에 선발됐습니다. - 오픈소스 YOLO를 활용하여 'AI객체탐지 프로그램'을 대원이 화면에서 실행할 수 있도록 GUI 프로그램으로 구현·개선해 왔습니다. LLM의 도움을 받아 오류를 수정하고 기능을 보완하며 버전을 올리고 있습니다. - 교안과 슬라이드 준비에 드는 시간을 줄이고자 「구조AI 교육자료 제작 플랫폼」을 만들어 시범운용 중입니다. 매뉴얼을 바탕으로 훈련계획·교안·슬라이드 초안을 생성하며, 요구사항 정리부터 코드 수정, 테스…", "source": "강사양성과정_신청서(김무영).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD/view?usp=drivesdk", "id": "1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD"}], "강의·학습 지원 관련 기재": [{"text": "전북소방 드론인력풀을 대상으로 소방드론 운용절차와 AI객체탐지 활용을 교육하고, 각 소방서 드론운용자를 대상으로 직무교육을 진행해 왔습니다. 2022년부터 현재까지 위 교육에 주 교관으로 참여했습니다. ① 참여자의 수준 차이를 고려한 실습 드론 교육에서는 참여자마다 숙련도가 달라 같은 진도로 실습하기 어려웠습니다. 2025년 12월 11~13일 직무교육에서도 조종 경험이 서로 다른 대원들이 함께 참여했습니다. 따라오기 어려워하는 대원을 보고 실습을 짧은 단계로 나누어 진도를 확인하고, 먼저 마친 대원이 옆자리 대원을 도울 수 있도록 짝을 지었습니다. 체크리스트와 다음 회차의 개별 진도 확인으로 실습을 지원했습니다.", "source": "강사양성과정_신청서(김무영).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD/view?usp=drivesdk", "id": "1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD"}, {"text": "수료 후에는 기관 내 강사로서 표준교안을 활용한 교육을 진행하고, 참여자의 실습을 지원하겠습니다. 우선 10~11월 중 완주소방서 희망자를 대상으로 바이브 코딩 기초 실습교육 1회 운영을 목표로 교육안을 제출하고, 교육 담당 부서와 모집 방법·교육시간·장소를 협의하겠습니다. 승인된 수업의 진행과 실습 지원은 제가 맡겠습니다. 표준교안의 학습목표와 핵심 실습을 따르면서 참여자의 경험과 이해도에 맞춰 설명 속도와 실습 범위를 조절하겠습니다. 실습은 짧은 단계로 나누어 진행하고, 단계마다 진행 상황을 확인해 초기 설정이나 오류 해결에 어려움을 겪는 참여자를 돕겠습니다. 교육 후에는 참여자의 질문을 모아 공통으로 어려워한 부분의 답변을 정리하고 공유하겠습니다. 그린·블루 인증을 희망하는 직원에게는 제 블루 인증 취득 경험과 공식 학습자료를 바탕으로 …", "source": "강사양성과정_신청서(김무영).hwpx", "page": 1, "method": "HWPX 구역", "url": "https://drive.google.com/file/d/1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD/view?usp=drivesdk", "id": "1nledbd9Lcj0dxar4NXEmbhJu6v6R_HrD"}, {"text": "승인된 수업의 진행과 실습 지원은 제가 맡겠습니다. 표준교안의 학습목표와 핵심 실습을 따르면서 참여자의 경험과 이해도에 맞춰 설명 속도와 실습 범위를 조절하겠습니다. 실습은 짧은 단계로 나누어 진행하고, 단계마다 진행 상황을 확인해 초기 설정이나 오류 해결에 어려움을 겪는 참여자를 돕겠습니다. 교육 후에는 참여자의 질문을 모아 공통으로 어려워한 부분의 답변을 정리하고 공유하겠습니다. 그린·블루 인증을 희망하는 직원에게는 제 블루 인증 취득 경험과 공식 학습자료를 바탕으로 준비 순서를 안내하겠습니다. 공식 교육·평가 참여는 공고된 일정과 요건에 따라 안내하고, 자체교육 이수와 공식 지정과목 이수·인증은 구분하겠습니다. 첫 교육에 걸린 시간과 주요 실습 오류, 참여자 의견을 정리해 담당 부서에 공유하겠습니다. 이를 바탕으로 추가 교육의 필요성과 …", "source": "강사양성과정_신청서(김무영)
