=drivesdk", "duration": 165.3521, "video": false, "audio": true, "segments": [{"start": 0.53, "end": 10.05, "text": "환장하십니까? 이번 공공 AI 역량 트랙 강사 과정을 신청한 경북 소방 본부 재난대용과에서 근무하는 이 용 후입니다.", "time": "00:00"}, {"start": 10.05, "end": 16.61, "text": "AI 역량 트랙 강사 과정을 신청한 계기는 현장에서 국민의 생명을 지키는 소방관들이", "time": "00:10"}, {"start": 16.61, "end": 25.81, "text": "날마다 공문서 작성, 반대한 법명 및 매뉴얼 검토, 그리고 복잡한 통계 취약 등 반복적인 행정 업무로 필요를 겪고 있습니다.", "time": "00:16"}, {"start": 25.81, "end": 29.65, "text": "특히 AI 기술이 급변하고 있는 있음에도 불구하고", "time": "00:25"}, {"start": 29.65, "end": 35.35, "text": "일선 서방 현장과 행정 실무의 이를 체계적으로 접목할 수 있는 실무 가이드라인이나", "time": "00:29"}, {"start": 35.35, "end": 38.51, "text": "전문 교육 체계는 여전히 부족한 현실입니다.", "time": "00:35"}, {"start": 38.51, "end": 42.39, "text": "그 결과 서방관들이 변원의 임무인 장비 전비와", "time": "00:38"}, {"start": 42.39, "end": 47.35, "text": "현장 출동 준비에 온전히 몰입하기 어려운 구조적 한계를 마주하고 있습니다.", "time": "00:42"}, {"start": 47.35, "end": 54.45, "text": "이러한 문제를 해결하기 위해 저는 생성형 AI와 피지컬 AI를 융합한 실전 해결책을 제시합니다.", "time": "00:47"}, {"start": 54.45, "end": 63.19, "text": "첫째, 채 GPT와 클라우드를 활용해 공무소 초원 작성과 범령, 메뉴얼 요약, 서유시간을 획기적으로 단축하겠습니다.", "time": "00:54"}, {"start": 63.19, "end": 75.35, "text": "둘째, 재미나이와 드론을 연기하여 광활한 산악 지역에 수색 섹터를 중복없이 효율적으로 분할하는 등 참단 스마트 전수를 내재하겠습니다.", "time": "01:03"}, {"start": 75.35, "end": 80.15, "text": "나아가 수려 후에는 연관 6회에 걸쳐 관선의 대원들을 대상으로", "time": "01:15"}, {"start": 80.15, "end": 85.27, "text": "소방특화 표준 프롬포트 시범 전과 프롬포트 레시티북을 배포하는 등", "time": "01:20"}, {"start": 85.27, "end": 90.19, "text": "자체 교육을 운영하여 교대 근무 여권 속에서도 누구나 즉시 활용할 수 있는", "time": "01:25"}, {"start": 90.19, "end": 92.95, "text": "디지털 협업 문화를 정착시키겠습니다.", "time": "01:30"}, {"start": 92.95, "end": 96.15, "text": "본 과정을 통한 현장 밀착혁 교육 접화는", "time": "01:32"}, {"start": 96.15, "end": 98.39, "text": "세 가지 강력한 변화를 이끌어냅니다.", "time": "01:36"}, {"start": 98.39, "end": 101.97, "text": "첫째 반복 행정 업무가 대폭관수화되어", "time": "01:38"}, {"start": 101.97, "end": 106.97, "text": "대원들이 현장 출동과 전술 훈련에 온전히 몰입할 수 있는 환경이 조성됩니다.", "time": "01:41"}, {"start": 106.97, "end": 115.97, "text": "둘째, AI 기반 드론 전술과 정밀한 도선 훈련 시나리오를 통해 고위험 재난 현장에서 대원들의 안전을 학과히 지켜냅니다.", "time": "01:46"}, {"start": 115.97, "end": 129.97, "text": "셋째, 다국어 변역과 AI 이미지 생성 기술로 재난 취업 계층을 위한 맞춤형 안전 메뉴얼을 보급함으로써 지역 주민들 모두를 아우르는 촘촘한 119 안전 서비스를 실현할 수 있습니다.", "time": "01:55"}, {"start": 129.97, "end": 135.97, "text": "저는 그간 데이터 AI 기반 제한 현장 대응 고도와 방안 연구 거절을 주도하고", "time": "02:09"}, {"start": 135.97, "end": 140.37, "text": "생성형 AI를 활용한 재난 시물레이션 교환을 직접 부축해왔습니다.", "time": "02:15"}, {"start": 140.37, "end": 145.87, "text": "이번 공공 AI 영향 트랙 강사 양성 과정은 저에게 단순한 기술 습득 기회를 넘어", "time": "02:20"}, {"start": 145.87, "end": 151.37, "text": "연구 성과를 일선 대원들의 실무 영향으로 꼽히우게 할 수 있는 중요한 도약대입니다.", "time": "02:25"}, {"start": 152.67, "end": 157.77, "text": "이런 만으로 머물지 않고 서방 현장에 즉시 안착할 수 있는 교육을 이끌어낼", "time": "02:32"}, {"start": 157.77, "end": 163.67, "text": "소방특가 공공 AI 전문 강사로서 경북 소방의 스마트 혁신을 최전선에서 완성하겠습니다.", "time": "02:37"}, {"start": 163.67, "end": 165.17, "text": "감사합니다.", "time": "02:43"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/36/1yJwtkgnYEUbp22_AfCFr9N2A48orLEBY.m4a", "frame": null, "quotes": [{"start": 54.45, "end": 63.19, "text": "첫째, 채 GPT와 클라우드를 활용해 공무소 초원 작성과 범령, 메뉴얼 요약, 서유시간을 획기적으로 단축하겠습니다.", "time": "00:54", "category": "AI 업무 활용 관련 기재"}, {"start": 85.27, "end": 90.19, "text": "자체 교육을 운영하여 교대 근무 여권 속에서도 누구나 즉시 활용할 수 있는", "time": "01:25", "category": "강의·학습 지원 관련 기재"}, {"start": 10.05, "end": 16.61, "text": "AI 역량 트랙 강사 과정을 신청한 계기는 현장에서 국민의 생명을 지키는 소방관들이", "time": "00:10", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 36, "name": "이용후", "title": "공공 AI역량 트랙 강사 과정 신청서(재난대응과).pdf", "mime": "application/pdf", "bytes": 1802156, "downloaded": true, "url": "https://drive.google.com/file/d/1MV3NSQdLf0X8xfoW5AnTpNeBBfg0PJC2/view?usp=drivesdk", "local": "../원본/36/1MV3NSQdLf0X8xfoW5AnTpNeBBfg0PJC2.pdf", "id": "1MV3NSQdLf0X8xfoW5AnTpNeBBfg0PJC2"}, {"n": 36, "name": "이용후", "title": "발표자료(경북소방본부 재난대응과 이용후).m4a", "mime": "aud yvvAMQecWedHEM-RWc3SFtqn_da"}], "기관 내 확산 계획 관련 기재": [{"text": "- 운영 목표 1년에 20명 실습교육 수료 및 5명의 시 챔피언 블루 양성 - 운영 대상 및 예상 인원 • AI혁신처, 재생에너지처, 발전처 등 사내 AI•데이터 활용 업무 희망 직원 3) 운영 트랙•과목 및 일정(안)", "source": "붙임2. 강사 양성과정 신청서.pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/14l3qNyvvAMQecWedHEM-RWc3SFtqn_da/view?usp=drivesdk", "id": "14l3qNyvvAMQecWedHEM-RWc3SFtqn_da"}, {"text": "- 운영 대상 및 예상 인원 • AI혁신처, 재생에너지처, 발전처 등 사내 AI•데이터 활용 업무 희망 직원 3) 운영 트랙•과목 및 일정(안) 자수", "source": "붙임2. 강사 양성과정 신청서.pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/14l3qNyvvAMQecWedHEM-RWc3SFtqn_da/view?usp=drivesdk", "id": "14l3qNyvvAMQecWedHEM-RWc3SFtqn_da"}, {"text": "AI에 대한 관심과 활용이 빠르게 확산되고 있습니다. 그러나 검색·요약·문서 작성에 그치는 현재 수준에서 한 단계 도약해야 할 때입니다. 현재 문제점", "source": "붙임3. AI강사 발표자료(ppt).pdf", "page": 1, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/173nRebq9KoJy3OgdrmhWRePPIPt409cB/view?usp=drivesdk", "id": "173nRebq9KoJy3OgdrmhWRePPIPt409cB"}], "과정·이유·검증 설명 관련 기재": []}, "media": [{"n": 37, "id": "1E5FY5jiCeIJg7CxNYJ6Q7Drr0RZnNPlF", "file": "붙임4. AI강사 발표자료(음성).m4a", "url": "https://drive.google.com/file/d/1E5FY5jiCeIJg7CxNYJ6Q7Drr0RZnNPlF/view?usp=drivesdk", "duration": 143.701333, "video": false, "audio": true, "segments": [{"start": 1.17, "end": 13.17, "text": "안녕하십니까 저는 한국동사 발전 AI 솔로션부 이수진입니다. 우선 이 음성 파일을 첨부해 드린 ppt 자료와 같이 보시는 것을 권장드립니다.", "time": "00:01"}, {"start": 13.17, "end": 23.17, "text": "일장입니다. 저는 우리 기간의 AI 데이터 역량 강화를 위해 생성형 AI 활용을 현업 데이터 기반에 문제 해결 역량으로 확장하고자 합니다.", "time": "00:13"}, {"start": 23.17, "end": 31.17, "text": "현재 생성형 AI가 빠르게 확산되면서 검색, 요약, 분서 작성 등 업무 활용도 늘어나고 있습니다.", "time": "00:23"}, {"start": 31.17, "end": 40.17, "text": "하지만 실제 발전 데이터를 분석하고 AI 모델을 만들어 업무에 적용하기 위해서는 한 단계 더 높은 데이터 분석 영향이 필요합니다.", "time": "00:31"}, {"start": 40.17, "end": 49.17, "text": "특히 발전과 재생 에너지처럼 우리 기간의 고유 업무와 AI를 연결할 수 있는 실습 중심의 교육이 필요하다고 생각합니다.", "time": "00:40"}, {"start": 49.17, "end": 51.17, "text": "2장입니다.", "time": "00:49"}, {"start": 51.17, "end": 57.17, "text": "1을 위해 저는 현업 데이터를 활용한 3단계 AI 실습 교육을 운영하고자 합니다.", "time": "00:51"}, {"start": 57.17, "end": 63.17, "text": "첫 번째 단계에서는 데이터에 대한 기본적인 이해와 전처리 방법을 배우고", "time": "00:57"}, {"start": 63.17, "end": 67.17, "text": "생성형 AI를 데이터 분석에 활용하는 방법을 입힙니다.", "time": "01:03"}, {"start": 67.17, "end": 71.17, "text": "두 번째 단계에서는 실제 업무와 연계된 발전 데이터를 활용하여", "time": "01:07"}, {"start": 71.17, "end": 76.17, "text": "데이터를 실각하고 패턴을 분석해 직접 인사이트를 도출해 봅니다.", "time": "01:11"}, {"start": 76.17, "end": 79.31, "text": "마지막 단계에서는 여기서 한 단계 더 나아가", "time": "01:16"}, {"start": 79.31, "end": 85.31, "text": "태양관과 폭력 발전량 예측과 같은 AI 모델링을 직접 수행해 보도록 하겠습니다.", "time": "01:19"}, {"start": 85.31, "end": 88.75, "text": "특히 일반적인 예제 데이터에 그치는 것이 아니라", "time": "01:25"}, {"start": 88.75, "end": 92.31, "text": "우리 기간의 실제 업무와 연계된 데이터를 활용하고", "time": "01:28"}, {"start": 92.31, "end": 95.85, "text": "산의 생성형 AI인 이지도 교육에 활용하여", "time": "01:32"}, {"start": 95.85, "end": 101.31, "text": "보안성을 확보하면서 실무에 적용할 수 있는 교육으로 운영하겠습니다.", "time": "01:35"}, {"start": 101.31, "end": 102.71, "text": "3장입니다.", "time": "01:41"}, {"start": 102.71, "end": 107.67, "text": "이 교육의 목표는 단순히 교육을 이소하는 것에서 끝나지 않겠습니다.", "time": "01:42"}, {"start": 107.67, "end": 112.31, "text": "우선 연간 20명의 AI 데이터 실습 교육 수료자를 양성하고", "time": "01:47"}, {"start": 112.31, "end": 118.55, "text": "이 가운데 5명의 AI 챔피언 블루를 양성하는 것을 목표로 하고 있겠습니다.", "time": "01:52"}, {"start": 118.55, "end": 124.39, "text": "교육을 받은 직원들이 각자의 현업에서 AI 활용 과제를 직접 발굴하고", "time": "01:58"}, {"start": 124.39, "end": 127.31, "text": "실제 업무에 적용해 보도록 하겠습니다.", "time": "02:04"}, {"start": 127.31, "end": 132.95, "text": "그리고 효과가 확인된 우수 사례는 다시 교육 컨텐츠로 만들어 공유함으로서", "time": "02:07"}, {"start": 132.95, "end": 136.39, "text": "교육에서 실습으로 실습에서 현업 적용으로", "time": "02:12"}, {"start": 136.39, "end": 140.95, "text": "다시 조직 전체로 확산되는 선순한 재개를 구축하겠습니다.", "time": "02:16"}, {"start": 140.95, "end": 143.59, "text": "감사합니다.", "time": "02:20"}], "method": "Whisper sma g", "segments": [{"start": 0.11, "end": 6.11, "text": "안녕하십니까. 경기 남북경찰청 안성종차서 정감 이상건입니다.", "time": "00:00"}, {"start": 6.11, "end": 21.11, "text": "현재 정부는 AI 시대 활상어를 위한 정책을 적고 추진 중이며 공직사회 내부의 AI 활용 역량을 상향 평전화해야 하는 중요한 시대적 과자가 보여 되어 있습니다.", "time": "00:06"}, {"start": 21.11, "end": 28.41, "text": "하지만 시한 현장의 현실은 사건 현장에서 수집한 메모를 업무용 PC의 수작업으로", "time": "00:21"}, {"start": 28.41, "end": 31.91, "text": "지입력하는 현장 낭비가 지속되고 있습니다.", "time": "00:28"}, {"start": 31.91, "end": 39.61, "text": "여기에 경찰 조직의 엉덕한 망불리 보안 한경과 관선의 AI 실습 인프라이 부재가 더해져", "time": "00:31"}, {"start": 39.61, "end": 47.91, "text": "현장 동료들이 체감할 수 있는 실용적인 AI 업무 지원 체계를 구축하는데 한계가 존재해 왔습니다.", "time": "00:39"}, {"start": 47.91, "end": 54.91, "text": "저는 이러한 행장랑비를 핵기적으로 줄이고 공직사회 AI 전원을 선도하고자", "time": "00:47"}, {"start": 54.91, "end": 62.91, "text": "경찰 내부망 환경에서 구동되는 현장 보고서 자동생성 시스템인 스마트 레포트를 직접 개발하였습니다.", "time": "00:54"}, {"start": 62.91, "end": 67.91, "text": "더 나아가 퀴스트 슈퍼컴퓨터 연계자원을 활용하여", "time": "01:02"}, {"start": 67.91, "end": 71.49, "text": "젠마4 IT 모델을 파인 수인행하고", "time": "01:07"}, {"start": 71.49, "end": 76.49, "text": "외부 서버 연결이 전혀 없는 100% 온 디바이스 환경에서", "time": "01:11"}, {"start": 76.49, "end": 82.15, "text": "초동 조치 보고서를 안전하게 자동 생산할 수 있도록 추진 중에 있습니다.", "time": "01:16"}, {"start": 82.15, "end": 88.99, "text": "현장 동찰관이 B정형 메모를 보고서 양식에 맞춘 정형화 데이터로 자동 변화하여", "time": "01:22"}, {"start": 88.99, "end": 91.83, "text": "보안 리스크는 제로로 낮추고", "time": "01:28"}, {"start": 91.83, "end": 95.75, "text": "본연의 취한 및 수사활동 집중돌을 극대화하는", "time": "01:31"}, {"start": 95.75, "end": 99.03, "text": "패라다임 전환을 할 수 있다고 생각합니다.", "time": "01:35"}, {"start": 99.03, "end": 102.91, "text": "또한 자체 교육 운영 시위에는 관할시도경찰청", "time": "01:39"}, {"start": 102.91, "end": 109.99, "text": "정부와 교육장 및 개별 노트북을 연기하여 물리적 인프라 제약을 극복하도록 하겠습니다.", "time": "01:42"}, {"start": 109.99, "end": 114.27, "text": "이러한 실체인으로 통해 3가지 확실한 성과를 달성하겠습니다.", "time": "01:49"}, {"start": 114.27, "end": 119.39, "text": "첫째, 시간 단축으로 수작업 재입력의 행정랑비를 제거하고", "time": "01:54"}, {"start": 119.39, "end": 124.07, "text": "둘째, 완벽한 보안으로 데이터 유출을 완전히 차단하며", "time": "01:59"}, {"start": 124.07, "end": 127.95, "text": "셋째, 이코노미 시스템 자생으로 내부방 중심에", "time": "02:04"}, {"start": 127.95, "end": 131.35, "text": "지속 가능한 AI 생태계를 완성하겠습니다.", "time": "02:07"}, {"start": 131.35, "end": 135.19, "text": "저는 이번 과정 수료 후 단순히 기술만 나열하는", "time": "02:11"}, {"start": 135.19, "end": 138.35, "text": "외지 강사가 아닌 현장과 기술을 잇는", "time": "02:15"}, {"start": 138.35, "end": 142.95, "text": "준비한 실전형 트랙 허실레이터로 활동하겠습니다.", "time": "02:18"}, {"start": 142.95, "end": 147.51, "text": "20년 현장 경험과 4년 9개월이 교관 노하우를 살려", "time": "02:22"}, {"start": 147.51, "end": 153.59, "text": "복잡한 AI 기술을 현장 눈무피에 맞춰 가장 쉽게 전달하겠습니다.", "time": "02:27"}, {"start": 153.59, "end": 158.79, "text": "정찰 내부망 사이버 공간인 현장 학습연구 모임 게시판을 통해", "time": "02:33"}, {"start": 158.79, "end": 163.83, "text": "소동 채널로 활용하여 교육생들이 제작한 프럼프트 템플릿을 공유하는", "time": "02:38"}, {"start": 163.83, "end": 168.25, "text": "지속 가능한 AI 학습 생태계를 구축하겠습니다.", "time": "02:43"}, {"start": 168.25, "end": 173.67, "text": "현장의 한계는 현장을 가장 잘 아는 사람이 기술로 극복할 수 있습니다.", "time": "02:48"}, {"start": 173.67, "end": 180.71, "text": "저희 정찰청이 공공 AI 대전환이 손도 모델이 되도록 최선을 다했습니다.", "time": "02:53"}, {"start": 180.71, "end": 181.55, "text": "감사합니다.", "time": "03:00"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/38/1Ro0edp4kQLbhmaqeiG3TzQAq5GcRjEZ9.mp4", "frame": "../영상장면/38.jpg", "quotes": [{"start": 153.59, "end": 158.79, "text": "정찰 내부망 사이버 공간인 현장 학습연구 모임 게시판을 통해", "time": "02:33", "category": "자기주도 학습 관련 기재"}, {"start": 54.91, "end": 62.91, "text": "경찰 내부망 환경에서 구동되는 현장 보고서 자동생성 시스템인 스마트 레포트를 직접 개발하였습니다.", "time": "00:54", "category": "AI 업무 활용 관련 기재"}, {"start": 158.79, "end": 163.83, "text": "소동 채널로 활용하여 교육생들이 제작한 프럼프트 템플릿을 공유하는", "time": "02:38", "category": "기관 내 확산 계획 관련 기재"}, {"start": 39.61, "end": 47.91, "text": "현장 동료들이 체감할 수 있는 실용적인 AI 업무 지원 체계를 구축하는데 한계가 존재해 왔습니다.", "time": "00:39", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 38, "name": "이상 cy8ZcI6dSr2"}], "강의·학습 지원 관련 기재": [{"text": "관계자 교육 등 현장 중심 교육 경험 보유 - 3 - - 4 -", "source": "(붙임) 강사 양성 과정 신청서(경사 김애리).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2/view?usp=drivesdk", "id": "1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2"}], "기관 내 확산 계획 관련 기재": [{"text": "학습자료로 재구성하여 정기적으로 공유하는 방식으로 교육 범위를 넓힘. 교육 기간 교육기관 교육 내용 (이수 시간) 수료/이수 2026.7.13. ~ 7.15. 행정안전부·NIA AI·DATA활용역량 교육(24시간) 수료", "source": "(붙임) 강사 양성 과정 신청서(경사 김애리).pdf", "page": 1, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2/view?usp=drivesdk", "id": "1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2"}, {"text": "ChatGPT 직원 교육자료 제작 찰 이슈를 정리, 카드뉴스 ○ 행정안전부 표준 교안과 실제 경찰업무 사례의 연계를 통한 울산청 내 AI 활용역량 확산 ~ 현재 형태로 제작하여 업무에 활용", "source": "(붙임) 강사 양성 과정 신청서(경사 김애리).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2/view?usp=drivesdk", "id": "1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2"}, {"text": "○ 개인별 계정 로그인 및 기기환경 점검에 따른 교육시간 소모를 줄이기 위한 강사 화면 ○ 울주경찰서 교육과정에서 확인된 이해도·질문·보완사항을 반영한 경찰업무 맞춤형 교안 시연 중심 교육 운영 개선 ○ 중급교육의 경우 AI챔피언 그린과정 수준의 기본교안 및 공통 실습 예제 활용 ○ 검증된 교안을 울산중부·남부·동부·북부경찰서 교육담당부서에 제공하여 관서별 자체", "source": "(붙임) 강사 양성 과정 신청서(경사 김애리).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2/view?usp=drivesdk", "id": "1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2"}], "과정·이유·검증 설명 관련 기재": [{"text": "○ 핵심개념 → 경찰업무 사례 → 화면 시연 → 보안·검증 순의 단계적 교육 구성 Google 2025.2. 홍보 등 시각 자료 제작 업무에 울산지방청장· ○ 개인정보·내부자료 보호 및 AI 결과 검증을 포함한 안전한 경찰업무 활용 중심 교육 이미지 생성", "source": "(붙임) 강사 양성 과정 신청서(경사 김애리).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2/view?usp=drivesdk", "id": "1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2"}, {"text": "Google 2025.2. 홍보 등 시각 자료 제작 업무에 울산지방청장· ○ 개인정보·내부자료 보호 및 AI 결과 검증을 포함한 안전한 경찰업무 활용 중심 교육 이미지 생성 Gemini ~ 현재 활용 경찰서장 표창", "source": "(붙임) 강사 양성 과정 신청서(경사 김애리).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2/view?usp=drivesdk", "id": "1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2"}, {"text": "질문·수정·검증 전 과정 수행 3) 수료 후 강사 활동 계획 가. 강사 역할", "source": "(붙임) 강사 양성 과정 신청서(경사 김애리).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2/view?usp=drivesdk", "id": "1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2"}]}, "media": [{"n": 39, "id": "1i-RxdqgICyGWzaipBjK5NMtGRWirE-px", "file": "AI·데이터 역량강화 실행계획 3분 발표자료(경사 김애리).m4a", "url": "https://drive.google.com/file/d/1i-RxdqgICyGWzaipBjK5NMtGRWirE-px/view?usp=drivesdk", "duration": 186.261333, "video": false, "audio": true, "segments": [{"start": 2.06, "end": 7.56, "text": "안녕하십니까. 불산울주경찰서 사생파주소 경사 김혜리입니다.", "time": "00:02"}, {"start": 7.56, "end": 18.56, "text": "경찰 조직을 AI 역량 강화 실행 계획을 문제점, 해결 방안, 기대 효과, 그리고 저의 역할 손으로 말씀드리겠습니다.", "time": "00:07"}, {"start": 18.56, "end": 20.96, "text": "먼저 문제점입니다.", "time": "00:18"}, {"start": 20.96, "end": 26.16, "text": "경찰은 교대 근무로 인해 교육 시간을 확보하기 어렵습니다.", "time": "00:20"}, {"start": 26.16, "end": 37.2, "text": "직업마다 AI에 대한 관심과 활용 수준도 다르고 개인정보와 수사 자료를 다루기 때문에 보안에 대한 우려도 큽니다.", "time": "00:26"}, {"start": 37.2, "end": 44.44, "text": "따라서 경찰이 근무 환경과 업무 특성을 반영한 쉽고 완전한 AI 교육이 필요합니다.", "time": "00:37"}, {"start": 44.44, "end": 47.04, "text": "다음은 해결 방안입니다.", "time": "00:44"}, {"start": 47.04, "end": 52.2, "text": "교육은 공통 교육과 실습 교육으로 나누겠습니다.", "time": "00:47"}, {"start": 52.2, "end": 58.64, "text": "먼저 기존 관서장 중심 집체 교육 중 1시간을 활용하겠습니다.", "time": "00:52"}, {"start": 58.64, "end": 69.08, "text": "파출수 근무자 약 190명을 우선 교육하고 이후 본서 근무자 약 190명으로 확대하겠습니다.", "time": "00:58"}, {"start": 69.08, "end": 75.88, "text": "행정안전부 표준 교환으로 바탕으로 지역경찰에는 현장 업무 활용법을", "time": "01:09"}, {"start": 75.88, "end": 84.04, "text": "분서 직원에게는 공문과 보고서 작성법을 경찰 업무 사례와 함께 설명하겠습니다.", "time": "01:15"}, {"start": 84.04, "end": 93.4, "text": "또한 민감 정보, 입력 금지와 AI 결과의 사실 확인 등 안전한 활용 수칙도 함께 교육하겠습니다.", "time": "01:24"}, {"start": 93.4, "end": 99.84, "text": "교육 희망자에게는 3시간 이상의 실습 과정을 운영하겠습니다.", "time": "01:33"}, {"start": 99.84, "end": 108.96, "text": "계정과 기기 접속 환경을 미리 점검하고 단계별 예제를 따라 실습 결과물 하나를 완성하도록 돕겠습니다.", "time": "01:39"}, {"start": 108.96, "end": 119.36, "text": "타 경찰서에는 보조 교환과 진행안을 제공하여 각 관서 교육 담당자가 자체 교육을 운영할 수 있도록 지원하겠습니다.", "time": "01:48"}, {"start": 119.36, "end": 121.52, "text": "다음은 기대 효과입니다.", "time": "01:59"}, {"start": 121.52, "end": 129.68, "text": "직원들이 AI에 대한 부담을 낮추고 공문과 보고서 반복 업무의 효율을 높일 수 있습니다.", "time": "02:01"}, {"start": 129.68, "end": 135.46, "text": "교육 자료를 지속적으로 보완하고 공유하여 파주소와 경찰서를 넘어", "time": "02:09"}, {"start": 135.46, "end": 140.42, "text": "우수한 경찰청 전체로 확산할 수 있는 교육 기반도 마련하겠습니다.", "time": "02:15"}, {"start": 140.42, "end": 142.82, "text": "마지막으로 저의 역할입니다.", "time": "02:20"}, {"start": 142.82, "end": 150.02, "text": "저는 경찰 경력 10년 동안 지역경찰관리 업무 4년과 수사 업무 3년을 경험하였습니다.", "time": "02:22"}, {"start": 150.02, "end": 153.58, "text": "AI 챔피언 그린 인증을 취득했고", "time": "02:30"}, {"start": 153.58, "end": 162.12, "text": "생성형 AI를 활용해 내부망에서 작동하는 원클릭 거점 분석 도구를 제작하여 서장상을 받았습니다.", "time": "02:33"}, {"start": 162.12, "end": 171.44, "text": "정식 강의를 한 경험은 없지만 직원들에게 AI 활용법과 AI를 활용한 보고서 작성법을 안내해왔습니다.", "time": "02:42"}, {"start": 171.44, "end": 182.2, "text": "강사 양성 과정을 통해 교육 영향을 갖추고 경찰 현장과 AI를 연결하는 현장 향 퍼실리테이터가 되겠습니다.", "time": "02:51"}, {"start": 182.2, "end": 184.2, "text": "감사합니다", "time": "03:02"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/39/1i-RxdqgICyGWzaipBjK5NMtGRWirE-px.m4a", "frame": null, "quotes": [{"start": 108.96, "end": 119.36, "text": "타 경찰서에는 보조 교환과 진행안을 제공하여 각 관서 교육 담당자가 자체 교육을 운영할 수 있도록 지원하겠습니다.", "time": "01:48", "category": "강의·학습 지원 관련 기재"}, {"start": 129.68, "end": 135.46, "text": "교육 자료를 지속적으로 보완하고 공유하여 파주소와 경찰서를 넘어", "time": "02:09", "category": "기관 내 확산 계획 관련 기재"}]}], "issues": [], "files": [{"n": 39, "name": "김애리", "title": "AI·데이터 역량강화 실행계획 3분 발표자료(경사 김애리).m4a", "mime": "audio/x-m4a", "bytes": 3102807, "downloaded": true, "url": "https://drive.google.com/file/d/1i-RxdqgICyGWzaipBjK5NMtGRWirE-px/view?usp=drivesdk", "local": "../원본/39/1i-RxdqgICyGWzaipBjK5NMtGRWirE-px.m4a", "id": "1i-RxdqgICyGWzaipBjK5NMtGRWirE-px"}, {"n": 39, "name": "김애리", "title": "(붙임) 강사 양성 과정 신청서(경사 김애리).pdf", "mime": "application/pdf", "bytes": 255232, "downloaded": true, "url": "https://drive.google.com/file/d/1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2/view?usp=drivesdk", "local": "../원본/39/1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2.pdf", "id": "1af3yh0FBp72oh7pcJx8iKcy8ZcI6dSr2"}], "doc_count": 1, "media_count": 1}, {"n": 40, "original_no": 40, "row": 41, "name": "권도헌", "org": "경찰청", "folder_title": "40. 경찰청_권도헌", "folder_url": "https://drive.google.com/drive/folders/1FR3OU0egxUv7FO2rSUNIMhdTrcxJ4Zfj", "summary": "AI 리터러시 강의와 QGIS·VSCode·로컬 모델 연동 경험을 기재. 환경 설정·오류 대응과 치안 업무 사례를 단계별로 설명하는 교육을 제시함.", "evidence": {"자기주도 학습 관련 기재": [{"text": "하도록 설정하는 등 모델을 돌리기 위한 사전 준비 작업을 스스로 처리할 수 있습니다. 4. VSCode에 AI(ChatGPT, Claude)를 붙여 코드 작성·실행 VSCode에서 AI의 도움을 받아 파이썬 코드를 작성하고, 이를 제 맥북에서 직접 실행합니다. 112 신고", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}, {"text": "직접 돌려서 운영하는 수준입니다. 도구 간 연동(MCP), 환경 세팅, 오류 대응까지 스스로 처리할 수 있어, 이 과정을 다른 사람에게 안내하는 것도 가능합니다. - 4 -", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}, {"text": "활용·잘못된 규제·과도한 기대)\"를 실제 사례로 짚어 왜 배워야 하는지부터 이해시키는 데 중점을 둡니다. 둘째, 치안 현장 연결자. 112 신고 데이터 분석, 순찰 동선 예측, 지리정보 분석 등 실제 치안 업무에 AI가 어떻게 쓰이는지를 제 실무 경험을 바탕으로 보여줌으로써, 신임경찰관이 \"내 업무에서 AI를 어떻게 쓸 수", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 5, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}], "AI 업무 활용 관련 기재": [{"text": "2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 ChatGPT와 Claude Pro를 유로구독으로 현재 2년 동안 사용하고 있습니다. 그리고 인터넷이 안되는 소속 내부망에서 구글 제미나미 기반 기업용 오픈소스 AI 모델 젬마 4.0 모델을 직접 세팅하여 활용하고 있습니다.", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}, {"text": "ChatGPT와 Claude Pro를 유로구독으로 현재 2년 동안 사용하고 있습니다. 그리고 인터넷이 안되는 소속 내부망에서 구글 제미나미 기반 기업용 오픈소스 AI 모델 젬마 4.0 모델을 직접 세팅하여 활용하고 있습니다. AI를 채팅으로만 쓰는 게 아니라, 여러 AI 도구를 제 맥북(M1)·VSCode 환경에 직접 연결해서 지리정보", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}, {"text": "1. QGIS를 MCP로 AI(Claude)에 연결해 지리 분석 지리정보 프로그램 QGIS(4.0)를 MCP(Model Context Protocol)로 Claude 데스크톱과 연동, QGIS MCP 플러그인을 설치해 AI가 QGIS의 레이어 관리, 피처 편집, 처리 알고리즘 실행 같은 지도 작업을 직접 제어", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}], "강의·학습 지원 관련 기재": [{"text": "대상과 목적의 교육을 운영하며 학습자의 수준과 상황에 맞추어 참여를 촉진하고 성장을 지원해 왔습니다. - 3 -", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}], "기관 내 확산 계획 관련 기재": [{"text": "’26.09.07-09.08. 행안부(AI챔피언 블루) 생성형 AI 활용 데이터분석 심화 2회차(2일) 수료 ’05.02. - ’13.02. 계명대학교 학사 경찰행정학·심리학(통계교육) (4년) 졸업 ’19.04.03-04.05. 인사처(국가공무원인재개발원) 제1기 빅데이터 분석 및 활용 교육(5일) 수료", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}, {"text": "허깅페이스(Hugging Face)는 전 세계 개발자들이 만든 AI 모델을 무료로 공유하는 곳으로 저는 여기서 제 연구 주제(시계열 예측, 시공간 데이터 분석)에 쓸 수 있는 모델을 직접 찾아보고, 여러 개를 비교해봤습 니다. 어떤 모델은 바로 가져다 쓸 수 있고, 어떤 모델은 공개된 코드를 받아 제 데이터로 새로 학습시켜야", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}, {"text": "운영합니다. 초기에는 기존 교육 과정 내 특강 형태로 시작해, 운영 경험이 쌓이면 정규 교과목으로 확대하는 것을 목표로 합니다. 평가·환류: 매 기수 종료 시 교육생 설문으로 이해도와 만족도를 점검하고, 신임경찰관의 눈높이와 현장 수요에 맞게 교안을 지속적으로 개선하고자 합니다.", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 5, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}], "과정·이유·검증 설명 관련 기재": [{"text": "’19.04.03-04.05. 인사처(국가공무원인재개발원) 제1기 빅데이터 분석 및 활용 교육(5일) 수료 ’19.06.17-07.26. 경찰청(경찰인재개발원) 제1기 빅데이터전문과정(6주) 수료 ’21.02. - ’23.02. 국민대학교 석사 AI·빅데이터(공학석사/ 2년) 졸업", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}, {"text": "하는데, 그 차이를 판단해서 적절한 방법을 골랐습니다. <인터넷에 공개된 AI 프로그램을 설치해 실제 운영해본 모델> - 3D Gaussian Splatting: 여러 장의 사진을 넣으면 3차원 공간으로 재구성해주는 모델", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}, {"text": "실행 중 나오는 오류를 AI와 함께 진단·수정해 완성했습니다. AI를 단독 챗봇이 아니라 QGIS·VSCode 같은 프로그램에 연결하고, 허깅페이스·오픈소스 모델을 로컬에서 직접 돌려서 운영하는 수준입니다. 도구 간 연동(MCP), 환경 세팅, 오류 대응까지 스스로 처리할 수 있어,", "source": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}]}, "media": [{"n": 40, "id": "18_l6kDziGJaQXD-u4X2Fl-f6niJItDrW", "file": "AI·데이터 역량강화 실행계획 3분  발표자료(경위 권도헌).mp4", "url": "https://drive.google.com/file/d/18_l6kDziGJaQXD-u4X2Fl-f6niJItDrW/view?usp=drivesdk", "duration": 208.361667, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\40.jpg", "segments": [{"start": 0.91, "end": 8.91, "text": "안녕하십니까. 경찰 대학 최한선재연구소에서 1121 신고 등 공공 데이터 분석을 담당하고 있는 경위건두원입니다.", "time": "00:00"}, {"start": 8.91, "end": 19.91, "text": "저는 이번 강사 양성과정을 통해 현장의 경험을 교육으로 재가공하고 그 교육이 경찰 조직의 실질적인 변화로 확산되는 실행 계획을 말씀드리고자 합니다.", "time": "00:08"}, {"start": 19.91, "end": 31.26, "text": "현재 현장에서는 AI를 얽게 생각해 활용을 주자는 경우와 반대로 AI가 만든 결과를 충분한 검증 없이 받아들인 경우가 함께 존재합니다.", "time": "00:19"}, {"start": 31.26, "end": 40.26, "text": "또한 112 신고, 순찰, 문사작성과 같은 일상적인 치안 업무에 AI를 어떻게 조금만 하는지 구체적으로 경험할 기회도 부족합니다.", "time": "00:31"}, {"start": 40.26, "end": 52.26, "text": "따라서 경찰관에게는 단순한 도구 사용법을 넘어 AI 결과에 근거를 확인하고 개인 존보와 평행의 문제까지 살피며 책임 있게 활용하는 판단 얘기 필요합니다.", "time": "00:40"}, {"start": 52.26, "end": 54.62, "text": "위해에 두 가지 교육과정을 운영하고자 합니다.", "time": "00:52"}, {"start": 54.62, "end": 59.54, "text": "먼저 시민경찰관은 20개 학급 총 800명을 대상으로 6차시 6시간의", "time": "00:54"}, {"start": 59.54, "end": 62.02, "text": "AI 리터러시 교육을 시시하겠습니다.", "time": "00:59"}, {"start": 62.02, "end": 66.98, "text": "교육은 AI 기념이의 도구체험, 치안 업무 적용, 윤리와 안전의 순서로", "time": "01:02"}, {"start": 66.98, "end": 69.2, "text": "단계적으로 구성하겠습니다.", "time": "01:06"}, {"start": 69.2, "end": 73.58, "text": "충남경찰장 실모자 80명에게는 실제 데이터를 직접 다루는 2시간의", "time": "01:09"}, {"start": 73.58, "end": 75.7, "text": "실습교육을 운영하겠습니다.", "time": "01:13"}, {"start": 75.7, "end": 79.58, "text": "단순한 설명에 그치지 않고 교육생이 직접 AI를 활용하고 결과를", "time": "01:15"}, {"start": 79.58, "end": 84.34, "text": "검증한 뒤 자신의 의문에 적용할 수 있도록 돕겠습니다.", "time": "01:19"}, {"start": 84.34, "end": 87.22, "text": "이 계획은 처음부터 새롭게 시작하는 구상은 아닙니다.", "time": "01:24"}, {"start": 87.22, "end": 91.9, "text": "2026년 하반기에는 시내켝찰관 10개 학급 400명과 중남경찰청", "time": "01:27"}, {"start": 91.9, "end": 97.34, "text": "실무자 80명 등 총 480명을 재상으로 운영된 교육 기반하고 있습니다.", "time": "01:31"}, {"start": 97.34, "end": 103.14, "text": "이를 바탕으로 2027년에는 시내켝찰관 800명과 시무자 80명 종 880명", "time": "01:37"}, {"start": 103.14, "end": 105.42, "text": "규모역으로 확대하겠습니다.", "time": "01:43"}, {"start": 105.42, "end": 116.86, "text": "매 기수의 설문 결과와 현장 의견을 교환을 반영하고 현재의 특당 중심 교육을 지속적이고 반복 가능한 정규 교과로 발전시키겠습니다.", "time": "01:45"}, {"start": 116.86, "end": 122.06, "text": "저는 이 계획을 실행하는데 필요한 실무 경험과 교육 영향을 함께 갖추고 있습니다.", "time": "01:56"}, {"start": 122.06, "end": 129.24, "text": "2019년부터 112 신고 데이터와 지리 시리얼데이터, 이미지 영상 데이터를 분석해왔고", "time": "02:02"}, {"start": 129.24, "end": 137.64, "text": "전국 18개 시도경찰청 실무자와 강사 양상 과정 교육생 신의경찰관, 필리핀경찰관을 대상으로 교육한 경험도 있습니다.", "time": "02:09"}, {"start": 137.64, "end": 144.04, "text": "또한 AI 비테이터 분야의 공학석사하기와 인공지능 데이터 사이언스 박사 과정을 실혈했고", "time": "02:17"}, {"start": 144.04, "end": 148.32, "text": "비테이터 분석 기사와 ADSP 자격을 갖추고 있습니다.", "time": "02:24"}, {"start": 148.32, "end": 156.96, "text": "단순한 기능 소개를 넘어 현장에서 실제로 마주치는 기술적 제약과 오류에 대응하는 방법까지 교육할 수 있습니다.", "time": "02:28"}, {"start": 156.96, "end": 161.5, "text": "교육의 성과는 수료 인원이 아니라 실제 업무의 변화로 증명하겠습니다.", "time": "02:36"}, {"start": 161.5, "end": 166.96, "text": "방법적인 신고, 통계자를 취업과 문소 요약, 지도 시각하에 되는 시간을 줄여", "time": "02:41"}, {"start": 166.96, "end": 170.72, "text": "경찰관이 판단과 기획에 더욱 집중하도록 하겠습니다.", "time": "02:46"}, {"start": 170.72, "end": 175.76, "text": "또한 신고가 집중되는 시간과 지역, 범죄 취약지장을 데이터로 분석해", "time": "02:50"}, {"start": 175.76, "end": 180.0, "text": "한정된 순찰 자원을 더욱 합리적으로 배분하도록 돕겠습니다.", "time": "02:55"}, {"start": 180.0, "end": 187.0, "text": "이와 함께 개인정보보호, 결과 검증, 평양 방지, 원칙을 현장에 정착시켜", "time": "03:00"}, {"start": 187.0, "end": 192.56, "text": "AI 허령이 더욱 신속하고 공정한 치안 서비스로 이어지도록 하겠습니다.", "time": "03:07"}, {"start": 192.56, "end": 198.24, "text": "저는 인공신흥의 강점과 한계를 정확하게 전달하고 AI와 경찰 치안", "time": "03:12"}, {"start": 198.24, "end": 203.22, "text": "업무를 연결하며 교육생의 교육 시습과 주중내 확산을 이끄는", "time": "03:18"}, {"start": 203.22, "end": 205.54, "text": "퍼실리테이터가 되도록 하겠습니다.", "time": "03:23"}, {"start": 205.54, "end": 206.14, "text": "감사합니다.", "time": "03:25"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/40/18_l6kDziGJaQXD-u4X2Fl-f6niJItDrW.mp4", "frame": "../영상장면/40.jpg", "quotes": [{"start": 73.58, "end": 75.7, "text": "실습교육을 운영하겠습니다.", "time": "01:13", "category": "강의·학습 지원 관련 기재"}, {"start": 8.91, "end": 19.91, "text": "저는 이번 강사 양성과정을 통해 현장의 경험을 교육으로 재가공하고 그 교육이 경찰 조직의 실질적인 변화로 확산되는 실행 계획을 말씀드리고자 합니다.", "time": "00:08", "category": "기관 내 확산 계획 관련 기재"}, {"start": 19.91, "end": 31.26, "text": "현재 현장에서는 AI를 얽게 생각해 활용을 주자는 경우와 반대로 AI가 만든 결과를 충분한 검증 없이 받아들인 경우가 함께 존재합니다.", "time": "00:19", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 40, "name": "권도헌", "title": "AI·데이터 역량강화 실행계획 3분  발표자료(경위 권도헌).mp4", "mime": "video/mp4", "bytes": 92032650, "downloaded": true, "url": "https://drive.google.com/file/d/18_l6kDziGJaQXD-u4X2Fl-f6niJItDrW/view?usp=drivesdk", "local": "../원본/40/18_l6kDziGJaQXD-u4X2Fl-f6niJItDrW.mp4", "id": "18_l6kDziGJaQXD-u4X2Fl-f6niJItDrW"}, {"n": 40, "name": "권도헌", "title": "(붙임) 강사 양성 과정 신청서(경위 권도헌).pdf", "mime": "application/pdf", "bytes": 435196, "downloaded": true, "url": "https://drive.google.com/file/d/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag/view?usp=drivesdk", "local": "../원본/40/1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag.pdf", "id": "1u1shcHeuP7H-9wVE5bP1o7p3UO87r8ag"}], "doc_count": 1, "media_count": 1}, {"n": 41, "original_no": 41, "row": 42, "name": "박경수", "org": "경찰청", "folder_title": "41. 경찰청_박경수", "folder_url": "https://drive.google.com/drive/folders/1SlS-39O7TsYip-MY-crO0zVBe2VOB1UI", "summary": "주문·조리·수령 앱, 개인 에이전트 환경 등 제작·실행·복구 경험을 기재. 문제정의부터 테스트·수정·재검증까지 실습하는 교육을 제시함.", "evidence": {"자기주도 학습 관련 기재": [], "AI 업무 활용 관련 기재": [{"text": "2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 저는 생성형 AI를 단순한 정보검색이나 문서작성 도구가 아니라, 실제 업무문제를 분석하고 프로그램·자 동화도구를 구현하는 실전 도구로 활용하고 있습니다. ChatGPT Pro x20, Claude, Gemini, Grok 등 주", "source": "(붙임) 강사 양성 과정 신청서(경위 박경수).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1ys1dl4jX_qXhb8METvToseBy8pvebauf/view?usp=drivesdk", "id": "1ys1dl4jX_qXhb8METvToseBy8pvebauf"}, {"text": "동화도구를 구현하는 실전 도구로 활용하고 있습니다. ChatGPT Pro x20, Claude, Gemini, Grok 등 주 요 생성형 AI에 월 약 50만 원 수준을 지속적으로 지출하며, 동일 과제를 여러 모델에 적용해 성능과 한 계를 비교하고 목적에 맞는 모델을 선택해 왔습니다.", "source": "(붙임) 강사 양성 과정 신청서(경위 박경수).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1ys1dl4jX_qXhb8METvToseBy8pvebauf/view?usp=drivesdk", "id": "1ys1dl4jX_qXhb8METvToseBy8pvebauf"}, {"text": "최근에 출시된 GPT Astra와 제가 가진 M1 MAX 64G 맥북에 Qwen3.8 Flash 모델을 설치하여 활용하고 있으며, AI챔피언 Green·Blue 인증과 공공 AI역량 8대 과목 이수를 바탕으로 실제 프로젝트와 공공업무 적용 경험을 함께 축적하고 있습니다.", "source": "(붙임) 강사 양성 과정 신청서(경위 박경수).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1ys1dl4jX_qXhb8METvToseBy8pvebauf/view?usp=drivesdk", "id": "1ys1dl4jX_qXhb8METvToseBy8pvebauf"}], "강의·학습 지원 관련 기재": [{"text": "1) 강의 실적 및 경험 기간 기관 강의·운영 내용, 대상 역할 비고 ※ 강의 실적을 기재. 실적이 없는 경우 공란으로 두고 계획 위주로 작성", "source": "(붙임) 강사 양성 과정 신청서(경위 박경수).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1ys1dl4jX_qXhb8METvToseBy8pvebauf/view?usp=drivesdk", "id": "1ys1dl4jX_qXhb8METvToseBy8pvebauf"}, {"text": "- (경험) 기존 강의·교육 운영, 학습자 지원·멘토링 등관련 경험을 구체적으로 기술 - 2 -", "source": "(붙임) 강사 양성 과정 신청서(경위 박경수).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1ys1dl4jX_qXhb8METvToseBy8pvebauf/view?usp=drivesdk", "id": "1ys1dl4jX_qXhb8METvToseBy8pvebauf"}, {"text": "라 ‘어디까지 해도 되는가’를 함께 가르치는 교육을 운영하고자 합니다. 또한 제가 만든 112 사건처리 지원 로컬 AI 시스템을 사례로 활용하여, AI가 업무판단을 대신하는 것이 아니라 관련 기준과 누락 가능 항목을 제시하고 사람이 최종 확인·수정하는 구조가 왜 필요한지도 설명", "source": "(붙임) 강사 양성 과정 신청서(경위 박경수).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1ys1dl4jX_qXhb8METvToseBy8pvebauf/view?usp=drivesdk", "id": "1ys1dl4jX_qXhb8METvToseBy8pvebauf"}], "기관 내 확산 계획 관련 기재": [{"text": "를 여러 기기가 공유하는 과정에서 인터넷 불안정, 재연결, 중복처리, 상태 불일치 등의 문제를 경험하였 고, 이후 Codex와 함께 Android 호스트와 여러 브라우저 단말이 연동되는 주문·조리·수령 통합 운영 앱 으로 확장하였습니다. 자연어로 데이터 역량강화 실행계획 3분 발표자료(경위 박경수).mp4", "url": "https://drive.google.com/file/d/1k02euQ6aMzX6f6OKpH8BzfAICydjFuuV/view?usp=drivesdk", "duration": 174.0, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\41.jpg", "segments": [{"start": 0.5, "end": 4.0, "text": "파주경찰서 경위 박경수입니다.", "time": "00:00"}, {"start": 4.0, "end": 10.47, "text": "현장에서 시작하는 AI 역량 강화 계획을 말씀드리겠습니다.", "time": "00:04"}, {"start": 10.47, "end": 12.47, "text": "먼저 문제점입니다.", "time": "00:10"}, {"start": 12.47, "end": 16.47, "text": "안복되는 문서 작업과 기록 점검의 시간이 들지만", "time": "00:12"}, {"start": 16.47, "end": 20.47, "text": "직원들이 필요한 도구를 직접 만들기는 어렵습니다.", "time": "00:16"}, {"start": 20.47, "end": 23.97, "text": "경찰 업무는 민감정보 보호도 중요합니다.", "time": "00:20"}, {"start": 23.97, "end": 30.47, "text": "교육에서 배운 내용을 실제 업무 개선으로 연결할 실습과 검증 과정이 필요합니다.", "time": "00:23"}, {"start": 30.47, "end": 35.47, "text": "해결방안은 현장의 작은 과제로 시작하는 실습 교육입니다.", "time": "00:30"}, {"start": 35.47, "end": 43.47, "text": "제가 만든 웹앱구러미는 자주 쓰는 로컬 도구를 모아 오프라인이나 내부망에서 사용하도록 구성했습니다.", "time": "00:35"}, {"start": 43.47, "end": 51.47, "text": "경찰 업무 보조 앱의 초안 작성과 사실 점검도 가상 자료를 활용한 교육 예제로 삼겠습니다.", "time": "00:43"}, {"start": 51.47, "end": 60.94, "text": "축제에서 직접 만든 주문도구를 사용하고 현장의 문제를 찾아 개선한 경험도 요구사항과 오류수정 실습에 활용하겠습니다.", "time": "00:51"}, {"start": 61.94, "end": 69.94, "text": "수료 후 한 달 안에 첫 교육을 시작하는 것을 목표로 소속 부서와 일정과 실습 환경을 협의하겠습니다.", "time": "01:01"}, {"start": 69.94, "end": 75.94, "text": "직원 10명에서 15명을 대상으로 2시간씩 4차 시 총 8시간을 계획합니다.", "time": "01:09"}, {"start": 75.94, "end": 83.94, "text": "표준 교육 자료와 공개 자료, 가상 자료를 활용하고 실습 전 설치와 실행 여부를 확인하겠습니다.", "time": "01:15"}, {"start": 83.94, "end": 96.94, "text": "첫 차시는 업무 문제와 요구사항 정리, 두 번째는 AI와 구현, 세 번째는 실행과 오류수정, 네번째는 동료 검증과 공유입니다.", "time": "01:23"}, {"start": 96.94, "end": 103.94, "text": "교육생마다 요구사항 한 페이지와 직접 실행하는 업무 지원 도구 하나를 완성하도록 돕겠습니다.", "time": "01:36"}, {"start": 103.94, "end": 112.94, "text": "기대 효과는 세 가지입니다. 직원은 특별히 신경쓰는 과정 운영을 하겠음 - 경찰 AI챔피언 그린· 블루과정 총 5회, 총 80~100명(그린60명· 블루40명) 양성 목표", "source": "(붙임) 강사 양성 과정 신청서(경위 이상현).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1IR_qojOEhRPQSbIOiFc1XDTTsKWayZtv/view?usp=drivesdk", "id": "1IR_qojOEhRPQSbIOiFc1XDTTsKWayZtv"}, {"text": "실현 가능한 계획을 제시해 주십시오. 운영의 구체성·실현 가능성·확산 효과 등을 종합 심사합니다. 1) 기관 자체 교육 운영 실적 기간 과정명 대상·인원 운영방식 본인 역할 비고", "source": "(붙임) 강사 양성 과정 신청서(경위 이상현).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1IR_qojOEhRPQSbIOiFc1XDTTsKWayZtv/view?usp=drivesdk", "id": "1IR_qojOEhRPQSbIOiFc1XDTTsKWayZtv"}, {"text": "- AI 결과를 원자료와 대조하여 출처·수치·누락·편향을 확인하고 담당자가 최종 판단 하도록 함. - 인증평가에도 보안 위반요소 식별, 입력 가능 정보 판단, 비식별화, 결과 검증을 필수항목", "source": "(붙임) 강사 양성 과정 신청서(경위 이상현).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1IR_qojOEhRPQSbIOiFc1XDTTsKWayZtv/view?usp=drivesdk", "id": "1IR_qojOEhRPQSbIOiFc1XDTTsKWayZtv"}]}, "media": [{"n": 42, "id": "1-0ZXMiy0CBqd7CTLhpVXdMazGs6tMCWI", "file": "AI·데이터 역량강화 실행계획 3분  발표자료(경위 이상현).mp3", "url": "https://drive.google.com/file/d/1-0ZXMiy0CBqd7CTLhpVXdMazGs6tMCWI/view?usp=drivesdk", "duration": 204.303673, "video": false, "audio": true, "segments": [{"start": 0.34, "end": 5.84, "text": "안녕하십니까? 경찰 인지개발원 경무웃센터에서 근무하고 있는 이상현입니다.", "time": "00:00"}, {"start": 5.84, "end": 10.64, "text": "저는 24년 2월부터 정보장비분야 교육과정을 설계하고 운영하며", "time": "00:05"}, {"start": 10.64, "end": 15.64, "text": "정보통신 보안, 개인정보 보호, 또 재난안전 통신망 등을 강의하고 있습니다.", "time": "00:10"}, {"start": 15.64, "end": 20.64, "text": "경찰에 입직하기 전에는 휴대전화 하되어 회로 설계 연구원으로 연구개발 업무를 했었고,", "time": "00:15"}, {"start": 20.64, "end": 27.14, "text": "그 이후에인지 정보통신경찰로 입직해서 지금까지 관련 분야의 전문성을 쌓아오고 있습니다.", "time": "00:20"}, {"start": 27.14, "end": 39.58, "text": "현재는 다양한 계급의 재직제뿐 아니라 신임경찰관 또 신임행정관 청년인턴 등 현장 실무자에게 관련 교육을 2년 반 약 한 900시간 정도 가까이 실시를 하고 있습니다.", "time": "00:27"}, {"start": 39.58, "end": 44.98, "text": "최근 인지개발원에서도 생성형 AI에 대한 관심이 크게 높아졌습니다.", "time": "00:39"}, {"start": 44.98, "end": 56.82, "text": "올 초부터 AI 특강을 교육행정계에서 운영 진행하고 있는데 외래강사 출강으로 해서 AI 흥미 위치에서 살아 업무 활용도 면에서는 제가 좀 고민을 해 오고 있었습니다.", "time": "00:44"}, {"start": 56.82, "end": 63.62, "text": "그래도 나중에 지난 8월에 행안부 주간 AI 챔피언 그린 과정에 제가 참여를 했고", "time": "00:56"}, {"start": 63.62, "end": 68.42, "text": "3일간 집중교육 또 자유락습 또 수행평가를 하게 되었습니다.", "time": "01:03"}, {"start": 68.42, "end": 71.92, "text": "그 과정에서 한 가지 제가 좀 중요한 의구심을 갖게 되었는데", "time": "01:08"}, {"start": 71.92, "end": 79.42, "text": "과연 경찰은 AI를 실제 업무에 어떻게 안전하게 활용하는가 하는 것이 문제입니다.", "time": "01:11"}, {"start": 79.42, "end": 84.92, "text": "경찰 업무 자료에는 대외비 수사 자료 또 민감한 개인 정보가 많습니다.", "time": "01:19"}, {"start": 84.92, "end": 89.04, "text": "또 경찰청 망에는 내부망 외부망이 분리되어 있고", "time": "01:24"}, {"start": 89.04, "end": 94.52, "text": "이건 상용망이 아니라 상용 AI 서비스 접근과 자료 업로드도", "time": "01:29"}, {"start": 94.52, "end": 96.4, "text": "극히 제한이 되고 있습니다.", "time": "01:34"}, {"start": 96.4, "end": 101.28, "text": "현장 직원들은 AI에 관심이 많지만 명확한 기준이 부족해서", "time": "01:36"}, {"start": 101.28, "end": 102.84, "text": "보안 사고에 대한 두려움도 있고", "time": "01:41"}, {"start": 102.84, "end": 106.4, "text": "이 활용 방법에 대한 혼란을 함께 느끼고 있습니다.", "time": "01:42"}, {"start": 106.4, "end": 108.92, "text": "따라서 AI의 교육은 경찰에서는", "time": "01:46"}, {"start": 108.92, "end": 112.2, "text": "특히 단순한 도구 사용법을 넘어야 되고요.", "time": "01:48"}, {"start": 112.2, "end": 116.76, "text": "먼저 사람이 업무를 설계하고 AI가 초안을 지원하며", "time": "01:52"}, {"start": 116.76, "end": 120.56, "text": "마지막으로 사람이 다시 원자료와 대조해서 검증하는", "time": "01:56"}, {"start": 120.56, "end": 124.44, "text": "샌드위치 워크플로어를 정착시켜야 된다고 생각합니다.", "time": "02:00"}, {"start": 124.44, "end": 127.32, "text": "개인정보 마스크, 보안 등급별, 입력 제한,", "time": "02:04"}, {"start": 127.32, "end": 132.36, "text": "출처 확인, 교차 검증 등을 필수 절차로 교육을 해야 된다고 생각합니다.", "time": "02:07"}, {"start": 132.36, "end": 134.44, "text": "장기적으로는 내부망에서 운영할 수 있는", "time": "02:12"}, {"start": 134.44, "end": 137.76, "text": "로컬, AI 파이프라인, SLM 등", "time": "02:14"}, {"start": 137.76, "end": 143.68, "text": "검증도구를 구축하고 이것을 운용할 인력도 양성해야 된다고 합니다.", "time": "02:17"}, {"start": 143.68, "end": 151.36, "text": "제가 제안하는 경찰형 AI 챔피언 과정은 이틀에서 3일간의 교육과 별도의 수행평가로 후성됩니다.", "time": "02:23"}, {"start": 151.36, "end": 162.26, "text": "평가는 단순한 트럼프트 작성 능력만 보는 게 아니라 개인정보 마스킹 준수 여부, 원자료, 대조, 검증, 그리고 또 보안 규정을 준수했느냐", "time": "02:31"}, {"start": 162.26, "end": 167.76, "text": "경찰 업무 적용의 가능성을 필수 항목으로 포함했으면 합니다.", "time": "02:42"}, {"start": 167.76, "end": 177.38, "text": "이를 통해서 경찰청과 행안부가 공인하는 신뢰도 높은 공공 AI 인증 체계를 만들 수 있을 것입니다.", "time": "02:47"}, {"start": 177.38, "end": 189.82, "text": "이 AI 도구가 정말 지금 현지 필요한데 이것을 경찰에 수사와 행정을 지원하는 강력하고 책임 있는 도구로 사용을 하는 것이 중요하다고 생각합니다.", "time": "02:57"}, {"start": 189.82, "end": 194.9, "text": "경찰 인재개발원에서 AI 챔피언 기관 인증 과정을 운영해서", "time": "03:09"}, {"start": 194.9, "end": 198.32, "text": "대한민국 과학 치안의 표준을 세울 수 있도록", "time": "03:14"}, {"start": 198.32, "end": 201.78, "text": "적극적인 관심과 지지를 부탁드립니다.", "time": "03:18"}, {"start": 201.78, "end": 203.46, "text": "경청해 주셔서 감사합니다.", "time": "03:21"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/42/1-0ZXMiy0CBqd7CTLhpVXdMazGs6tMCWI.mp3", "frame": null, "quotes": [{"start": 10.64, "end": 15.64, "text": "정보통신 보안, 개인정보 보호, 또 재난안전 통신망 등을 강의하고 있습니다.", "time": "00:10", "category": "강의·학습 지원 관련 기재"}, {"start": 5.84, "end": 10.64, "text": "저는 24년 2월부터 정보장비분야 교육과정을 설계하고 운영하며", "time": "00:05", "category": "기관 내 확산 계획 관련 기재"}, {"start": 27.14, "end": 39.58, "text": "현재는 다양한 계급의 재직제뿐 아니라 신임경찰관 또 신임행정관 청년인턴 등 현장 실무자에게 관련 교육을 2년 반 약 한 900시간 정도 가까이 실시를 하고 있습니다.", "time": "00:27", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 42, "name": "이상현", "title": "AI·데이터 역량강화 실행계획 3분  발표자료(경위 이상현).mp3", "mime": "audio/mpeg", "bytes": 4904173, "downloaded": true, "url": "https://drive.google.com/file/d/1-0ZXMiy0CBqd7CTLhpVXdMazGs6tMCWI/view?usp=drivesdk", "local": "../원본/42/1-0ZXMiy0CBqd7CTLhpVXdMazGs6tMCWI.mp3", "id": "1-0ZXMiy0CBqd7CTLhpVXdMazGs6tMCWI"}, {"n": 42, "name": "이상현", "title": "(붙임) 강사 양성 과정 신청서(경위 이상현). ory": "AI 업무 활용 관련 기재"}, {"start": 63, "text": "02 해결방안\n3단계 확산 구조\n수료 즉시 1년 내 기관 운영 제계 완성\n해결방안 • 확산 구조\n경찰수사연수원 교무과 • 교수요원 경위 이진호\n1단계\n신임수사관 과정 실습 편성\n기존 해시 생성 실습을 표준 교안으로\n체계화 -수 연 1,000명+ '첫 도구' 제작\n2단계\n전문과정(사이버 • 포렌식) 심화\n수사관이 자기 업무 도구를 직접 제작\n현장 도구 라이브러리로 축적 • 공유\n3단계\n동료 교수요원 강사 양성\n연수원 내 후속 퍼실리테이터 양성\n1인 강의 -수 기관 운영 체계로 전환\n2026 A|챔피언 및 공공 A|역량 트랙 강사 양성 과정 신청", "time": "01:03", "category": "기관 내 확산 계획 관련 기재"}, {"start": 23, "text": "01 문제점\n도구가 필요한 사람이, 도구를 만들 수 없다\n경찰 수사 현장의 현재 상황\n0\n수요는 급증\n신임수사관 과정 연 1,000명 이상 통과\n전자정보 압수• 디지털 증거 처리는\n모든 수사관의 일상 자동화 수요 큼\n경찰수사연수원 교무과 • 교수요원 경위 이진호\n도구의 공백\n해시 생성 • 검증, 로그 정리, 증거 목록화\n같은 작은 도구는 상용 솔루션 밖\n수작업 반복, 외부 개발은 보안 제약\n문제점 2/3\n2026 A|챔피언 및 공공 A|역량 트랙 강사 양성 과정 신청", "time": "00:23", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 43, "name": "이진호", "title": "AI·데이터 역량강화 실행계획 3분 발표자료(경위 이진호).mp4", "mime": "video/mp4", "bytes": 4694388, "downloaded": true, "url": "https://drive.google.com/file/d/15U2S-O2sJ0ekxqvxJzPInUSZp3F_P9BT/view?usp=drivesdk", "local": "../원본/43/15U2S-O2sJ0ekxqvxJzPInUSZp3F_P9BT.mp4", "id": "15U2S-O2sJ0ekxqvxJzPInUSZp3F_P9BT"}, {"n": 43, "name": "이진호", "title": "(붙임) 강사 양성 과정 신청서(경위 이진호).pdf", "mime": "application/pdf", "bytes": 587343, "downloaded": true, "url": "https://drive.google.com/file/d/1yKfGDbcki3z0C5qkqIvy5CK8Lz5a9NKp/view?usp=drivesdk", "local": "../원본/43/1yKfGDbcki3z0C5qkqIvy5CK8Lz5a9NKp.pdf", "id": "1yKfGDbcki3z0C5qkqIvy5CK8Lz5a9NKp"}], "doc_count": 1, "media_count": 1}, {"n": 44, "original_no": 44, "row": 45, "name": "최창영", "org": "경찰청", "folder_title": "44. 경찰청_최창영", "folder_url": "https://drive.google.com/drive/folders/17X_VDbHVuyo88rM_zUewHQVkzT-1pEZO", "summary": "업무 프로그램 개발·자동화 경험을 기재. 회당 10~12명, 연 6회 실습과 1:1 오류 해결·피드백을 계획함.", "evidence": {"자기주도 학습 관련 기재": [], "AI 업무 활용 관련 기재": [{"text": "2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 지난 1년 이상 ChatGPT Plus, Claude Pro, Gemini Advanced를 유료 구독하며 실제 치안 실무와 콘텐츠 제작에 상시 활용해 왔습니다. 단순 호기심 차원의 질의를 넘어 각 도구의 특성을 정확히", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}, {"text": "지난 1년 이상 ChatGPT Plus, Claude Pro, Gemini Advanced를 유료 구독하며 실제 치안 실무와 콘텐츠 제작에 상시 활용해 왔습니다. 단순 호기심 차원의 질의를 넘어 각 도구의 특성을 정확히 파악하고 업무 성격에 맞춰 교차 운용하고 있습니다.", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}, {"text": "Claude: 복잡한 경찰 훈령·지침 분석, 행정 보고서의 논리 구조 교정 및 정제된 공문서 문체화에 특화 활용 ChatGPT: 기획안 뼈대 구성, 정형화된 행정 서식 제작 및 반복 업무 자동화 템플릿 개발에 활용 Gemini: 방대한 데이터 처리와 멀티모달 분석을 바탕으로 치안 통계 자료 검토 및 신속한 리서치에 운용", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}], "강의·학습 지원 관련 기재": [{"text": "2013.04.01∼2017.11.27 중앙경찰학교 교무과 운전학과 교수요원, 행정요원 2017.11.28∼2021.12.30 충북경찰청 여성청소년과 수사관 2021.12.31∼2024.11.19 충북경찰청 음성경찰서 순찰요원", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 1, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}, {"text": "1) 강의 실적 및 경험 기간 기관 강의·운영 내용, 대상 역할 비고 지역경찰 전산업무", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}, {"text": "- (경험) 기존 강의·교육 운영, 학습자 지원·멘토링 등관련 경험을 구체적으로 기술 2) AI 도구(ChatGPT·Claude·Gemini 등) 활용 경험 지난 1년 이상 ChatGPT Plus, Claude Pro, Gemini Advanced를 유료 구독하며 실제 치안 실무와", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}], "기관 내 확산 계획 관련 기재": [{"text": "대상 및 주기: 관서 내 행정 실무자 및 지구대·파출소 직원을 대상으로 분기별 정기 집중 교육(회당 4H)과 월 1회 소그룹 실습 멘토링 운영 운영 방식: 일방적인 이론 전달을 지양하고, '표준 교안 30분 + 1인 1실습 90분 + 업무 적용 산출물", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}, {"text": "4H)과 월 1회 소그룹 실습 멘토링 운영 운영 방식: 일방적인 이론 전달을 지양하고, '표준 교안 30분 + 1인 1실습 90분 + 업무 적용 산출물 도출' 방식의 철저한 퍼실리테이션 중심 수업 진행", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}, {"text": "사후 지원: 일회성 교육으로 끝나지 않도록 교육 수료자 대상 전산 질의 창구를 열어두고, 업무 중 막히는 부분을 상시 코칭해주는 지속 가능한 사내 AI 멘토로서의 역할을 다하겠습니다. - 3 -", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}], "과정·이유·검증 설명 관련 기재": [{"text": "대입하기 어려운 한계가 있었습니다. 본인은 20년 차 경찰관으로서 현업의 고충과 행정 프로세스를 명확히 이해하고 있습니다. 행정안전부의 표준 교안을 충실히 반영하되, 이를 우리 경찰의 실무 언어로 재해석하여 교육생이 복귀 즉시 업무에", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}, {"text": "실현 가능한 계획을 제시해 주십시오. 운영의 구체성·실현 가능성·확산 효과 등을 종합 심사합니다. 1) 기관 자체 교육 운영 실적 기간 과정명 대상·인원 운영방식 본인 역할 비고", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}, {"text": "외부 범용 교육의 한계였던 '실무 적용 단절'을 극복하고, 20년 현장 실무 경험 기반의 '경찰 맞춤형 AI 업무 활용 프로세스'를 교육 (운영 대상 및 예상 인원)", "source": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}]}, "media": [{"n": 44, "id": "1UtIj17CWO6LcT4ehmqP95YA3dYDE2B7T", "file": "AI·데이터 역량강화 실행계획 3분 발표자료(경위 최창영).mp4", "url": "https://drive.google.com/file/d/1UtIj17CWO6LcT4ehmqP95YA3dYDE2B7T/view?usp=drivesdk", "duration": 177.984, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\44.jpg", "segments": [{"start": 0.0, "end": 7.2, "text": "안녕하십니까. 2026년 공공 AI 역량 트랙 강사 양성과정이 지원한 충북경찰청 최창영경입니다.", "time": "00:00"}, {"start": 7.2, "end": 13.12, "text": "현재 경찰 내부에서도 생성형 AI에 대한 동료들의 관심과 배음의 열기가 매우 뜨겁습니다.", "time": "00:07"}, {"start": 13.12, "end": 19.92, "text": "그래서 경찰 내에 AI 관련 교육들이 많이 지행되고는 있지만 교육을 받은 후 정작 현업으로 돌아오면", "time": "00:13"}, {"start": 19.92, "end": 25.84, "text": "내용은 참 좋은데 내 업무의 구체적으로 어떻게 적용해야 할지 모르겠다며 아쉬움을 털어놓고는 합니다.", "time": "00:19"}, {"start": 25.84, "end": 30.24, "text": "외부 강사님께서 AI 기술에 능통하신 것은 분명 맞지만", "time": "00:25"}, {"start": 30.24, "end": 33.72, "text": "112 신고철이나 복잡한 수사치한 행정처럼", "time": "00:30"}, {"start": 33.72, "end": 39.28, "text": "경찰 조직 특유의 고요한 업무 흐름을 다 아시기에는 어렵기 때문이라고 생각합니다.", "time": "00:33"}, {"start": 39.28, "end": 44.72, "text": "바로 이 지점에서 AI와 현장 실무 사이에 간극이 생겨나고 있다고 느꼈습니다.", "time": "00:39"}, {"start": 44.72, "end": 48.48, "text": "저는 20년 동안 경찰의 여러 분야를 두루 거쳐오며", "time": "00:44"}, {"start": 48.48, "end": 51.52, "text": "현장에 다양한 업무를 직접 경험해왔습니다.", "time": "00:48"}, {"start": 51.52, "end": 55.96, "text": "그렇기에 경찰이 어떤 분야의 AI를 어떻게 접목하면 좋을지", "time": "00:51"}, {"start": 55.96, "end": 61.84, "text": "동료들에게 가장 현실적이고 수입모 있는 실무적 인사이트를 조심스럽게 건네 수 있다고 생각합니다.", "time": "00:55"}, {"start": 61.84, "end": 70.4, "text": "지난 1년 넘게 채치 PT 클로드 재미나의 같은 주요 AI 도구를 유료를 구독하며 실무에 적용하려 노력해왔습니다.", "time": "01:01"}, {"start": 70.4, "end": 77.72, "text": "그 결과 AI 원고와 슬라이드를 기획 제작해서 경찰청 내부 학습 콘텐츠의 우수인증을 받았고", "time": "01:10"}, {"start": 77.72, "end": 83.88, "text": "경찰선의 쇼폼 영상 공모전회에서도 AI 영상 제작투를 활용해 1위를 차지했을 정도로", "time": "01:17"}, {"start": 83.88, "end": 87.64, "text": "도구 활용과 실무 전목에 대한 깊은 이해도를 다져왔습니다.", "time": "01:23"}, {"start": 87.64, "end": 91.96, "text": "최근에는 AI 에이전트와 바이브 코딩까지 차근차근 익혀가며", "time": "01:27"}, {"start": 91.96, "end": 96.96, "text": "현장의 작은 아이들을 실제 도구로 빚어내는 방법도 꾸준히 공부하고 있습니다.", "time": "01:31"}, {"start": 96.96, "end": 99.2, "text": "제가 본 과정을 수료하게 된다면", "time": "01:36"}, {"start": 99.2, "end": 105.12, "text": "행안볼에 탄탄한 표준 교환 위에 경찰 업무를 AI를 활용하는 방법을 전목해서", "time": "01:39"}, {"start": 105.12, "end": 109.24, "text": "10명에서 12명 소수정의 집중 실습 강자를 운영하겠습니다.", "time": "01:45"}, {"start": 109.24, "end": 111.76, "text": "두꺼운 치한 메뉴얼 속에서 필요한 지침을", "time": "01:49"}, {"start": 111.76, "end": 114.96, "text": "즉시 찾아주는 나만의 AI 비서 만들기부터", "time": "01:51"}, {"start": 114.96, "end": 118.4, "text": "현장 보고서 초안을 수월하게 뼈대 잡는 방법까지", "time": "01:54"}, {"start": 118.4, "end": 120.4, "text": "내일부터 당장 현업에 써먹을 수 있는", "time": "01:58"}, {"start": 120.4, "end": 122.6, "text": "실질적인 교육을 진행하겠습니다.", "time": "02:00"}, {"start": 122.6, "end": 125.0, "text": "현장 경찰관들의 가려운 부분을 긁어주는", "time": "02:02"}, {"start": 125.0, "end": 127.32, "text": "맞춤형 교육을 통해 동료들에게", "time": "02:05"}, {"start": 127.32, "end": 129.8, "text": "실질적인 변화를 만들어주고 싶습니다.", "time": "02:07"}, {"start": 129.8, "end": 133.28, "text": "작은 행정 업무부터 AI를 손에 익히기 시작하면", "time": "02:09"}, {"start": 133.28, "end": 141.28, "text": "비개발 직군의 현장 직원들도 나도 할 수 있다는 자신감과 디지털 효능감을 자연스럽게 얻게 될 것이라고 생각합니다.", "time": "02:13"}, {"start": 141.28, "end": 152.96, "text": "이러한 경험이 쌓여 결국엔 현장에서 꼭 필요하고 느꼈던 치한 아이디어들을 동료들 스스로 AI도구나 체보스로 구현해내는 소중한 결실로 이어질 것이라고 생각합니다.", "time": "02:21"}, {"start": 152.96, "end": 166.68, "text": "저는 지식을 일방적으로 가르치는 거창한 강사가 되갯보다는 최신 기술과 경찰 현장 사이에서 동료들의 눈높이에 맞춰 함께 고민하고 길을 터주는 산의 퍼실리 데이터가 되고 싶습니다.", "time": "02:32"}, {"start": 166.68, "end": 177.88, "text": "교육이 끝난 후에도 동료들이 언제나 부담 없이 찾아와 이 업무의 AI를 어떻게 쓰면 좋을까 편하게 묻고 상의할 수 있는 든든한 산의 AI 멘토로 묵묵히 함께 하겠습니다.", "time": "02:46"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/44/1UtIj17CWO6LcT4ehmqP95YA3dYDE2B7T.mp4", "frame": "../영상장면/44.jpg", "quotes": [{"start": 141.28, "end": 152.96, "text": "이러한 경험이 쌓여 결국엔 현장에서 꼭 필요하고 느꼈던 치한 아이디어들을 동료들 스스로 AI도구나 체보스로 구현해내는 소중한 결실로 이어질 것이라고 생각합니다.", "time": "02:21", "category": "AI 업무 활용 관련 기재"}, {"start": 120.4, "end": 122.6, "text": "실질적인 교육을 진행하겠습니다.", "time": "02:00", "category": "강의·학습 지원 관련 기재"}, {"start": 105.12, "end": 109.24, "text": "10명에서 12명 소수정의 집중 실습 강자를 운영하겠습니다.", "time": "01:45", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 44, "name": "최창영", "title": "AI·데이터 역량강화 실행계획 3분 발표자료(경위 최창영).mp4", "mime": "video/mp4", "bytes": 10821102, "downloaded": true, "url": "https://drive.google.com/file/d/1UtIj17CWO6LcT4ehmqP95YA3dYDE2B7T/view?usp=drivesdk", "local": "../원본/44/1UtIj17CWO6LcT4ehmqP95YA3dYDE2B7T.mp4", "id": "1UtIj17CWO6LcT4ehmqP95YA3dYDE2B7T"}, {"n": 44, "name": "최창영", "title": "(붙임) 강사 양성 과정 신청서(경위 최창영).pdf", "mime": "application/pdf", "bytes": 238562, "downloaded": true, "url": "https://drive.google.com/file/d/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns/view?usp=drivesdk", "local": "../원본/44/1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns.pdf", "id": "1Vg5ZuohrvoVOWnkWry9Lw0G9NLC0VSns"}], "doc_count": 1, "media_count": 1}, {"n": 45, "original_no": 45, "row": 46, "name": "구현모", "org": "경찰청", "folder_title": "45. 경찰청_구현모", "folder_url": "https://drive.google.com/drive/folders/1VrthCxEkgxRVWncf1COoLKDfLA-h749_", "summary": "AI와 코드 설계·오류 원인 분석·검증을 반복한 경험을 기재. 6~10명 학습그룹에서 업무 문제 발굴·실습·인증 준비를 연결하는 계획을 제시함.", "evidence": {"자기주도 학습 관련 기재": [{"text": "생성형 AI 활용 데이터분석 심화 인증 자기주도 행정안전부 인증 등 학습 과정", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 1, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}], "AI 업무 활용 관련 기재": [{"text": "2) AI 도구(ChatGPTCIaudeGemini 등) 활용 경험 저는 AI를 특별한 업무가 있을 때만 사용하는 도구가 아니라, 일상적인 업무와 생활에서 함께 사고하는 도구로 활용하고 있습니다. 현재 ChatGPT Plus와 Claude Max 5X를 직접 구독하여 지속적으로", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}, {"text": "도구로 활용하고 있습니다. 현재 ChatGPT Plus와 Claude Max 5X를 직접 구독하여 지속적으로 사용하고 있으며, 새로운 기능과 활용 방법이 등장할 때마다 직접 시험해 보고 서로 다른 AI의 결과를 비교하면서 효과적인 활용 방법을 익히고 있습니다.", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}, {"text": "예상되는 반론이나 누락된 사항을 찾는 보조수단으로 활용하고 있습니다. 또한 프로그램 작성이나 자동화 과정에서도 AI와 함께 코드를 설계하고 오류의 원인을 분석하며, 해결방안을 단계적으로 검토하는 방식으로 활용해 왔습니다.", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}], "강의·학습 지원 관련 기재": [{"text": "1） 강의 실적 및 경험 기간 기관 강의•운영 내용, 대상 역할 비고 제가 정식 강사로 활동한 경력은 아직 없습니다. 그러나 저는 강사의 역할이 단순히 많은 지식을", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}, {"text": "제가 정식 강사로 활동한 경력은 아직 없습니다. 그러나 저는 강사의 역할이 단순히 많은 지식을 전달하는 데 있다고 생각하지 않습니다. 특히 AI 교육에서는 학습자가 새로운 기술에 부담을 느끼지 않도록 먼저 말을 걸고, 무엇이 어려운지를 함께 찾아내며, 스스로 문제를 해결할 수 있을 때까지 옆에서", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}, {"text": "중심의 교육을 진행하고 싶습니다. 특히 AI에 익숙하지 않은 직원에게는 어려운 기술용어보다 친숙한 사례부터 설명하고, 반대로 활용 경험이 많은 직원에게는 실제 업무과제와 연결된 심화 실습을 제시하여 학습자 수준에 따라 교육 속도와", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}], "기관 내 확산 계획 관련 기재": [{"text": "작은 질문이라도 자유롭게 할 수 있고, 서로의 시행착오를 공유하면서 자연스럽게 배우는 교육을 만들겠습니다. - 8 -", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}, {"text": "중요하다고 생각합니다. 교육 과정에서도 개인정보•민감정보를 그대로 입력하지 않는 원칙, 필요 시 내용을 비식별화하는 방법, AI가 생성한 결과의 사실관계를 반드시 확인해야 하는 이유 등을 실제 사례와 함께 지속적으로 안내하겠습니다.", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 3, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}, {"text": "저는 AI챔피언과 공공 AI역량 확산은 일종의 '아래로부터의 혁신'이라고 생각합니다. 공공부문의 AI 전환은 어느 날 하나의 거대한 시스템을 도입한다고 완성되는 것이 아니락, 수많은 직원 들이 매일 마주하는 작은 문제와 반복적인 업무를 하나씩 해결하면서 이루어진다고 생각합니다.", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 4, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}], "과정·이유·검증 설명 관련 기재": [{"text": "않도록 먼저 말을 걸고, 무엇이 어려운지를 함께 찾아내며, 스스로 문제를 해결할 수 있을 때까지 옆에서 안내하는 역할이 더욱 중요하다고 생각합니다. 저는 평소 새로운 기술이나 AI 도구를 익히는 과정에서 알게 된 내용을 혼자 활용하는 데 그치지 않고,", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}, {"text": "어려움을 느끼는 부분이 있으면 정답부터 알려주기보다는 어떤 업무를 해결하려는 것인지 먼저 듣고, 문제를 작은 단계로 나누어 함께 해결하는 방식을 선호합니다. 강사 양성 과정을 수료하게 된다면 이러한 장점을 살려 일방적으로 설명하는 강의보다는 학습자가 직접", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}, {"text": "AI를 사용하고, 질문하고, 시행착오를 경험하면서 자신의 업무에 적용할 수 있도록 돕는 퍼실리테이션 중심의 교육을 진행하고 싶습니다. 특히 AI에 익숙하지 않은 직원에게는 어려운 기술용어보다 친숙한 사례부터 설명하고, 반대로 활용", "source": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "page": 2, "method": "PDF 텍스트", "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}]}, "media": [{"n": 45, "id": "1eyOS0jadS29t6QksGzxIrHW6RtD3ZnQS", "file": "AI·데이터 역량강화 실행계획 3분 발표자료(경장 구현모).mp4", "url": "https://drive.google.com/file/d/1eyOS0jadS29t6QksGzxIrHW6RtD3ZnQS/view?usp=drivesdk", "duration": 211.636327, "video": true, "audio": true, "contact_sheet": "C:\\Users\\value\\Desktop\\NEW PROJECT\\[[2026]]강의안\\202609_행정안전부강사양성과정\\선발자료\\자료검토_20260915\\영상장면\\45.jpg", "segments": [{"start": 0.18, "end": 6.5, "text": "안녕하십니까. 제가 이번 강사 양성과정에 선발된다면 AI와 데이터 활용 역량을", "time": "00:00"}, {"start": 6.5, "end": 11.1, "text": "일선 현장에서 동료들이 함께 적용할 수 있는 형태로 멘토링하고자 합니다.", "time": "00:06"}, {"start": 11.1, "end": 16.14, "text": "저는 공공 AI 역량 강화의 핵심이 거창한 시스템을 도입하는 데 있는 것이 아니라", "time": "00:11"}, {"start": 16.14, "end": 22.34, "text": "직원 한 사람 한 사람이 자신의 업무에서 AI를 자연스럽게 활용할 수 있도록 만드는 데 있다고 생각합니다.", "time": "00:16"}, {"start": 22.34, "end": 25.02, "text": "지금부터 제가 겪은 현장에서의 문제점과", "time": "00:22"}, {"start": 25.02, "end": 30.46, "text": "그에 대한 해결방안, 기대 효과 그리고 제가 담당하고 싶은 역할을 말씀드리겠습니다.", "time": "00:25"}, {"start": 30.46, "end": 37.46, "text": "수사 업무는 사건 기록, 계좌거래 내역, 통신재료 등 많은 데이터를 검토하고 서로 연결하는 업무입니다.", "time": "00:30"}, {"start": 37.46, "end": 45.98, "text": "하지만, 자료 정리, 요약 비교 검토 같은 반복 업무의 많은 시간이 들고, 디지털 자료를 분석하는 능력도 직원마다 큰 차이가 있습니다.", "time": "00:37"}, {"start": 45.98, "end": 50.78, "text": "대부분 AI의 관심은 있지만 어리서부터 어떻게 활용해야 할지 모르고", "time": "00:45"}, {"start": 50.78, "end": 55.58, "text": "개인정보와 수사정보에 대한 보안 우려로 활용을 주저하는 경우도 많습니다.", "time": "00:50"}, {"start": 55.58, "end": 63.98, "text": "결국 핵심 문제는 AI를 안전하고 실용적으로 수사 업무에 연결할 수 있는 학습과 지원 재개가 부족하다는 점입니다.", "time": "00:55"}, {"start": 63.98, "end": 68.78, "text": "이를 해결하기 위해 저는 행정안전부 표준 교환을 바탕으로", "time": "01:03"}, {"start": 68.78, "end": 73.98, "text": "실제 경찰 업무와 연결된 소규모 실습 중심 교육을 운영하겠습니다.", "time": "01:08"}, {"start": 73.98, "end": 80.62, "text": "AI 활용과 챔피언 인증에 관심 있는 직원 여선세서 10명을 대상으로 주 1회 교육을 진행하고", "time": "01:13"}, {"start": 80.62, "end": 84.58, "text": "각자 업무 과제를 직접 해결해 보도록 하겠습니다.", "time": "01:20"}, {"start": 84.58, "end": 94.14, "text": "또한 실습 결과를 함께 검토하며 학습을 이어가고 개인정보와 수사 정보를 보호하는 안전한 AI 활용 원칙도 함께 교육하겠습니다.", "time": "01:24"}, {"start": 94.14, "end": 103.62, "text": "이러한 교육이 정착되면 반복 업무 부담이 줄어 수사관들이 사실관계 확인, 법립 판단, 수사 방향 결정과 같은 본질적인 업무에 더 집중할 수 있을 것입니다.", "time": "01:34"}, {"start": 103.62, "end": 113.06, "text": "또한, 보고서와 수사 문서의 품질이 향상되고, 우수한 활용 사례가 공유되면서 조직 전처에 AI 활용 역량도 높아질 것으로 기대합니다.", "time": "01:43"}, {"start": 113.06, "end": 120.1, "text": "궁극적으로 보다 신속하고 정확한 사건 처리로 이어져 국민들에게 더 나은 수사 서비스를 제공할 수 있을 것입니다.", "time": "01:53"}, {"start": 120.1, "end": 127.22, "text": "저는 이러한 작은 변화의 축적이 바로 아래로부터 만들어지는 공공 AI 혁신이라고 생각합니다.", "time": "02:00"}, {"start": 127.22, "end": 132.9, "text": "제가 맡고 싶은 역할은 AI 기술 자체를 어렵게 설명하는 전문 강서가 아닙니다.", "time": "02:07"}, {"start": 132.9, "end": 139.34, "text": "수사 실물을 이해하는 내부 퍼실리테이터로서 동료 직원들이 AI를 부담 없이 처음 사용해보고", "time": "02:12"}, {"start": 139.34, "end": 144.26, "text": "실제 자신의 문제를 해결할 수 있도록 옆에서 돕는 역할을 하고 싶습니다.", "time": "02:19"}, {"start": 144.26, "end": 150.66, "text": "저는 킥스 임시 파일백업기, 토스 파일 변환기, 내선 번호 검색기,", "time": "02:24"}, {"start": 150.66, "end": 156.5, "text": "이미지 PDF 제작기 같은 유틸리티뿐만 아니라 제주 동부경처서 수사비 청구관리 시스템,", "time": "02:30"}, {"start": 156.5, "end": 160.34, "text": "제가 맡고 있는 주대 업무인 수배자 검거관리 시스템,", "time": "02:36"}, {"start": 160.34, "end": 167.58, "text": "시팀원들과 추적 중인 대상자의 실시간 위치를 공유하며 확인할 수 있는 수배자 위치 추적 감시 시스템뿐만 아니라", "time": "02:40"}, {"start": 167.58, "end": 178.54, "text": "최근 가장 핫한 범죄인 가상자산의 이동 경로를 추정 및 그래프를 자동으로 그려주는 프로그램을 홀로 또는 AI와 함께 개발해서 사용 중입니다.", "time": "02:47"}, {"start": 178.54, "end": 186.98, "text": "저는 AI를 실제 업무에 적용해온 다양한 경험을 바탕으로 수강생들이 자신의 업무를 AI로 직접 해결할 수 있도록 돕겠습니다.", "time": "02:58"}, {"start": 186.98, "end": 192.36, "text": "또한 교육에서 발굴된 좋은 활용 사례를 조직 내부에 공유하고 교육받은", "time": "03:06"}, {"start": 192.36, "end": 196.3, "text": "직원이 다시 동료들을 돕는 선순한 구절을 만들겠습니다.", "time": "03:12"}, {"start": 196.3, "end": 201.34, "text": "저는 00AI 혁신이 현장의 작은 문제를 스스로 해결하는 데서 시작된다고", "time": "03:16"}, {"start": 201.34, "end": 202.34, "text": "생각합니다.", "time": "03:21"}, {"start": 202.34, "end": 206.74, "text": "그 변화가 수사 현장에서 실제로 이어지도록 돕는 친근한 안내자", "time": "03:22"}, {"start": 206.74, "end": 209.7, "text": "이자 실용적인 퍼실리테이터가 되겠습니다.", "time": "03:26"}, {"start": 209.7, "end": 219.7, "text": "들어주셔서 감사합니다.", "time": "03:29"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/45/1eyOS0jadS29t6QksGzxIrHW6RtD3ZnQS.mp4", "frame": "../영상장면/45.jpg", "quotes": [{"start": 6.5, "end": 11.1, "text": "일선 현장에서 동료들이 함께 적용할 수 있는 형태로 멘토링하고자 합니다.", "time": "00:06", "category": "강의·학습 지원 관련 기재"}, {"start": 103.62, "end": 113.06, "text": "또한, 보고서와 수사 문서의 품질이 향상되고, 우수한 활용 사례가 공유되면서 조직 전처에 AI 활용 역량도 높아질 것으로 기대합니다.", "time": "01:43", "category": "기관 내 확산 계획 관련 기재"}, {"start": 94.14, "end": 103.62, "text": "이러한 교육이 정착되면 반복 업무 부담이 줄어 수사관들이 사실관계 확인, 법립 판단, 수사 방향 결정과 같은 본질적인 업무에 더 집중할 수 있을 것입니다.", "time": "01:34", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 45, "name": "구현모", "title": "AI·데이터 역량강화 실행계획 3분 발표자료(경장 구현모).mp4", "mime": "video/mp4", "bytes": 68639917, "downloaded": true, "url": "https://drive.google.com/file/d/1eyOS0jadS29t6QksGzxIrHW6RtD3ZnQS/view?usp=drivesdk", "local": "../원본/45/1eyOS0jadS29t6QksGzxIrHW6RtD3ZnQS.mp4", "id": "1eyOS0jadS29t6QksGzxIrHW6RtD3ZnQS"}, {"n": 45, "name": "구현모", "title": "(붙임) 강사 양성 과정 신청서(경장 구현모).pdf", "mime": "application/pdf", "bytes": 2518573, "downloaded": true, "url": "https://drive.google.com/file/d/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H/view?usp=drivesdk", "local": "../원본/45/1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H.pdf", "id": "1XW8mPvvmSArkjCYhgYVHV4nO_qXY0C1H"}], "doc_count": 1, "media_count": 1}, {"n": 46, "original_no": 46, "row": 47, "name": "이경민", "org": "경찰청", "folder_title": "46. 경찰청_이경민", "folder_url": "https://drive.google.com/drive/folders/1zeUPx-L_S1CKgHuAgg8wfiVi2DfJ1oCm", "summary": "데이터분석 및 복수 AI 도구를 목적에 맞게 활용한 경험을 기재. 문제정의·데이터 이해·분석·검증·시각화·업무 적용의 교육 흐름을 제시함.", "evidence": {"자기주도 학습 관련 기재": [], "AI 업무 활용 관련 기재": [{"text": "트랙2(AI융합) : @ 노코드 데이터분석 ㉭ 시 행정 융합 기획 ㉭ 노코드 시 서비스 구현 口 트랙3(AI개발) • ㉨ 데이터분석 심화 ㉭ 바이브 코딩 ※ 강사 양성 과정은 담당 트랙 1개를 선정하여 해당 교안을 사전 검토 후 참여합니다.", "source": "(붙임) 강사 양성 과정 신청서(주사보 이경민).pdf", "page": 1, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V/view?usp=drivesdk", "id": "1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V"}, {"text": "2) 시 도구(ChatGPT•Claude•Gemini 등) 활용 경험 2024년 행정안전부에서 주관한 「사뗴이EI 기반 행정 역량강학교육」을 수료한 이후, AI와 데이터 분석 기술을 실체 업무 및 교육 현장에 적용하기 위한 역량을 지속적으로 발전시켜 왔습니다. 특히 경찰청 치안", "source": "(붙임) 강사 양성 과정 신청서(주사보 이경민).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V/view?usp=drivesdk", "id": "1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V"}, {"text": "단순한 문서작성 도구가 아닌 데이터 분석, 문체정의. 업무자동화 및 정책•행정 의사결정을 지원하는 실무 도구로 경찰청에서도 자리잡았고 다양하계 활용하고 있습니다. 주요 활용 도구는 ChatGPT, Claude, Gemini 등 생성형 사이며, 각 도구의 특성과 장점을 비교하여 업무", "source": "(붙임) 강사 양성 과정 신청서(주사보 이경민).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V/view?usp=drivesdk", "id": "1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V"}], "강의·학습 지원 관련 기재": [{"text": "1) 강의 실적 및 경험 비고 비고", "source": "(붙임) 강사 양성 과정 신청서(주사보 이경민).pdf", "page": 2, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V/view?usp=drivesdk", "id": "1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V"}, {"text": "강사로서의 역할은 크게 세 가지로 추진하고자 합니다. 첫째, 경찰청 직원들이 시를 어렵계 느끼지 않고 자신의 업무에 적용할 수 있도록 생성형 시와 데이터 분석의 기본 개념 및 활용 방법을 교육하고자 합니다. 둘째, 단순 기능교육을 넘어 실제 지안업무의 문제를 데이터 기반으로 정의하고 시를 활용하여 해결하는", "source": "(붙임) 강사 양성 과정 신청서(주사보 이경민).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V/view?usp=drivesdk", "id": "1xaNKM61oa 한 정보의 탐색경리와 도구별 특성을 고러한 활용 경험을 축적 600이e 기반 업무환경에서의 AI 활용 가능성을 검토 하는", "source": "(붙임) 강사 양성 과정 신청서(주사보 이경민).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V/view?usp=drivesdk", "id": "1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V"}, {"text": "및 분석을 위한 Python•SQL 등의 코드 작성과 검증을 지원받으며『 분석결과를 시각화하고 정책적 의미를 해석하는 과정까지 연계하어 활용하고 있습니다. 또한 시가 생성한 결과를 그대로 수용하기보다는 데이터의 품질, 분석 과정의 학당성, 결과의 오류 가능성을 사람이 검증하는 방식으로 활용하고 있어 공공부문에서", "source": "(붙임) 강사 양성 과정 신청서(주사보 이경민).pdf", "page": 3, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V/view?usp=drivesdk", "id": "1xaNKM61oabTBCQCe4vXBfe7GcLjfSx-V"}]}, "media": [{"n": 46, "id": "1nFzCbIcsyB49W5Fa4jkZEroAbf6oUvjv", "file": "AI·데이터 역량강화 실행계획 3분  발표자료(주사보 이경민).m4a", "url": "https://drive.google.com/file/d/1nFzCbIcsyB49W5Fa4jkZEroAbf6oUvjv/view?usp=drivesdk", "duration": 253.564, "video": false, "audio": true, "segments": [{"start": 2.0, "end": 13.46, "text": "안녕하십니까? 경찰청 AI 데이터 혁신을 현장에서 직접 증명해내 강사 이경민입니다.", "time": "00:02"}, {"start": 13.46, "end": 19.46, "text": "요즘 공공 현장에서 AI 활용, 어디까지 와 있을까요?", "time": "00:13"}, {"start": 19.46, "end": 24.46, "text": "대부분 보고서 초안이나 번역 정도에는 AI를 쓰고 계십니다.", "time": "00:19"}, {"start": 24.46, "end": 33.46, "text": "하지만 정작, 핵심 공무원장으로 들어가 보면 세 가지 커다란 작음 몇 개 부딪힙니다.", "time": "00:24"}, {"start": 33.46, "end": 38.22, "text": "첫째, 황각과 정밀성이 한계입니다.", "time": "00:33"}, {"start": 38.22, "end": 42.98, "text": "공공보고서는 숫자와 단어 하나에도 엄격해야 하는데", "time": "00:38"}, {"start": 42.98, "end": 46.14, "text": "생상형 AI의 할로신 에이션 때문에", "time": "00:42"}, {"start": 46.14, "end": 50.1, "text": "검증의 시간이 더 걸린다는 점입니다.", "time": "00:46"}, {"start": 50.1, "end": 54.94, "text": "둘째는 기간 내부 데이터 과의 분리입니다.", "time": "00:50"}, {"start": 54.94, "end": 57.98, "text": "보아문제로 외부 AI 모델에", "time": "00:54"}, {"start": 57.98, "end": 61.02, "text": "내부 데이터를 학습시킬 수가 없다 보니", "time": "00:57"}, {"start": 61.02, "end": 65.7, "text": "결국 일반적인 답변 맞게 어찌 못하고 있습니다.", "time": "01:01"}, {"start": 65.7, "end": 71.82, "text": "셋째, 일회성 개인 활용이 그치는 구조입니다.", "time": "01:05"}, {"start": 71.82, "end": 76.26, "text": "이 알이 잘 쓰는 몇몇 개인의 노하우로만 남을 뿐", "time": "01:11"}, {"start": 76.26, "end": 82.54, "text": "조직 전체의 표진 프로세서로 자산화되지 못하고 있습니다.", "time": "01:16"}, {"start": 82.54, "end": 87.34, "text": "이 명확한 문제들을 해결하기 위해 저는 3단계", "time": "01:22"}, {"start": 87.34, "end": 90.7, "text": "현장 밀착형 솔루션을 제안합니다.", "time": "01:27"}, {"start": 90.7, "end": 98.58, "text": "첫째 R, AG 기반의 공공 데이터 맞춤행 검색 교육기입니다.", "time": "01:30"}, {"start": 98.58, "end": 107.74, "text": "단순 프롬포트 입력을 넘어 기간 내부 규정과 기존 정책 보고서를 AI와 안전하게 연동해서", "time": "01:38"}, {"start": 107.74, "end": 114.9, "text": "근거가 명확한 답변과 초안을 도출하는 실무 기법을 전수하겠습니다.", "time": "01:47"}, {"start": 114.9, "end": 122.38, "text": "둘째, 보안 가이드라인을 준수한 데이터 전 처리 및 분석 실습입니다.", "time": "01:54"}, {"start": 122.38, "end": 126.9, "text": "개인정보 비식별화 처리 프로세스를 완벽히 숙제하고", "time": "02:02"}, {"start": 126.9, "end": 133.38, "text": "보안 구형 내에서도 활용 가능한 공공 맞춤형 프롬프트 배턴과", "time": "02:06"}, {"start": 133.38, "end": 137.5, "text": "데이터 가공 루틴을 체득하게 만들겠습니다.", "time": "02:13"}, {"start": 137.5, "end": 143.1, "text": "셋째, 부서별 AI 표준 워크플로우 구축입니다.", "time": "02:17"}, {"start": 143.1, "end": 147.6, "text": "교육 후 부서별 반복 행정 업무를 맵핑하여", "time": "02:23"}, {"start": 147.6, "end": 151.2, "text": "보도자료 생성, 민원 데이터 패턴 문석,", "time": "02:27"}, {"start": 151.2, "end": 153.42, "text": "사비, 집행 검증 등", "time": "02:31"}, {"start": 153.42, "end": 160.58, "text": "실무별 AI 활용 표준 템플릿을 제작 배포하겠습니다.", "time": "02:33"}, {"start": 160.58, "end": 162.78, "text": "이 계획이 실행되면", "time": "02:40"}, {"start": 162.78, "end": 167.76, "text": "우리 기관들은 두 가지 확실한 변화를 맞이하게 됩니다.", "time": "02:42"}, {"start": 167.76, "end": 174.2, "text": "먼저 행정이 정확성과 생산성이 동시 확보입니다.", "time": "02:47"}, {"start": 174.2, "end": 180.16, "text": "보고서 작성 및 자료 검증 시간이 최대 40% 이상 단축될 것이고", "time": "02:54"}, {"start": 180.16, "end": 188.44, "text": "단순 업무가 줄어들어서 정책 기획의 질적 수준이 대폭 향상될 걸로 기대됩니다.", "time": "03:00"}, {"start": 188.44, "end": 194.52, "text": "그리고 지속 가능한 공공 AI 자산화도 장점으로 들 수 있습니다.", "time": "03:08"}, {"start": 194.52, "end": 199.92, "text": "개인의 경험이 아닌 조직의 표준 가이드를 완성할 수 있고", "time": "03:14"}, {"start": 199.92, "end": 204.36, "text": "인사 이동 시에도 흔들림없는 디지털 행정이", "time": "03:19"}, {"start": 204.36, "end": 209.02, "text": "역량을 강화해서 유지될 수 있습니다.", "time": "03:24"}, {"start": 209.02, "end": 215.34, "text": "이 모든 가정을 완성할 우리 AI 역량 트랙 강사", "time": "03:29"}, {"start": 215.34, "end": 218.14, "text": "들의 역할이 아주 명확합니다.", "time": "03:35"}, {"start": 218.14, "end": 222.42, "text": "저는 AI 데이터 분석 실무 능력과 공공 분야에 대한", "time": "03:38"}, {"start": 222.42, "end": 225.78, "text": "기분 이해를 모두 갖추은 전문 강사입니다.", "time": "03:42"}, {"start": 225.78, "end": 228.58, "text": "단순 이론 전달자가 아니라", "time": "03:45"}, {"start": 228.58, "end": 234.66, "text": "직원들의 질문에 현장에서 즉시 해답을 내놓는 AI 퍼실리 데이터이자", "time": "03:48"}, {"start": 234.66, "end": 241.74, "text": "기간의 디지털 혁신을 끝까지 완성할 가장 믿음직한 AI 챔피언이 되겠습니다.", "time": "03:54"}, {"start": 241.74, "end": 246.14, "text": "성공적인 공공 AI 혁신 준비된 리더,", "time": "04:01"}, {"start": 246.14, "end": 250.74, "text": "저희 경민이 완벽하게 실현해놓도록 함께하겠습니다.", "time": "04:06"}, {"start": 250.74, "end": 251.74, "text": "감사합니다.", "time": "04:10"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/46/1nFzCbIcsyB49W5Fa4jkZEroAbf6oUvjv.m4a", "frame": null, "quotes": [{"start": 33.46, "end": 38.22, "text": "첫째, 황각과 정밀성이 한계입니다.", "time": "00:33", "category": "과정·이유·검증 설명 관련 기재"}]}], "issues": [], "files": [{"n": 46, "name": "이경민", "title": "AI·데이터 역량강화 실행계획 3분  발표자료(주사보 이경민).m4a", "mime": "audio/x-m4a", "bytes": 4138049, "downloaded": true, "url": "https://drive.google.com/file/d/1nFzCbIcsyB49W5Fa4jkZEroAbf6oUvjv/view?usp=drivesdk", "local": "../원본/46/1nFzCbIcsyB49W5Fa4jkZEroAbf6oUvjv.m4a", "id": "1nFzCbIcsyB49W5Fa4jkZEroAbf6oUvjv"}, {"n": 46, "name": "이경민", "title": "(붙임) 강사 양성 과정 신청서(주사보 이경민).pdf", "mime": "application/pdf", "bytes": 744180, "downloaded": true, "u {"text": "실현 기능한 계획을 제시해 주십시오 운영의 구제성•실현 가능•'넝•획산 효과 등을 종합 심사합니다. 1) 기관 자체 교육 운영 실적 해당 없음", "source": "붙임 2026년 공공 AI역량 트랙 강사 양성과정 신청서(국가철도공단).pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1o2MrrA5LoOqL4xBo0uwWBRuTWangpIL_/view?usp=drivesdk", "id": "1o2MrrA5LoOqL4xBo0uwWBRuTWangpIL_"}, {"text": "0 (3단계) IT전문가 및 용역사를 대상으로 한 데이터 활용 및 코드생성•검증 교육(약 100명) 0 (4단계) 전직원 대상 AI경징대회 수행 및 선정자 대상 아이디어 구현 실행(POC) 3) 운영 트택•과목 및 일정(안)", "source": "붙임 2026년 공공 AI역량 트랙 강사 양성과정 신청서(국가철도공단).pdf", "page": 4, "method": "Windows 한국어 OCR(원본 대조 필요)", "url": "https://drive.google.com/file/d/1o2MrrA5LoOqL4xBo0uwWBRuTWangpIL_/view?usp=drivesdk", "id": "1o2MrrA5LoOqL4xBo0uwWBRuTWangpIL_"}]}, "media": [{"n": 48, "id": "1U9utvHmu5Kx2jdZFDPrlRExH3v5Y3D8K", "file": "AI역량강화 실행방안(국가철도공단).m4a", "url": "https://drive.google.com/file/d/1U9utvHmu5Kx2jdZFDPrlRExH3v5Y3D8K/view?usp=drivesdk", "duration": 189.309, "video": false, "audio": true, "segments": [{"start": 0.46, "end": 5.9, "text": "안녕하세요. 국가철도공단 AX 주진단 TF 권 이혁 차장입니다.", "time": "00:00"}, {"start": 5.9, "end": 9.72, "text": "국가철도공단 AI 역량 광화 실행 방안에 대해서", "time": "00:05"}, {"start": 9.72, "end": 16.64, "text": "1번 문제점, 2번 해결 방안, 3번 기대 효과 4번 나의 역할에 대해서 말씀드리도록 하겠습니다.", "time": "00:09"}, {"start": 16.64, "end": 18.3, "text": "우선 문제점입니다.", "time": "00:16"}, {"start": 18.3, "end": 22.4, "text": "국가철도공단은 전사적으로 AI 도구를 도입하지 않아서", "time": "00:18"}, {"start": 22.4, "end": 25.34, "text": "직원 개개인이 별도로 사용하고 있는 실정으로", "time": "00:22"}, {"start": 25.34, "end": 29.74, "text": "AI에 대한 이해도와 활용 역량이 초기 단계에 머물러 있습니다.", "time": "00:25"}, {"start": 29.74, "end": 34.58, "text": "그리고 철도 운영이라는 안정적이고 규정 중심의 업무 특성상", "time": "00:29"}, {"start": 34.58, "end": 41.58, "text": "AI 신기수의 도입에 대한 조직적, 문화적 거부감 및 활용 목적에 대한 공감대가 부족한 현실입니다.", "time": "00:34"}, {"start": 41.58, "end": 56.38, "text": "이에 대한 해결 방안으로서 1단계에 인식 확산 기초 교육, 2단계에 실무 적용 실습, 3단계에 AI 공모전을 통한 POC 실증, 4단계 전사 문화 확산으로 단계별 추진할 예정입니다.", "time": "00:41"}, {"start": 56.38, "end": 68.38, "text": "우선 AEX 추진단 중심의 전사 거번원수를 정립하고 AI 활용 정체에 가이드라인 보안 기준을 수립하고 부서별 실행을 지원하는 컨트롤타워 역할을 수행하도록 지원하겠습니다.", "time": "00:56"}, {"start": 68.38, "end": 78.38, "text": "그리고 소속별 AI 전문가를 지정하고 육성하여 집중교육을 실세하고 각 부서로 돌아가 전파교육을 수행하는 자생적 확산 구조를 설계하도록 하겠습니다.", "time": "01:08"}, {"start": 78.38, "end": 85.74, "text": "그리고 전 직원 AI 공모전을 운영하여 아이디어 발굴부터 POC 구형까지 이어지는 공모전을 통해", "time": "01:18"}, {"start": 85.74, "end": 91.58, "text": "시지적 성공 사례를 창출하고 이를 전사에 확산되는 롤모델으로 활용하겠습니다.", "time": "01:25"}, {"start": 91.58, "end": 97.66, "text": "그리고 보고서 작성 데이터 처리, 엑셀 함수 등의 데이터 처리, 이미지 생성 등", "time": "01:31"}, {"start": 97.66, "end": 105.1, "text": "사무양정 분야와 철도 업무 현장에서 바로 적용 가능한 현장 실습 중심의 커리클넘을 설계하겠습니다.", "time": "01:37"}, {"start": 105.1, "end": 112.14, "text": "이에 대한 기대 효과로서는 반복 업무에 대한 소유시간의 50% 이상 단축하고", "time": "01:45"}, {"start": 112.14, "end": 115.78, "text": "전지관, 전지관에 대한 AI 공무전 참여의 확대", "time": "01:52"}, {"start": 115.78, "end": 119.62, "text": "그리고 POC 구형 건수를 10건 이상 진행하도록 하겠습니다.", "time": "01:55"}, {"start": 119.62, "end": 125.18, "text": "그리고 부서별 AI 전문가 전파 교육률을 90% 이상 달성할 수 있도록", "time": "01:59"}, {"start": 125.18, "end": 128.82, "text": "법정 의무 교육으로 지정하도록 하겠습니다.", "time": "02:05"}, {"start": 128.82, "end": 133.02, "text": "정성적 효과로는 AI를 업무적인 파트너로 인식하는", "time": "02:08"}, {"start": 133.02, "end": 138.9, "text": "조직문화를 정착시키고요. 부서간 우수사를 공유를 통해 자발적 학습생태계", "time": "02:13"}, {"start": 138.9, "end": 144.38, "text": "형성 그리고 경쟁적으로 선도 기술을 받아들이는 노력을 할 수 있도록", "time": "02:18"}, {"start": 144.38, "end": 149.0, "text": "기반을 마련하도록 하겠습니다. 여기서 저의 역할은 초기 확산", "time": "02:24"}, {"start": 149.0, "end": 153.66, "text": "촉진자 역할로서 AI 도구 실무 활용 경험을 기반으로 구성원 대상", "time": "02:29"}, {"start": 153.66, "end": 159.86, "text": "기초교육 실습을 진행하고 AI 전무의 양성을 지원하도록 하겠습니다.", "time": "02:33"}, {"start": 159.86, "end": 166.3, "text": "그리고 본격적으로 AI 공모전 실행 진행을 기획하고 운영하여", "time": "02:39"}, {"start": 166.3, "end": 172.8, "text": "실제 AI가 현장 시습에 전격적으로 도입될 수 있도록 지원하겠습니다", "time": "02:46"}, {"start": 172.8, "end": 177.68, "text": "그리고 우소 PUC 사례를 실무역에 도입할 수 있도록 추진하겠습니다", "time": "02:52"}, {"start": 177.68, "end": 187.74, "text": "그리고 AX 추진된과의 연계 참고를 통해 이 모든 기획과 운영이 잘 수행될 수 있도록 노력하도록 하겠습니다", "time": "02:57"}, {"start": 187.74, "end": 189.24, "text": "이상입니다 감사합니다", "time": "03:07"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/48/1U9utvHmu5Kx2jdZFDPrlRExH3v5Y3D8K.m4a", "frame": null, "quotes": [{"start": 41.58, "end": 56.38, "text": "이에 대한 해결 방안으로서 1단계에 인식 확산 기초 교육, 2단계에 실무 적용 실습, 3단계에 AI 공모전을 통한 POC 실증, 4단계 전사 문화 확산으로 단계별 추진할 예정입니다.", "time": "00:41", "category": "기관 내 확산 계획 관련 기재"}]}], "issues": [], "files": [{"n": 48, "name": "권이혁", "title": "2026년 AI챔피언 및 공공 AI역량 트랙 강사 양성과정 신청서 제출.pdf", "mime": "application/pdf", "bytes": 80884, "downloaded": true, "url": "https://drive.google.com/file/d/1NbdI5CNHpMdzyoFE10MTWqZ2A6Qorn_8/view?usp=drivesdk", "local": "../원본/48/1NbdI5CNHpMdzyoFE10MTWqZ2A6Qorn_8.pdf", "id": "1NbdI5CNHpMdzyoFE10MTWqZ2A6Qorn_8"}, {"n": 48, "name": "권이혁", "title": "붙임 2026년 공공 AI역량 트랙 강사 양성과정 신청서(국가철도공단).pdf", "mime": "application/pdf", "bytes": 291927, "downloaded": true, "url": "https://drive.google.com/file/d/1o2MrrA5LoOqL4xBo0uwWBRuTWangpIL_/view?usp=drivesdk", "local": "../원본/48/1o2MrrA5LoOqL4xBo0uwWBRuTWangpIL_.pdf", "id": "1o2MrrA5LoOqL4xBo0uwWBRuTWangpIL_"}, {"n": 48, "name": "권이혁", "title": "AI역량강화 실행방안(국가철도공단).m4a", "mime": "audio/x-m4a", "bytes": 3089843, "downloaded": true, "url": "https://drive.google.com/file/d/1U9utvHmu5Kx2jdZFDPrlRExH3v5Y3D8K/view?usp=drivesdk", "local": "../원본/48/1U9utvHmu5Kx2jdZFDPrlRExH3v5Y3D8K.m4a", "id": "1U9utvHmu5Kx2jdZFDPrlRExH3v5Y3D8K"}], "doc_count": 2, "media_count": 1}, {"n": 49, "original_no": 49, "row": 50, "name": "최병주", "org": "서울특별시 용산구", "folder_title": "49. 서울특별시 용산구청_최병주", "folder_url": "https://drive.google.com/drive/folders/1AOVan5S3srVSy5B7U-0imamrOc2G1pCA", "summary": "통반 확인 지도 등 업무용 웹앱 기획·개발·배포 경험을 기재. 전 직원 인식 확산부터 소그룹 기초·실습으로 이어지는 단계별 교육을 계획함.", "evidence": {"자기주도 학습 관련 기재": [], "AI 업무 활용 관련 기재": nd": 28.08, "text": "그래서 저는 전 직원의 대상으로 AI 활용 역량 강화 트랙 프로그램을 만들 계획입니다.", "time": "00:21"}, {"start": 28.08, "end": 38.08, "text": "단순히 한 번의 실습으로 끝나는 것이 아니라 초급, 중급, 고급 이렇게 3단계로 만들어서 활용 능력을 쌍아가던 방향으로 설계하겠습니다.", "time": "00:28"}, {"start": 38.08, "end": 44.08, "text": "초급에서는 AI로 자료를 모으고 정리하는 반복된 업무를 실습합니다.", "time": "00:38"}, {"start": 44.08, "end": 52.08, "text": "중급에서는 실제로 여러 현장에서 사용하고 있는 툴을 벤치마킹하여 직접 AI로 만들어 보는 실습을 진행합니다.", "time": "00:44"}, {"start": 52.08, "end": 64.08, "text": "고급으로 가면 이제 바이브 코딩으로 그동안 각 부서에서 안고 있던 비효율적인 업무를 AI 기반으로 직접 자동화하는 툴을 만들 수 있는 실습을 진행합니다.", "time": "00:52"}, {"start": 64.08, "end": 70.08, "text": "결과는 단순히 반복 업무의 효율화에 그치지 않습니다.", "time": "01:04"}, {"start": 70.08, "end": 78.08, "text": "그동안 AI의 활용 방법을 몰라서 우상조차 어려웠던 혁신이 실제로 구현 가능한 영역으로 들어오게 될 것입니다.", "time": "01:10"}, {"start": 78.08, "end": 83.08, "text": "이렇게 되면 AI 활용도를 보는 기준도 달라질 것입니다.", "time": "01:18"}, {"start": 83.08, "end": 87.08, "text": "그동안 전체 직원 중 몇 명이나 AI를 쓰고 있는지 측정했다면", "time": "01:23"}, {"start": 87.08, "end": 93.08, "text": "앞으로는 전체 업무중에서 AI를 얼마나 적용하고 있는지 측정하게 될 것입니다.", "time": "01:27"}, {"start": 93.08, "end": 98.08, "text": "제 역할은 단순히 강이나 커리클럼 세계에서 끝나지 않습니다.", "time": "01:33"}, {"start": 98.08, "end": 104.08, "text": "강이는 한 번뿐이지만 현장의 문제는 계속해서 생겨나기 때문입니다.", "time": "01:38"}, {"start": 104.08, "end": 113.08, "text": "저는 지금도 행정 현장의 최전선에 있기 때문에 강의가 끝난 뒤에도 현장의 문제를 누구보다 가까이서 지켜볼 수 있습니다.", "time": "01:44"}, {"start": 113.08, "end": 120.08, "text": "따라서 저는 AI 강사관이 AI 멘토이자 AI 혁신 리더의 역할을 수행하겠습니다.", "time": "01:53"}, {"start": 120.08, "end": 127.08, "text": "현장에서 새로 보이는 문제들을 계속 다음 커리클럼에 담아서 멈추지 않고 지나가는 AI 교육을 만들겠습니다.", "time": "02:00"}, {"start": 127.08, "end": 129.08, "text": "감사합니다.", "time": "02:07"}], "method": "Whisper small 한국어 자동전사(원음 대조 필요)", "local": "../원본/49/113GonVBh4rSlAp8rnXbzOXNWgWZSNJwk.mp4", "frame": "../영상장면/49.jpg", "quotes": [{"start": 52.08, "end": 64.08, "text": "고급으로 가면 이제 바이브 코딩으로 그동안 각 부서에서 안고 있던 비효율적인 업무를 AI 기반으로 직접 자동화하는 툴을 만들 수 있는 실습을 진행합니다.", "time": "00:52
