const SVG_NS = 'http://www.w3.org/2000/svg';

function el(name, attrs={}, children=[]) {
  const elem = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs)) {
    elem.setAttribute(k, v);
  }
  if (typeof children === 'string') {
    elem.textContent = children;
  } else if (Array.isArray(children)) {
    children.forEach(c => elem.appendChild(c));
  }
  return elem;
}

function R(s, x, y, w, h, fill=C.white, stroke='none', rx=0, sw=1){
  const r = el('rect', { x, y, width: w, height: h, fill, stroke, rx, 'stroke-width': sw });
  s.appendChild(r);
  return r;
}

function CIRC(s, cx, cy, r, fill=C.blue, stroke='none'){
  const c = el('circle', { cx, cy, r, fill, stroke });
  s.appendChild(c);
  return c;
}

function L(s, x1, y1, x2, y2, stroke=C.line, sw=1, dash=null){
  const attrs = { x1, y1, x2, y2, stroke, 'stroke-width': sw };
  if(dash) attrs['stroke-dasharray'] = dash;
  const l = el('line', attrs);
  s.appendChild(l);
  return l;
}

function T(s, x, y, text, cls='', sz=null, extra={}){
  const attrs = { x, y, class: cls };
  if(sz) attrs['font-size'] = sz;
  for(const [k,v] of Object.entries(extra)) attrs[k] = v;
  const t = el('text', attrs, text);
  s.appendChild(t);
  return t;
}

function M(s, x, y, lines, cls='', lh=20, extra={}){
  const t = el('text', { x, y, class: cls });
  for(const [k,v] of Object.entries(extra)) t.setAttribute(k, v);
  lines.forEach((line, i)=>{
    const ts = el('tspan', { x, dy: i===0?0:lh }, line);
    t.appendChild(ts);
  });
  s.appendChild(t);
  return t;
}

// 엄격한 텍스트 줄바꿈 및 글자 수 제한 알고리즘 (박스 밖 1px 탈출 방지)
function wrapText(text, maxW, sz=12.5, maxLines=3){
  if(!text) return [];
  const words = text.split(' ');
  const lines = [];
  let curLine = '';
  let curW = 0;
  
  const charW = (c) => {
    const code = c.charCodeAt(0);
    if((code >= 0xac00 && code <= 0xd7a3) || (code >= 0x1100 && code <= 0x11ff) || (code >= 0x3130 && code <= 0x318f)) return sz * 1.05;
    if(c === ' ') return sz * 0.35;
    if(/[A-Z]/.test(c)) return sz * 0.65;
    if(/[0-9]/.test(c)) return sz * 0.58;
    return sz * 0.52;
  };
  
  const getStrW = (str) => {
    let w = 0;
    for(let i=0; i<str.length; i++) w += charW(str[i]);
    return w;
  };
  
  for(const word of words){
    const wordW = getStrW(word);
    const spaceW = curLine ? charW(' ') : 0;
    if(curW + spaceW + wordW <= maxW){
      curLine = curLine ? curLine + ' ' + word : word;
      curW += spaceW + wordW;
    } else {
      if(curLine) lines.push(curLine);
      if(wordW > maxW){
        let chunk = '', chunkW = 0;
        for(let i=0; i<word.length; i++){
          const cw = charW(word[i]);
          if(chunkW + cw > maxW){
            lines.push(chunk);
            chunk = word[i];
            chunkW = cw;
          } else {
            chunk += word[i];
            chunkW += cw;
          }
        }
        curLine = chunk;
        curW = chunkW;
      } else {
        curLine = word;
        curW = wordW;
      }
    }
  }
  if(curLine) lines.push(curLine);
  
  if(lines.length > maxLines){
    lines.splice(maxLines);
    if(lines[maxLines-1].length > 3){
      lines[maxLines-1] = lines[maxLines-1].slice(0, -2) + '...';
    }
  }
  return lines;
}

function W(s, x, y, text, maxW, cls='', sz=12.5, lh=18, extra={}, maxLines=3){
  let lines = [];
  if(Array.isArray(text)){
    text.forEach(t => {
      const wrapped = wrapText(t, maxW, sz, maxLines);
      lines.push(...wrapped);
    });
  } else {
    lines = wrapText(text, maxW, sz, maxLines);
  }
  return M(s, x, y, lines, cls, lh, {...extra, 'font-size': sz});
}

          }
        }
        curLine = chunk;
        curW = chunkW;
      } else {

    }
  }

  // 만약 최대 줄 수를 초과하면 마지막 줄 끝에 말줄임표 처리하여 박스 탈출 원천 차단

    if(lines[maxLines-1].length > 3){
      lines[maxLines-1] = lines[maxLines-1].slice(0, -2) + '...';
    }
  }
  return lines;
}

function W(s, x, y, text, maxW, cls='', sz=13, lh=20, extra={{}}, maxLines=4){{

    }});
  }} else {{
    lines = wrapText(text, maxW, sz, maxLines);
  }}
  return M(s, x, y, lines, cls, lh, {{...extra, 'font-size': sz}});
}}

  } else {
    base(svg, '삼성전자 AI 데이터 분석 실무', 'Slide ' + i, '상세 분석 및 실습 화면', i);
  }
  
  slideDiv.appendChild(svg);
  wrapper.appendChild(slideDiv);
}

function showSlide(n){
  if(n < 1) n = 1;
  if(n > totalSlides) n = totalSlides;
  
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('slide-' + n);
  if(target) target.classList.add('active');
  
  currentSlide = n;
  document.getElementById('page-info').textContent = String(n).padStart(2,'0') + ' / ' + String(totalSlides).padStart(2,'0');
  document.getElementById('jump-input').value = n;
}

function prevSlide(){ showSlide(currentSlide - 1); }
function nextSlide(){ showSlide(currentSlide + 1); }
function jumpSlide(){
  const val = parseInt(document.getElementById('jump-input').value, 10);
  if(!isNaN(val)) showSlide(val);
}

function toggleFullScreen(){
  if(!document.fullscreenElement){
    document.getElementById('deck-container').requestFullscreen().catch(err=>alert(err.message));
  } else {
    document.exitFullscreen();
  }
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
    e.preventDefault();
    nextSlide();
  } else if(e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault();
    prevSlide();
  } else if(e.key === 'f' || e.key === 'F') {
    toggleFullScreen();
  } else if(e.key === 'Home') {
    showSlide(1);
  } else if(e.key === 'End') {
    showSlide(totalSlides);
  }
});

</script>
