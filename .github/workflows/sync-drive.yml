name: Drive → 지식그래프 동기화

# Google Drive '강의안/01_강의관련' 폴더를 확인해 새로 생기거나 바뀐 강의안만 받아
# 지식그래프(graph/)를 증분 빌드하고 커밋한다. Claude(LLM)를 쓰지 않으므로 토큰 비용이 없다.
on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 (UTC 기준). 바뀐 파일이 없으면 30초 안에 끝난다.
  workflow_dispatch:         # Actions 탭에서 [Run workflow]로 즉시 실행
    inputs:
      dry_run:
        description: "받지 않고 변경 목록만 확인"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: 인증 키 확인
        id: guard
        run: |
          if [ -z "$GDRIVE_SA_KEY" ]; then
            echo "::notice::GDRIVE_SA_KEY 시크릿이 없어 동기화를 건너뜁니다. docs/drive-sync-setup.md 참고"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: 패키지 설치
        if: steps.guard.outputs.ok == 'true'
        run: pip install --quiet google-auth requests

      - name: Drive에서 바뀐 파일 받기
        id: fetch
        if: steps.guard.outputs.ok == 'true'
        run: python kg/drive_fetch.py --out raw ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 지식그래프 증분 빌드
        if: steps.fetch.outputs.changed == 'true' && !inputs.dry_run
        run: |
          python kg/build.py --raw raw
          python kg/query.py stats

      - name: 커밋·푸시
        if: steps.fetch.outputs.changed == 'true' && !inputs.dry_run
        run: |
          git config user.name "drive-sync-bot"
          git config user.email "drive-sync-bot@users.noreply.github.com"
          git add graph data
          if git diff --cached --quiet; then
            echo "그래프 변경 없음"
            exit 0
          fi
          git commit -m "Drive 동기화: 강의안 ${{ steps.fetch.outputs.downloaded }}개 반영 ($(date -u +%F))"
          git push
